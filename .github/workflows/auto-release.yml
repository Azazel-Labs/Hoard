name: auto-release
# After ci passes on a push to main:
#   - Cargo.toml's [workspace.package] version has no vX.Y.Z tag yet  ->  tag that commit with it and release it
#                                                                       (release.yml), moving :edge;
#   - otherwise                                                        ->  publish ghcr.io/<owner>/hoard:edge and
#                                                                       :sha-<short>.
# So Cargo.toml's version is the one source of truth: raising it (cargo xtask bump patch|minor|major|X.Y.Z) and pushing
# is what releases, and each release gathers every commit since the one before. Nothing is committed back to main.
# The release notes are the commit subjects since the last tag (scripts/release-notes.sh).
#
# The tag is pushed with GITHUB_TOKEN, which deliberately doesn't trigger workflows, so release.yml is called here
# rather than run a second time from the tag push.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One at a time, never canceled mid-push. A newer push's run waits and then sees the newer main.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions: { contents: read }
    outputs:
      tip: ${{ steps.plan.outputs.tip }}
      short: ${{ steps.plan.outputs.short }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      edge-version: ${{ steps.plan.outputs.edge-version }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - id: plan
        env: { SHA: "${{ github.event.workflow_run.head_sha }}" }
        run: |
          # Only act on main's tip: if main has moved on, the newer push's ci run will get here too.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main has moved past $SHA; skipping"
            echo "tip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          short="$(git rev-parse --short=7 HEAD)"
          echo "tip=true" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)".*/\1/p' Cargo.toml | head -1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml's [workspace.package] version, '$version', isn't X.Y.Z"; exit 1
          fi
          # An :edge build reports the version it's built on, plus where it is.
          echo "edge-version=${version}+edge.$short" >> "$GITHUB_OUTPUT"

          # A version behind the newest release is a mistake (pre-releases of the newest X.Y.Z are fine).
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          newest="${newest#v}"; newest="${newest%%-*}"
          if [ -n "$newest" ] && [ "$newest" != "${version%%-*}" ] &&
             [ "$(printf '%s\n%s\n' "$newest" "${version%%-*}" | sort -V | tail -1)" = "$newest" ]; then
            echo "::error::Cargo.toml says $version, behind the newest release, v$newest. Raise it with cargo xtask bump."
            exit 1
          fi
          if [[ "$version" == *-* ]] && git rev-parse -q --verify "refs/tags/v${version%%-*}" >/dev/null; then
            echo "::error::Cargo.toml says $version, a pre-release of v${version%%-*}, which is already out."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; publishing :edge only"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Releasing v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tag:
    needs: plan
    if: needs.plan.outputs.tip == 'true' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.workflow_run.head_sha }}", fetch-depth: 0 }
      - name: Tag
        env: { VERSION: "${{ needs.plan.outputs.version }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { printf 'Hoard %s\n\n' "$VERSION"; bash scripts/release-notes.sh HEAD; } | git tag -a "v$VERSION" -F -
          git push origin "v$VERSION"

  release:
    needs: [plan, tag]
    uses: ./.github/workflows/release.yml
    permissions: { contents: write, packages: write }
    # A called workflow sees none of the repository's secrets unless they're passed on: the desktop builds need the
    # updater's signing key.
    secrets: inherit
    with:
      tag: v${{ needs.plan.outputs.version }}
      edge: true

  edge:
    needs: plan
    if: needs.plan.outputs.tip == 'true' && needs.plan.outputs.release != 'true'
    uses: ./.github/workflows/image.yml
    permissions: { contents: read, packages: write }
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.plan.outputs.edge-version }}
      tags: edge sha-${{ needs.plan.outputs.short }}
