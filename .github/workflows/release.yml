name: release
# Builds binaries, the desktop app's installers and a multi-arch container image, and publishes a GitHub release whose notes are the commit
# subjects since the previous tag (scripts/release-notes.sh). The version comes from the tag alone (builds get it as
# HOARD_VERSION); nothing in the repository is bumped. Runs two ways:
#   - auto-release.yml calls it after ci passes on main and it has tagged a version (the usual path);
#   - pushing a v*.*.* tag yourself (scripts/release.sh, then git push origin vX.Y.Z).
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to release.
        type: string
        required: true
      edge:
        description: Also move :edge and add :sha-<short> (the tag is main's tip).
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      image-tags: ${{ steps.v.outputs.image-tags }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - id: v
        name: Version from the tag
        env: { EDGE: "${{ inputs.edge }}" }
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG isn't vX.Y.Z"; exit 1; }
          # Pre-releases get only their exact tag; releases also move :<major>.<minor> and :latest.
          if [[ "$v" == *-* ]]; then tags="$v"; else tags="$v ${v%.*} latest"; fi
          [ "$EDGE" = "true" ] && tags="$tags edge sha-$(git rev-parse --short=7 HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image-tags=$tags" >> "$GITHUB_OUTPUT"

  web:
    needs: check-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: web/dist }

  binaries:
    needs: [check-version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - name: Latest stable, with the components rust-toolchain.toml lists
        run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p hoardd -p hoard
        env: { HOARD_VERSION: "${{ needs.check-version.outputs.version }}" }
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: web/dist }
      - name: Package
        shell: bash
        run: |
          name="hoard-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$name/web"
          exe=""; [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          cp "target/release/hoardd$exe" "target/release/hoard$exe" "$name/"
          cp -r web/dist "$name/web/dist"
          cp README.md LICENSE* "$name/" 2>/dev/null || true
          if [[ -n "$exe" ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: hoard-*.*z*

  # The desktop app (crates/hoard-desktop): a Windows installer (.exe), a .dmg, an AppImage and a .deb. With the TAURI_SIGNING_PRIVATE_KEY
  # secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key has one) each also gets a signed update, which installed
  # copies find through the release's latest.json; without it the installers are built alone.
  desktop:
    needs: [check-version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - name: Latest stable, with the components rust-toolchain.toml lists
        run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { key: "desktop-${{ matrix.target }}" }
      - name: The web view's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: web/dist }
      - name: Build
        shell: bash
        working-directory: crates/hoard-desktop
        env:
          HOARD_VERSION: ${{ needs.check-version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updates=true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updates=false
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so the installers are built without updates"
          fi
          version="$HOARD_VERSION"
          # A Windows installer's version is numbers only.
          [ "$RUNNER_OS" = Windows ] && version="${version%%-*}"
          # The tag's version, the portal's files beside the app, and the updates when they can be signed.
          config="$(printf '{"version":"%s","bundle":{"resources":{"../../web/dist/":"web/"},"createUpdaterArtifacts":%s}}' "$version" "$updates")"
          npx --yes @tauri-apps/cli@2.12.5 build --ci --bundles "${{ matrix.bundles }}" --config "$config"
      - name: Collect
        shell: bash
        run: |
          b=target/release/bundle
          mkdir out
          shopt -s nullglob
          cp $b/nsis/*.exe* $b/dmg/*.dmg $b/appimage/*.AppImage* $b/deb/*.deb out/
          # macOS's update is named Hoard.app.tar.gz: give it the version and architecture the others have.
          for f in $b/macos/Hoard.app.tar.gz*; do
            cp "$f" "out/Hoard_${{ needs.check-version.outputs.version }}_aarch64.${f##*/Hoard.}"
          done
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: out/*

  image:
    needs: check-version
    uses: ./.github/workflows/image.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      version: ${{ needs.check-version.outputs.version }}
      tags: ${{ needs.check-version.outputs.image-tags }}

  publish:
    needs: [check-version, binaries, desktop, image]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.TAG }}", fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { pattern: bin-*, path: dist, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { pattern: desktop-*, path: dist, merge-multiple: true }
      - name: What installed copies of the desktop app read to update themselves
        run: python3 scripts/desktop-updates.py "${{ needs.check-version.outputs.version }}" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" dist
      - name: Release notes from the commits since the previous tag
        run: |
          v="${{ needs.check-version.outputs.version }}"
          bash scripts/release-notes.sh "$TAG" > notes.md
          printf '\n### Desktop app\n\nThe `-setup.exe` for Windows, the `.dmg` for macOS on Apple silicon, the `.AppImage` or `.deb` for Linux.\n' >> notes.md
          printf '\n### Container image\n\n```sh\ndocker pull ghcr.io/%s:%s\n```\n' "${GITHUB_REPOSITORY,,}" "$v" >> notes.md
          # latest.json carries the updates' signatures.
          rm -f dist/*.sig
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prerelease=""; [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --title "Hoard ${TAG#v}" --notes-file notes.md $prerelease
