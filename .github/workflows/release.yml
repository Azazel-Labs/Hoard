name: release
# Builds binaries and a multi-arch container image, and publishes a GitHub release whose notes are the commit
# subjects since the previous tag (scripts/release-notes.sh). The version comes from the tag alone (builds get it as
# HOARD_VERSION); nothing in the repository is bumped. Runs two ways:
#   - auto-release.yml calls it after ci passes on main and it has tagged a version (the usual path);
#   - pushing a v*.*.* tag yourself (scripts/release.sh, then git push origin vX.Y.Z).
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to release.
        type: string
        required: true
      edge:
        description: Also move :edge and add :sha-<short> (the tag is main's tip).
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image-tags: ${{ steps.v.outputs.image-tags }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - id: v
        name: Version from the tag
        env: { EDGE: "${{ inputs.edge }}" }
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG isn't vX.Y.Z"; exit 1; }
          # Pre-releases get only their exact tag; releases also move :<major>.<minor> and :latest.
          if [[ "$v" == *-* ]]; then tags="$v"; else tags="$v ${v%.*} latest"; fi
          [ "$EDGE" = "true" ] && tags="$tags edge sha-$(git rev-parse --short=7 HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image-tags=$tags" >> "$GITHUB_OUTPUT"

  web:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  binaries:
    needs: [check-version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p hoardd -p hoard
        env: { HOARD_VERSION: "${{ needs.check-version.outputs.version }}" }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Package
        shell: bash
        run: |
          name="hoard-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$name/web"
          exe=""; [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          cp "target/release/hoardd$exe" "target/release/hoard$exe" "$name/"
          cp -r web/dist "$name/web/dist"
          cp README.md LICENSE* "$name/" 2>/dev/null || true
          if [[ -n "$exe" ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: hoard-*.*z*

  image:
    needs: check-version
    uses: ./.github/workflows/image.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      version: ${{ needs.check-version.outputs.version }}
      tags: ${{ needs.check-version.outputs.image-tags }}

  publish:
    needs: [check-version, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}", fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: bin-*, path: dist, merge-multiple: true }
      - name: Release notes from the commits since the previous tag
        run: |
          v="${{ needs.check-version.outputs.version }}"
          bash scripts/release-notes.sh "$TAG" > notes.md
          printf '\n### Container image\n\n```sh\ndocker pull ghcr.io/%s:%s\n```\n' "${GITHUB_REPOSITORY,,}" "$v" >> notes.md
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prerelease=""; [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --title "Hoard ${TAG#v}" --notes-file notes.md $prerelease
