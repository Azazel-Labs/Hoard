[workspace]
resolver = "3"
members = ["crates/hoard-core", "crates/hoard-unreal", "crates/hoardd", "crates/hoard", "crates/hoard-render", "xtask"]

[workspace.package]
# Only what a local build reports. Releases are git tags (auto-release.yml tags every push to main that passes ci) and
# builds take their version from the tag (HOARD_VERSION), so this isn't bumped.
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT-0"
repository = "https://github.com/Azazel-Labs/Hoard"

[workspace.dependencies]
hoard-core = { path = "crates/hoard-core" }
hoard-render = { path = "crates/hoard-render" }
hoard-unreal = { path = "crates/hoard-unreal" }
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart", "query"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Groups first (low priority) so the individual overrides below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panic / footgun guards from the `restriction` group. Tests are exempt via clippy.toml.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
allow_attributes = "warn"                 # use #[expect(...)] so stale suppressions get flagged
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
large_include_file = "warn"
rc_mutex = "warn"
str_to_string = "warn"
clone_on_ref_ptr = "warn"
lossy_float_literal = "warn"
fn_to_numeric_cast_any = "warn"
verbose_file_reads = "warn"
needless_raw_strings = "warn"

# Pedantic lints that are mostly noise for an app (not a published library).
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# SQLite speaks i64; pixel math speaks f32. These fire constantly on deliberate conversions.
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "thin"

# Debug builds still optimize dependencies: image decoding, PNG encoding, zip inflate and hashing are 10-50x slower
# without it, which makes ingest crawl. Hoard's own code stays quick to build and debuggable.
[profile.dev.package."*"]
opt-level = 3
