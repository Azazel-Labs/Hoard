[package]
name = "hoard-desktop"
description = "Hoard for one person: the asset library in a window, no server to set up"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The server without what only a team's server needs (LDAP, HTTPS certificates), with secrets in the keychain.
hoardd = { path = "../hoardd", default-features = false, features = ["s3", "keychain"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.6", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
