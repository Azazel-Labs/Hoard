[package]
name = "hoard-unreal"
description = "Read Unreal Engine editor packages (.uasset/.umap) and convert their contents to common formats, without Unreal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
hoard-core.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }

[lints]
workspace = true
