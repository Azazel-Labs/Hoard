[package]
name = "hoardd"
description = "Hoard asset server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# What a server for a team needs and the desktop app (one person, this computer only) leaves out.
[features]
default = ["ldap", "https", "s3"]
# Settings → Authentication: signing in against LDAP or Active Directory.
ldap = ["dep:ldap3", "dep:rustls-native-certs"]
# Settings → Connection: HTTPS with Hoard's own certificate or an uploaded one, and HTTP/3.
https = ["dep:tokio-rustls", "dep:rcgen", "dep:x509-parser", "dep:if-addrs", "dep:gethostname", "dep:quinn", "dep:h3", "dep:h3-quinn"]
# Library locations in S3 buckets.
s3 = ["object_store/aws"]
# The desktop app: passwords and keys typed into Settings kept in the system's keychain (Windows Credential Manager,
# the macOS keychain, the Secret Service on Linux) rather than in the library's database.
keychain = ["dep:keyring-core", "dep:ring", "dep:windows-native-keyring-store", "dep:apple-native-keyring-store", "dep:zbus-secret-service-keyring-store"]

[dependencies]
hoard-core.workspace = true
hoard-render.workspace = true
hoard-unreal.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
axum = { version = "0.8", features = ["multipart", "http2"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip", "compression-br", "compression-zstd", "set-header"] }
rusqlite = { version = "0.41", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.36"
uuid = { version = "1.29", features = ["v4", "v7"] }
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "time"] }
tar = "0.4"
quick-xml = "0.41"
flate2 = "1.1"
infer = "0.22"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp", "tiff", "hdr", "exr", "ico", "qoi", "pnm"] }
zstd = "0.14"
# TLS, HTTP/2 and HTTP/3. All on rustls with the `ring` provider (no C toolchain needed).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
tokio-rustls = { optional = true, version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { optional = true, version = "0.14", features = ["x509-parser"] }
x509-parser = { version = "0.18", optional = true }
# Settings → HTTPS: the addresses Hoard's own certificate covers.
if-addrs = { version = "0.15", optional = true }
gethostname = { version = "1", optional = true }
quinn = { optional = true, version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = "1"
http-body-util = "0.1"
http-body = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
lofty = "0.25"
flacenc = { version = "0.5", default-features = false }
rusty_mp3 = "1"
opus-pure = "0.2"
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"] }
brotli = "9"
basisu = "0.1"
xmrs = "0.15"
xmrsplayer = "0.15"
midly = "0.5"
rustysynth = "1"
# Chiptunes: NES music (NSF) emulated in pure Rust, and the Yamaha FM chips VGM files log writes to (ymfm, C++).
oxideav-nsf = { version = "0.0.5", default-features = false }
ymfm-sys = "0.2"
# Model formats (STL, PLY, VOX, OBJ, FBX, 3DS, 3MF, USD, and glTF with Draco) read natively for thumbnails and GLB copies.
polysmelt = "0.13.0"
ddsfile = "0.6"
texture2ddecoder = "0.1"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
ktx2 = "0.5"
resvg = { version = "0.50", default-features = false, features = ["svgz", "text", "system-fonts"] }
hayro = "0.9"
asefile = "0.3"
ttf-parser = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
regex = "1"
toml = "1"
object_store = "0.14"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3", "aiff", "adpcm"] }
tempfile = "3.27.0"
webp = { version = "0.3.1", default-features = false }
sha2 = "0.11"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
argon2 = "0.6.0"
getrandom = "0.4"
# Settings → Authentication: signing in against LDAP or Active Directory.
ldap3 = { optional = true, version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls-native-certs = { version = "0.8", optional = true }
# Settings: Image search runs CLIP on the CPU, in pure Rust.
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
rayon = "1"
# The server's messages in the language each request asks for (see `i18n`).
fluent-bundle = "0.16"
# Settings' secrets in the desktop app: sealed with a key the system's keychain keeps (see `secrets`).
keyring-core = { version = "1.0.1", optional = true }
ring = { version = "0.17", optional = true }

[build-dependencies]
# build.rs checks the catalogs in locales/ before embedding them.
fluent-syntax = "0.12"
unic-langid = "0.9"

[dev-dependencies]
ldap3_proto = "0.9"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(windows)'.dependencies.windows-native-keyring-store]
version = "1.1.0"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.apple-native-keyring-store]
version = "1.0.2"
optional = true
features = ["keychain"]

# The Secret Service over D-Bus, in pure Rust (no libdbus), on its own small executor.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.zbus-secret-service-keyring-store]
version = "1.0.1"
optional = true
features = ["rt-async-io-crypto-rust"]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "thread"] }

# Lowering a heavy thread's priority on Windows needs a system call, and `unsafe` is forbidden here.
[target.'cfg(windows)'.dependencies]
thread-priority = "3.1"
