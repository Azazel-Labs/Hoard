# Topology A: everything on the NAS. Hoard + Garage (blobs) at home, published through a Cloudflare Tunnel.
# Put Cloudflare Access in front of the hostname for login, and a cache rule for /api/blobs/* and
# /api/assets/*/thumb (immutable, content-addressed) so repeat downloads don't touch your uplink.
#   cp deploy/.env.example deploy/.env && edit; edit deploy/garage.toml secrets
#   docker compose -f deploy/compose.all-in-one.yml --env-file deploy/.env up -d
services:
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      - GARAGE_DEFAULT_BUCKET
      - GARAGE_DEFAULT_ACCESS_KEY
      - GARAGE_DEFAULT_SECRET_KEY
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/hoard/garage/meta:/var/lib/garage/meta     # adjust to your NAS paths
      - /volume1/hoard/garage/data:/var/lib/garage/data

  hoard:
    image: ghcr.io/azazel-labs/hoard:${HOARD_VERSION:-latest}   # or `build: ..` to build from this checkout
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: hoard
    restart: unless-stopped
    depends_on: [garage]
    environment:
      HOARD_STORAGE: s3
      HOARD_S3_ENDPOINT: http://garage:3900
      HOARD_S3_REGION: garage
      HOARD_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      HOARD_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      HOARD_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      HOARD_TOKEN: ${HOARD_TOKEN}
    volumes:
      - /volume1/hoard/meta:/data          # SQLite DB, staging, backups (small)
    ports:
      - "7878:7878"                        # LAN access; drop this if you only use the tunnel

  # The local model server for AI tagging and descriptions (llama.cpp). It starts empty: in the portal, Settings →
  # AI tagging → Local model lists suggested models, downloads the one you pick from Hugging Face into the volume
  # below, and switches or deletes them later. The suggested ones run on the CPU in 3-6 GB of RAM; a GPU overlay
  # (compose.gpu-*.yml) moves them onto the GPU. Don't want it? Delete this service (Settings can use a hosted one).
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    # One model in memory at a time, room for a batch of assets plus a contact sheet, and thinking models answer
    # straight away: tagging wants quick JSON, not a chain of thought.
    command: ["--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "-c", "16384", "--reasoning-budget", "0"]
    volumes:
      - /volume1/hoard/models:/models

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # In the tunnel's public hostname settings, point hoard.example.com at http://hoard:7878

  # Pulls new Hoard images daily and restarts it; the database upgrades itself on start (backed up first).
  # Pin HOARD_VERSION (e.g. 0.8) to take only patch releases, or remove this service to update by hand.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: hoard
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "${HOARD_UPDATE_SCHEDULE:-0 0 4 * * *}"   # seconds-first cron: 04:00 daily
    labels:
      com.centurylinklabs.watchtower.scope: hoard
