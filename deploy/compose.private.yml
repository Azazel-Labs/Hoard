# Topology P: everything on the NAS, reachable from anywhere over Cloudflare's private network routing
# (Cloudflare One / WARP). No public hostname, no open ports on your router: only devices enrolled in your
# Zero Trust org, running the Cloudflare One client, can reach it. See docs/DEPLOYMENT.md, "Private access".
#   cp deploy/.env.example deploy/.env && edit; edit deploy/garage.toml secrets
#   docker compose -f deploy/compose.private.yml --env-file deploy/.env up -d
services:
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      - GARAGE_DEFAULT_BUCKET
      - GARAGE_DEFAULT_ACCESS_KEY
      - GARAGE_DEFAULT_SECRET_KEY
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/hoard/garage/meta:/var/lib/garage/meta     # adjust to your NAS paths
      - /volume1/hoard/garage/data:/var/lib/garage/data

  hoard:
    image: ghcr.io/azazel-labs/hoard:${HOARD_VERSION:-latest}   # or `build: ..` to build from this checkout
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: hoard
    restart: unless-stopped
    depends_on: [garage]
    environment:
      HOARD_STORAGE: s3
      HOARD_S3_ENDPOINT: http://garage:3900
      HOARD_S3_REGION: garage
      HOARD_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      HOARD_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      HOARD_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      HOARD_TOKEN: ${HOARD_TOKEN}
      HOARD_PUBLIC_URL: ${HOARD_PUBLIC_URL:-}          # e.g. http://192.168.50.10:7878, for MCP links
      # The bundled model below. Settings in the portal can point Hoard elsewhere or turn AI tagging off.
      HOARD_LLM_URL: ${HOARD_LLM_URL-http://llm:8080/v1}
      HOARD_LLM_MODEL: ${HOARD_LLM_MODEL-qwen3.5-2b}
      HOARD_LLM_VISION: ${HOARD_LLM_VISION:-true}
      HOARD_LLM_BATCH: ${HOARD_LLM_BATCH:-12}         # assets per request; small models do better with fewer
      # Blender and ffmpeg: off, auto (find or download) or a path. Also switchable in the portal's Settings.
      HOARD_BLENDER: ${HOARD_BLENDER:-off}
      HOARD_FFMPEG: ${HOARD_FFMPEG:-auto}
      HOARD_UNREAL_CONVERT: ${HOARD_UNREAL_CONVERT:-keep}
      # HTTPS gives browsers HTTP/2 (one connection for the whole thumbnail grid). Self-signed is fine on a private
      # network: accept the warning once. HTTP/3 additionally needs the UDP port below.
      HOARD_TLS_SELF_SIGNED: ${HOARD_TLS_SELF_SIGNED:-true}
      HOARD_TLS_NAMES: ${HOARD_TLS_NAMES:-}
      HOARD_HTTP3: ${HOARD_HTTP3:-false}
    volumes:
      - /volume1/hoard/meta:/data
    ports:
      # LAN only. Don't forward this port on your router: remote access goes through the tunnel.
      - "7878:7878"
      - "7878:7878/udp"   # HTTP/3 (QUIC), only used with HOARD_HTTP3=true

  # A small local vision model for AI tagging and descriptions, served by llama.cpp. It downloads the model from
  # Hugging Face on first start (about 2 GB, kept in the volume below) and runs on the CPU in about 3 GB of RAM;
  # a GPU overlay (compose.gpu-*.yml) moves it onto the GPU. Other models: docs/DEPLOYMENT.md, "AI tagging". Don't want
  # it? Delete this service and set HOARD_LLM_URL= (empty), or point Hoard at another endpoint in Settings.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
      # `<Hugging Face repo>:<quantization>`; the vision projector (mmproj) comes along automatically.
      LLAMA_ARG_HF_REPO: ${HOARD_LOCAL_MODEL_HF:-unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
      LLAMA_ARG_ALIAS: ${HOARD_LOCAL_MODEL:-qwen3.5-2b}
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
    # Thinking models answer straight away: tagging wants quick JSON, not a chain of thought.
    command: ${HOARD_LOCAL_MODEL_ARGS---reasoning-budget 0}
    volumes:
      - /volume1/hoard/models:/models

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # The tunnel needs no public hostnames. In the dashboard, add a private network route (CIDR) for the
    # NAS's LAN address, e.g. 192.168.50.10/32. cloudflared then forwards WARP traffic for that address
    # onto your LAN, where the port above answers.

  # Pulls new Hoard images daily and restarts it; the database upgrades itself on start (backed up first).
  # Pin HOARD_VERSION (e.g. 0.8) to take only patch releases, or remove this service to update by hand.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: hoard
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "${HOARD_UPDATE_SCHEDULE:-0 0 4 * * *}"   # seconds-first cron: 04:00 daily
    labels:
      com.centurylinklabs.watchtower.scope: hoard
