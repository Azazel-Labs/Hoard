# Topology P: everything on the NAS, reachable from anywhere over Cloudflare's private network routing
# (Cloudflare One / WARP). No public hostname, no open ports on your router: only devices enrolled in your
# Zero Trust org, running the Cloudflare One client, can reach it. See docs/DEPLOYMENT.md, "Private access".
#   cp deploy/.env.example deploy/.env && edit; edit deploy/garage.toml secrets
#   docker compose -f deploy/compose.private.yml --env-file deploy/.env up -d
services:
  garage:
    container_name: hoard-garage
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      - GARAGE_DEFAULT_BUCKET
      - GARAGE_DEFAULT_ACCESS_KEY
      - GARAGE_DEFAULT_SECRET_KEY
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/hoard/garage/meta:/var/lib/garage/meta     # adjust to your NAS paths
      - /volume1/hoard/garage/data:/var/lib/garage/data

  hoard:
    container_name: hoard
    image: ghcr.io/azazel-labs/hoard:latest   # or `build: ..` to build from this checkout
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: hoard
    restart: unless-stopped
    depends_on: [garage]
    environment:
      HOARD_STORAGE: s3
      HOARD_S3_ENDPOINT: http://garage:3900
      HOARD_S3_REGION: garage
      HOARD_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      HOARD_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      HOARD_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      HOARD_TOKEN: ${HOARD_TOKEN}
      # HTTPS gives browsers HTTP/2 (one connection for the whole thumbnail grid). Self-signed is fine on a private
      # network: accept the warning once. HTTP/3 additionally needs the UDP port below.
      HOARD_TLS_SELF_SIGNED: "true"
      HOARD_TLS_NAMES: 192.168.50.10,nas.local   # the addresses you type into the browser
      HOARD_HTTP3: "false"
    volumes:
      # Your files are in Garage's data folder above; these are the other two.
      - /volume1/hoard/config:/config      # database, Settings, backups: small, back it up
      - /volume1/hoard/cache:/cache        # thumbnails, uploads in progress, Blender/ffmpeg: can be rebuilt
    ports:
      # LAN only. Don't forward this port on your router: remote access goes through the tunnel.
      - "4627:4627"
      - "4627:4627/udp"   # HTTP/3 (QUIC), only used with HOARD_HTTP3 "true"

  # The local model server for AI tagging and descriptions (llama.cpp). It starts empty: in the portal, Settings →
  # AI tagging → Local model lists suggested models, downloads the one you pick from Hugging Face into the volume
  # below, and switches or deletes them later. The suggested ones run on the CPU in 3-6 GB of RAM; a GPU overlay
  # (compose.gpu-*.yml) moves them onto the GPU. Don't want it? Delete this service (Settings can use a hosted one).
  llm:
    container_name: hoard-llm
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    # One model in memory at a time, room for a batch of assets plus a contact sheet, and thinking models answer
    # straight away: tagging wants quick JSON, not a chain of thought.
    command: ["--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "-c", "16384", "--reasoning-budget", "0"]
    volumes:
      - /volume1/hoard/models:/models

  cloudflared:
    container_name: hoard-cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # The tunnel needs no public hostnames. In the dashboard, add a private network route (CIDR) for the
    # NAS's LAN address, e.g. 192.168.50.10/32. cloudflared then forwards WARP traffic for that address
    # onto your LAN, where the port above answers.

  # Pulls new Hoard images daily and restarts it; the database upgrades itself on start (backed up first).
  # Pin the image tag (e.g. :0.8) to take only patch releases, or remove this service to update by hand.
  watchtower:
    container_name: hoard-watchtower
    image: ghcr.io/nicholas-fedor/watchtower:1.21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: hoard
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # seconds-first cron: 04:00 daily
    labels:
      com.centurylinklabs.watchtower.scope: hoard
