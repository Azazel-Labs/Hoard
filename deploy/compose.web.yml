# Topology B, cloud half: a small VPS runs Hoard (portal, API, MCP, metadata DB, ingest) and reaches the
# NAS's Garage over Tailscale. Downloads are proxied NAS -> VPS -> client; put Cloudflare in front of the
# VPS and cache /api/blobs/* so popular files are served from the edge.
#   docker compose -f deploy/compose.web.yml --env-file deploy/.env up -d
services:
  tailscale:
    container_name: hoard-tailscale
    image: tailscale/tailscale:latest
    hostname: hoard-web
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ts-web:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin]
    ports:
      - "4627:4627"       # http:// and https:// (Settings → Connection)
      - "4627:4627/udp"   # HTTP/3, when it's on in Settings → Connection

  hoard:
    container_name: hoard
    image: ghcr.io/azazel-labs/hoard:latest   # or `build: ..` to build from this checkout
    restart: unless-stopped
    network_mode: service:tailscale
    environment:
      HOARD_STORAGE: s3
      HOARD_S3_ENDPOINT: http://hoard-nas:3900       # MagicDNS name of the NAS node
      HOARD_S3_REGION: garage
      HOARD_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      HOARD_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      HOARD_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
    volumes:
      # Your files stay at home in the NAS bucket; these are the other two.
      - hoard-config:/config      # database, Settings, backups: small, back it up
      - hoard-cache:/cache        # thumbnails served from the VPS, uploads in progress: can be rebuilt

volumes:
  ts-web:
  hoard-config:
  hoard-cache:
