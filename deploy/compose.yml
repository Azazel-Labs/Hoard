# Hoard on one machine: the server, its files on a local volume, and automatic updates.
#   docker compose -f deploy/compose.yml up -d     # then open http://<host>:4627 and make your account
# It includes a local model server for AI tagging (pick a model in the portal's Settings), and Blender and ffmpeg can
# be switched on there too.
# GPU for model thumbnails and the local model: add -f deploy/compose.gpu-nvidia.yml or -f deploy/compose.gpu-dri.yml.
# Bigger setups (files on a NAS, remote access) are in docs/DEPLOYMENT.md.
services:
  hoard:
    container_name: hoard
    image: ghcr.io/azazel-labs/hoard:latest   # or :0.8 (patch releases only), :0.8.1 (pinned), :edge (every main commit)
    restart: unless-stopped
    environment:
      # Lets Hoard ask Watchtower (below) to update it as soon as it's idle after a release.
      HOARD_WATCHTOWER_URL: http://watchtower:8080
      HOARD_WATCHTOWER_TOKEN: hoard-update
    volumes:
      # Three volumes, so each can live where it fits (swap a name for a host path, e.g. /mnt/big/hoard:/library):
      - hoard-config:/config      # database, Settings, backups: small, back it up
      - hoard-library:/library    # your files: big, put it on the disk with room
      - hoard-cache:/cache        # thumbnails, uploads in progress, Blender/ffmpeg: fast disk, can be rebuilt
    ports:
      - "4627:4627"       # http:// and https:// (Settings → HTTPS)
      - "4627:4627/udp"   # HTTP/3, when it's on in Settings → HTTPS
    labels:
      # Watchtower below updates only containers with these labels.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: hoard

  # The local model server for AI tagging and descriptions (llama.cpp). It starts empty: in the portal, Settings →
  # AI tagging → Local model lists suggested models, downloads the one you pick from Hugging Face into the volume
  # below, and switches or deletes them later. The suggested ones run on the CPU in 3-6 GB of RAM; a GPU overlay
  # (compose.gpu-*.yml) moves them onto the GPU. Don't want it? Delete this service (Settings can use a hosted one).
  llm:
    container_name: hoard-llm
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    # One model in memory at a time, room for a batch of assets plus a contact sheet, and thinking models answer
    # straight away: tagging wants quick JSON, not a chain of thought.
    command: ["--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "-c", "16384", "--reasoning-budget", "0"]
    volumes:
      - llm-models:/models

  # ── Other model servers (optional) ─────────────────────────────────────────────────────────────────────────────
  # Any OpenAI-compatible server works; the `llm` service above (llama.cpp) is the lightest choice. To use one of
  # these instead, uncomment it (and its volume at the bottom), delete `llm`, then pick it in the portal's Settings.
  #
  # Ollama: the easy one if you want to keep several models around and switch between them. It loads a model on
  # first use and unloads it when idle. Fetch models with
  #   docker compose -f deploy/compose.yml exec ollama ollama pull qwen3-vl:4b
  # then in Settings choose "Ollama" (http://ollama:11434/v1) and the model. NVIDIA GPU: give it the `deploy:` block
  # the vllm service below has. (With a GPU overlay, also delete the overlay's `llm` section once `llm` is gone.)
  # ollama:
  #   container_name: hoard-ollama
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_CONTEXT_LENGTH: "16384"   # its default is too small for a batch of assets and a contact sheet
  #     OLLAMA_KEEP_ALIVE: 10m           # how long a model stays in memory after the last request
  #   volumes:
  #     - ollama-models:/root/.ollama
  #
  # vLLM: for a dedicated NVIDIA GPU, when you want a bigger model and many packs tagged quickly. It serves one
  # model, downloaded from Hugging Face on first start. In Settings choose "Custom": http://vllm:8000/v1 and the
  # served model name below.
  # vllm:
  #   container_name: hoard-vllm
  #   image: vllm/vllm-openai:latest
  #   restart: unless-stopped
  #   ipc: host
  #   command: ["--model", "Qwen/Qwen3-VL-8B-Instruct", "--served-model-name", "qwen3-vl-8b", "--max-model-len", "16384"]
  #   environment:
  #     HF_TOKEN: ${HF_TOKEN:-}          # only for gated models
  #   volumes:
  #     - vllm-models:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # Pulls new Hoard images daily and restarts the container; the database upgrades itself on start (backed up
  # first). Pin the image tag (e.g. :0.8) to take only patch releases, or remove this service to update by hand.
  watchtower:
    container_name: hoard-watchtower
    image: ghcr.io/nicholas-fedor/watchtower:1.21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: hoard
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # seconds-first cron: 04:00 daily
      # Hoard asks for its own update over this API once it's idle; the port isn't published, so only containers
      # in this file can reach it. Periodic polls keep the 04:00 check as well.
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: hoard-update
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    labels:
      com.centurylinklabs.watchtower.scope: hoard

volumes:
  hoard-config:
  hoard-library:
  hoard-cache:
  llm-models:
  # ollama-models:
  # vllm-models:
