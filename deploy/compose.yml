# Hoard on one machine: the server, its files on a local volume, and automatic updates.
#   HOARD_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/compose.yml up -d     # then open http://<host>:7878
# It includes a small local model for AI tagging, and Blender and ffmpeg can be switched on in the portal's Settings.
# GPU for model thumbnails and the local model: add -f deploy/compose.gpu-nvidia.yml or -f deploy/compose.gpu-dri.yml.
# Bigger setups (files on a NAS, remote access) are in docs/DEPLOYMENT.md.
services:
  hoard:
    image: ghcr.io/azazel-labs/hoard:${HOARD_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Uploads, edits and admin calls need this token (the portal asks for it once); browsing doesn't.
      HOARD_TOKEN: ${HOARD_TOKEN:?set HOARD_TOKEN, e.g. HOARD_TOKEN=$(openssl rand -hex 32)}
      HOARD_PUBLIC_URL: ${HOARD_PUBLIC_URL:-}
      # The bundled model below. Settings in the portal can point Hoard elsewhere or turn AI tagging off.
      HOARD_LLM_URL: ${HOARD_LLM_URL-http://llm:8080/v1}
      HOARD_LLM_MODEL: ${HOARD_LLM_MODEL-qwen3.5-2b}
      HOARD_LLM_VISION: ${HOARD_LLM_VISION:-true}
      HOARD_LLM_BATCH: ${HOARD_LLM_BATCH:-12}         # assets per request; small models do better with fewer
    volumes:
      - hoard-data:/data          # database, files, thumbnails, backups
    ports:
      - "7878:7878"
    labels:
      # Watchtower below updates only containers with these labels.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: hoard

  # A small local vision model for AI tagging and descriptions, served by llama.cpp. It downloads the model from
  # Hugging Face on first start (about 2 GB, kept in the volume below) and runs on the CPU in about 3 GB of RAM;
  # a GPU overlay (compose.gpu-*.yml) moves it onto the GPU. Other models: docs/DEPLOYMENT.md, "AI tagging". Don't want
  # it? Delete this service and set HOARD_LLM_URL= (empty), or point Hoard at another endpoint in Settings.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
      # `<Hugging Face repo>:<quantization>`; the vision projector (mmproj) comes along automatically.
      LLAMA_ARG_HF_REPO: ${HOARD_LOCAL_MODEL_HF:-unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
      LLAMA_ARG_ALIAS: ${HOARD_LOCAL_MODEL:-qwen3.5-2b}
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
    # Thinking models answer straight away: tagging wants quick JSON, not a chain of thought.
    command: ${HOARD_LOCAL_MODEL_ARGS---reasoning-budget 0}
    volumes:
      - llm-models:/models

  # ── Other model servers (optional) ─────────────────────────────────────────────────────────────────────────────
  # Any OpenAI-compatible server works; the `llm` service above (llama.cpp) is the lightest choice. To use one of
  # these instead, uncomment it (and its volume at the bottom), delete `llm`, then pick it in the portal's Settings
  # (or set HOARD_LLM_URL / HOARD_LLM_MODEL above).
  #
  # Ollama: the easy one if you want to keep several models around and switch between them. It loads a model on
  # first use and unloads it when idle. Fetch models with
  #   docker compose -f deploy/compose.yml exec ollama ollama pull qwen3-vl:4b
  # then in Settings choose "Ollama" (http://ollama:11434/v1) and the model. NVIDIA GPU: give it the `deploy:` block
  # the vllm service below has. (With a GPU overlay, also delete the overlay's `llm` section once `llm` is gone.)
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_CONTEXT_LENGTH: "16384"   # its default is too small for a batch of assets and a contact sheet
  #     OLLAMA_KEEP_ALIVE: 10m           # how long a model stays in memory after the last request
  #   volumes:
  #     - ollama-models:/root/.ollama
  #
  # vLLM: for a dedicated NVIDIA GPU, when you want a bigger model and many packs tagged quickly. It serves one
  # model, downloaded from Hugging Face on first start. In Settings choose "Custom": http://vllm:8000/v1 and the
  # served model name below.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   restart: unless-stopped
  #   ipc: host
  #   command: ["--model", "Qwen/Qwen3-VL-8B-Instruct", "--served-model-name", "qwen3-vl-8b", "--max-model-len", "16384"]
  #   environment:
  #     HF_TOKEN: ${HF_TOKEN:-}          # only for gated models
  #   volumes:
  #     - vllm-models:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # Pulls new Hoard images daily and restarts the container; the database upgrades itself on start (backed up
  # first). Pin HOARD_VERSION (e.g. 0.8) to take only patch releases, or remove this service to update by hand.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: hoard
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "${HOARD_UPDATE_SCHEDULE:-0 0 4 * * *}"   # seconds-first cron: 04:00 daily
    labels:
      com.centurylinklabs.watchtower.scope: hoard

volumes:
  hoard-data:
  llm-models:
  # ollama-models:
  # vllm-models:
