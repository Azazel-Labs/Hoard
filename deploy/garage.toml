# Garage single-node config for Hoard's blob storage. See https://garagehq.deuxfleurs.fr/documentation/
# Replace rpc_secret with your own: `openssl rand -hex 32`.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "CHANGE_ME_64_HEX_CHARS"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

# No [admin] section: Hoard never uses Garage's admin API, so it isn't served (the `garage` command works without
# it). Add one with tokens of your own if you want metrics.
