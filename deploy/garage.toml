# Garage single-node config for Hoard's blob storage. See https://garagehq.deuxfleurs.fr/documentation/
# Replace both secrets: `openssl rand -hex 32` for rpc_secret, `openssl rand -base64 32` for the tokens.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "CHANGE_ME_64_HEX_CHARS"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "CHANGE_ME"
metrics_token = "CHANGE_ME"
