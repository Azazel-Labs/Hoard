translation = "Groepe waarvan die lede elke rol kry, een per reël, volgens naam of DN (of wat ook al die groups-claim lys). Die hoogste wat pas, wen, en dit word by elke aanmelding nagegaan. As geen gelys is nie, kry nuwe rekeninge die rol hierbo en 'n admin verander dit daarna. As groepe onder Kan kyk gelys is, mag net lede van 'n gelyste groep aanmeld."

