source = "Found on the server, or built-in"
translation = "Op die bediener gevind, of ingebou"

[messages.settings-soundfont-placeholder-desktop]
source = "Found on this computer, or built-in"
translation = "Op hierdie rekenaar gevind, of ingebou"

[messages.settings-soundfont-what]
source = "The instruments MIDI files are played and converted with."
translation = "Die instrumente waarmee MIDI-lêers gespeel en omgeskakel word."

[messages.settings-status-off]
source = "Off"
translation = "Af"

[messages.settings-store-lookup]
source = "Look up store pages automatically"
translation = "Soek winkelbladsye outomaties op"

[messages.settings-store-pages]
source = "Store pages"
translation = "Winkelbladsye"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "Nuwe pakke word in die agtergrond in die winkels opgesoek, sodat hulle hul winkelbladsy, verkoper en lisensie kry."

[messages.settings-the-default]
source = "the default"
translation = "die verstek"

[messages.settings-themes]
source = "Themes"
translation = "Temas"

[messages.settings-thumbs]
source = "Thumbnails"
translation = "Duimnaels"

[messages.settings-thumbs-avif]
source = "Send thumbnails as AVIF"
translation = "Stuur duimnaels as AVIF"

[messages.settings-thumbs-avif-what]
source = "Browsers that show AVIF get smaller thumbnails, often less than half the size. Each is made from the stored thumbnail the first time it’s shown and kept with the conversions; until then the stored one is sent. Making them keeps up to two cores busy while a big library is first browsed. Lossless thumbnails and pixel art are sent as they are."
translation = "Blaaiers wat AVIF wys, kry kleiner duimnaels, dikwels minder as die helfte van die grootte. Elkeen word van die gestoorde duimnael gemaak die eerste keer dat dit gewys word en saam met die omskakelings bewaar; tot dan word die gestoorde een gestuur. Om hulle te maak hou tot twee kerne besig terwyl ’n groot biblioteek die eerste keer deurblaai word. Verlieslose duimnaels en pixelkuns word gestuur soos hulle is."

[messages.settings-thumbs-balanced]
source = "Balanced"
translation = "Gebalanseer"

[messages.settings-thumbs-balanced-hint]
source = "JPEG, quality 82. Hard to tell from the original at thumbnail size."
translation = "JPEG, kwaliteit 82. Moeilik om van die oorspronklike te onderskei op duimnaelgrootte."

[messages.settings-thumbs-lossless]
source = "Lossless"
translation = "Verliesloos"

[messages.settings-thumbs-lossless-hint]
source = "PNG, exactly as made. Several times larger."
translation = "PNG, presies soos gemaak. Etlike kere groter."

[messages.settings-thumbs-saved]
source = "Thumbnails: { $quality }"
translation = "Duimnaels: { $quality }"

[messages.settings-thumbs-sharp]
source = "Sharper"
translation = "Skerper"

[messages.settings-thumbs-sharp-hint]
source = "JPEG, quality 92. About twice the size of Balanced."
translation = "JPEG, kwaliteit 92. Omtrent twee keer so groot as Gebalanseer."

[messages.settings-thumbs-small]
source = "Smaller"
translation = "Kleiner"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG, kwaliteit 70. Goed in die rooster; effens sag van naby."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Hoe nuwe duimnaels en modelaansigte gestoor word. Dié met deursigtigheid, en pixelkuns, is altyd PNG. Om dié wat jy reeds het te verklein, laat loop Verklein duimnaels in Instandhouding."

[messages.settings-title]
source = "Settings"
translation = "Instellings"

[messages.settings-tn]
source = "Texture names"
translation = "Tekstuurname"

[messages.settings-tn-custom]
source = "Your own"
translation = "Jou eie"

[messages.settings-tn-descriptive]
source = "Descriptive"
translation = "Beskrywend"

[messages.settings-tn-ending-add]
