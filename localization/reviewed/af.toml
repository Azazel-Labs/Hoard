[messages.sheet-animations]
source = """
{ $count ->
        [one] { $count } animation
       *[other] { $count } animations
    }"""
translation = """
{ $count ->
        [one] { $count } animasie
       *[other] { $count } animasies
    }"""

[messages.sheet-failed]
source = "This sheet can't be read."
translation = "Hierdie blad kan nie gelees word nie."

[messages.sheet-find]
source = "Find a sprite"
translation = "Soek 'n sprite"

[messages.sheet-loading]
source = "Loading the sheet…"
translation = "Laai die blad…"

[messages.sheet-no-match]
source = "No sprite has that in its name."
translation = "Geen sprite het dit in sy naam nie."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites kloksgewys gedraai en bygesny. Dit kan nie animasies hou nie: rame gaan volgens hul genommerde name."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Elke sprite regop op sy hele doek, elkeen 'n PNG wat na hom vernoem is."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprites word nooit gedraai nie en die weggesnyde rand bly as kantruimte behoue, met animasies en elke raam se tyd."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Teëls word nooit gedraai of bygesny nie, op 'n rooster van die teëlgrootte, en beelde wat reeds op een is, bly soos hulle is."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Elke sprite regop op sy hele doek, in selle wat almal ewe groot is, vir enigiets wat 'n blad in 'n rooster opsny."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Hoard se eie formaat: die bladsye soos hulle is, sprites enige kant toe gedraai en bygesny, met animasies en elke raam se tyd."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites antikloksgewys gedraai en bygesny. Dit kan nie animasies hou nie: rame gaan volgens hul genommerde name."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprites kloksgewys gedraai en bygesny, met animasies volgens naam, soos PixiJS en Phaser dit lees."

[messages.sheet-pages]
source = """
{ $count ->
        [one] { $count } page
       *[other] { $count } pages
    }"""
translation = """
{ $count ->
        [one] { $count } bladsy
       *[other] { $count } bladsye
