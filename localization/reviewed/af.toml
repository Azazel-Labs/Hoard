[messages.settings-page-copies]
source = "Near copies"
translation = "Byna-kopieë"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Lêers wat dieselfde prent, klank of model in ’n ander grootte, monstertempo of formaat is, dié wat die meeste spasie opneem eerste. Die beste van elke stel is gemerk; niks word uitgevee nie."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Aflaaie"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hoe lêers benoem word in wat Hoard stuur: aflaaie, zips, die hoard-hulpmiddel en KI-assistente. Lêers in die biblioteek bly soos hulle is."

[messages.settings-page-general]
source = "General"
translation = "Algemeen"

[messages.settings-page-general-blurb]
source = "Your dragon’s hoard, and what this server is called."
translation = "Jou draak se skat, en wat hierdie bediener genoem word."

[messages.settings-page-general-blurb-desktop]
source = "Your dragon’s hoard, and what this library is called."
translation = "Jou draak se skat, en wat hierdie biblioteek genoem word."

[messages.settings-page-issues]
source = "Issues"
translation = "Probleme"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Wat verkeerd geloop het met die oopmaak of verwerking van lêers: argiewe wat nie wou uitpak nie, lêers wat nie gelees kon word nie, take wat misluk het. Probeer hulle weer sodra die oorsaak reggestel is, of wys hulle weg."

[messages.settings-page-library]
source = "Library"
translation = "Biblioteek"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Wat in die hoard is: hoe groot dit is, waarvan dit gemaak is, hoe dit gegroei het en hoe goed dit geëtiketteer is. Geargiveerde dinge word nie getel nie."

[messages.settings-page-locations]
source = "Library locations"
translation = "Biblioteekliggings"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Die vouers op die bediener wat die biblioteek bevat: dié waarin Hoard lêers hou, en vouers met pakke wat dit indekseer waar hulle is."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Die vouers wat die biblioteek bevat: dié waarin Hoard lêers hou, en vouers met pakke wat dit indekseer waar hulle is."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Instandhouding"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Rugsteun, gaan na vir skade en ruim op. Een van elk loop op 'n slag, en jy kan hierdie bladsy verlaat terwyl hulle loop."

[messages.settings-page-performance]
source = "Performance"
translation = "Werkverrigting"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Hoe hard die bediener werk, hoe duimnaels gemaak en gehou word, en die meeste wat dit inneem."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Hoe hard Hoard werk, hoe duimnaels gemaak en gehou word, en die meeste wat dit inneem."

[messages.settings-page-search]
source = "Image and sound search"
translation = "Beeld- en klanksoektog"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Soek prente volgens wat hulle wys en klanke volgens hoe hulle klink, nie net volgens hul name nie, en vind dinge wat in soort eenders is, nie net in kleur nie."

[messages.settings-page-store-files]
source = "Store files"
translation = "Winkellêers"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Die lêers wat winkels langs hul kuns sit, wat Hoard lees om pakke te benoem en hul makers erkenning te gee. Leer dit dié wat dit nie ken nie, en deel wat jy dit geleer het."

[messages.settings-page-tags]
source = "Tags"
translation = "Etikette"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Elke etiket in die biblioteek. Voeg dié saam wat dieselfde beteken, of hernoem een; die etiketteerders gebruik van dan af die nuwe naam."

[messages.settings-page-tools]
source = "Tools"
translation = "Gereedskap"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Eksterne programme wat Hoard gebruik om lêers om te skakel en te lees."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
translation = """
Wys die { $preview ->
        [light] ligte
       *[dark] donker
    } tema sodat jy dit kan sien. Jy gebruik die { $used ->
        [light] ligte
       *[dark] donker
    } tema{ $system ->
        [yes] { " " }(volg die stelsel)
       *[other] { "" }
    }, en dit kom terug wanneer jy hierdie bladsy verlaat."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
Terug na { $used ->
        [light] lig
       *[dark] donker
    }"""

[messages.settings-previews-size]
source = "Previews take { $size } now."
translation = "Voorskoue neem nou { $size } op."

