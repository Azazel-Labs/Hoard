{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] dag
       *[other] dae
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Tot dan kan 'n omgeskakelde lêer se bladsy die oorspronklike terugsit. Teksture word nie in 'n omgeskakelde model gekopieer nie: dit verwys na die beeldlêers langsaan. 'n Model se .mtl- of .bin-lêers bly."

[messages.settings-conv-nothing]
