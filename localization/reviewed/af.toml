[messages.settings-tn-short]
source = "Short"
translation = "Kort"

[messages.settings-tn-slots]
source = "In GLB downloads, a texture packed inside a model with no file of its own is named after the material and the slot it fills, and these slots have suffixes too:"
translation = "In GLB-aflaaie word 'n tekstuur wat sonder 'n eie lêer binne-in 'n model gepak is, benoem na die materiaal en die gleuf wat dit vul, en hierdie gleuwe het ook agtervoegsels:"

[messages.settings-tn-style]
source = "Style"
translation = "Styl"

[messages.settings-tn-style-group]
source = "Naming style"
translation = "Benoemingstyl"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "Agtervoegsels vir elke soort kaart"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Benoem tekstuurkaarte na hul materiaal"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "'n Materiaal se kaarte gaan uit benoem na hom en waarvoor elke kaart is, hoe die lêers ook al benoem is: Rock_Normal.png, nie rock_moss_xeokah0_raw_8K_Normal.png nie. Die lêers in die biblioteek word nie aangeraak nie, en 'n kaart wat 'n model of MTL wat daarmee saam gestuur is noem, behou daardie naam, sodat die model dit steeds vind."

[messages.settings-tool-downloading]
source = "Downloading… progress is in the activity indicator"
translation = "Laai af… vordering is in die aktiwiteitsaanwyser"

[messages.settings-tool-looking]
