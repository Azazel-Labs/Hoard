translation = "Rig modelle regop terwyl hulle omgeskakel word (Y op, wys na +Z), soos die pak se modelle gewys word"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Skakel lêers wat Hoard hou na een formaat om, soos elke OBJ en FBX na GLB, sodat die biblioteek eenvormig is. Die omgeskakelde lêer neem die oorspronklike se plek in, met sy naam, etikette, versamelings en skakels. Lêers in gemonitorde vouers word nooit verander nie."

