translation = '{ " " }die materiaal,{ " " }'

[messages.settings-tn-hint-size]
source = '{ " " }its size when the set comes in more than one (added on the end if the pattern leaves it out).'
translation = '{ " " }sy grootte wanneer die stel in meer as een kom (aan die einde bygevoeg as die patroon dit weglaat).'

[messages.settings-tn-pattern]
source = "Pattern"
