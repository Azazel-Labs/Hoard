[messages.settings-unreal]
source = "Unreal packages"
translation = "Unreal-pakkette"

[messages.settings-unreal-download]
source = "Downloads Epic’s Linux x86-64 editor. Requires linked GitHub access and tens of GB of disk space."
translation = "Laai Epic se Linux x86-64-redigeerder af. Vereis gekoppelde GitHub-toegang en tientalle GB skyfspasie."

[messages.settings-unreal-editor-what]
source = "Installs Unreal Editor for the export worker. Run the worker separately to export assets."
translation = "Installeer Unreal Editor vir die uitvoerwerker. Begin die werker afsonderlik om bates uit te voer."

[messages.settings-unreal-image]
source = "Unreal version or image"
translation = "Unreal-weergawe of beeld"

[messages.settings-unreal-keep]
source = "Convert, keep originals"
translation = "Skakel om, hou oorspronklikes"

[messages.settings-unreal-keep-hint]
source = "Textures, sounds and materials come out in common formats; the .uasset stays too."
translation = "Teksture, klanke en materiale kom in algemene formate uit; die .uasset bly ook."

[messages.settings-unreal-off]
source = "Leave as is"
translation = "Los soos dit is"

[messages.settings-unreal-off-hint]
source = "Convert from a pack’s page when you want to."
translation = "Skakel om vanaf 'n pak se bladsy wanneer jy wil."

[messages.settings-unreal-replace]
source = "Convert, drop originals"
translation = "Skakel om, gooi oorspronklikes weg"

[messages.settings-unreal-replace-hint]
source = "Saves space once the content is out. Meshes still wait for the Unreal worker."
translation = "Bespaar spasie sodra die inhoud uit is. Mase wag steeds vir die Unreal-werker."

[messages.settings-unreal-reset]
source = "Unreal packages: back to the default"
translation = "Unreal-pakkette: terug na die verstek"

[messages.settings-unreal-what]
source = "What to do with .uasset files."
translation = "Wat om met .uasset-lêers te doen."

[messages.settings-update-check]
