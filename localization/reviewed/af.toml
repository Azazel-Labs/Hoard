translation = "Prente verlaat hierdie rekenaar. 'n Kleinkiekie van elke prent in die biblioteek, en die woorde van elke beeldsoektog, word na { $service } gestuur, wat daarvoor koste hef en dit bewaar soos sy voorwaardes bepaal."

