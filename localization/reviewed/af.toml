translation = "Keycloak, Authentik, Authelia, Okta, Zitadel en ander: gee die issuer en Ontdek vul die adresse in."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Maak 'n OAuth-toep in GitHub → Settings → Developer settings. GitHub stuur geen groepe nie, so gee rolle in Instellings → Rekening, en skakel die maak van rekeninge by die eerste aanmelding af tensy enigiemand met 'n GitHub-rekening moet kan inkom."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Maak 'n toepassing in GitLab → Preferences → Applications (of jou instansie se admin-area: verander gitlab.com in die adresse)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Maak 'n OAuth-kliënt (Web application) in Google Cloud Console → APIs & Services → Credentials. Google stuur geen groepe nie, so gee rolle in Instellings → Rekening, en skakel die maak van rekeninge by die eerste aanmelding af tensy enigiemand met 'n Google-rekening moet kan inkom."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registreer 'n toep in Entra ID → App registrations ('n Web-herleiding na die adres hieronder). Sit jou tenant-ID in die plek van “organizations” om net jou organisasie in te laat. Vir rolle uit groepe, voeg die groups-claim by onder Token configuration: dit lys groep-ID's."

