[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Wanneer 'n nuwe weergawe uit is, kan Hoard 'n adres roep sodra niks aan die gang is nie (geen oplaaie, take, omskakelings of instandhouding nie), sodat wat ook al sy houer bywerk dit nie halfpad deur 'n oplaai herbegin nie. Dit stuur 'n POST met die weergawe in 'n JSON-liggaam. Dit het die weergawekontrole hierbo nodig."

