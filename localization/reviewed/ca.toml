translation = "Creeu un client OAuth (Web application) a Google Cloud Console → APIs & Services → Credentials. Google no envia grups, així que doneu els rols a Configuració → Compte, i desactiveu la creació de comptes al primer inici de sessió tret que qualsevol persona amb un compte de Google hagi de poder entrar."

