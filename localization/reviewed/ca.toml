[messages.server-issues-file]
source = "Files that couldn’t be opened"
translation = "Fitxers que no s'han pogut obrir"

[messages.server-issues-file-blurb]
source = "Hoard couldn’t open or store them. A watched pack tries them again at its next scan; a file already in the library kept what it had before."
translation = "Hoard no els ha pogut obrir ni desar. Un paquet vigilat els torna a provar en el següent escaneig; un fitxer que ja era a la biblioteca conserva el que tenia abans."

[messages.server-issues-folder]
source = "Watched folders that can’t be read"
translation = "Carpetes vigilades que no es poden llegir"

[messages.server-issues-folder-blurb]
source = "Their packs are left as they are until the folder can be read again."
translation = "Els seus paquets es deixen tal com estan fins que la carpeta es pugui tornar a llegir."

[messages.server-issues-folder-gone]
source = "The folder “{ $folder }” wasn’t found."
translation = "No s'ha trobat la carpeta «{ $folder }»."

[messages.server-issues-job]
source = "Background jobs that failed"
translation = "Tasques en segon pla que han fallat"

[messages.server-issues-job-blurb]
source = "Retrying runs the job again from the start."
translation = "En tornar-ho a provar, la tasca s'executa de nou des del principi."

[messages.server-issues-look-again]
source = "Look again"
translation = "Torna a cercar"

[messages.server-issues-material-thumb]
source = "Materials without a thumbnail"
translation = "Materials sense miniatura"

[messages.server-issues-material-thumb-blurb]
source = "The material was found, but its preview couldn’t be drawn."
translation = "S'ha trobat el material, però no se n'ha pogut dibuixar la previsualització."

[messages.server-issues-materials]
source = "Packs whose materials couldn’t be worked out"
translation = "Paquets dels quals no s'han pogut deduir els materials"

[messages.server-issues-materials-blurb]
source = "Their textures are all there; they just aren’t grouped into materials."
translation = "Totes les textures hi són; simplement no estan agrupades en materials."

[messages.server-issues-missing]
source = "Watched packs whose folder is gone"
translation = "Paquets vigilats la carpeta dels quals ha desaparegut"

[messages.server-issues-missing-blurb]
source = "Each pack is kept for 3 days in case its folder is only offline, then removed."
translation = "Cada paquet es conserva 3 dies per si la carpeta només està fora de línia, i després s'elimina."

[messages.server-issues-pack]
source = "Packs that couldn’t be added"
translation = "Paquets que no s'han pogut afegir"

[messages.server-issues-pack-blurb]
source = "Delete the pack and add it again, or open it to see what it has."
translation = "Suprimiu el paquet i torneu-lo a afegir, o obriu-lo per veure què conté."

[messages.server-issues-read]
source = "Files Hoard couldn’t make sense of"
translation = "Fitxers que Hoard no ha sabut interpretar"

[messages.server-issues-read-again]
source = "Read again"
translation = "Torna a llegir"

[messages.server-issues-read-blurb]
source = "They’re in the library, but without the facts, tags or thumbnail that reading them gives."
translation = "Són a la biblioteca, però sense les dades, les etiquetes ni la miniatura que en dona la lectura."

[messages.server-issues-reanalyze]
source = "Re-analyze pack"
translation = "Torna a analitzar el paquet"

[messages.server-issues-render]
source = "Models the thumbnail renderer failed on"
translation = "Models en què ha fallat el renderitzador de miniatures"

[messages.server-issues-render-blurb]
source = "They have no thumbnail. Opening one in the viewer may still work, and can save one."
translation = "No tenen miniatura. Obrir-ne un al visualitzador pot funcionar igualment, i en pot desar una."

[messages.server-issues-retry]
source = "Retry"
translation = "Torna-ho a provar"

[messages.server-issues-scan-again]
source = "Scan again"
translation = "Torna a escanejar"

[messages.server-issues-store-files]
source = "Store files that couldn’t be read"
translation = "Fitxers de botiga que no s'han pogut llegir"

[messages.server-issues-store-files-blurb]
source = "Files from the store a pack came from, such as a Megascans JSON, that name and tag it."
translation = "Fitxers de la botiga d'on prové un paquet, com ara un JSON de Megascans, que li donen nom i etiquetes."

[messages.server-issues-unpack]
source = "Archives that couldn’t be unpacked"
translation = "Arxius comprimits que no s'han pogut descomprimir"

[messages.server-issues-unpack-blurb]
source = "Each is kept in its pack as a plain file, so nothing inside it is in the library."
translation = "Cadascun es conserva al seu paquet com a fitxer normal, així que res del que conté és a la biblioteca."

[messages.server-issues-unreal]
source = "Unreal packages that couldn’t be converted"
translation = "Paquets d'Unreal que no s'han pogut convertir"

[messages.server-issues-unreal-blurb]
source = "The pack’s Unreal page has the rest of its packages."
translation = "La pàgina d'Unreal del paquet té la resta dels seus paquets d'Unreal."

