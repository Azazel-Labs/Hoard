       *[other] A punt: coneix totes les { $count } imatges
    }"""

[messages.settings-clip-ready-empty]
source = "Ready. Pictures are learned as packs are added."
translation = "A punt. Les imatges s'aprenen a mesura que s'afegeixen paquets."

[messages.settings-clip-reset]
