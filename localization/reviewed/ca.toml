translation = "Les sol·licituds d'etiquetatge compten per a l'ús del vostre pla de ChatGPT. Gestiona l'ús mostra el que ha fet servir Hoard i us permet limitar-ho. Per desconnectar Hoard del mateix ChatGPT, aneu a Settings → Security and login → Sign in with ChatGPT a chatgpt.com."

[messages.settings-clip-downloading]
source = "Downloading the model… progress is in the activity indicator"
translation = "S'està baixant el model… el progrés es mostra a l'indicador d'activitat"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Cerca pel que mostren les imatges"

[messages.settings-clip-hint]
source = "Uses OpenAI’s CLIP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Fa servir el model CLIP d'OpenAI, executat al processador d'aquest servidor: no en surt res. En activar-la, es baixa el model ({ $size } MB) de Hugging Face i després aprèn cada imatge en segon pla amb prioritat baixa. Ocupa de 300 a 600 MB de memòria mentre treballa o algú cerca. En desactivar-la, se suprimeix el model i es conserva el que ha après, per a la propera vegada."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "A punt: aprenent imatges, { $done } de { $total } fins ara"

[messages.settings-clip-looking]
