Es mostra el tema { $preview ->
        [light] clar
       *[dark] fosc
    } perquè el pugueu veure. Feu servir el { $used ->
        [light] clar
       *[dark] fosc
    }{ $system ->
        [yes] { " " }(segons el sistema)
       *[other] { "" }
    }, i tornarà quan sortiu d'aquesta pàgina."""

[messages.settings-preview-back]
