translation = "Creeu una aplicació OAuth a GitHub → Settings → Developer settings. GitHub no envia grups, així que doneu els rols a Configuració → Compte, i desactiveu la creació de comptes al primer inici de sessió tret que qualsevol persona amb un compte de GitHub hagi de poder entrar."

