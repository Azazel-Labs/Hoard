[messages.settings-address]
source = "Address"
translation = "Adreça"

[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "L'adreça que fan servir les persones i les aplicacions per arribar a Hoard, quan no és la d'aquest navegador: la d'un servidor intermediari invers, la d'un túnel o un nom de tailnet, com ara https://hoard.example.com. Els enllaços que dona Hoard (a Claude i altres aplicacions, en l'inici de sessió, al seu certificat) la fan servir."

