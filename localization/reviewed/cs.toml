[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "Adresa, kterou lidé a aplikace používají k přístupu k Hoardu, pokud to není ta, na které je tento prohlížeč: adresa reverzní proxy, tunelu nebo název v tailnetu, například https://hoard.example.com. Používají ji odkazy, které Hoard rozdává (Claudovi a jiným aplikacím, při přihlášení, ve svém certifikátu)."

