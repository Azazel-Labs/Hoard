translation = "Napište, co hledáte („mossy rock“, „sci-fi door“, „wooden barrel“), a obrázky, které to zobrazují, se objeví vedle názvů obsahujících tato slova. „Další podobné“ najde věci stejného druhu, nejen stejných barev."

