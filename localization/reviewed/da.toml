[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Navngiv tekstur-maps efter deres materiale"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Et materiales maps sendes ud navngivet efter materialet og efter, hvad hvert map er til, uanset hvad filerne hedder: Rock_Normal.png, ikke rock_moss_xeokah0_raw_8K_Normal.png. Filerne i biblioteket røres ikke, og et map, som en model eller MTL-fil, der sendes med, nævner ved navn, beholder det navn, så modellen stadig finder det."

