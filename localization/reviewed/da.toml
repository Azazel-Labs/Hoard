Viser det { $preview ->
        [light] lyse
       *[dark] mørke
    } tema, så du kan se det. Du bruger det { $used ->
        [light] lyse
       *[dark] mørke
    }{ $system ->
        [yes] { " " }(følger systemet)
       *[other] { "" }
    }, og det vender tilbage, når du forlader denne side."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
Tilbage til { $used ->
        [light] lyst tema
