translation = "Konverterer filer, som Hoard opbevarer, til ét format, f.eks. alle OBJ og FBX til GLB, så biblioteket er ensartet. Den konverterede fil tager originalens plads med dens navn, tags, samlinger og links. Filer i overvågede mapper ændres aldrig."

