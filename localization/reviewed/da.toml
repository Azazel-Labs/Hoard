{ $count ->
        [one] { $count } animation
       *[other] { $count } animations
    }"""
translation = """
{ $count ->
        [one] { $count } animation
       *[other] { $count } animationer
    }"""

[messages.sheet-failed]
source = "This sheet can't be read."
translation = "Dette ark kan ikke læses."

[messages.sheet-find]
source = "Find a sprite"
translation = "Find en sprite"

[messages.sheet-loading]
source = "Loading the sheet…"
translation = "Indlæser arket…"

[messages.sheet-no-match]
source = "No sprite has that in its name."
translation = "Ingen sprite har det i sit navn."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites drejet med uret og beskåret. Det kan ikke rumme animationer: billederne følger deres nummererede navne."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Hver sprite opret på hele sit lærred, hver som en PNG opkaldt efter den."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprites drejes aldrig, og det beskårne bevares som margener, med animationer og hvert billedes varighed."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Fliser drejes eller beskæres aldrig, i et gitter på flisestørrelsen, og billederne beholdes, hvis de allerede ligger i et."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Hver sprite opret på hele sit lærred, i celler af samme størrelse, til alt, der skærer et ark op i et gitter."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
