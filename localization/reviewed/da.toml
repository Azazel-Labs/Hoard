[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Hver animation får også en kort film i loop, der afspilles, mens du peger på dens felt. De fylder omkring 40 KB hver og tager et stykke tid at lave for et stort bibliotek. Slår du det fra, slettes de."

[messages.settings-name]
source = "Name"
translation = "Navn"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Hvad denne server hedder i topbjælken, i browserfanen og på login-siden, så du kan kende forskel, hvis du har mere end én Hoard."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "Hvad dette bibliotek hedder i topbjælken."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Konto"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Din adgangskode, de andre personer, der kan logge ind, og adgangstokens til scripts og andre programmer."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Tilføjelse af pakker"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Hvad Hoard gør med en pakke, når den tilføjes, ud over at læse og tagge den."

[messages.settings-page-ai]
source = "AI tagging"
translation = "AI-tagging"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "En AI-model navngiver, beskriver og tagger nye pakker oven i de indbyggede regler. Dens tags er markeret som forslag."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Udseende"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "De temaer, denne browser bruger, når den er lys, og når den er mørk. Gemmes kun i denne browser."

[messages.settings-page-auth]
source = "Authentication"
translation = "Godkendelse"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Hvordan folk logger ind: Hoards egne konti, et LDAP-katalog, Microsoft Active Directory eller en OAuth-udbyder, hvor længe sessioner varer, og hvilke grupper der får hvilken rolle."

[messages.settings-page-connection]
source = "Connection"
translation = "Forbindelse"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Hvordan browsere og apps når Hoard: den adresse, den er kendt under, og HTTPS, som nogle browserfunktioner kræver."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Downloads"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hvordan filer navngives i det, Hoard sender: downloads, zip-filer, hoard-værktøjet og AI-assistenter. Filerne i biblioteket forbliver, som de er."

[messages.settings-page-general]
source = "General"
translation = "Generelt"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Hvad denne server hedder, for alle, der bruger den."

[messages.settings-page-general-blurb-desktop]
source = "What this library is called."
translation = "Hvad dette bibliotek hedder."

[messages.settings-page-issues]
source = "Issues"
translation = "Problemer"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Hvad der gik galt ved åbning eller behandling af filer: arkiver, der ikke ville pakkes ud, filer, der ikke kunne læses, job, der mislykkedes. Prøv dem igen, når årsagen er rettet, eller afvis dem."

[messages.settings-page-library]
source = "Library"
translation = "Bibliotek"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Hvad der er i Hoard: hvor stort det er, hvad det består af, hvordan det er vokset, og hvor godt det er tagget. Arkiverede ting tælles ikke med."

[messages.settings-page-locations]
source = "Library locations"
translation = "Biblioteksplaceringer"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "De mapper på serveren, der indeholder biblioteket: dem, Hoard opbevarer filer i, og mapper med pakker, som den indekserer, hvor de ligger."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "De mapper, der indeholder biblioteket: dem, Hoard opbevarer filer i, og mapper med pakker, som den indekserer, hvor de ligger."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Vedligeholdelse"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Sikkerhedskopiér, kontrollér for skader, og ryd op. Én af hver slags kører ad gangen, og du kan forlade siden, mens de kører."

[messages.settings-page-performance]
source = "Performance"
translation = "Ydeevne"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Hvor hårdt serveren arbejder, hvordan miniaturer laves og opbevares, og hvor meget den højst tager imod."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Hvor hårdt Hoard arbejder, hvordan miniaturer laves og opbevares, og hvor meget den højst tager imod."

[messages.settings-page-search]
source = "Image and sound search"
translation = "Billed- og lydsøgning"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Søg i billeder efter det, de viser, og i lyde efter, hvordan de lyder, ikke kun efter deres navne, og find ting, der ligner hinanden i art, ikke kun i farve."

[messages.settings-page-store-files]
source = "Store files"
translation = "Butiksfiler"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "De filer, butikker lægger ved siden af deres grafik, og som Hoard læser for at navngive pakker og kreditere deres skabere. Lær den dem, den ikke kender, og del det, du har lært den."

[messages.settings-page-tags]
source = "Tags"
translation = "Tags"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Alle tags i biblioteket. Flet dem, der betyder det samme, eller omdøb et; taggerne bruger derefter det nye navn."

[messages.settings-page-tools]
source = "Tools"
translation = "Værktøjer"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Eksterne programmer, Hoard bruger til at konvertere og læse filer."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
