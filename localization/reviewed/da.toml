[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Når en ny udgivelse er ude, kan Hoard kalde en adresse, så snart der ikke sker noget (ingen uploads, job, konverteringer eller vedligeholdelse), så det, der opdaterer containeren, ikke genstarter den midt i en upload. Den sender en POST med udgivelsen i en JSON-body. Dette kræver udgivelsestjekket ovenfor."

