source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Opret en applikation i GitLab → Preferences → Applications (eller i din instans' administrationsområde: ret gitlab.com i adresserne)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Opret en OAuth-klient (webapplikation) i Google Cloud Console → APIs & Services → Credentials. Google sender ingen grupper, så tildel roller under Indstillinger → Konto, og slå oprettelse af konti ved første login fra, medmindre alle med en Google-konto skal kunne komme ind."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registrér en app i Entra ID → App registrations (en web-omdirigering til adressen nedenfor). Skriv dit tenant-id i stedet for »organizations« for kun at lukke din organisation ind. For at få roller fra grupper skal du tilføje groups-claimet under Token configuration: det angiver gruppe-id'er."

