source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grupper, hvis medlemmer får hver rolle, én pr. linje, efter navn eller DN (eller hvad groups-claimet nu angiver). Den højeste, der matcher, vinder, og det kontrolleres ved hvert login. Hvis der ikke står nogen, får nye konti rollen ovenfor, og en administrator ændrer den bagefter. Hvis der står grupper under Kan se, kan kun medlemmer af en af dem logge ind."

