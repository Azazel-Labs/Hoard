translation = "Tilføj en regel"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Den ligger i én pakke.
       *[other] De ligger i { $packs } pakker.
    } Hver original gemmes i { $days } dage, og indtil da kan den gendannes fra sin side."""

