translation = "Bruger OpenAIs CLIP-model, som køres på denne computers processor: intet forlader den. Når du slår det til, downloades modellen ({ $size } MB) fra Hugging Face, og derefter lærer den alle billeder i baggrunden med lav prioritet. Den bruger 300 til 600 MB hukommelse, mens den arbejder, eller du søger. Når du slår det fra, slettes modellen, men det, den har lært, beholdes til næste gang."

