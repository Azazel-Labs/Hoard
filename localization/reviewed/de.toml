[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Gruppen, deren Mitglieder die jeweilige Rolle bekommen, eine pro Zeile, per Name oder DN. Die höchste passende gilt, und das wird bei jeder Anmeldung geprüft. Ist keine aufgeführt, bekommen neue Konten die Rolle oben, und ein Admin ändert sie danach. Sind unter „Darf ansehen“ Gruppen aufgeführt, dürfen sich nur Mitglieder einer aufgeführten Gruppe anmelden."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Gruppen, deren Mitglieder die jeweilige Rolle bekommen, eine pro Zeile, per Name oder DN (oder was immer der Gruppenanspruch auflistet). Die höchste passende gilt, und das wird bei jeder Anmeldung geprüft. Ist keine aufgeführt, bekommen neue Konten die Rolle oben, und ein Admin ändert sie danach. Sind unter „Darf ansehen“ Gruppen aufgeführt, dürfen sich nur Mitglieder einer aufgeführten Gruppe anmelden."

