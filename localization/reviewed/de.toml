[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Wenn eine neue Version erscheint, kann Hoard eine Adresse aufrufen, sobald nichts läuft (keine Uploads, Aufträge, Umwandlungen oder Wartung), damit das, was seinen Container aktualisiert, ihn nicht mitten in einem Upload neu startet. Es sendet ein POST mit der Version in einem JSON-Body. Dafür muss die Versionsprüfung oben aktiviert sein."

