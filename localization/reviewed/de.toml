[messages.settings-clip-hint]
source = "Uses Google’s SigLIP 2 model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Verwendet das SigLIP-2-Modell von Google, ausgeführt auf dem Prozessor dieses Servers: Nichts verlässt ihn. Beim Einschalten wird das Modell ({ $size } MB) von Hugging Face heruntergeladen, das dann im Hintergrund mit niedriger Priorität jedes Bild lernt. Während es arbeitet oder jemand sucht, belegt es 350 bis 750 MB Arbeitsspeicher. Beim Ausschalten wird das Modell gelöscht, das Gelernte aber für das nächste Mal behalten."

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Verwendet das SigLIP-2-Modell von Google, ausgeführt auf dem Prozessor dieses Computers: Nichts verlässt ihn. Beim Einschalten wird das Modell ({ $size } MB) von Hugging Face heruntergeladen, das dann im Hintergrund mit niedriger Priorität jedes Bild lernt. Während es arbeitet oder Sie suchen, belegt es 350 bis 750 MB Arbeitsspeicher. Beim Ausschalten wird das Modell gelöscht, das Gelernte aber für das nächste Mal behalten."

[messages.settings-clip-hosted]
source = "A hosted service"
translation = "Bei einem gehosteten Dienst"

[messages.settings-clip-hosted-hint]
source = "Nothing is downloaded or run here: the service learns every picture, a batch at a time. Another service or model learns them all again, and what each one learned is kept, for switching back."
translation = "Hier wird nichts heruntergeladen oder ausgeführt: Der Dienst lernt jedes Bild, stapelweise. Ein anderer Dienst oder ein anderes Modell lernt alle neu, und was jedes gelernt hat, bleibt erhalten, für den Wechsel zurück."

[messages.settings-clip-hosted-unavailable]
source = "Couldn’t use { $service }: { $detail }. Trying again every hour."
translation = "{ $service } konnte nicht genutzt werden: { $detail }. Neuer Versuch jede Stunde."

[messages.settings-clip-hosted-warning]
source = "Pictures leave this server. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Bilder verlassen diesen Server. Eine Miniatur jedes Bildes der Bibliothek und die Wörter jeder Bildsuche werden an { $service } gesendet, das dafür Gebühren berechnet und sie nach seinen Bedingungen aufbewahrt."

