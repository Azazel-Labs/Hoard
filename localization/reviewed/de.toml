translation = "{ $name } konnte nicht hinzugefügt werden"

[messages.account-added]
source = "{ $name } can sign in now."
translation = "{ $name } kann sich jetzt anmelden."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude und andere KI-Apps"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Verbinden Sie Claude (oder eine beliebige MCP-App), dann kann es für Sie Assets suchen und abrufen und beschreiben und taggen, was Hoard noch nicht erfasst hat. Beim ersten Mal meldet es sich bei Hoard an; Sie erlauben es hier im Browser."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "Die Hoard-App meldet Sie selbst an, deshalb gibt es kein Passwort. Erstellen Sie unten ein Zugriffstoken für die Engine-Plugins und den Befehl hoard."

[messages.account-change-password]
source = "Change password"
translation = "Passwort ändern"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Einstellungen → Konnektoren → Benutzerdefinierten Konnektor hinzufügen, Adresse einfügen, dann Verbinden. Diese verbinden sich von den Servern von Anthropic aus, daher muss Hoard über HTTPS aus dem Internet erreichbar sein."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Einstellungen → Konnektoren → Benutzerdefinierten Konnektor hinzufügen, Adresse einfügen, dann Verbinden. Diese verbinden sich von den Servern von Anthropic aus, daher muss Hoard über HTTPS aus dem Internet erreichbar sein (diese Adresse ist es nicht: Legen Sie die öffentliche Adresse unter Einstellungen → Verbindung fest)."

