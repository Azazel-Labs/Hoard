[messages.auth-preset-custom-note]
source = "Keycloak, Authentik, Authelia, Okta, Zitadel and others: give the issuer and Discover fills in the addresses."
translation = "Keycloak, Authentik, Authelia, Okta, Zitadel und andere: Geben Sie den Issuer an, und „Ermitteln“ trägt die Adressen ein."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Legen Sie in GitHub unter Settings → Developer settings eine OAuth-App an. GitHub sendet keine Gruppen; vergeben Sie Rollen daher unter Einstellungen → Konto, und schalten Sie das Anlegen von Konten bei der ersten Anmeldung aus, es sei denn, jeder mit einem GitHub-Konto soll hineinkommen."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Legen Sie in GitLab unter Preferences → Applications eine Anwendung an (oder im Admin-Bereich Ihrer Instanz: Ersetzen Sie dann gitlab.com in den Adressen)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Legen Sie in der Google Cloud Console unter APIs & Dienste → Anmeldedaten einen OAuth-Client (Webanwendung) an. Google sendet keine Gruppen; vergeben Sie Rollen daher unter Einstellungen → Konto, und schalten Sie das Anlegen von Konten bei der ersten Anmeldung aus, es sei denn, jeder mit einem Google-Konto soll hineinkommen."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registrieren Sie eine App unter Entra ID → App-Registrierungen (mit einer Web-Weiterleitung auf die Adresse unten). Setzen Sie Ihre Mandanten-ID anstelle von „organizations“ ein, um nur Ihre Organisation hereinzulassen. Für Rollen aus Gruppen fügen Sie unter Tokenkonfiguration den Gruppenanspruch hinzu: Er listet Gruppen-IDs."

