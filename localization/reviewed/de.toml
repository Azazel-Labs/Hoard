translation = "Wandelt die Dateien, die Hoard speichert, in ein Format um, etwa alle OBJ und FBX in GLB, damit die Bibliothek einheitlich ist. Die umgewandelte Datei tritt an die Stelle des Originals und behält dessen Namen, Tags, Sammlungen und Verknüpfungen. Dateien in überwachten Ordnern werden nie verändert."

