source = "Version"
translation = "Version"

[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "Hoard bewahrt Spiel-Assets (Modelle, Texturen, Sounds, Musik, Sprites und mehr) in einer Bibliothek auf, die Sie durchsuchen, in der Vorschau ansehen und aus der Sie sich bedienen können, geteilt mit allen, denen Sie Zugang geben."

[messages.account-add]
source = "Add"
translation = "Hinzufügen"

[messages.account-add-failed]
