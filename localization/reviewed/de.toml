translation = "Jedes Sprite aufrecht auf seiner ganzen Leinwand, in gleich großen Zellen, für alles, was ein Sheet in ein Raster zerlegt."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Hoards eigenes Format: die Seiten unverändert, Sprites beliebig gedreht und beschnitten, mit Animationen und der Dauer jedes Frames."

[messages.sheet-note-libgdx]
