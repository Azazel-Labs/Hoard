translation = "Αφαίρεση κατάληξης { $ending }"

[messages.settings-tn-ending-to]
source = "Swap for"
translation = "Αντικατάσταση με"

[messages.settings-tn-ending-to-example]
source = "_BC"
translation = "_BC"

[messages.settings-tn-endings]
source = "Endings of your own"
translation = "Δικές σας καταλήξεις"

[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "Μια υφή που δεν είναι κάποιος από τους χάρτες ενός υλικού κρατά το δικό της όνομα, εκτός αν τελειώνει σε μία από αυτές: το _diff → _BC στέλνει το rock_diff.png ως rock_BC.png. Αφήστε το δεύτερο κενό για να αφαιρεθεί η κατάληξη."

[messages.settings-tn-example]
source = "Example"
translation = "Παράδειγμα"

[messages.settings-tn-hint-map]
source = '{ " " }what the map is for,{ " " }'
translation = '{ " " }σε τι χρησιμεύει ο χάρτης,{ " " }'

[messages.settings-tn-hint-name]
