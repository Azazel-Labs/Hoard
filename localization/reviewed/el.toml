[messages.about-blender]
source = "Converts 3D models and makes their thumbnails."
translation = "Μετατρέπει τρισδιάστατα μοντέλα και φτιάχνει τις μικρογραφίες τους."

[messages.about-built-with]
source = "Built with"
translation = "Φτιαγμένο με"

[messages.about-built-with-what]
source = "The open source libraries Hoard is made from, with their licenses."
translation = "Οι βιβλιοθήκες ανοιχτού κώδικα από τις οποίες είναι φτιαγμένο το Hoard, με τις άδειές τους."

[messages.about-clap]
source = "Finds sounds by what they sound like."
translation = "Βρίσκει ήχους με βάση το πώς ακούγονται."

[messages.about-count]
source = "{ $shown } of { $total }"
translation = "{ $shown } από { $total }"

[messages.about-discord]
source = "Chat with us on Discord"
translation = "Συζητήστε μαζί μας στο Discord"

[messages.about-downloaded]
source = "Downloaded when needed"
translation = "Λήψη όταν χρειάζεται"

[messages.about-downloaded-what]
source = "Hoard doesn’t come with these. It downloads each one the first time something needs it, and each comes under its own license."
translation = "Το Hoard δεν τα περιλαμβάνει. Κατεβάζει το καθένα την πρώτη φορά που κάτι το χρειάζεται, και το καθένα έχει τη δική του άδεια χρήσης."

[messages.about-edition]
source = "Edition"
translation = "Εκδοχή"

[messages.about-edition-desktop]
source = "Desktop app"
translation = "Εφαρμογή υπολογιστή"

[messages.about-edition-server]
source = "Server"
translation = "Διακομιστής"

[messages.about-edition-steam]
source = "Desktop app from Steam"
translation = "Εφαρμογή υπολογιστή από το Steam"

[messages.about-ffmpeg]
source = "Converts sound and video and makes their previews."
translation = "Μετατρέπει ήχο και βίντεο και φτιάχνει τις προεπισκοπήσεις τους."

[messages.about-filter]
source = "Filter by name or license"
translation = "Φιλτράρισμα κατά όνομα ή άδεια"

[messages.about-issues]
source = "Report a problem"
translation = "Αναφορά προβλήματος"

[messages.about-license]
source = "License"
translation = "Άδεια χρήσης"

[messages.about-license-what]
source = "Hoard is open source under the MIT No Attribution license: use it, change it and share it however you like."
translation = "Το Hoard είναι ανοιχτού κώδικα με την άδεια MIT No Attribution: χρησιμοποιήστε το, αλλάξτε το και μοιραστείτε το όπως θέλετε."

[messages.about-licenses-failed]
source = "The list couldn’t be loaded."
translation = "Δεν ήταν δυνατή η φόρτωση της λίστας."

[messages.about-licenses-loading]
source = "Loading the list…"
translation = "Φόρτωση της λίστας…"

[messages.about-made-by]
source = "Made by"
translation = "Δημιουργός"

[messages.about-models]
source = "Models you pick for the local AI server come under their makers’ licenses."
translation = "Τα μοντέλα που επιλέγετε για τον τοπικό διακομιστή ΤΝ διέπονται από τις άδειες των δημιουργών τους."

[messages.about-no-license]
source = "No license given"
translation = "Δεν δηλώνεται άδεια"

[messages.about-report]
source = "Report a problem…"
translation = "Αναφορά προβλήματος…"

[messages.about-siglip]
source = "Finds pictures by what’s in them."
translation = "Βρίσκει εικόνες με βάση το τι δείχνουν."

[messages.about-source]
source = "Source code on GitHub"
translation = "Πηγαίος κώδικας στο GitHub"

[messages.about-steam]
source = "Hoard on Steam"
translation = "Το Hoard στο Steam"

[messages.about-steamworks]
source = "The Steam build also includes the Steamworks SDK, © Valve Corporation."
translation = "Η έκδοση για το Steam περιλαμβάνει επίσης το Steamworks SDK, © Valve Corporation."

[messages.about-version]
source = "Version"
translation = "Έκδοση"

[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "Το Hoard κρατά στοιχεία παιχνιδιών (μοντέλα, υφές, ήχους, μουσική, sprites και άλλα) σε μία βιβλιοθήκη όπου μπορείτε να κάνετε αναζήτηση, να δείτε προεπισκόπηση και να παίρνετε ό,τι χρειάζεστε, κοινόχρηστη με όλους όσους δίνετε πρόσβαση."

[messages.account-add]
source = "Add"
translation = "Προσθήκη"

[messages.account-add-failed]
source = "Couldn't add { $name }"
translation = "Δεν ήταν δυνατή η προσθήκη του χρήστη { $name }"

[messages.account-added]
source = "{ $name } can sign in now."
translation = "Ο χρήστης { $name } μπορεί πλέον να συνδεθεί."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude και άλλες εφαρμογές AI"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Συνδέστε το Claude (ή οποιαδήποτε εφαρμογή MCP) και θα μπορεί να αναζητά και να φέρνει στοιχεία για εσάς, και να περιγράφει και να βάζει ετικέτες σε ό,τι δεν έχει κάνει ακόμη το Hoard. Συνδέεται στο Hoard την πρώτη φορά· εσείς το επιτρέπετε εδώ, στο πρόγραμμα περιήγησης."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "Η εφαρμογή Hoard σας συνδέει μόνη της, οπότε δεν υπάρχει κωδικός. Δημιουργήστε παρακάτω ένα διακριτικό πρόσβασης για τα πρόσθετα των μηχανών και την εντολή hoard."

[messages.account-change-password]
source = "Change password"
translation = "Αλλαγή κωδικού πρόσβασης"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Settings → Connectors → Add custom connector, επικολλήστε τη διεύθυνση και μετά Connect. Αυτά συνδέονται από τους διακομιστές της Anthropic, οπότε το Hoard πρέπει να είναι προσβάσιμο από το διαδίκτυο μέσω HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Settings → Connectors → Add custom connector, επικολλήστε τη διεύθυνση και μετά Connect. Αυτά συνδέονται από τους διακομιστές της Anthropic, οπότε το Hoard πρέπει να είναι προσβάσιμο από το διαδίκτυο μέσω HTTPS (αυτή η διεύθυνση δεν είναι: ορίστε τη Δημόσια διεύθυνση στις Ρυθμίσεις → Συνδεσιμότητα)."

