[messages.formatwizard-library]
source = """
{ $files ->
        [one] { $files } file
       *[other] { $files } files
    } in { $packs ->
        [one] { $packs } pack
       *[other] { $packs } packs
    } have a name it takes. Of { $tried } tried, it reads { $read }."""
translation = """
{ $files ->
        [one]
            { $files } αρχείο σε { $packs ->
                [one] { $packs } πακέτο
               *[other] { $packs } πακέτα
            } έχει όνομα που δέχεται.
       *[other]
            { $files } αρχεία σε { $packs ->
                [one] { $packs } πακέτο
               *[other] { $packs } πακέτα
            } έχουν όνομα που δέχεται.
    } Από τα { $tried } που δοκιμάστηκαν, διαβάζει { $read }."""

