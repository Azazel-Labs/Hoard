translation = "ο κατάλογος δεν επιτρέπει ανώνυμη αναζήτηση χρηστών ({ $reason })"

[messages.error-ldap-no-certificate]
source = "no certificate in it"
translation = "δεν περιέχει πιστοποιητικό"

[messages.error-ldap-no-server]
