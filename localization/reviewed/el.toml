[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Μετατρέπει τα αρχεία που κρατά το Hoard σε μία μορφή, π.χ. όλα τα OBJ και FBX σε GLB, ώστε η βιβλιοθήκη να είναι ομοιόμορφη. Το αρχείο που μετατράπηκε παίρνει τη θέση του πρωτοτύπου, με το όνομα, τις ετικέτες, τις συλλογές και τους συνδέσμους του. Τα αρχεία σε παρακολουθούμενους φακέλους δεν αλλάζουν ποτέ."

