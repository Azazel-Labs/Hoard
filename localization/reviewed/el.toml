translation = "Κανένα sprite δεν το έχει αυτό στο όνομά του."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites περιστραμμένα δεξιόστροφα και περικομμένα. Δεν μπορεί να περιέχει animations: τα καρέ ακολουθούν τα αριθμημένα ονόματά τους."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Κάθε sprite όρθιο σε ολόκληρο τον καμβά του, το καθένα ως PNG με το όνομά του."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Τα sprites δεν περιστρέφονται ποτέ και ό,τι περικόπηκε διατηρείται ως περιθώριο, με animations και τη διάρκεια κάθε καρέ."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Τα πλακίδια δεν περιστρέφονται ούτε περικόπτονται ποτέ, σε πλέγμα με το μέγεθος του πλακιδίου· οι εικόνες που είναι ήδη σε πλέγμα μένουν ως έχουν."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Κάθε sprite όρθιο σε ολόκληρο τον καμβά του, σε κελιά ίδιου μεγέθους, για οτιδήποτε κόβει ένα φύλλο σε πλέγμα."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Η δική μορφή του Hoard: οι σελίδες ως έχουν, τα sprites περιστραμμένα με οποιονδήποτε τρόπο και περικομμένα, με animations και τη διάρκεια κάθε καρέ."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites περιστραμμένα αριστερόστροφα και περικομμένα. Δεν μπορεί να περιέχει animations: τα καρέ ακολουθούν τα αριθμημένα ονόματά τους."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprites περιστραμμένα δεξιόστροφα και περικομμένα, με animations κατά όνομα, όπως τα διαβάζουν το PixiJS και το Phaser."

