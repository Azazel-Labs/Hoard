source = "The new issue is filled in with this. When the log is too long for that, only its last lines go in; Copy has all of it."
translation = "Το νέο issue συμπληρώνεται με αυτά. Αν το αρχείο καταγραφής είναι πολύ μεγάλο, μπαίνουν μόνο οι τελευταίες γραμμές του· η Αντιγραφή τα έχει όλα."

[messages.report-loading]
source = "Gathering the report…"
translation = "Συγκέντρωση της αναφοράς…"

[messages.report-log]
source = "What the server logged lately"
translation = "Τι κατέγραψε πρόσφατα ο διακομιστής"

[messages.report-title]
source = "Report a problem"
translation = "Αναφορά προβλήματος"

[messages.report-what]
source = "This is what an issue on GitHub needs for the problem to be looked into. Nothing private is in it: access tokens, passwords, keys, email addresses and your name in folder paths are taken out. Read it over before you send it."
translation = "Αυτά χρειάζεται ένα issue στο GitHub για να διερευνηθεί το πρόβλημα. Δεν περιέχει τίποτα ιδιωτικό: τα διακριτικά πρόσβασης, οι κωδικοί, τα κλειδιά, οι διευθύνσεις email και το όνομά σας στις διαδρομές φακέλων αφαιρούνται. Διαβάστε το πριν το στείλετε."

[messages.reset-label]
source = "Reset to the default, { $value }"
translation = "Επαναφορά στην προεπιλογή, { $value }"

[messages.reset-title]
source = "Reset to the default: { $value }"
translation = "Επαναφορά στην προεπιλογή: { $value }"

[messages.root-desktop-reopen]
source = "This window was signed out. Close Hoard and open it again to carry on."
translation = "Αυτό το παράθυρο αποσυνδέθηκε. Κλείστε το Hoard και ανοίξτε το ξανά για να συνεχίσετε."

[messages.root-lazy-connect]
source = "the app connection"
translation = "σύνδεσης εφαρμογής"

[messages.root-try-again]
source = "Try again"
translation = "Δοκιμάστε ξανά"

[messages.root-unreachable]
source = "Couldn’t reach the Hoard server: { $error }"
translation = "Δεν ήταν δυνατή η πρόσβαση στον διακομιστή Hoard: { $error }"

[messages.root-unreachable-desktop]
source = "Hoard isn’t answering: { $error }"
translation = "Το Hoard δεν απαντά: { $error }"

[messages.server-back-to-settings]
source = "Back to Settings"
translation = "Πίσω στις Ρυθμίσεις"

[messages.server-chatgpt-not-finished-title]
source = "Sign-in not finished"
translation = "Η σύνδεση δεν ολοκληρώθηκε"

[messages.server-chatgpt-other-computer]
source = "If you started the sign-in from Hoard on another computer, copy this page's address from the address bar and paste it into Hoard's Settings there."
translation = "Αν ξεκινήσατε τη σύνδεση από το Hoard σε άλλον υπολογιστή, αντιγράψτε τη διεύθυνση αυτής της σελίδας από τη γραμμή διευθύνσεων και επικολλήστε την στις Ρυθμίσεις του Hoard εκεί."

[messages.server-chatgpt-revoke-failed]
source = "Signed out here, but OpenAI couldn't be told. To be sure, disconnect Hoard in ChatGPT Settings → Security and login → Sign in with ChatGPT."
translation = "Αποσυνδεθήκατε εδώ, αλλά δεν ήταν δυνατό να ενημερωθεί το OpenAI. Για σιγουριά, αποσυνδέστε το Hoard στο ChatGPT από Settings → Security and login → Sign in with ChatGPT."

[messages.server-chatgpt-signed-in]
source = "Hoard is signed in. AI tagging can use your ChatGPT plan now."
translation = "Το Hoard συνδέθηκε. Οι ετικέτες με AI μπορούν πλέον να χρησιμοποιούν τη συνδρομή σας ChatGPT."

[messages.server-chatgpt-signed-in-as]
source = "Hoard is signed in as { $email }. AI tagging can use your ChatGPT plan now."
translation = "Το Hoard συνδέθηκε ως { $email }. Οι ετικέτες με AI μπορούν πλέον να χρησιμοποιούν τη συνδρομή σας ChatGPT."

[messages.server-chatgpt-signed-in-title]
source = "Signed in to ChatGPT"
translation = "Συνδεθήκατε στο ChatGPT"

[messages.server-issues-blob-damaged]
source = "The stored file doesn’t match what was stored: it’s damaged."
translation = "Το αποθηκευμένο αρχείο δεν ταιριάζει με αυτό που αποθηκεύτηκε: έχει καταστραφεί."

[messages.server-issues-blob-missing]
source = "The stored file is gone."
translation = "Το αποθηκευμένο αρχείο χάθηκε."

[messages.server-issues-convert]
source = "Models Blender couldn’t convert"
translation = "Μοντέλα που το Blender δεν μπόρεσε να μετατρέψει"

[messages.server-issues-convert-again]
source = "Convert again"
translation = "Νέα μετατροπή"

[messages.server-issues-convert-blurb]
source = "They have no GLB copy, so they can’t be shown in 3D."
translation = "Δεν έχουν αντίγραφο GLB, οπότε δεν μπορούν να εμφανιστούν σε 3D."

[messages.server-issues-damaged]
source = "Stored files that are damaged or gone"
translation = "Αποθηκευμένα αρχεία που έχουν καταστραφεί ή χαθεί"

[messages.server-issues-damaged-blurb]
source = "Found by Check files for damage. Restore them from a backup or add their pack again, then run Check files for damage again."
translation = "Εντοπίστηκαν από την εργασία «Έλεγχος αρχείων για φθορές». Επαναφέρετέ τα από αντίγραφο ασφαλείας ή προσθέστε ξανά το πακέτο τους και μετά εκτελέστε ξανά την εργασία «Έλεγχος αρχείων για φθορές»."

[messages.server-issues-file]
source = "Files that couldn’t be opened"
translation = "Αρχεία που δεν ήταν δυνατό να ανοίξουν"

[messages.server-issues-file-blurb]
source = "Hoard couldn’t open or store them. A watched pack tries them again at its next scan; a file already in the library kept what it had before."
translation = "Το Hoard δεν μπόρεσε να τα ανοίξει ή να τα αποθηκεύσει. Ένα παρακολουθούμενο πακέτο τα ξαναδοκιμάζει στην επόμενη σάρωσή του· ένα αρχείο που ήταν ήδη στη βιβλιοθήκη κράτησε ό,τι είχε πριν."

[messages.server-issues-folder]
source = "Watched folders that can’t be read"
translation = "Παρακολουθούμενοι φάκελοι που δεν διαβάζονται"

[messages.server-issues-folder-blurb]
source = "Their packs are left as they are until the folder can be read again."
translation = "Τα πακέτα τους μένουν ως έχουν μέχρι να μπορεί να διαβαστεί ξανά ο φάκελος."

[messages.server-issues-folder-gone]
source = "The folder “{ $folder }” wasn’t found."
translation = "Ο φάκελος «{ $folder }» δεν βρέθηκε."

[messages.server-issues-job]
source = "Background jobs that failed"
translation = "Εργασίες παρασκηνίου που απέτυχαν"

[messages.server-issues-job-blurb]
source = "Retrying runs the job again from the start."
translation = "Η επανάληψη εκτελεί την εργασία ξανά από την αρχή."

[messages.server-issues-look-again]
source = "Look again"
translation = "Νέος έλεγχος"

[messages.server-issues-material-thumb]
source = "Materials without a thumbnail"
translation = "Υλικά χωρίς μικρογραφία"

[messages.server-issues-material-thumb-blurb]
source = "The material was found, but its preview couldn’t be drawn."
translation = "Το υλικό βρέθηκε, αλλά η προεπισκόπησή του δεν ήταν δυνατό να σχεδιαστεί."

[messages.server-issues-materials]
source = "Packs whose materials couldn’t be worked out"
translation = "Πακέτα των οποίων τα υλικά δεν ήταν δυνατό να προσδιοριστούν"

[messages.server-issues-materials-blurb]
source = "Their textures are all there; they just aren’t grouped into materials."
translation = "Οι υφές τους είναι όλες εκεί· απλώς δεν έχουν ομαδοποιηθεί σε υλικά."

[messages.server-issues-missing]
source = "Watched packs whose folder is gone"
translation = "Παρακολουθούμενα πακέτα των οποίων ο φάκελος χάθηκε"

[messages.server-issues-missing-blurb]
source = "Each pack is kept for 3 days in case its folder is only offline, then removed."
translation = "Κάθε πακέτο διατηρείται για 3 ημέρες σε περίπτωση που ο φάκελός του είναι απλώς εκτός σύνδεσης και μετά καταργείται."

[messages.server-issues-pack]
source = "Packs that couldn’t be added"
translation = "Πακέτα που δεν ήταν δυνατό να προστεθούν"

[messages.server-issues-pack-blurb]
source = "Delete the pack and add it again, or open it to see what it has."
translation = "Διαγράψτε το πακέτο και προσθέστε το ξανά ή ανοίξτε το για να δείτε τι περιέχει."

[messages.server-issues-read]
source = "Files Hoard couldn’t make sense of"
translation = "Αρχεία που το Hoard δεν μπόρεσε να ερμηνεύσει"

[messages.server-issues-read-again]
source = "Read again"
translation = "Νέα ανάγνωση"

[messages.server-issues-read-blurb]
source = "They’re in the library, but without the facts, tags or thumbnail that reading them gives."
translation = "Βρίσκονται στη βιβλιοθήκη, αλλά χωρίς τα στοιχεία, τις ετικέτες ή τη μικρογραφία που δίνει η ανάγνωσή τους."

[messages.server-issues-reanalyze]
source = "Re-analyze pack"
translation = "Νέα ανάλυση πακέτου"

[messages.server-issues-reformat]
source = "Files a conversion rule couldn’t convert"
translation = "Αρχεία που ένας κανόνας μετατροπής δεν μπόρεσε να μετατρέψει"

[messages.server-issues-reformat-blurb]
source = "They’re left as they were."
translation = "Έμειναν όπως ήταν."

[messages.server-issues-render]
source = "Models the thumbnail renderer failed on"
translation = "Μοντέλα στα οποία απέτυχε η απόδοση μικρογραφίας"

[messages.server-issues-render-blurb]
source = "They have no thumbnail. Opening one in the viewer may still work, and can save one."
translation = "Δεν έχουν μικρογραφία. Το άνοιγμά τους στο πρόγραμμα προβολής μπορεί να λειτουργεί και να αποθηκεύσει μία."

[messages.server-issues-retry]
source = "Retry"
translation = "Επανάληψη"

[messages.server-issues-scan-again]
source = "Scan again"
translation = "Νέα σάρωση"

[messages.server-issues-store-files]
source = "Store files that couldn’t be read"
translation = "Αρχεία καταστημάτων που δεν διαβάστηκαν"

[messages.server-issues-store-files-blurb]
source = "Files from the store a pack came from, such as a Megascans JSON, that name and tag it."
translation = "Αρχεία από το κατάστημα από το οποίο προήλθε ένα πακέτο, όπως ένα JSON του Megascans, που του δίνουν όνομα και ετικέτες."

[messages.server-issues-unpack]
source = "Archives that couldn’t be unpacked"
translation = "Συμπιεσμένα αρχεία που δεν ήταν δυνατό να αποσυμπιεστούν"

[messages.server-issues-unpack-blurb]
source = "Each is kept in its pack as a plain file, so nothing inside it is in the library."
translation = "Το καθένα διατηρείται στο πακέτο του ως απλό αρχείο, οπότε τίποτα από το περιεχόμενό του δεν είναι στη βιβλιοθήκη."

[messages.server-issues-unreal]
source = "Unreal packages that couldn’t be converted"
translation = "Πακέτα Unreal που δεν ήταν δυνατό να μετατραπούν"

[messages.server-issues-unreal-blurb]
source = "The pack’s Unreal page has the rest of its packages."
translation = "Η σελίδα Unreal του πακέτου έχει τα υπόλοιπα πακέτα του."

[messages.server-job-a-pack]
source = "a pack"
translation = "ένα πακέτο"

[messages.server-job-convert]
source = "Converting { $pack } with Blender"
translation = "Μετατροπή με Blender: { $pack }"

[messages.server-job-embed]
source = "Learning what pictures show"
translation = "Αναγνώριση του περιεχομένου των εικόνων"

[messages.server-job-hear]
source = "Learning what sounds sound like"
translation = "Εκμάθηση του πώς ακούγονται οι ήχοι"

[messages.server-job-ingest]
source = "Ingesting { $pack }"
translation = "Εισαγωγή: { $pack }"

[messages.server-job-llm-tag]
source = "Tagging { $pack } with AI"
translation = "Ετικέτες με AI: { $pack }"

[messages.server-job-looks]
source = "Working out colors and looks"
translation = "Ανάλυση χρωμάτων και εμφάνισης"

[messages.server-job-materials]
source = "Finding materials in { $pack }"
translation = "Εύρεση υλικών: { $pack }"

[messages.server-job-read-files]
source = "Reading the files of { $pack }"
translation = "Ανάγνωση αρχείων: { $pack }"

[messages.server-job-reformat]
source = "Converting files in { $pack } by the conversion rules"
translation = "Μετατροπή αρχείων με τους κανόνες μετατροπής: { $pack }"

[messages.server-job-relocate]
source = "Moving files between library locations"
translation = "Μετακίνηση αρχείων μεταξύ τοποθεσιών βιβλιοθήκης"

[messages.server-job-retag]
source = "Re-tagging { $pack }"
translation = "Νέες ετικέτες: { $pack }"

[messages.server-job-scan]
source = "Scanning a watched folder"
translation = "Σάρωση παρακολουθούμενου φακέλου"

[messages.server-job-sounds]
source = "Listening to sounds"
translation = "Ακρόαση ήχων"

[messages.server-job-store-lookup]
source = "Looking up a store page"
translation = "Αναζήτηση σελίδας καταστήματος"

[messages.server-job-unreal]
source = "Converting Unreal packages in { $pack }"
translation = "Μετατροπή πακέτων Unreal: { $pack }"

[messages.server-maintenance-backup]
source = "Back up the database"
translation = "Αντίγραφο ασφαλείας της βάσης δεδομένων"

[messages.server-maintenance-backup-blurb]
source = "A consistent copy of the database (packs, tags, notes, collections and Settings) in the backups folder next to it. The library's files aren't in it: they never change once stored, so any file sync backs them up."
translation = "Ένα συνεπές αντίγραφο της βάσης δεδομένων (πακέτα, ετικέτες, σημειώσεις, συλλογές και Ρυθμίσεις) στον φάκελο backups δίπλα της. Τα αρχεία της βιβλιοθήκης δεν περιλαμβάνονται: δεν αλλάζουν ποτέ μετά την αποθήκευση, οπότε οποιοσδήποτε συγχρονισμός αρχείων τα αντιγράφει."

[messages.server-maintenance-clear-cache]
source = "Clear cached conversions"
translation = "Εκκαθάριση αποθηκευμένων μετατροπών"

[messages.server-maintenance-clear-cache-blurb]
source = "Drops the files kept from “Download as” conversions (they're made again when next asked for) and what interrupted work left behind."
translation = "Διαγράφει τα αρχεία που κρατήθηκαν από μετατροπές «Λήψη ως» (δημιουργούνται ξανά όταν ζητηθούν) και ό,τι άφησαν πίσω εργασίες που διακόπηκαν."

[messages.server-maintenance-gc]
source = "Delete unused files"
translation = "Διαγραφή αχρησιμοποίητων αρχείων"

[messages.server-maintenance-gc-blurb]
source = "Deletes stored files nothing points at any more, such as the files of packs deleted for good."
translation = "Διαγράφει αποθηκευμένα αρχεία στα οποία δεν παραπέμπει πια τίποτα, όπως τα αρχεία πακέτων που διαγράφηκαν οριστικά."

[messages.server-maintenance-reanalyze]
source = "Re-analyze every pack"
translation = "Νέα ανάλυση όλων των πακέτων"

[messages.server-maintenance-reanalyze-blurb]
source = "Reads every file again with this version of Hoard: thumbnails, previews, details and rule tags are made afresh. Your own edits stay; the AI isn't asked again."
translation = "Διαβάζει ξανά κάθε αρχείο με αυτή την έκδοση του Hoard: μικρογραφίες, προεπισκοπήσεις, λεπτομέρειες και ετικέτες κανόνων δημιουργούνται από την αρχή. Οι δικές σας αλλαγές μένουν· το AI δεν ερωτάται ξανά."

[messages.server-maintenance-scrub]
source = "Check files for damage"
translation = "Έλεγχος αρχείων για φθορές"

[messages.server-maintenance-scrub-blurb]
source = "Reads every stored file back and checks it against its fingerprint, to catch files that have rotted or gone missing from a disk or NAS. Takes a while on a big library."
translation = "Διαβάζει ξανά κάθε αποθηκευμένο αρχείο και το ελέγχει με το αποτύπωμά του, για να εντοπίσει αρχεία που φθάρηκαν ή χάθηκαν από έναν δίσκο ή NAS. Διαρκεί αρκετά σε μεγάλη βιβλιοθήκη."

