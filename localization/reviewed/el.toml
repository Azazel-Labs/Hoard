[messages.settings-backups-kept]
source = "Each goes in the backups folder as hoard-auto-…db, and to the other folder (another disk, or one a sync app backs up) when there’s one, given by its full path on the server. Only older scheduled backups are removed; ones made by hand stay."
translation = "Κάθε αντίγραφο μπαίνει στον φάκελο αντιγράφων ως hoard-auto-…db, και στον άλλο φάκελο (άλλος δίσκος ή ένας που αντιγράφει μια εφαρμογή συγχρονισμού) αν υπάρχει, δοσμένος με την πλήρη διαδρομή του στον διακομιστή. Αφαιρούνται μόνο τα παλαιότερα προγραμματισμένα αντίγραφα· όσα έγιναν με το χέρι μένουν."

[messages.settings-backups-what]
