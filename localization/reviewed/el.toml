[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Πώς συνδέονται οι χρήστες: οι λογαριασμοί του ίδιου του Hoard, ένας κατάλογος LDAP, το Microsoft Active Directory ή ένας πάροχος OAuth, πόσο διαρκούν οι περίοδοι σύνδεσης και ποιες ομάδες παίρνουν ποιον ρόλο."

[messages.settings-page-connection]
source = "Connection"
translation = "Συνδεσιμότητα"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Πώς φτάνουν στο Hoard τα προγράμματα περιήγησης και οι εφαρμογές: η διεύθυνση με την οποία είναι γνωστό και το HTTPS, που χρειάζονται ορισμένες λειτουργίες των προγραμμάτων περιήγησης."

[messages.settings-page-copies]
source = "Near copies"
translation = "Σχεδόν αντίγραφα"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Αρχεία που είναι η ίδια εικόνα, ο ίδιος ήχος ή το ίδιο μοντέλο σε άλλο μέγεθος, ρυθμό δειγματοληψίας ή μορφή, πρώτα όσα πιάνουν τον περισσότερο χώρο. Το καλύτερο κάθε ομάδας είναι σημειωμένο· τίποτα δεν διαγράφεται."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Λήψεις"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Πώς ονομάζονται τα αρχεία σε ό,τι στέλνει το Hoard: λήψεις, αρχεία zip, το εργαλείο hoard και βοηθοί AI. Τα αρχεία στη βιβλιοθήκη μένουν όπως είναι."

[messages.settings-page-dragon]
source = "Dragon"
translation = "Δράκος"

[messages.settings-page-dragon-blurb]
source = "Your dragon’s hoard: every asset in the library is a piece of its treasure."
translation = "Ο θησαυρός του δράκου σας: κάθε στοιχείο της βιβλιοθήκης είναι ένα κομμάτι του."

[messages.settings-page-issues]
source = "Issues"
translation = "Προβλήματα"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Τι πήγε στραβά κατά το άνοιγμα ή την επεξεργασία αρχείων: συμπιεσμένα αρχεία που δεν αποσυμπιέστηκαν, αρχεία που δεν διαβάστηκαν, εργασίες που απέτυχαν. Δοκιμάστε τα ξανά μόλις διορθωθεί η αιτία ή απορρίψτε τα."

[messages.settings-page-library]
source = "Library"
translation = "Βιβλιοθήκη"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Τι υπάρχει στη συλλογή σας: πόσο μεγάλη είναι, από τι αποτελείται, πώς μεγάλωσε και πόσο καλά έχει ετικέτες. Τα αρχειοθετημένα δεν μετρώνται."

[messages.settings-page-locations]
source = "Library locations"
translation = "Τοποθεσίες βιβλιοθήκης"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Οι φάκελοι στον διακομιστή που περιέχουν τη βιβλιοθήκη: εκείνοι όπου το Hoard φυλάει αρχεία και φάκελοι με πακέτα που ευρετηριάζει εκεί όπου βρίσκονται."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Οι φάκελοι που περιέχουν τη βιβλιοθήκη: εκείνοι όπου το Hoard φυλάει αρχεία και φάκελοι με πακέτα που ευρετηριάζει εκεί όπου βρίσκονται."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Συντήρηση"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Αντίγραφα ασφαλείας, έλεγχος για φθορές και τακτοποίηση. Εκτελείται μία από κάθε είδος κάθε φορά και μπορείτε να φύγετε από αυτή τη σελίδα όσο εκτελούνται."

[messages.settings-page-performance]
source = "Performance"
translation = "Επιδόσεις"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Πόσο εντατικά δουλεύει ο διακομιστής, πώς δημιουργούνται και φυλάσσονται οι μικρογραφίες και πόσα δέχεται το πολύ."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Πόσο εντατικά δουλεύει το Hoard, πώς δημιουργούνται και φυλάσσονται οι μικρογραφίες και πόσα δέχεται το πολύ."

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Αναζητήστε εικόνες με βάση αυτό που δείχνουν και ήχους με βάση το πώς ακούγονται, όχι μόνο με τα ονόματά τους, και βρείτε πράγματα που μοιάζουν στο είδος, όχι μόνο στο χρώμα."

[messages.settings-page-search-tab]
source = "Search"
translation = "Αναζήτηση"

[messages.settings-page-store-files]
source = "Store files"
translation = "Αρχεία καταστημάτων"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Τα αρχεία που βάζουν τα καταστήματα δίπλα στα έργα τους, τα οποία διαβάζει το Hoard για να δώσει όνομα στα πακέτα και να αναφέρει τους δημιουργούς τους. Μάθετέ του όσα δεν γνωρίζει και μοιραστείτε ό,τι του μάθατε."

[messages.settings-page-tags]
source = "Tags"
translation = "Ετικέτες"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Κάθε ετικέτα της βιβλιοθήκης. Συγχωνεύστε όσες σημαίνουν το ίδιο ή μετονομάστε μία· οι μηχανισμοί ετικετών χρησιμοποιούν το νέο όνομα από εκεί και πέρα."

[messages.settings-page-tools]
source = "Tools"
translation = "Εργαλεία"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Εξωτερικά προγράμματα που χρησιμοποιεί το Hoard για να μετατρέπει και να διαβάζει αρχεία."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
translation = """
Εμφανίζεται το { $preview ->
        [light] φωτεινό
       *[dark] σκοτεινό
    } θέμα για να το δείτε. Χρησιμοποιείτε το { $used ->
        [light] φωτεινό
       *[dark] σκοτεινό
    }{ $system ->
        [yes] { " " }(ακολουθεί το σύστημα)
       *[other] { "" }
    }, που επανέρχεται όταν φύγετε από αυτή τη σελίδα."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
Επιστροφή στο { $used ->
        [light] φωτεινό
       *[dark] σκοτεινό
    }"""

