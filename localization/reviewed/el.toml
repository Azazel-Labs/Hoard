translation = "Τα Ουρανός, Μέντα, Βερίκοκο και Λεμόνι προστίθενται στα φωτεινά θέματα και τα Μεσάνυχτα, Λιμνοθάλασσα και Νέον στα σκοτεινά, και η νέα εμφάνιση απλώνεται από το πλακίδιο που επιλέγετε."

