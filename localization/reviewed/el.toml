translation = "Οι λογαριασμοί του ίδιου του Hoard συνδέονται ακόμη με τους δικούς τους κωδικούς πρόσβασης, ώστε ένας κατάλογος ή πάροχος που δεν λειτουργεί ή είναι λάθος ρυθμισμένος να μη σας κλειδώσει έξω."

