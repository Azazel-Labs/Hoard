translation = "Λήψη του μοντέλου… η πρόοδος φαίνεται στην ένδειξη δραστηριότητας"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Αναζήτηση με βάση αυτό που δείχνουν οι εικόνες"

[messages.settings-clip-here]
source = "This server: nothing leaves it"
translation = "Αυτόν τον διακομιστή: τίποτα δεν φεύγει από αυτόν"

[messages.settings-clip-here-desktop]
source = "This computer: nothing leaves it"
translation = "Αυτόν τον υπολογιστή: τίποτα δεν φεύγει από αυτόν"

[messages.settings-clip-hint]
source = "Uses Google’s SigLIP 2 model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Χρησιμοποιεί το μοντέλο SigLIP 2 της Google, που εκτελείται στον επεξεργαστή αυτού του διακομιστή: τίποτα δεν φεύγει από αυτόν. Η ενεργοποίηση κατεβάζει το μοντέλο ({ $size } MB) από το Hugging Face και έπειτα μαθαίνει κάθε εικόνα στο παρασκήνιο με χαμηλή προτεραιότητα. Καταλαμβάνει 350 έως 750 MB μνήμης όσο δουλεύει ή όταν κάποιος κάνει αναζήτηση. Η απενεργοποίηση διαγράφει το μοντέλο και κρατά ό,τι έμαθε, για την επόμενη φορά."

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Χρησιμοποιεί το μοντέλο SigLIP 2 της Google, που εκτελείται στον επεξεργαστή αυτού του υπολογιστή: τίποτα δεν φεύγει από αυτόν. Η ενεργοποίηση κατεβάζει το μοντέλο ({ $size } MB) από το Hugging Face και έπειτα μαθαίνει κάθε εικόνα στο παρασκήνιο με χαμηλή προτεραιότητα. Καταλαμβάνει 350 έως 750 MB μνήμης όσο δουλεύει ή όταν κάνετε αναζήτηση. Η απενεργοποίηση διαγράφει το μοντέλο και κρατά ό,τι έμαθε, για την επόμενη φορά."

[messages.settings-clip-hosted]
source = "A hosted service"
translation = "Μια φιλοξενούμενη υπηρεσία"

[messages.settings-clip-hosted-hint]
source = "Nothing is downloaded or run here: the service learns every picture, a batch at a time. Another service or model learns them all again, and what each one learned is kept, for switching back."
translation = "Τίποτα δεν κατεβαίνει ούτε εκτελείται εδώ: η υπηρεσία μαθαίνει κάθε εικόνα, κατά παρτίδες. Μια άλλη υπηρεσία ή άλλο μοντέλο τις μαθαίνει όλες ξανά, και ό,τι έμαθε το καθένα κρατιέται, για να μπορείτε να επιστρέψετε."

[messages.settings-clip-hosted-unavailable]
source = "Couldn’t use { $service }: { $detail }. Trying again every hour."
translation = "Δεν ήταν δυνατή η χρήση του { $service }: { $detail }. Νέα προσπάθεια κάθε ώρα."

[messages.settings-clip-hosted-warning]
source = "Pictures leave this server. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Οι εικόνες φεύγουν από αυτόν τον διακομιστή. Μια μικρογραφία κάθε εικόνας της βιβλιοθήκης και οι λέξεις κάθε αναζήτησης εικόνων στέλνονται στο { $service }, που χρεώνει γι’ αυτές και τις κρατά όπως ορίζουν οι όροι του."

[messages.settings-clip-hosted-warning-desktop]
source = "Pictures leave this computer. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Οι εικόνες φεύγουν από αυτόν τον υπολογιστή. Μια μικρογραφία κάθε εικόνας της βιβλιοθήκης και οι λέξεις κάθε αναζήτησης εικόνων στέλνονται στο { $service }, που χρεώνει γι’ αυτές και τις κρατά όπως ορίζουν οι όροι του."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "Έτοιμο: μαθαίνει εικόνες, { $done } από { $total } μέχρι στιγμής"

[messages.settings-clip-looking]
