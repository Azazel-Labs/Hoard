[messages.tags-tree-what]
source = "Put a tag under a broader one, here or on its tag page, and searching the broader one finds everything under it too."
translation = "Βάλτε μια ετικέτα κάτω από μια ευρύτερη, εδώ ή στη σελίδα της, και η αναζήτηση της ευρύτερης βρίσκει και ό,τι υπάρχει από κάτω."

[messages.tags-what]
source = "Pick tags that mean the same thing and merge them, or pick one to rename it."
translation = "Επιλέξτε ετικέτες που σημαίνουν το ίδιο και συγχωνεύστε τες ή επιλέξτε μία για να τη μετονομάσετε."

[messages.texnames-bad-characters]
source = 'Names can’t have < > : " / \ | ? or *'
translation = 'Τα ονόματα δεν μπορούν να περιέχουν < > : " / \ | ? ή *'

[messages.texnames-bad-suffix]
source = 'The suffix for { $role } maps can’t have < > : " / \ | ? or *'
translation = 'Το επίθημα για τους χάρτες { $role } δεν μπορεί να περιέχει < > : " / \ | ? ή *'

[messages.texnames-ending-bad]
source = 'Endings of your own can’t have < > : " / \ | ? or *'
translation = 'Οι δικές σας καταλήξεις δεν μπορούν να περιέχουν < > : " / \ | ? ή *'

[messages.texnames-ending-missing]
source = "Each ending of your own needs the ending to look for"
translation = "Κάθε δική σας κατάληξη χρειάζεται την κατάληξη που θα αναζητηθεί"

[messages.texnames-ending-twice]
source = "{ $ending } is in your endings twice"
translation = "Η κατάληξη { $ending } υπάρχει δύο φορές στις καταλήξεις σας"

[messages.texnames-needs-map]
source = 'The pattern needs { "{" }map{ "}" }, or every map of a material would get the same name'
translation = 'Το μοτίβο χρειάζεται το { "{" }map{ "}" }, αλλιώς όλοι οι χάρτες ενός υλικού θα έπαιρναν το ίδιο όνομα'

[messages.texnames-no-suffix]
source = "Give { $role } maps a suffix"
translation = "Δώστε επίθημα στους χάρτες { $role }"

[messages.texnames-placeholders]
source = 'The pattern can use { "{" }name{ "}" }, { "{" }map{ "}" } and { "{" }size{ "}" }'
translation = 'Το μοτίβο μπορεί να χρησιμοποιεί τα { "{" }name{ "}" }, { "{" }map{ "}" } και { "{" }size{ "}" }'

