[messages.error-openai-answered]
source = "OpenAI answered { $status }: { $reason }"
translation = "Το OpenAI απάντησε { $status }: { $reason }"

[messages.error-openai-api-unreachable]
source = "couldn't reach api.openai.com"
translation = "δεν ήταν δυνατή η πρόσβαση στο api.openai.com"

