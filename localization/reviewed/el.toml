[messages.settings-address]
source = "Address"
translation = "Διεύθυνση"

[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "Η διεύθυνση που χρησιμοποιούν οι χρήστες και οι εφαρμογές για να φτάσουν στο Hoard, όταν δεν είναι αυτή στην οποία βρίσκεται αυτό το πρόγραμμα περιήγησης: ενός reverse proxy, ενός tunnel ή ένα όνομα tailnet, όπως https://hoard.example.com. Τη χρησιμοποιούν οι σύνδεσμοι που δίνει το Hoard (στο Claude και σε άλλες εφαρμογές, στη σύνδεση, στο πιστοποιητικό του)."

[messages.settings-ai-anthropic-hint]
