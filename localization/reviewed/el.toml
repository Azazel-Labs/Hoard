[messages.settings-chatgpt-usage]
source = "Tagging requests count toward your ChatGPT plan’s usage. Manage usage shows what Hoard has used and lets you limit it. To disconnect Hoard from ChatGPT itself, go to Settings → Security and login → Sign in with ChatGPT on chatgpt.com."
translation = "Τα αιτήματα για ετικέτες μετρούν στη χρήση της συνδρομής σας ChatGPT. Η «Διαχείριση χρήσης» δείχνει τι έχει χρησιμοποιήσει το Hoard και σας επιτρέπει να το περιορίσετε. Για να αποσυνδέσετε το Hoard από το ίδιο το ChatGPT, μεταβείτε στο Settings → Security and login → Sign in with ChatGPT στο chatgpt.com."

[messages.settings-clap-heading]
source = "Search by what sounds sound like"
translation = "Αναζήτηση με βάση το πώς ακούγονται οι ήχοι"

[messages.settings-clap-hint]
source = "Uses LAION’s CLAP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Χρησιμοποιεί το μοντέλο CLAP του LAION, που εκτελείται στον επεξεργαστή αυτού του διακομιστή: τίποτα δεν φεύγει από αυτόν. Η ενεργοποίηση κατεβάζει το μοντέλο ({ $size } MB) από το Hugging Face και έπειτα ακούει την αρχή κάθε ήχου στο παρασκήνιο με χαμηλή προτεραιότητα. Καταλαμβάνει έως περίπου 1 GB μνήμης όσο δουλεύει ή όταν κάποιος κάνει αναζήτηση. Η απενεργοποίηση διαγράφει το μοντέλο και κρατά ό,τι έμαθε, για την επόμενη φορά."

[messages.settings-clap-hint-desktop]
source = "Uses LAION’s CLAP model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Χρησιμοποιεί το μοντέλο CLAP του LAION, που εκτελείται στον επεξεργαστή αυτού του υπολογιστή: τίποτα δεν φεύγει από αυτόν. Η ενεργοποίηση κατεβάζει το μοντέλο ({ $size } MB) από το Hugging Face και έπειτα ακούει την αρχή κάθε ήχου στο παρασκήνιο με χαμηλή προτεραιότητα. Καταλαμβάνει έως περίπου 1 GB μνήμης όσο δουλεύει ή όταν κάνετε αναζήτηση. Η απενεργοποίηση διαγράφει το μοντέλο και κρατά ό,τι έμαθε, για την επόμενη φορά."

[messages.settings-clap-learning]
source = "Ready: learning sounds, { $done } of { $total } so far"
translation = "Έτοιμο: μαθαίνει ήχους, { $done } από { $total } μέχρι στιγμής"

