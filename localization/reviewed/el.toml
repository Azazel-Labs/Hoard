translation = "Μέχρι τότε, το πρωτότυπο μπορεί να επανέλθει από τη σελίδα του αρχείου που μετατράπηκε. Οι υφές δεν αντιγράφονται μέσα σε ένα μοντέλο που μετατράπηκε: παραπέμπει στα αρχεία εικόνων δίπλα του. Τα αρχεία .mtl ή .bin ενός μοντέλου παραμένουν."

