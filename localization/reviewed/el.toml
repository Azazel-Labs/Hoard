[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Πληκτρολογήστε αυτό που ψάχνετε («mossy rock», «sci-fi door», «wooden barrel») και οι εικόνες που το δείχνουν εμφανίζονται δίπλα στα ονόματα που περιέχουν τις λέξεις. Το «Περισσότερα σαν αυτό» βρίσκει πράγματα του ίδιου είδους, όχι μόνο με τα ίδια χρώματα."

