translation = '{ " " }θα μπορεί να αναζητά, να κατεβάζει, να περιγράφει και να βάζει ετικέτες σε όλα όσα υπάρχουν σε αυτό το Hoard, ενεργώντας ως{ " " }'

[messages.connect-lede-2]
source = ". It can’t manage accounts or access tokens."
translation = ". Δεν μπορεί να διαχειρίζεται λογαριασμούς ή διακριτικά πρόσβασης."

[messages.connect-title]
source = "Connect { $app }?"
translation = "Να συνδεθεί το { $app };"

[messages.copies-load-failed]
