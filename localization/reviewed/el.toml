translation = "Οι διευθύνσεις authorization και token πρέπει να αρχίζουν με https://"

[messages.error-oauth-bad-authorization-address]
source = "the authorization address isn't valid"
translation = "η διεύθυνση authorization δεν είναι έγκυρη"

[messages.error-oauth-client-id]
source = "Give the client ID the provider made for Hoard"
translation = "Δώστε το client ID που δημιούργησε ο πάροχος για το Hoard"

[messages.error-oauth-discovery-bad]
source = "{ $url } isn't a discovery document"
translation = "Το { $url } δεν είναι έγγραφο discovery"

[messages.error-oauth-discovery-incomplete]
source = "{ $url } doesn't name the authorization and token addresses"
