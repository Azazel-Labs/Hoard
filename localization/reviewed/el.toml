[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Δημιουργήστε μια OAuth app στο GitHub → Settings → Developer settings. Το GitHub δεν στέλνει ομάδες, οπότε δώστε ρόλους στις Ρυθμίσεις → Λογαριασμός και απενεργοποιήστε τη δημιουργία λογαριασμών στην πρώτη σύνδεση, εκτός αν πρέπει να μπαίνει οποιοσδήποτε έχει λογαριασμό GitHub."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Δημιουργήστε μια εφαρμογή στο GitLab → Preferences → Applications (ή στην περιοχή διαχείρισης του δικού σας instance: αλλάξτε το gitlab.com στις διευθύνσεις)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Δημιουργήστε έναν OAuth client (Web application) στο Google Cloud Console → APIs & Services → Credentials. Το Google δεν στέλνει ομάδες, οπότε δώστε ρόλους στις Ρυθμίσεις → Λογαριασμός και απενεργοποιήστε τη δημιουργία λογαριασμών στην πρώτη σύνδεση, εκτός αν πρέπει να μπαίνει οποιοσδήποτε έχει λογαριασμό Google."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Καταχωρίστε μια εφαρμογή στο Entra ID → App registrations (με ανακατεύθυνση Web στην παρακάτω διεύθυνση). Βάλτε το tenant ID σας στη θέση του «organizations» για να μπαίνει μόνο ο οργανισμός σας. Για ρόλους από ομάδες, προσθέστε το claim groups στο Token configuration: παραθέτει τα ID των ομάδων."

