translation = "Σύνδεση GitHub…"

[messages.settings-unreal-github-connect-title]
source = "Connect GitHub"
translation = "Σύνδεση GitHub"

[messages.settings-unreal-github-connect-why]
source = "Epic shares Unreal Editor with GitHub accounts linked to Epic Games. Hoard asks only to read packages."
translation = "Η Epic μοιράζεται το Unreal Editor με λογαριασμούς GitHub συνδεδεμένους με το Epic Games. Το Hoard ζητά μόνο ανάγνωση πακέτων."

[messages.settings-unreal-github-connected]
