translation = "Έτοιμο. Οι ήχοι μαθαίνονται καθώς προστίθενται πακέτα."

[messages.settings-clap-reset]
source = "Sound search: back to the default"
translation = "Αναζήτηση ήχων: επαναφορά στην προεπιλογή"

[messages.settings-clap-saved-off]
source = "Sound search: off"
translation = "Αναζήτηση ήχων: ανενεργή"

[messages.settings-clap-saved-on]
source = "Sound search: on"
translation = "Αναζήτηση ήχων: ενεργή"

