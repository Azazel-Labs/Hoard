translation = "Ο πάροχος δεν είπε ποιος είστε (δεν υπάρχει claim sub ή id)"

[messages.error-oauth-off]
source = "Signing in with OAuth isn't turned on"
translation = "Η σύνδεση με OAuth δεν είναι ενεργοποιημένη"

[messages.error-oauth-pkce]
