[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Όταν κυκλοφορεί νέα έκδοση, το Hoard μπορεί να καλέσει μια διεύθυνση μόλις δεν γίνεται τίποτα (καμία μεταφόρτωση, εργασία, μετατροπή ή συντήρηση), ώστε ό,τι ενημερώνει το container του να μην το επανεκκινήσει στη μέση μιας μεταφόρτωσης. Στέλνει ένα POST με την έκδοση σε σώμα JSON. Χρειάζεται τον παραπάνω έλεγχο για νέες εκδόσεις."

[messages.updates-what-calls]
source = "What can it call?"
translation = "Τι μπορεί να καλέσει;"

