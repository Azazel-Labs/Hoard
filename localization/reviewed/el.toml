translation = "Οι πιο ομαλές ταινίες χρειάζονται περισσότερο χρόνο και χώρο: περίπου διπλάσιο στα 24 fps από ό,τι στα 12, και ακόμη περισσότερο στα 30. Αν τον αλλάξετε, δημιουργούνται όλες ξανά."

