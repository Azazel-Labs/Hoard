translation = "Η βάση δεδομένων κρατά μόνη της αντίγραφα ασφαλείας· κάθε αντίγραφο φαίνεται στο ιστορικό παρακάτω."

[messages.settings-blender-download]
source = "Uses an installed Blender, or downloads Blender 4.5 LTS (about 400 MB) from a blender.org mirror."
translation = "Χρησιμοποιεί ένα εγκατεστημένο Blender ή κατεβάζει το Blender 4.5 LTS (περίπου 400 MB) από έναν mirror του blender.org."

[messages.settings-blender-what]
source = "Converts .blend, .dae, .abc and .x3d models to glTF in the background, so they get thumbnails and a 3D preview. Packs added while it was off are converted once it’s ready."
translation = "Μετατρέπει μοντέλα .blend, .dae, .abc και .x3d σε glTF στο παρασκήνιο, ώστε να αποκτούν μικρογραφίες και προεπισκόπηση 3D. Τα πακέτα που προστέθηκαν όσο ήταν ανενεργό μετατρέπονται μόλις είναι έτοιμο."

