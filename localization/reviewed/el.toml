translation = "Το Unreal Editor κατεβαίνει με αυτόν τον λογαριασμό GitHub."

[messages.settings-unreal-github-before]
source = "Before you start"
translation = "Πριν ξεκινήσετε"

[messages.settings-unreal-github-before-what]
source = "Link GitHub to your Epic Games account and accept the EpicGames invitation GitHub emails you."
translation = "Συνδέστε το GitHub με τον λογαριασμό σας στο Epic Games και αποδεχτείτε την πρόσκληση της EpicGames που σας στέλνει το GitHub με email."

[messages.settings-unreal-github-change]
source = "Change…"
translation = "Αλλαγή…"

[messages.settings-unreal-github-connect]
