[messages.error-not-started-desktop]
source = "Hoard hasn't started"
translation = "το Hoard δεν έχει ξεκινήσει"

[messages.error-not-watched]
source = "{ $name } isn't a watched folder"
translation = "Το { $name } δεν είναι παρακολουθούμενος φάκελος"

[messages.error-nothing-to-merge]
source = "nothing to merge"
