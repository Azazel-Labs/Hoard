[messages.error-ldap-password-check]
source = "the directory wouldn't check { $name }'s password ({ $reason })"
translation = "ο κατάλογος δεν έλεγξε τον κωδικό πρόσβασης του χρήστη { $name } ({ $reason })"

[messages.error-ldap-search]
source = "looking for { $name } under { $base }"
translation = "αναζήτηση του χρήστη { $name } στο { $base }"

[messages.error-ldap-server-form]
source = "{ $server }: a directory server's address is host:port, ldap://… or ldaps://…"
translation = "{ $server }: η διεύθυνση ενός διακομιστή καταλόγου είναι host:port, ldap://… ή ldaps://…"

[messages.error-ldap-settings]
source = "bad LDAP settings: { $reason }"
translation = "λανθασμένες ρυθμίσεις LDAP: { $reason }"

[messages.error-ldap-several]
source = "{ $count } entries in the directory match { $name }: narrow the user filter"
translation = "{ $count } καταχωρίσεις στον κατάλογο ταιριάζουν με το { $name }: περιορίστε το φίλτρο χρηστών"

[messages.error-ldap-unreachable]
