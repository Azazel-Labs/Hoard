translation = "Τα ονόματα υφών αποθηκεύτηκαν"

[messages.settings-tn-short]
source = "Short"
translation = "Σύντομο"

[messages.settings-tn-slots]
source = "In GLB downloads, a texture packed inside a model with no file of its own is named after the material and the slot it fills, and these slots have suffixes too:"
translation = "Στις λήψεις GLB, μια υφή πακεταρισμένη μέσα σε μοντέλο χωρίς δικό της αρχείο ονομάζεται με βάση το υλικό και την υποδοχή που καλύπτει, και αυτές οι υποδοχές έχουν επίσης επιθήματα:"

[messages.settings-tn-style]
source = "Style"
translation = "Στυλ"

[messages.settings-tn-style-group]
source = "Naming style"
translation = "Στυλ ονομασίας"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "Επιθήματα για κάθε είδος χάρτη"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Ονομασία χαρτών υφής με βάση το υλικό τους"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Οι χάρτες ενός υλικού αποστέλλονται με το όνομά του και τη χρήση κάθε χάρτη, όπως κι αν λέγονται τα αρχεία: Rock_Normal.png, όχι rock_moss_xeokah0_raw_8K_Normal.png. Τα αρχεία στη βιβλιοθήκη δεν αγγίζονται, και ένας χάρτης που ονομάζει ένα μοντέλο ή MTL που αποστέλλεται μαζί του κρατά αυτό το όνομα, ώστε το μοντέλο να τον βρίσκει ακόμη."

[messages.settings-tool-downloading]
