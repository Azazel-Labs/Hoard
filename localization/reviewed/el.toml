[messages.settings-thumbs-small-hint]
source = "Fine in the grid; a little soft up close."
translation = "Καλές στο πλέγμα· λίγο θολές από κοντά."

[messages.settings-thumbs-what]
source = "Kept as WebP, compressed or exact, whichever is smaller. A small picture that's smaller as it is stays its own thumbnail. Changing these remakes the thumbnails you have, in the background."
translation = "Αποθηκεύονται ως WebP, συμπιεσμένες ή ακριβείς, όποιο βγαίνει μικρότερο. Μια μικρή εικόνα που είναι ήδη μικρότερη όπως είναι γίνεται η ίδια η μικρογραφία της. Μια αλλαγή εδώ ξαναφτιάχνει όσες μικρογραφίες έχετε, στο παρασκήνιο."

