translation = "Το ιδιωτικό κλειδί δεν είναι έγκυρο PEM"

[messages.error-https-key-password]
source = "The key is protected with a password: give it without one (openssl pkey -in key.pem -out plain.pem)"
translation = "Το κλειδί προστατεύεται με κωδικό πρόσβασης: δώστε το χωρίς κωδικό (openssl pkey -in key.pem -out plain.pem)"

[messages.error-https-no-ca]
