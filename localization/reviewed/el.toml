translation = "Ενεργοποίηση αναζήτησης ήχων"

[messages.settings-clap-what]
source = "Type what you’re after (“distant thunder”, “glassy UI blip”, “footsteps on gravel”) and sounds that sound like it turn up beside names that have the words."
translation = "Πληκτρολογήστε αυτό που ψάχνετε («distant thunder», «glassy UI blip», «footsteps on gravel») και οι ήχοι που ακούγονται έτσι εμφανίζονται δίπλα στα ονόματα που περιέχουν τις λέξεις."

[messages.settings-clip-downloading]
