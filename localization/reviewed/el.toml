translation = "Κάθε χρήστης μπορεί μόνο να βλέπει (αναζήτηση, προεπισκόπηση και λήψη), να αλλάζει επίσης τη βιβλιοθήκη (προσθήκη, επεξεργασία, ετικέτες, συλλογές και αρχειοθέτηση) ή να είναι επιπλέον διαχειριστής (Ρυθμίσεις, λογαριασμοί και συντήρηση, καθώς και οριστική διαγραφή)."

