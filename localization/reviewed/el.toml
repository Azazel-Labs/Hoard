translation = "{ $size } στα αντίγραφα που δεν είναι τα καλύτερα"

[messages.copies-sum]
source = """
{ $count ->
        [one] One set of near copies. The copies that aren’t the best take { $size }.
       *[other] { $count } sets of near copies. The copies that aren’t the best take { $size }.
    }"""
translation = "Ομάδες σχεδόν αντιγράφων: { $count }. Τα αντίγραφα που δεν είναι τα καλύτερα πιάνουν { $size }."

