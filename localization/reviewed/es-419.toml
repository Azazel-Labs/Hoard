[messages.about-version]
source = "Version"
translation = "Versión"

[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "Hoard guarda recursos de juegos (modelos, texturas, sonidos, música, sprites y más) en una biblioteca donde puedes buscar, previsualizar y tomar lo que necesites, compartida con todas las personas a las que des acceso."

[messages.account-add]
source = "Add"
translation = "Agregar"

[messages.account-add-failed]
source = "Couldn't add { $name }"
translation = "No se pudo agregar a { $name }"

[messages.account-added]
source = "{ $name } can sign in now."
translation = "{ $name } ya puede iniciar sesión."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude y otras apps de IA"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Conecta Claude (o cualquier app MCP) y podrá buscar y obtener recursos por ti, y describir y etiquetar lo que Hoard todavía no. Inicia sesión en Hoard la primera vez; tú lo autorizas aquí en el navegador."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "La app de Hoard inicia sesión por ti, así que no hay contraseña. Crea abajo un token de acceso para los complementos de los motores y el comando hoard."

[messages.account-change-password]
source = "Change password"
translation = "Cambiar contraseña"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Configuración → Conectores → Agregar conector personalizado, pega la dirección y luego Conectar. Estos se conectan desde los servidores de Anthropic, así que Hoard tiene que ser accesible desde internet por HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Configuración → Conectores → Agregar conector personalizado, pega la dirección y luego Conectar. Estos se conectan desde los servidores de Anthropic, así que Hoard tiene que ser accesible desde internet por HTTPS (esta dirección no lo es: configura la Dirección pública en Configuración → Conexión)."

