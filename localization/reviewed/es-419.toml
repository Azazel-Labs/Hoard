translation = "Crea una aplicación en GitLab → Preferencias → Aplicaciones (o en el área de administración de tu instancia: cambia gitlab.com en las direcciones)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Crea un cliente OAuth (Aplicación web) en Google Cloud Console → APIs y servicios → Credenciales. Google no envía grupos, así que asigna los roles en Configuración → Cuenta, y desactiva la creación de cuentas en el primer inicio de sesión, a menos que cualquiera con una cuenta de Google deba poder entrar."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registra una app en Entra ID → Registros de aplicaciones (con un redireccionamiento Web a la dirección de abajo). Pon el ID de tu inquilino en lugar de “organizations” para que solo entre tu organización. Para obtener roles a partir de grupos, agrega la notificación de grupos en Configuración de token: enumera los ID de los grupos."

