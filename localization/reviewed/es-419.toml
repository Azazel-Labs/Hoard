translation = "Búsqueda de imágenes: se ejecuta en este servidor"

[messages.settings-clip-saved-here-desktop]
source = "Image search: runs on this computer"
translation = "Búsqueda de imágenes: se ejecuta en esta computadora"

[messages.settings-clip-saved-hosted]
