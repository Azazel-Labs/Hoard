translation = "Búferes de glTF, bibliotecas de materiales, los mapas de los materiales, los materiales que usa un solo modelo y los archivos de tienda que describen modelos. Se incluyen al descargar lo que los usa. Las páginas de una hoja de sprites, y los sprites que el paquete también tiene como imágenes sueltas, se muestran con la hoja. Un recurso que el paquete tiene en varios formatos se muestra una sola vez, en el formato que Hoard lee mejor."

