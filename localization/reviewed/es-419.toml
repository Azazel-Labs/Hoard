       *[other] Listo: conoce las { $count } imágenes
    }"""

[messages.settings-clip-ready-empty]
source = "Ready. Pictures are learned as packs are added."
translation = "Listo. Las imágenes se aprenden a medida que se agregan paquetes."

[messages.settings-clip-relearning]
source = "Until the new model has learned every picture, searches use what the old one learned."
translation = "Hasta que el modelo nuevo haya aprendido todas las imágenes, las búsquedas usan lo que aprendió el anterior."

[messages.settings-clip-reset]
source = "Image search: back to the default"
translation = "Búsqueda de imágenes: volver al valor predeterminado"

[messages.settings-clip-saved-here]
