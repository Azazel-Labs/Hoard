translation = "Se descarga cuando hace falta"

[messages.about-downloaded-what]
source = "Hoard doesn’t come with these. It downloads each one the first time something needs it, and each comes under its own license."
translation = "Hoard no los incluye. Descarga cada uno la primera vez que algo lo necesita, y cada uno tiene su propia licencia."

