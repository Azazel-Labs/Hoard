translation = "Ingresa la ruta del ejecutable de { $tool } instalado. La instalación automática solo está disponible en Docker."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "Usa un ffmpeg del sistema con los codificadores adecuados, o descarga una compilación estática (unos 80 MB)."

[messages.settings-ffmpeg-what]
source = "Encodes MP3, OGG and Opus downloads, and reads audio Hoard can’t decode itself (AAC, M4A, WMA, …)."
translation = "Codifica las descargas en MP3, OGG y Opus, y lee audio que Hoard no puede decodificar por su cuenta (AAC, M4A, WMA, …)."

