translation = "Ningún sprite tiene eso en su nombre."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites girados en sentido horario y recortados. No admite animaciones: los fotogramas se identifican por sus nombres numerados."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Cada sprite derecho sobre todo su lienzo, cada uno en un PNG con su nombre."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Los sprites nunca se giran y el recorte se conserva como márgenes, con animaciones y la duración de cada fotograma."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Los tiles nunca se giran ni se recortan, en una cuadrícula del tamaño del tile; las imágenes que ya están en una se quedan como están."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Cada sprite derecho sobre todo su lienzo, en celdas del mismo tamaño, para cualquier herramienta que corte una hoja en cuadrícula."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Formato propio de Hoard: las páginas tal cual, los sprites girados en cualquier sentido y recortados, con animaciones y la duración de cada fotograma."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites girados en sentido antihorario y recortados. No admite animaciones: los fotogramas se identifican por sus nombres numerados."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprites girados en sentido horario y recortados, con animaciones por nombre, como los leen PixiJS y Phaser."

