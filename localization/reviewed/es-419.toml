translation = "No se pudo obtener el modelo: { $detail }. Se vuelve a intentar cada hora."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Escribe lo que buscas (“roca con musgo”, “puerta de ciencia ficción”, “barril de madera”) y las imágenes que lo muestran aparecen junto a los nombres que tienen esas palabras. “Más como este” encuentra cosas del mismo tipo, no solo de los mismos colores."

[messages.settings-clip-where]
source = "Runs on"
translation = "Se ejecuta en"

[messages.settings-conv]
source = "Conversion rules"
translation = "Reglas de conversión"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Agregar una regla"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Está en un paquete.
       *[other] Están en { $packs } paquetes.
    } Cada original se conserva { $days } días y, hasta entonces, se puede restaurar desde su página."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Uno está en un paquete que todavía se está agregando; se convertirá cuando termine.
       *[other] { $count } están en paquetes que todavía se están agregando; se convertirán cuando terminen.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Convertirlo
       *[other] Convertir { $count } archivos
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Archivos que se convertirían"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…y { $count } más"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Guardar, solo paquetes nuevos"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Guardar y convertirlo
       *[other] Guardar y convertir { $count } archivos
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Se dejan como están:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
        [one] ¿Convertir un archivo que ya está en la biblioteca?
       *[other] ¿Convertir { $count } archivos que ya están en la biblioteca?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
        [one] Convirtiendo un archivo en segundo plano
       *[other] Convirtiendo { $count } archivos en segundo plano
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Convertir los archivos que ya están en la biblioteca"

[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "El sonido queda exactamente igual, en más o menos la mitad del espacio, y todo lo demás del WAV (puntos de loop, marcadores de cue, etiquetas) se guarda en el FLAC, así que el WAV se puede recuperar tal como era en cualquier momento. Los WAV con muestras de punto flotante o de 32 bits se quedan como WAV."

[messages.settings-conv-from]
source = "From"
translation = "De"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Conservar los originales durante"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] día
       *[other] días
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Hasta entonces, desde la página de un archivo convertido se puede restaurar el original. Las texturas no se copian dentro de un modelo convertido: este apunta a los archivos de imagen que tiene al lado. Los archivos .mtl o .bin de un modelo se quedan."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "No hay nada en la biblioteca que necesite convertirse."

[messages.settings-conv-remove]
source = "Remove"
translation = "Quitar"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Quitar la regla { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Deshacer los cambios"

[messages.settings-conv-rule-on]
source = "On"
translation = "Activada"

[messages.settings-conv-save]
source = "Save rules"
translation = "Guardar reglas"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Reglas de conversión guardadas. Se aplican a los paquetes que se agreguen a partir de ahora."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] un archivo cuya copia convertida ya está en su paquete
       *[other] { $count } archivos cuyas copias convertidas ya están en sus paquetes
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] un archivo que Blender aún no ha leído (Configuración → Herramientas)
       *[other] { $count } archivos que Blender aún no ha leído (Configuración → Herramientas)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] un archivo que un proyecto de Unity conoce por su nombre
       *[other] { $count } archivos que un proyecto de Unity conoce por sus nombres
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] un archivo al que hace referencia una escena u otro archivo
       *[other] { $count } archivos a los que hace referencia una escena u otro archivo
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] un archivo en una carpeta vigilada
       *[other] { $count } archivos en carpetas vigiladas
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "Otra regla ya convierte este formato"

[messages.settings-conv-to]
source = "Convert to"
translation = "Convertir a"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Poner los modelos de pie al convertirlos (con la Y hacia arriba y mirando hacia +Z), como se muestran los modelos del paquete"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Convierte los archivos que guarda Hoard a un solo formato, como todos los OBJ y FBX a GLB, para que la biblioteca sea uniforme. El archivo convertido ocupa el lugar del original y conserva su nombre, etiquetas, colecciones y enlaces. Los archivos de las carpetas vigiladas nunca se modifican."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Descargas convertidas"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "como máximo; las usadas hace más tiempo se descartan primero"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "como máximo, { $size } ahora; las usadas hace más tiempo se descartan primero"

