Se muestra el tema { $preview ->
        [light] claro
       *[dark] oscuro
    } para que lo veas. Estás usando el { $used ->
        [light] claro
       *[dark] oscuro
    }{ $system ->
        [yes] { " " }(según el sistema)
       *[other] { "" }
    }, que vuelve cuando sales de esta página."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
Volver al { $used ->
        [light] claro
       *[dark] oscuro
    }"""

