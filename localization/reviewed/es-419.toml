[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Cuando sale una nueva versión, Hoard puede llamar a una dirección en cuanto no haya nada en curso (ni subidas, tareas, conversiones o mantenimiento), para que lo que actualice su contenedor no lo reinicie en medio de una subida. Envía un POST con la versión en un cuerpo JSON. Esto necesita la comprobación de versiones de arriba."

