[messages.settings-clap-heading]
source = "Search by what sounds sound like"
translation = "Buscar por cómo suenan los sonidos"

[messages.settings-clap-hint]
source = "Uses LAION’s CLAP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Usa el modelo CLAP de LAION, ejecutado en el procesador de este servidor: nada sale de él. Al activarla se descarga el modelo ({ $size } MB) de Hugging Face, y luego escucha el comienzo de cada sonido en segundo plano con baja prioridad. Ocupa hasta cerca de 1 GB de memoria mientras trabaja o alguien busca. Al desactivarla se elimina el modelo y se conserva lo que aprendió, para la próxima vez."

[messages.settings-clap-hint-desktop]
source = "Uses LAION’s CLAP model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Usa el modelo CLAP de LAION, ejecutado en el procesador de esta computadora: nada sale de ella. Al activarla se descarga el modelo ({ $size } MB) de Hugging Face, y luego escucha el comienzo de cada sonido en segundo plano con baja prioridad. Ocupa hasta cerca de 1 GB de memoria mientras trabaja o mientras buscas. Al desactivarla se elimina el modelo y se conserva lo que aprendió, para la próxima vez."

