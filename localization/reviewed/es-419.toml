source = "Look up store pages automatically"
translation = "Buscar páginas de tienda automáticamente"

[messages.settings-store-pages]
source = "Store pages"
translation = "Páginas de tienda"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "Los paquetes nuevos se buscan en las tiendas en segundo plano, para que obtengan su página de tienda, vendedor y licencia."

[messages.settings-the-default]
source = "the default"
translation = "el valor predeterminado"

[messages.settings-themes]
source = "Themes"
translation = "Temas"

[messages.settings-thumbs]
source = "Thumbnails"
translation = "Miniaturas"

[messages.settings-thumbs-avif]
source = "Send thumbnails as AVIF"
translation = "Enviar las miniaturas como AVIF"

[messages.settings-thumbs-avif-what]
source = "Browsers that show AVIF get smaller thumbnails, often less than half the size. Each is made from the stored thumbnail the first time it’s shown and kept with the conversions; until then the stored one is sent. Making them keeps up to two cores busy while a big library is first browsed. Lossless thumbnails and pixel art are sent as they are."
translation = "Los navegadores que muestran AVIF reciben miniaturas más pequeñas, a menudo de menos de la mitad del tamaño. Cada una se crea a partir de la miniatura guardada la primera vez que se muestra y se guarda con las conversiones; hasta entonces se envía la guardada. Crearlas mantiene ocupados hasta dos núcleos mientras se recorre por primera vez una biblioteca grande. Las miniaturas sin pérdida y el pixel art se envían tal como están."

[messages.settings-thumbs-balanced]
source = "Balanced"
translation = "Equilibradas"

[messages.settings-thumbs-balanced-hint]
source = "JPEG, quality 82. Hard to tell from the original at thumbnail size."
translation = "JPEG, calidad 82. Difícil de distinguir del original a tamaño de miniatura."

[messages.settings-thumbs-lossless]
source = "Lossless"
translation = "Sin pérdida"

[messages.settings-thumbs-lossless-hint]
source = "PNG, exactly as made. Several times larger."
translation = "PNG, tal como se generan. Varias veces más grandes."

[messages.settings-thumbs-saved]
source = "Thumbnails: { $quality }"
translation = "Miniaturas: { $quality }"

[messages.settings-thumbs-sharp]
source = "Sharper"
translation = "Más nítidas"

[messages.settings-thumbs-sharp-hint]
source = "JPEG, quality 92. About twice the size of Balanced."
translation = "JPEG, calidad 92. Más o menos el doble del tamaño de Equilibradas."

[messages.settings-thumbs-small]
source = "Smaller"
translation = "Más pequeñas"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG, calidad 70. Bien en la cuadrícula; un poco suaves de cerca."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Cómo se guardan las miniaturas y vistas de modelos nuevas. Las que tienen transparencia, y el pixel art, siempre son PNG. Para reducir las que ya tienes, ejecuta Reducir miniaturas en Mantenimiento."

