translation = "Búsqueda de imágenes: se ejecuta en { $service }"

[messages.settings-clip-saved-off]
source = "Image search: off"
translation = "Búsqueda de imágenes: desactivada"

[messages.settings-clip-saved-on]
source = "Image search: on"
translation = "Búsqueda de imágenes: activada"

[messages.settings-clip-toggle]
