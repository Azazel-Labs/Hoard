translation = "Estilo de nombres"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "Sufijos para cada tipo de mapa"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Nombrar los mapas de textura según su material"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Los mapas de un material salen con el nombre del material y para qué es cada mapa, sin importar cómo se llamen los archivos: Rock_Normal.png, no rock_moss_xeokah0_raw_8K_Normal.png. Los archivos de la biblioteca no se tocan, y un mapa que nombra un modelo o MTL enviado con él conserva ese nombre, para que el modelo lo siga encontrando."

