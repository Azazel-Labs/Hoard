translation = "Osoite, jolla ihmiset ja sovellukset tavoittavat Hoardin, kun se ei ole sama kuin tämän selaimen käyttämä: käänteisen välityspalvelimen, tunnelin tai tailnet-nimen osoite, esim. https://hoard.example.com. Hoardin jakamat linkit (Claudelle ja muille sovelluksille, kirjautumisessa, sen varmenteessa) käyttävät sitä."

