translation = "Kirjauduttu ChatGPT:hen käyttäjänä { $email }"

[messages.settings-chatgpt-signed-out]
source = "Signed out of ChatGPT"
translation = "Kirjauduttu ulos ChatGPT:stä"

[messages.settings-chatgpt-status]
source = "Signed in"
translation = "Kirjautunut"

[messages.settings-chatgpt-status-as]
source = "Signed in as { $email }"
translation = "Kirjautunut käyttäjänä { $email }"

[messages.settings-chatgpt-usage]
source = "Tagging requests count toward your ChatGPT plan’s usage. Manage usage shows what Hoard has used and lets you limit it. To disconnect Hoard from ChatGPT itself, go to Settings → Security and login → Sign in with ChatGPT on chatgpt.com."
translation = "Tunnistepyynnöt lasketaan ChatGPT-tilauksesi käyttöön. Hallitse käyttöä näyttää, mitä Hoard on käyttänyt, ja antaa rajoittaa sitä. Katkaistaksesi Hoardin yhteyden itse ChatGPT:stä siirry chatgpt.comissa kohtaan Settings → Security and login → Sign in with ChatGPT."

[messages.settings-clap-heading]
source = "Search by what sounds sound like"
translation = "Hae ääniä sen mukaan, miltä ne kuulostavat"

[messages.settings-clap-hint]
source = "Uses LAION’s CLAP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Käyttää LAIONin CLAP-mallia, jota ajetaan tämän palvelimen suorittimella: mitään ei lähde palvelimelta. Käyttöönotto lataa mallin ({ $size } Mt) Hugging Facesta ja kuuntelee sitten jokaisen äänen alun taustalla matalalla prioriteetilla. Se vie enintään noin 1 Gt muistia työskennellessään tai kun joku hakee. Käytöstä poisto poistaa mallin mutta säilyttää opitun seuraavaa kertaa varten."

[messages.settings-clap-hint-desktop]
source = "Uses LAION’s CLAP model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Käyttää LAIONin CLAP-mallia, jota ajetaan tämän tietokoneen suorittimella: mitään ei lähde tietokoneelta. Käyttöönotto lataa mallin ({ $size } Mt) Hugging Facesta ja kuuntelee sitten jokaisen äänen alun taustalla matalalla prioriteetilla. Se vie enintään noin 1 Gt muistia työskennellessään tai kun haet. Käytöstä poisto poistaa mallin mutta säilyttää opitun seuraavaa kertaa varten."

[messages.settings-clap-learning]
source = "Ready: learning sounds, { $done } of { $total } so far"
translation = "Valmis: opetellaan ääniä, { $done }/{ $total } tähän mennessä"

[messages.settings-clap-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } sounds
    }"""
translation = """
{ $count ->
        [one] Valmis: tuntee { $count } äänen
       *[other] Valmis: tuntee kaikki { $count } ääntä
    }"""

[messages.settings-clap-ready-empty]
source = "Ready. Sounds are learned as packs are added."
translation = "Valmis. Äänet opitaan, kun paketteja lisätään."

[messages.settings-clap-reset]
source = "Sound search: back to the default"
translation = "Äänihaku: palauta oletus"

[messages.settings-clap-saved-off]
source = "Sound search: off"
translation = "Äänihaku: pois"

[messages.settings-clap-saved-on]
source = "Sound search: on"
translation = "Äänihaku: päällä"

[messages.settings-clap-toggle]
source = "Turn on sound search"
translation = "Ota äänihaku käyttöön"

[messages.settings-clap-what]
source = "Type what you’re after (“distant thunder”, “glassy UI blip”, “footsteps on gravel”) and sounds that sound like it turn up beside names that have the words."
translation = "Kirjoita, mitä etsit (”distant thunder”, ”glassy UI blip”, ”footsteps on gravel”), niin siltä kuulostavat äänet näkyvät sanat sisältävien nimien rinnalla."

[messages.settings-clip-downloading]
source = "Downloading the model… progress is in the activity indicator"
translation = "Ladataan mallia… edistyminen näkyy toimintailmaisimessa"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Hae kuvia sen mukaan, mitä ne esittävät"

[messages.settings-clip-here]
source = "This server: nothing leaves it"
translation = "Tällä palvelimella: mitään ei lähde täältä"

[messages.settings-clip-here-desktop]
source = "This computer: nothing leaves it"
translation = "Tällä tietokoneella: mitään ei lähde täältä"

[messages.settings-clip-hint]
source = "Uses Google’s SigLIP 2 model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Käyttää Googlen SigLIP 2 -mallia, jota ajetaan tämän palvelimen suorittimella: mitään ei lähde palvelimelta. Käyttöönotto lataa mallin ({ $size } Mt) Hugging Facesta ja opettelee sitten jokaisen kuvan taustalla matalalla prioriteetilla. Se vie 350–750 Mt muistia työskennellessään tai kun joku hakee. Käytöstä poisto poistaa mallin mutta säilyttää opitun seuraavaa kertaa varten."

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Käyttää Googlen SigLIP 2 -mallia, jota ajetaan tämän tietokoneen suorittimella: mitään ei lähde tietokoneelta. Käyttöönotto lataa mallin ({ $size } Mt) Hugging Facesta ja opettelee sitten jokaisen kuvan taustalla matalalla prioriteetilla. Se vie 350–750 Mt muistia työskennellessään tai kun haet. Käytöstä poisto poistaa mallin mutta säilyttää opitun seuraavaa kertaa varten."

[messages.settings-clip-hosted]
source = "A hosted service"
translation = "Isännöidyssä palvelussa"

[messages.settings-clip-hosted-hint]
source = "Nothing is downloaded or run here: the service learns every picture, a batch at a time. Another service or model learns them all again, and what each one learned is kept, for switching back."
translation = "Mitään ei ladata eikä ajeta täällä: palvelu oppii jokaisen kuvan erä kerrallaan. Toinen palvelu tai malli oppii ne kaikki uudelleen, ja se, mitä kukin on oppinut, säilytetään takaisin vaihtamista varten."

[messages.settings-clip-hosted-unavailable]
source = "Couldn’t use { $service }: { $detail }. Trying again every hour."
translation = "Palvelua { $service } ei voitu käyttää: { $detail }. Yritetään uudelleen tunnin välein."

[messages.settings-clip-hosted-warning]
source = "Pictures leave this server. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Kuvat lähtevät tältä palvelimelta. Pienoiskuva jokaisesta kirjaston kuvasta ja jokaisen kuvahaun sanat lähetetään palveluun { $service }, joka laskuttaa niistä ja säilyttää niitä ehtojensa mukaan."

[messages.settings-clip-hosted-warning-desktop]
source = "Pictures leave this computer. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Kuvat lähtevät tältä tietokoneelta. Pienoiskuva jokaisesta kirjaston kuvasta ja jokaisen kuvahaun sanat lähetetään palveluun { $service }, joka laskuttaa niistä ja säilyttää niitä ehtojensa mukaan."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "Valmis: opetellaan kuvia, { $done }/{ $total } tähän mennessä"

[messages.settings-clip-looking]
source = "Looking for the model…"
translation = "Etsitään mallia…"

[messages.settings-clip-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } pictures
    }"""
translation = """
{ $count ->
        [one] Valmis: tuntee { $count } kuvan
       *[other] Valmis: tuntee kaikki { $count } kuvaa
    }"""

[messages.settings-clip-ready-empty]
source = "Ready. Pictures are learned as packs are added."
translation = "Valmis. Kuvat opitaan, kun paketteja lisätään."

[messages.settings-clip-relearning]
source = "Until the new model has learned every picture, searches use what the old one learned."
translation = "Kunnes uusi malli on oppinut jokaisen kuvan, haut käyttävät sitä, mitä vanha oppi."

[messages.settings-clip-reset]
source = "Image search: back to the default"
translation = "Kuvahaku: palauta oletus"

[messages.settings-clip-saved-here]
source = "Image search: runs on this server"
translation = "Kuvahaku: toimii tällä palvelimella"

[messages.settings-clip-saved-here-desktop]
source = "Image search: runs on this computer"
translation = "Kuvahaku: toimii tällä tietokoneella"

[messages.settings-clip-saved-hosted]
source = "Image search: runs on { $service }"
translation = "Kuvahaku: toimii palvelussa { $service }"

[messages.settings-clip-saved-off]
source = "Image search: off"
translation = "Kuvahaku: pois"

[messages.settings-clip-saved-on]
source = "Image search: on"
translation = "Kuvahaku: päällä"

[messages.settings-clip-toggle]
source = "Turn on image search"
translation = "Ota kuvahaku käyttöön"

[messages.settings-clip-unavailable]
source = "Couldn’t get the model: { $detail }. Trying again every hour."
translation = "Mallia ei saatu: { $detail }. Yritetään uudelleen tunnin välein."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Kirjoita, mitä etsit (”mossy rock”, ”sci-fi door”, ”wooden barrel”), niin sitä esittävät kuvat näkyvät sanat sisältävien nimien rinnalla. ”Lisää samankaltaisia” löytää samantyyppisiä asioita, ei vain samanvärisiä."

[messages.settings-clip-where]
source = "Runs on"
translation = "Toimii"

[messages.settings-conv]
source = "Conversion rules"
translation = "Muunnossäännöt"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Lisää sääntö"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Se on yhdessä paketissa.
       *[other] Ne ovat { $packs } paketissa.
    } Jokainen alkuperäinen säilytetään { $days } päivää, ja siihen asti sen voi palauttaa sen sivulta."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Yksi on paketissa, jota vielä lisätään; se muunnetaan, kun lisäys on valmis.
       *[other] { $count } on paketeissa, joita vielä lisätään; ne muunnetaan, kun lisäys on valmis.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Muunna se
       *[other] Muunna { $count } tiedostoa
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Tiedostot, jotka muunnettaisiin"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…ja { $count } lisää"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Tallenna, vain uudet paketit"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Tallenna ja muunna se
       *[other] Tallenna ja muunna { $count } tiedostoa
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Jätetään ennalleen:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
        [one] Muunnetaanko yksi kirjastossa jo oleva tiedosto?
       *[other] Muunnetaanko { $count } kirjastossa jo olevaa tiedostoa?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
        [one] Muunnetaan yhtä tiedostoa taustalla
       *[other] Muunnetaan { $count } tiedostoa taustalla
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Muunna kirjastossa jo olevat tiedostot"

[messages.settings-conv-from]
source = "From"
translation = "Lähtömuodot"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Säilytä alkuperäiset"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] päivän
       *[other] päivää
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Siihen asti muunnetun tiedoston sivulta voi palauttaa alkuperäisen. Tekstuureja ei kopioida muunnettuun malliin: se viittaa vieressään oleviin kuvatiedostoihin. Mallin .mtl- tai .bin-tiedostot jäävät paikalleen."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "Kirjastossa ei ole mitään muunnettavaa."

[messages.settings-conv-remove]
source = "Remove"
translation = "Poista"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Poista sääntö { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Kumoa muutokset"

[messages.settings-conv-rule-on]
source = "On"
translation = "Käytössä"

[messages.settings-conv-save]
source = "Save rules"
translation = "Tallenna säännöt"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Muunnossäännöt tallennettu. Niitä sovelletaan tästä lähtien lisättäviin paketteihin."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] yksi tiedosto, jonka muunnettu kopio on jo sen paketissa
       *[other] { $count } tiedostoa, joiden muunnetut kopiot ovat jo niiden paketeissa
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] yksi tiedosto, jota Blender ei ole vielä lukenut (Asetukset → Työkalut)
       *[other] { $count } tiedostoa, joita Blender ei ole vielä lukenut (Asetukset → Työkalut)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] yksi tiedosto, jonka Unity-projekti tuntee nimeltä
       *[other] { $count } tiedostoa, jotka Unity-projekti tuntee nimeltä
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] yksi tiedosto, jonka kohtaus tai toinen tiedosto mainitsee nimeltä
       *[other] { $count } tiedostoa, jotka kohtaus tai toinen tiedosto mainitsee nimeltä
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] yksi tiedosto valvotussa kansiossa
       *[other] { $count } tiedostoa valvotuissa kansioissa
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "Toinen sääntö muuntaa jo tämän muodon"

[messages.settings-conv-to]
source = "Convert to"
translation = "Muunna muotoon"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Käännä mallit pystyyn muunnettaessa (Y ylös, etupuoli kohti +Z) samalla tavalla kuin paketin mallit näytetään"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Muunna Hoardin säilyttämät tiedostot yhteen muotoon, esimerkiksi kaikki OBJ- ja FBX-tiedostot GLB-muotoon, jotta kirjasto on yhtenäinen. Muunnettu tiedosto korvaa alkuperäisen ja säilyttää sen nimen, tunnisteet, kokoelmat ja linkit. Valvottujen kansioiden tiedostoja ei koskaan muuteta."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Muunnetut lataukset"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "säilytetään enintään; vähiten käytetyt poistetaan ensin"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "säilytetään enintään, nyt { $size }; vähiten käytetyt poistetaan ensin"

[messages.settings-default-auto]
source = "automatic"
translation = "automaattinen"

[messages.settings-default-off]
source = "off"
translation = "pois"

[messages.settings-default-on]
source = "on"
translation = "päällä"

[messages.settings-desktop-updates]
source = "Hoard looks for a new release each time it starts, downloads it in the background, and installs it when you quit."
translation = "Hoard etsii uutta versiota aina käynnistyessään, lataa sen taustalla ja asentaa sen, kun suljet sovelluksen."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "Käyttää järjestelmän ffmpegiä, jossa on oikeat kooderit, tai lataa staattisen version (noin 80 Mt)."

[messages.settings-ffmpeg-what]
source = "Encodes MP3, OGG and Opus downloads, and reads audio Hoard can’t decode itself (AAC, M4A, WMA, …)."
translation = "Koodaa MP3-, OGG- ja Opus-lataukset ja lukee äänen, jota Hoard ei itse osaa purkaa (AAC, M4A, WMA, …)."

[messages.settings-gpu-none]
source = "No GPU or software renderer found, so models get no thumbnails"
translation = "Näytönohjainta tai ohjelmallista renderöijää ei löytynyt, joten mallit eivät saa pikkukuvia"

[messages.settings-gpu-on]
source = "On the GPU: { $renderer }"
translation = "Näytönohjaimella: { $renderer }"

[messages.settings-gpu-software]
source = "No GPU found, so in software ({ $renderer })"
translation = "Näytönohjainta ei löytynyt, joten ohjelmallisesti ({ $renderer })"

[messages.settings-limits]
source = "Work and limits"
translation = "Työ ja rajat"

[messages.settings-limits-what]
source = "Each one saves when you leave the field or press Enter. Sizes take units: 100 GB, 512 MB, 1.5 TB; a plain number is GB."
translation = "Kukin tallentuu, kun poistut kentästä tai painat Enter. Koot ottavat yksiköt: 100 GB, 512 MB, 1.5 TB; pelkkä luku tarkoittaa gigatavuja."

