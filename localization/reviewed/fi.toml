[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Liikkuvat esikatselukuvat animaatioille"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Jokainen animaatio saa myös lyhyen silmukkana toistuvan videon, joka pyörii, kun osoitat sen ruutua. Kukin vie noin 40 kt, ja suuressa kirjastossa niiden tekeminen kestää hetken. Kun poistat tämän käytöstä, ne poistetaan."

[messages.settings-name]
source = "Name"
translation = "Nimi"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Mikä tämän palvelimen nimi on yläpalkissa, selaimen välilehdellä ja kirjautumissivulla, jotta useamman Hoardin kanssa tiedät, mikä on mikä."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "Mikä tämän kirjaston nimi on yläpalkissa."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Tili"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Salasanasi, muut kirjautumaan pääsevät ja käyttöoikeustunnukset skripteille ja muille ohjelmille."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Pakettien lisäys"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Mitä Hoard tekee paketille, kun se lisätään, lukemisen ja tunnisteiden lisäämisen lisäksi."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Tekoälytunnisteet"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Tekoälymalli nimeää, kuvailee ja merkitsee uudet paketit tunnisteilla sisäänrakennettujen sääntöjen lisäksi. Sen tunnisteet merkitään ehdotetuiksi."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Ulkoasu"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Teemat, joita tämä selain käyttää vaaleassa ja tummassa tilassa. Tallennetaan vain tähän selaimeen."

[messages.settings-page-auth]
source = "Authentication"
translation = "Todennus"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Miten käyttäjät kirjautuvat: Hoardin omat tilit, LDAP-hakemisto, Microsoft Active Directory tai OAuth-palveluntarjoaja, kuinka kauan istunnot kestävät ja mitkä ryhmät saavat minkäkin roolin."

[messages.settings-page-connection]
source = "Connection"
translation = "Yhteys"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Miten selaimet ja sovellukset tavoittavat Hoardin: osoite, jolla se tunnetaan, ja HTTPS, jota jotkin selaimen ominaisuudet tarvitsevat."

[messages.settings-page-copies]
source = "Near copies"
translation = "Lähes samat kopiot"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Tiedostot, jotka ovat sama kuva, ääni tai malli eri koossa, näytteenottotaajuudella tai muodossa, eniten tilaa vievät ensin. Kunkin joukon paras on merkitty; mitään ei poisteta."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Lataukset"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Miten tiedostot nimetään siinä, mitä Hoard lähettää: lataukset, zipit, hoard-työkalu ja tekoälyavustajat. Kirjaston tiedostot pysyvät ennallaan."

[messages.settings-page-general]
source = "General"
translation = "Yleiset"

[messages.settings-page-general-blurb]
source = "Your dragon’s hoard, and what this server is called."
translation = "Lohikäärmeesi aarre ja tämän palvelimen nimi."

[messages.settings-page-general-blurb-desktop]
source = "Your dragon’s hoard, and what this library is called."
translation = "Lohikäärmeesi aarre ja tämän kirjaston nimi."

[messages.settings-page-issues]
source = "Issues"
translation = "Ongelmat"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Mikä meni pieleen tiedostoja avattaessa tai käsiteltäessä: arkistot, jotka eivät purkautuneet, tiedostot, joita ei voitu lukea, ja epäonnistuneet työt. Yritä niitä uudelleen, kun syy on korjattu, tai kuittaa ne."

[messages.settings-page-library]
source = "Library"
translation = "Kirjasto"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Mitä Hoardissa on: kuinka suuri se on, mistä se koostuu, miten se on kasvanut ja kuinka hyvin sen sisältö on merkitty tunnisteilla. Arkistoituja ei lasketa."

[messages.settings-page-locations]
source = "Library locations"
translation = "Kirjaston sijainnit"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Palvelimen kansiot, joissa kirjasto on: kansiot, joissa Hoard säilyttää tiedostoja, ja pakettikansiot, jotka se indeksoi paikoillaan."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Kansiot, joissa kirjasto on: kansiot, joissa Hoard säilyttää tiedostoja, ja pakettikansiot, jotka se indeksoi paikoillaan."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Ylläpito"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Varmuuskopioi, tarkista vauriot ja siivoa. Kutakin ajetaan yksi kerrallaan, ja voit poistua tältä sivulta niiden ollessa käynnissä."

[messages.settings-page-performance]
source = "Performance"
translation = "Suorituskyky"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Kuinka kovasti palvelin työskentelee, miten pikkukuvat tehdään ja säilytetään ja paljonko se enintään ottaa vastaan."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Kuinka kovasti Hoard työskentelee, miten pikkukuvat tehdään ja säilytetään ja paljonko se enintään ottaa vastaan."

[messages.settings-page-search]
source = "Image and sound search"
translation = "Kuva- ja äänihaku"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Hae kuvia sen mukaan, mitä ne esittävät, ja ääniä sen mukaan, miltä ne kuulostavat, eikä vain nimen perusteella, ja löydä tyypiltään eikä vain väriltään samankaltaisia."

[messages.settings-page-store-files]
source = "Store files"
translation = "Kauppatiedostot"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Tiedostot, joita kaupat laittavat sisältönsä viereen ja joista Hoard lukee pakettien nimet ja tekijät. Opeta sille tiedostoja, joita se ei tunne, ja jaa opettamasi."

[messages.settings-page-tags]
source = "Tags"
translation = "Tunnisteet"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Kirjaston kaikki tunnisteet. Yhdistä samaa tarkoittavat tai nimeä jokin uudelleen; tunnistelijat käyttävät siitä lähtien uutta nimeä."

[messages.settings-page-tools]
source = "Tools"
translation = "Työkalut"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Ulkoiset ohjelmat, joilla Hoard muuntaa ja lukee tiedostoja."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
