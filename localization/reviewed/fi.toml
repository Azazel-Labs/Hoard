translation = "Tekoälytunnisteet käyttävät ChatGPT-tilaustasi, joten ne pysähtyvät, kunnes kirjaudut uudelleen tai valitset toisen palvelun."

[messages.settings-chatgpt-sign-out-title]
source = "Sign out of ChatGPT?"
