[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Ryhmät, joiden jäsenet saavat kunkin roolin, yksi riviä kohden, nimellä tai DN:llä. Korkein vastaava voittaa, ja se tarkistetaan jokaisella kirjautumisella. Jos ryhmiä ei ole lueteltu, uudet tilit saavat yllä olevan roolin ja ylläpitäjä muuttaa sen myöhemmin. Jos Voi katsoa -kohdassa on lueteltu ryhmiä, vain lueteltujen ryhmien jäsenet voivat kirjautua."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Ryhmät, joiden jäsenet saavat kunkin roolin, yksi riviä kohden, nimellä tai DN:llä (tai millä tahansa ryhmävaatimus niitä luettelee). Korkein vastaava voittaa, ja se tarkistetaan jokaisella kirjautumisella. Jos ryhmiä ei ole lueteltu, uudet tilit saavat yllä olevan roolin ja ylläpitäjä muuttaa sen myöhemmin. Jos Voi katsoa -kohdassa on lueteltu ryhmiä, vain lueteltujen ryhmien jäsenet voivat kirjautua."

