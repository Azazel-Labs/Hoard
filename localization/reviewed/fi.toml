source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "Hoardin omat tilit kirjautuvat yhä omilla salasanoillaan, joten alhaalla oleva tai väärin määritetty hakemisto tai palveluntarjoaja ei voi lukita sinua ulos."

