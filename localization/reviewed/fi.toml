[messages.settings-store-pages]
source = "Store pages"
translation = "Kauppasivut"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "Uudet paketit haetaan kaupoista taustalla, jotta ne saavat kauppasivunsa, myyjänsä ja lisenssinsä."

[messages.settings-the-default]
source = "the default"
translation = "oletus"

[messages.settings-themes]
source = "Themes"
translation = "Teemat"

[messages.settings-thumbs]
source = "Thumbnails"
translation = "Pikkukuvat"

[messages.settings-thumbs-balanced]
source = "Balanced"
translation = "Tasapainoinen"

[messages.settings-thumbs-balanced-hint]
source = "JPEG, quality 82. Hard to tell from the original at thumbnail size."
translation = "JPEG, laatu 82. Vaikea erottaa alkuperäisestä pikkukuvan koossa."

[messages.settings-thumbs-lossless]
source = "Lossless"
translation = "Häviötön"

[messages.settings-thumbs-lossless-hint]
source = "PNG, exactly as made. Several times larger."
translation = "PNG, täsmälleen tehtynä. Monta kertaa suurempi."

[messages.settings-thumbs-saved]
source = "Thumbnails: { $quality }"
translation = "Pikkukuvat: { $quality }"

[messages.settings-thumbs-sharp]
source = "Sharper"
translation = "Terävämmät"

[messages.settings-thumbs-sharp-hint]
source = "JPEG, quality 92. About twice the size of Balanced."
translation = "JPEG, laatu 92. Noin kaksi kertaa Tasapainoisen kokoinen."

[messages.settings-thumbs-small]
source = "Smaller"
translation = "Pienemmät"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG, laatu 70. Riittää ruudukossa; hieman pehmeä läheltä."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Miten uudet pikkukuvat ja mallinäkymät tallennetaan. Läpinäkyvät kuvat ja pikseligrafiikka ovat aina PNG-muodossa. Pienentääksesi jo olemassa olevat aja Ylläpito-sivulla Pienennä pikkukuvat."

[messages.settings-title]
source = "Settings"
translation = "Asetukset"

[messages.settings-tn]
source = "Texture names"
translation = "Tekstuurien nimet"

[messages.settings-tn-custom]
source = "Your own"
translation = "Oma"

[messages.settings-tn-descriptive]
source = "Descriptive"
translation = "Kuvaava"

[messages.settings-tn-ending-add]
source = "Add an ending"
translation = "Lisää loppuosa"

[messages.settings-tn-ending-from]
source = "Ending"
translation = "Loppuosa"

[messages.settings-tn-ending-from-example]
source = "_diff"
translation = "_diff"

[messages.settings-tn-ending-remove]
