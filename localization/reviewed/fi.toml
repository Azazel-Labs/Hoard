source = "Files that couldn’t be opened"
translation = "Tiedostot, joita ei voitu avata"

[messages.server-issues-file-blurb]
source = "Hoard couldn’t open or store them. A watched pack tries them again at its next scan; a file already in the library kept what it had before."
translation = "Hoard ei voinut avata tai tallentaa niitä. Valvottu paketti yrittää niitä uudelleen seuraavassa tarkistuksessaan; kirjastossa jo oleva tiedosto säilytti aiemman sisältönsä."

