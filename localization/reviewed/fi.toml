translation = "_BC"

[messages.settings-tn-endings]
source = "Endings of your own"
translation = "Omat loppuosat"

[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "Tekstuuri, joka ei ole mikään materiaalin kartoista, säilyttää oman nimensä, ellei se pääty johonkin näistä: _diff → _BC lähettää tiedoston rock_diff.png nimellä rock_BC.png. Jätä jälkimmäinen tyhjäksi, niin loppuosa poistetaan."

[messages.settings-tn-example]
source = "Example"
translation = "Esimerkki"

[messages.settings-tn-hint-map]
source = '{ " " }what the map is for,{ " " }'
translation = '{ " " }kartan käyttötarkoitus,{ " " }'

[messages.settings-tn-hint-name]
source = '{ " " }the material,{ " " }'
translation = '{ " " }materiaali,{ " " }'

[messages.settings-tn-hint-size]
source = '{ " " }its size when the set comes in more than one (added on the end if the pattern leaves it out).'
translation = '{ " " }sen koko, kun sarjasta on useita kokoja (lisätään loppuun, jos malli jättää sen pois).'

[messages.settings-tn-pattern]
source = "Pattern"
translation = "Malli"

[messages.settings-tn-reset]
source = "Texture names: back to the default"
translation = "Tekstuurien nimet: palauta oletus"

[messages.settings-tn-saved]
source = "Texture names saved"
translation = "Tekstuurien nimet tallennettu"

[messages.settings-tn-short]
source = "Short"
translation = "Lyhyt"

[messages.settings-tn-slots]
source = "In GLB downloads, a texture packed inside a model with no file of its own is named after the material and the slot it fills, and these slots have suffixes too:"
translation = "GLB-latauksissa mallin sisään pakattu tekstuuri, jolla ei ole omaa tiedostoa, nimetään materiaalin ja sen täyttämän paikan mukaan, ja näilläkin paikoilla on päätteet:"

[messages.settings-tn-style]
source = "Style"
translation = "Tyyli"

[messages.settings-tn-style-group]
source = "Naming style"
translation = "Nimeämistyyli"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "Päätteet kullekin karttatyypille"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Nimeä tekstuurikartat materiaalinsa mukaan"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Materiaalin kartat lähtevät nimettyinä materiaalin ja kunkin kartan käyttötarkoituksen mukaan, nimettiinpä tiedostot miten tahansa: Rock_Normal.png, ei rock_moss_xeokah0_raw_8K_Normal.png. Kirjaston tiedostoihin ei kosketa, ja kartta, jonka mukana lähetetty malli tai MTL nimeää, säilyttää nimensä, jotta malli löytää sen yhä."

[messages.settings-tool-downloading]
source = "Downloading… progress is in the activity indicator"
translation = "Ladataan… edistyminen näkyy toimintailmaisimessa"

