[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Kun uusi versio julkaistaan, Hoard voi kutsua osoitetta heti, kun mitään ei ole käynnissä (ei lähetyksiä, töitä, muunnoksia eikä ylläpitoa), jottei sen konttia päivittävä työkalu käynnistä sitä uudelleen kesken lähetyksen. Se lähettää POST-pyynnön, jonka JSON-rungossa on versio. Tämä vaatii yllä olevan versiotarkistuksen."

