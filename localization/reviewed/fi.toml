Näytetään { $preview ->
        [light] vaalea
       *[dark] tumma
    } teema, jotta näet sen. Käytät { $used ->
        [light] vaaleaa
       *[dark] tummaa
    } teemaa{ $system ->
        [yes] { " " }(järjestelmän mukaan)
       *[other] { "" }
    }, ja se palaa, kun poistut tältä sivulta."""

[messages.settings-preview-back]
