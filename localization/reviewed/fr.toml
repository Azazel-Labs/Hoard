translation = "Convertissez les fichiers que Hoard conserve vers un seul format, par exemple tous les OBJ et FBX en GLB, pour que la bibliothèque soit homogène. Le fichier converti prend la place de l’original, avec son nom, ses étiquettes, ses collections et ses liens. Les fichiers des dossiers surveillés ne sont jamais modifiés."

