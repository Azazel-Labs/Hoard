[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Les groupes dont les membres obtiennent chaque rôle, un par ligne, par nom ou par DN. Le plus élevé qui correspond l’emporte, et c’est vérifié à chaque connexion. Si aucun n’est listé, les nouveaux comptes reçoivent le rôle ci-dessus et un administrateur le change ensuite. Si des groupes sont listés sous Peut consulter, seuls les membres d’un groupe listé peuvent se connecter."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Les groupes dont les membres obtiennent chaque rôle, un par ligne, par nom ou par DN (ou ce que liste la revendication des groupes). Le plus élevé qui correspond l’emporte, et c’est vérifié à chaque connexion. Si aucun n’est listé, les nouveaux comptes reçoivent le rôle ci-dessus et un administrateur le change ensuite. Si des groupes sont listés sous Peut consulter, seuls les membres d’un groupe listé peuvent se connecter."

