[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Créez une OAuth app dans GitHub → Settings → Developer settings. GitHub n’envoie aucun groupe : attribuez les rôles dans Paramètres → Compte, et désactivez la création de comptes à la première connexion, sauf si toute personne ayant un compte GitHub doit pouvoir entrer."

