[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Votre mot de passe, les autres personnes qui peuvent se connecter, et les jetons d’accès pour les scripts et autres programmes."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Ajout de packs"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Ce que Hoard fait d’un pack quand il est ajouté, en plus de le lire et de l’étiqueter."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Étiquetage par IA"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Un modèle d’IA nomme, décrit et étiquette les nouveaux packs, en plus des règles intégrées. Ses étiquettes sont marquées comme suggérées."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Apparence"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Les thèmes que ce navigateur porte en mode clair et en mode sombre. Enregistrés dans ce navigateur uniquement."

[messages.settings-page-auth]
source = "Authentication"
translation = "Authentification"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Comment on se connecte : les comptes propres à Hoard, un annuaire LDAP, Microsoft Active Directory ou un fournisseur OAuth, la durée des sessions, et quels groupes obtiennent quel rôle."

[messages.settings-page-connection]
source = "Connection"
translation = "Connexion"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Comment les navigateurs et les applications joignent Hoard : l’adresse sous laquelle il est connu, et HTTPS, dont certaines fonctions des navigateurs ont besoin."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Téléchargements"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Comment sont nommés les fichiers que Hoard envoie : téléchargements, zips, l’outil hoard et les assistants IA. Les fichiers de la bibliothèque restent tels quels."

[messages.settings-page-general]
source = "General"
translation = "Général"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Le nom de ce serveur, pour tous ceux qui l’utilisent."

[messages.settings-page-general-blurb-desktop]
source = "What this library is called."
translation = "Le nom de cette bibliothèque."

[messages.settings-page-issues]
source = "Issues"
translation = "Problèmes"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Ce qui a mal tourné à l’ouverture ou au traitement des fichiers : archives impossibles à décompresser, fichiers illisibles, tâches en échec. Réessayez une fois la cause corrigée, ou ignorez-les."

[messages.settings-page-library]
source = "Library"
translation = "Bibliothèque"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Ce que contient Hoard : sa taille, de quoi il est fait, comment il a grandi et à quel point il est bien étiqueté. Ce qui est archivé n’est pas compté."

[messages.settings-page-locations]
source = "Library locations"
translation = "Emplacements de la bibliothèque"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Les dossiers du serveur qui contiennent la bibliothèque : ceux où Hoard range des fichiers, et les dossiers de packs qu’il indexe là où ils se trouvent."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Les dossiers qui contiennent la bibliothèque : ceux où Hoard range des fichiers, et les dossiers de packs qu’il indexe là où ils se trouvent."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Maintenance"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Sauvegarder, vérifier l’intégrité et faire le ménage. Une tâche de chaque type s’exécute à la fois, et vous pouvez quitter cette page pendant ce temps."

[messages.settings-page-performance]
source = "Performance"
translation = "Performances"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "L’intensité de travail du serveur, la façon dont les miniatures sont créées et conservées, et le maximum qu’il accepte."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "L’intensité de travail de Hoard, la façon dont les miniatures sont créées et conservées, et le maximum qu’il accepte."

[messages.settings-page-search]
source = "Image search"
translation = "Recherche d’images"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show, not only by their names, and find things that are alike in kind, not only in color."
translation = "Cherchez des images d’après ce qu’elles montrent, pas seulement d’après leur nom, et trouvez des choses de même nature, pas seulement de même couleur."

[messages.settings-page-store-files]
source = "Store files"
translation = "Fichiers des boutiques"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Les fichiers que les boutiques placent à côté de leurs ressources, que Hoard lit pour nommer les packs et créditer leurs auteurs. Apprenez-lui ceux qu’il ne connaît pas, et partagez ce que vous lui avez appris."

[messages.settings-page-tags]
source = "Tags"
translation = "Étiquettes"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Toutes les étiquettes de la bibliothèque. Fusionnez celles qui veulent dire la même chose, ou renommez-en une ; les étiqueteurs utilisent le nouveau nom à partir de là."

