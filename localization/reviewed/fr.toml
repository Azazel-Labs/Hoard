translation = "Créez une application dans GitLab → Preferences → Applications (ou dans la zone d’administration de votre instance : changez gitlab.com dans les adresses)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Créez un client OAuth (Application Web) dans Google Cloud Console → API et services → Identifiants. Google n’envoie aucun groupe : attribuez les rôles dans Paramètres → Compte, et désactivez la création de comptes à la première connexion, sauf si toute personne ayant un compte Google doit pouvoir entrer."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Inscrivez une application dans Entra ID → Inscriptions d’applications (une redirection Web vers l’adresse ci-dessous). Remplacez « organizations » par l’ID de votre locataire pour n’admettre que votre organisation. Pour des rôles issus des groupes, ajoutez la revendication groups dans Configuration du jeton : elle liste les ID des groupes."

