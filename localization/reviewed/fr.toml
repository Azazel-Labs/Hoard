[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Quand une nouvelle version sort, Hoard peut appeler une adresse dès que rien n’est en cours (ni envoi, ni tâche, ni conversion, ni maintenance), pour que ce qui met à jour son conteneur ne le redémarre pas en plein envoi. Il envoie un POST avec la version dans un corps JSON. Cela nécessite la vérification des nouvelles versions ci-dessus."

