[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude et autres applications d’IA"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Connectez Claude (ou toute application MCP) et il peut chercher et récupérer des ressources pour vous, et décrire et étiqueter ce que Hoard n’a pas encore traité. Il se connecte à Hoard la première fois ; vous l’autorisez ici, dans le navigateur."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "L’application Hoard vous connecte elle-même, il n’y a donc pas de mot de passe. Créez ci-dessous un jeton d’accès pour les extensions des moteurs et la commande hoard."

[messages.account-change-password]
source = "Change password"
translation = "Changer le mot de passe"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Paramètres → Connecteurs → Ajouter un connecteur personnalisé, collez l’adresse, puis Connecter. Ces applications se connectent depuis les serveurs d’Anthropic : Hoard doit donc être joignable depuis Internet en HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Paramètres → Connecteurs → Ajouter un connecteur personnalisé, collez l’adresse, puis Connecter. Ces applications se connectent depuis les serveurs d’Anthropic : Hoard doit donc être joignable depuis Internet en HTTPS (ce n’est pas le cas de cette adresse : définissez l’adresse publique dans Paramètres → Connexion)."

