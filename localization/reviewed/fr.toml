translation = "Aucun sprite n’a cela dans son nom."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites pivotés dans le sens horaire et rognés. Il ne peut pas contenir d’animations : les images se suivent selon leurs noms numérotés."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Chaque sprite à l’endroit sur toute sa toile, chacun dans un PNG qui porte son nom."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprites jamais pivotés, leur rognage conservé sous forme de marges, avec les animations et la durée de chaque image."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Tuiles jamais pivotées ni rognées, sur une grille à la taille des tuiles, en gardant les images telles quelles si elles y sont déjà."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Chaque sprite à l’endroit sur toute sa toile, dans des cellules toutes de la même taille, pour tout ce qui découpe une planche en grille."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Le format propre à Hoard : les pages telles quelles, les sprites pivotés dans n’importe quel sens et rognés, avec les animations et la durée de chaque image."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites pivotés dans le sens antihoraire et rognés. Il ne peut pas contenir d’animations : les images se suivent selon leurs noms numérotés."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprites pivotés dans le sens horaire et rognés, avec les animations par nom, comme PixiJS et Phaser les lisent."

