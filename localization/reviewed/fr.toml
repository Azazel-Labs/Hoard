translation = "Ajouter une règle"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Il se trouve dans un pack.
       *[other] Ils se trouvent dans { $packs } packs.
    } Chaque original est conservé { $days } jours, et d’ici là il peut être remis depuis sa page."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Un fichier se trouve dans un pack encore en cours d’ajout ; il sera converti une fois l’ajout terminé.
       *[other] { $count } se trouvent dans des packs encore en cours d’ajout ; ils seront convertis une fois l’ajout terminé.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
