[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Ha megjelenik egy új kiadás, a Hoard meghívhat egy címet, amint semmi sincs folyamatban (nincs feltöltés, feladat, átalakítás vagy karbantartás), így a konténerét frissítő eszköz nem indítja újra feltöltés közben. POST kérést küld, a kiadással egy JSON-törzsben. Ehhez a fenti kiadásellenőrzés szükséges."

