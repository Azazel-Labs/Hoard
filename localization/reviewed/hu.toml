translation = "Áruházi fájlok, amelyeket nem sikerült beolvasni"

[messages.server-issues-store-files-blurb]
source = "Files from the store a pack came from, such as a Megascans JSON, that name and tag it."
translation = "Annak az áruháznak a fájljai, ahonnan a csomag származik (például egy Megascans JSON), amelyek megnevezik és felcímkézik."

[messages.server-issues-unpack]
source = "Archives that couldn’t be unpacked"
translation = "Tömörített fájlok, amelyeket nem sikerült kicsomagolni"

[messages.server-issues-unpack-blurb]
source = "Each is kept in its pack as a plain file, so nothing inside it is in the library."
translation = "Mindegyik egyszerű fájlként marad a csomagjában, így a tartalmából semmi sincs a könyvtárban."

