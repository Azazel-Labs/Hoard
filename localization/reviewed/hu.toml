translation = "A letöltés leáll, és az eddig letöltött rész törlődik."

[messages.settings-local-delete-in-use]
source = "AI tagging uses this model, so it stops until you pick another. Its files are deleted from the model server."
translation = "Az MI-címkézés ezt a modellt használja, ezért leáll, amíg másikat nem választ. A fájljai törlődnek a modellszerverről."

