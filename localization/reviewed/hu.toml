[messages.settings-max-expand-unit]
source = "once unpacked"
translation = "kicsomagolva"

[messages.settings-max-upload]
source = "Largest upload"
translation = "Legnagyobb feltöltés"

[messages.settings-max-upload-unit]
source = "per file"
translation = "fájlonként"

[messages.settings-mode-auto]
source = "Automatic"
translation = "Automatikus"

[messages.settings-mode-off]
source = "Off"
translation = "Ki"

[messages.settings-mode-path]
source = "This program"
translation = "Ez a program"

[messages.settings-motion-fps]
source = "Frame rate"
translation = "Képkockasebesség"

[messages.settings-motion-fps-option]
source = "{ $fps } fps"
translation = "{ $fps } fps"

[messages.settings-motion-fps-what]
source = "Smoother movies take longer to make and more room: about twice as much at 24 fps as at 12, and more again at 30. Changing it makes them all again."
translation = "A gördülékenyebb mozgóképek elkészítése tovább tart és több helyet foglal: 24 fps-nél nagyjából kétszer annyit, mint 12-nél, 30-nál pedig még többet. Ha módosítja, mind újra elkészül."

[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Mozgó bélyegképek az animációkhoz"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Minden animáció kap egy rövid, ismétlődő mozgóképet is, amely akkor játszódik, amikor a csempéjére mutatsz. Darabonként kb. 40 KB-ot foglalnak, és nagy könyvtárnál eltart egy ideig az elkészítésük. Kikapcsoláskor törlődnek."

[messages.settings-name]
source = "Name"
translation = "Név"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "A szerver neve a felső sávban, a böngészőlapon és a bejelentkezési oldalon, hogy több hoard esetén meg lehessen különböztetni őket."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "A könyvtár neve a felső sávban."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-about]
source = "About"
translation = "Névjegy"

[messages.settings-page-about-blurb]
source = "What Hoard is, which version this is, and the work of others it’s made with."
translation = "Mi a Hoard, melyik verzió ez, és mások munkája, amelyből készült."

[messages.settings-page-account]
source = "Account"
translation = "Fiók"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "A jelszava, a többi bejelentkezni tudó személy, valamint hozzáférési tokenek szkriptekhez és más programokhoz."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Csomagok hozzáadása"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Mit csinál a Hoard egy csomaggal hozzáadáskor, a beolvasásán és felcímkézésén kívül."

[messages.settings-page-ai]
source = "AI tagging"
translation = "MI-címkézés"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Egy MI-modell elnevezi, leírja és felcímkézi az új csomagokat a beépített szabályokon felül. A címkéi javasoltként vannak megjelölve."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Megjelenés"

[messages.settings-page-appearance-blurb]
source = "Language, themes, text size and spacing, and what the tiles and the top bar show. Saved in this browser only."
translation = "Nyelv, témák, szövegméret és térköz, valamint hogy mit mutatnak a csempék és a felső sáv. Csak ebben a böngészőben mentve."

[messages.settings-page-auth]
source = "Authentication"
translation = "Hitelesítés"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Hogyan jelentkeznek be az emberek: a Hoard saját fiókjaival, LDAP-címtárral, Microsoft Active Directoryval vagy OAuth-szolgáltatóval; meddig tartanak a munkamenetek, és melyik csoport melyik szerepkört kapja."

[messages.settings-page-connection]
source = "Connection"
translation = "Kapcsolat"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Hogyan érik el a böngészők és az alkalmazások a Hoardot: a cím, amelyen ismert, és a HTTPS, amely egyes böngészőfunkciókhoz szükséges."

[messages.settings-page-copies]
source = "Near copies"
translation = "Majdnem azonos másolatok"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Fájlok, amelyek ugyanaz a kép, hang vagy modell más méretben, mintavételezési frekvenciával vagy formátumban; elöl azok, amelyek a legtöbb helyet foglalják. Minden csoport legjobbja meg van jelölve; semmi sem törlődik."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Letöltések"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hogyan nevezi el a Hoard a fájlokat abban, amit küld: letöltésekben, zipekben, a hoard eszközben és az MI-asszisztenseknek. A könyvtár fájljai változatlanok maradnak."

[messages.settings-page-dragon]
source = "Dragon"
translation = "Sárkány"

[messages.settings-page-dragon-blurb]
source = "Your dragon’s hoard: every asset in the library is a piece of its treasure."
translation = "A sárkányod kincse: a könyvtár minden eleme egy darabja."

[messages.settings-page-issues]
source = "Issues"
translation = "Problémák"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Mi ment félre a fájlok megnyitásakor vagy feldolgozásakor: ki nem csomagolható tömörített fájlok, be nem olvasható fájlok, sikertelen feladatok. Próbálja újra őket, ha az ok megszűnt, vagy vesse el őket."

[messages.settings-page-library]
source = "Library"
translation = "Könyvtár"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Mi van a hoardban: mekkora, miből áll, hogyan nőtt, és mennyire jól van felcímkézve. Az archivált elemek nem számítanak bele."

[messages.settings-page-locations]
source = "Library locations"
translation = "Tárolási helyek"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "A szerver mappái, amelyekben a könyvtár van: amelyekben a Hoard fájlokat tárol, és csomagmappák, amelyeket a helyükön indexel."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "A mappák, amelyekben a könyvtár van: amelyekben a Hoard fájlokat tárol, és csomagmappák, amelyeket a helyükön indexel."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Karbantartás"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Biztonsági mentés, sérülésellenőrzés és rendrakás. Mindegyikből egyszerre egy fut, és elhagyhatja ezt az oldalt, amíg futnak."

[messages.settings-page-performance]
source = "Performance"
translation = "Teljesítmény"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Mennyire dolgozik keményen a szerver, hogyan készülnek és tárolódnak a bélyegképek, és legfeljebb mennyit fogad be."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Mennyire dolgozik keményen a Hoard, hogyan készülnek és tárolódnak a bélyegképek, és legfeljebb mennyit fogad be."

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Keressen a képek között aszerint, hogy mit ábrázolnak, a hangok között pedig aszerint, hogyan szólnak, ne csak a nevük szerint, és találjon fajtájukban hasonló dolgokat, ne csak színükben hasonlókat."

[messages.settings-page-search-tab]
source = "Search"
translation = "Keresés"

[messages.settings-page-store-files]
source = "Store files"
translation = "Áruházi fájlok"

[messages.settings-page-store-files-blurb]
