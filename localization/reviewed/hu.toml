[messages.server-issues-blob-missing]
source = "The stored file is gone."
translation = "A tárolt fájl eltűnt."

[messages.server-issues-convert]
source = "Models Blender couldn’t convert"
translation = "Modellek, amelyeket a Blender nem tudott átalakítani"

[messages.server-issues-convert-again]
source = "Convert again"
translation = "Átalakítás újra"

[messages.server-issues-convert-blurb]
source = "They have no GLB copy, so they can’t be shown in 3D."
translation = "Nincs GLB-másolatuk, így nem jeleníthetők meg 3D-ben."

[messages.server-issues-damaged]
source = "Stored files that are damaged or gone"
translation = "Sérült vagy eltűnt tárolt fájlok"

[messages.server-issues-damaged-blurb]
source = "Found by Check files for damage. Restore them from a backup or add their pack again, then run Check files for damage again."
translation = "A „Fájlok sérülésének ellenőrzése” találta őket. Állítsa vissza őket biztonsági mentésből, vagy adja hozzá újra a csomagjukat, majd futtassa ismét az ellenőrzést."

[messages.server-issues-file]
source = "Files that couldn’t be opened"
translation = "Fájlok, amelyeket nem sikerült megnyitni"

[messages.server-issues-file-blurb]
source = "Hoard couldn’t open or store them. A watched pack tries them again at its next scan; a file already in the library kept what it had before."
translation = "A Hoard nem tudta megnyitni vagy tárolni őket. A figyelt csomag a következő vizsgálatkor újra megpróbálja; a könyvtárban már meglévő fájl megtartotta a korábbi tartalmát."

[messages.server-issues-folder]
source = "Watched folders that can’t be read"
translation = "Figyelt mappák, amelyek nem olvashatók"

[messages.server-issues-folder-blurb]
source = "Their packs are left as they are until the folder can be read again."
translation = "A csomagjaik változatlanok maradnak, amíg a mappa újra olvashatóvá nem válik."

[messages.server-issues-folder-gone]
source = "The folder “{ $folder }” wasn’t found."
translation = "A mappa nem található: „{ $folder }”."

[messages.server-issues-job]
source = "Background jobs that failed"
translation = "Sikertelen háttérfeladatok"

[messages.server-issues-job-blurb]
source = "Retrying runs the job again from the start."
translation = "Az újrapróbálás elölről futtatja a feladatot."

[messages.server-issues-look-again]
source = "Look again"
translation = "Újrakeresés"

[messages.server-issues-material-thumb]
source = "Materials without a thumbnail"
translation = "Anyagok bélyegkép nélkül"

[messages.server-issues-material-thumb-blurb]
source = "The material was found, but its preview couldn’t be drawn."
translation = "Az anyag megvan, de az előnézetét nem sikerült megrajzolni."

[messages.server-issues-materials]
source = "Packs whose materials couldn’t be worked out"
translation = "Csomagok, amelyek anyagait nem sikerült kikövetkeztetni"

[messages.server-issues-materials-blurb]
source = "Their textures are all there; they just aren’t grouped into materials."
translation = "A textúráik mind megvannak, csak nincsenek anyagokba csoportosítva."

[messages.server-issues-missing]
source = "Watched packs whose folder is gone"
translation = "Figyelt csomagok, amelyeknek eltűnt a mappája"

[messages.server-issues-missing-blurb]
source = "Each pack is kept for 3 days in case its folder is only offline, then removed."
translation = "Minden csomag 3 napig megmarad arra az esetre, ha a mappája csak offline lenne, utána törlődik."

[messages.server-issues-pack]
source = "Packs that couldn’t be added"
translation = "Csomagok, amelyeket nem sikerült hozzáadni"

[messages.server-issues-pack-blurb]
source = "Delete the pack and add it again, or open it to see what it has."
translation = "Törölje a csomagot, és adja hozzá újra, vagy nyissa meg, hogy lássa, mi van benne."

[messages.server-issues-read]
source = "Files Hoard couldn’t make sense of"
translation = "Fájlok, amelyeket a Hoard nem tudott értelmezni"

[messages.server-issues-read-again]
source = "Read again"
translation = "Újraolvasás"

[messages.server-issues-read-blurb]
source = "They’re in the library, but without the facts, tags or thumbnail that reading them gives."
translation = "Bekerültek a könyvtárba, de azok az adatok, címkék és bélyegkép nélkül, amelyeket a beolvasásuk adna."

[messages.server-issues-reanalyze]
source = "Re-analyze pack"
translation = "Csomag újraelemzése"

[messages.server-issues-reformat]
source = "Files a conversion rule couldn’t convert"
translation = "Fájlok, amelyeket egy átalakítási szabály nem tudott átalakítani"

[messages.server-issues-reformat-blurb]
source = "They’re left as they were."
translation = "Változatlanul maradtak."

[messages.server-issues-render]
source = "Models the thumbnail renderer failed on"
translation = "Modellek, amelyeknél a bélyegkép-renderelő hibát jelzett"

[messages.server-issues-render-blurb]
source = "They have no thumbnail. Opening one in the viewer may still work, and can save one."
translation = "Nincs bélyegképük. A megjelenítőben megnyitva még működhetnek, és ott el is lehet menteni egyet."

[messages.server-issues-retry]
source = "Retry"
translation = "Újrapróbálás"

[messages.server-issues-scan-again]
source = "Scan again"
translation = "Újravizsgálás"

[messages.server-issues-store-files]
