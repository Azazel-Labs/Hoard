[messages.about-version]
source = "Version"
translation = "Verzió"

[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "A Hoard egyetlen könyvtárban tárolja a játékokhoz való asseteket (modelleket, textúrákat, hangokat, zenét, sprite-okat és egyebeket), amelyben kereshet, előnézetet nézhet és amelyből vehet, megosztva mindenkivel, akinek hozzáférést ad."

[messages.account-add]
source = "Add"
translation = "Hozzáadás"

[messages.account-add-failed]
source = "Couldn't add { $name }"
translation = "Nem sikerült felvenni: { $name }"

[messages.account-added]
source = "{ $name } can sign in now."
translation = "{ $name } mostantól bejelentkezhet."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "A Claude és más MI-alkalmazások"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Csatlakoztassa a Claude-ot (vagy bármely MCP-alkalmazást), és assetekre kereshet és letöltheti őket Ön helyett, valamint leírhatja és felcímkézheti, amit a Hoard még nem. Első alkalommal bejelentkezik a Hoardba; ezt itt, a böngészőben engedélyezi."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "A Hoard alkalmazás magától bejelentkeztet, ezért nincs jelszó. Alább hozz létre hozzáférési tokent a motorbővítményekhez és a hoard parancshoz."

[messages.account-change-password]
source = "Change password"
translation = "Jelszó módosítása"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Settings → Connectors → Add custom connector, illessze be a címet, majd Connect. Ezek az Anthropic szervereiről kapcsolódnak, ezért a Hoardnak HTTPS-en elérhetőnek kell lennie az internetről."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Settings → Connectors → Add custom connector, illessze be a címet, majd Connect. Ezek az Anthropic szervereiről kapcsolódnak, ezért a Hoardnak HTTPS-en elérhetőnek kell lennie az internetről (ez a cím nem az: állítsa be a Nyilvános címet a Beállítások → Kapcsolat oldalon)."

