{ $scheme ->
        [light] Világos téma
       *[dark] Sötét téma
    }"""

[messages.settings-look-hint]
source = "Switch between light and dark (or follow the system) from the top bar."
translation = "A világos és a sötét mód (vagy a rendszer követése) között a felső sávban válthat."

[messages.settings-look-light]
source = "Light"
translation = "Világos"

[messages.settings-max-expand]
source = "Largest pack"
