source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "A hang pontosan ugyanaz marad, nagyjából feleakkora helyen, és a WAV minden más része (hurokpontok, cue-jelölők, címkék) megmarad a FLAC-ban, így a WAV bármikor pontosan az eredeti formájában visszaállítható. A lebegőpontos vagy 32 bites mintákat tartalmazó WAV-ok WAV-ok maradnak."

[messages.settings-conv-from]
source = "From"
translation = "Forrásformátumok"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Az eredetiek megőrzése"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] napig
       *[other] napig
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Addig az átalakított fájl oldaláról visszaállítható az eredeti. A textúrák nem másolódnak bele az átalakított modellbe: az a mellette lévő képfájlokra hivatkozik. A modell .mtl vagy .bin fájljai megmaradnak."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "A könyvtárban semmit sem kell átalakítani."

[messages.settings-conv-remove]
source = "Remove"
translation = "Eltávolítás"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "{ $n }. szabály eltávolítása"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Módosítások visszavonása"

[messages.settings-conv-rule-on]
source = "On"
translation = "Bekapcsolva"

[messages.settings-conv-save]
source = "Save rules"
translation = "Szabályok mentése"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Átalakítási szabályok mentve. A mostantól hozzáadott csomagokra vonatkoznak."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] egy fájl, amelynek átalakított másolata már a csomagjában van
       *[other] { $count } fájl, amelynek átalakított másolata már a csomagjában van
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] egy fájl, amelyet a Blender még nem olvasott be (Beállítások → Eszközök)
       *[other] { $count } fájl, amelyet a Blender még nem olvasott be (Beállítások → Eszközök)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] egy fájl, amelyet egy Unity-projekt a nevéről ismer
       *[other] { $count } fájl, amelyet egy Unity-projekt a nevéről ismer
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] egy fájl, amelyet egy jelenet vagy egy másik fájl megnevez
       *[other] { $count } fájl, amelyet egy jelenet vagy egy másik fájl megnevez
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] egy fájl figyelt mappában
       *[other] { $count } fájl figyelt mappákban
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "Ezt a formátumot egy másik szabály alakítja át"

[messages.settings-conv-to]
source = "Convert to"
translation = "Célformátum"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "A modellek felállítása átalakításkor (Y felfelé, előre +Z irányba), ahogy a csomag modelljei megjelennek"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "A Hoard által tárolt fájlok átalakítása egyetlen formátumra, például minden OBJ és FBX fájlé GLB-re, hogy a könyvtár egységes legyen. Az átalakított fájl átveszi az eredeti helyét, megtartva a nevét, címkéit, gyűjteményeit és hivatkozásait. A figyelt mappákban lévő fájlok soha nem változnak."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Átalakított letöltések"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "legfeljebb ennyi marad meg; a legrégebben használtak törlődnek először"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "legfeljebb ennyi marad meg, jelenleg { $size }; a legrégebben használtak törlődnek először"

[messages.settings-default-auto]
source = "automatic"
translation = "automatikus"

[messages.settings-default-off]
source = "off"
translation = "kikapcsolva"

[messages.settings-default-on]
source = "on"
translation = "bekapcsolva"

[messages.settings-desktop-updates]
source = "Hoard looks for a new release each time it starts, downloads it in the background, and installs it when you quit."
translation = "A Hoard minden indításkor új kiadást keres, a háttérben letölti, és kilépéskor telepíti."

[messages.settings-editor-path]
source = "Enter the executable path of your installed { $tool }. Automatic installation is available only in Docker."
translation = "Adja meg a telepített { $tool } futtatható fájljának útvonalát. Az automatikus telepítés csak Dockerben érhető el."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "A rendszer megfelelő kódolókkal rendelkező ffmpeg-jét használja, vagy letölt egy statikus buildet (kb. 80 MB)."

[messages.settings-ffmpeg-what]
source = "Encodes MP3, OGG and Opus downloads, and reads audio Hoard can’t decode itself (AAC, M4A, WMA, …)."
translation = "MP3-, OGG- és Opus-letöltéseket kódol, és beolvassa azokat a hangokat, amelyeket a Hoard maga nem tud dekódolni (AAC, M4A, WMA, …)."

[messages.settings-find]
source = "Find a setting"
translation = "Beállítás keresése"

[messages.settings-find-none]
source = "No setting matches “{ $query }”."
translation = "Egy beállítás sem felel meg ennek: „{ $query }”."

[messages.settings-gpu-none]
