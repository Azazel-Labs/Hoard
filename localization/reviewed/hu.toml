source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "A csempék sosincsenek elforgatva vagy körbevágva, csempeméretű rácson állnak, és a képek változatlanok maradnak, ha már rácson vannak."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Minden sprite állítva, a teljes vásznával, egyforma méretű cellákban, bármihez, ami rácsra vágja a lapot."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "A Hoard saját formátuma: az oldalak úgy, ahogy vannak, a sprite-ok bármilyen irányba elforgatva és körbevágva, animációkkal és minden képkocka idejével."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "A sprite-ok az óramutató járásával ellentétesen elforgatva és körbevágva. Animációkat nem tud tárolni: a képkockákat a számozott nevük azonosítja."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "A sprite-ok az óramutató járásával megegyezően elforgatva és körbevágva, név szerinti animációkkal, ahogy a PixiJS és a Phaser olvassa őket."

