[messages.auth-preset-custom-note]
source = "Keycloak, Authentik, Authelia, Okta, Zitadel and others: give the issuer and Discover fills in the addresses."
translation = "Keycloak, Authentik, Authelia, Okta, Zitadel és mások: adja meg a kiállítót, és a Felderítés kitölti a címeket."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Hozzon létre egy OAuth-alkalmazást a GitHub → Settings → Developer settings alatt. A GitHub nem küld csoportokat, ezért a szerepköröket a Beállítások → Fiók oldalon adja meg, és kapcsolja ki a fiókok első bejelentkezéskor történő létrehozását, hacsak nem juthat be bárki, akinek GitHub-fiókja van."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Hozzon létre egy alkalmazást a GitLab → Preferences → Applications alatt (vagy a saját példánya adminfelületén: a címekben cserélje ki a gitlab.com részt)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Hozzon létre egy OAuth-klienst (Web application) a Google Cloud Console → APIs & Services → Credentials alatt. A Google nem küld csoportokat, ezért a szerepköröket a Beállítások → Fiók oldalon adja meg, és kapcsolja ki a fiókok első bejelentkezéskor történő létrehozását, hacsak nem juthat be bárki, akinek Google-fiókja van."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Regisztráljon egy alkalmazást az Entra ID → App registrations alatt (Web átirányítással az alábbi címre). Az „organizations” helyére írja a bérlőazonosítóját, hogy csak a saját szervezete jusson be. A csoportokból származó szerepkörökhöz adja hozzá a groups claimet a Token configuration alatt: ez csoportazonosítókat sorol fel."

