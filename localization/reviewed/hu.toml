[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Azok a csoportok, amelyek tagjai az egyes szerepköröket kapják, soronként egy, név vagy DN szerint. A legmagasabb egyező nyer, és ez minden bejelentkezéskor ellenőrződik. Ha nincs megadva egy sem, az új fiókok a fenti szerepkört kapják, és egy admin később módosítja. Ha a Megtekintő alatt csoportok vannak megadva, csak a felsorolt csoportok tagjai jelentkezhetnek be."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Azok a csoportok, amelyek tagjai az egyes szerepköröket kapják, soronként egy, név vagy DN szerint (vagy ahogy a groups claim felsorolja őket). A legmagasabb egyező nyer, és ez minden bejelentkezéskor ellenőrződik. Ha nincs megadva egy sem, az új fiókok a fenti szerepkört kapják, és egy admin később módosítja. Ha a Megtekintő alatt csoportok vannak megadva, csak a felsorolt csoportok tagjai jelentkezhetnek be."

