[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "A cím, amelyen az emberek és az alkalmazások elérik a Hoardot, ha nem az, amelyen ez a böngésző van: egy fordított proxyé, egy alagúté vagy egy tailnet-név, például https://hoard.example.com. A Hoard által kiadott hivatkozások (a Claude-nak és más alkalmazásoknak, a bejelentkezésben, a tanúsítványán) ezt használják."

