[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
       *[other] Berkas tersebut ada di { $packs } paket.
    } Setiap berkas asli disimpan selama { $days } hari, dan sampai saat itu dapat dikembalikan dari halamannya."""

