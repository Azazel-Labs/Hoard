source = "They have no GLB copy, so they can’t be shown in 3D."
translation = "Model itu tidak punya salinan GLB, jadi tidak dapat ditampilkan dalam 3D."

[messages.server-issues-damaged]
source = "Stored files that are damaged or gone"
translation = "Berkas tersimpan yang rusak atau hilang"

