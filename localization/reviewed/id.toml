[messages.account-people-hint]
source = "Each person can look (search, preview and download), change the library too (add, edit, tag, collect and archive), or be an admin as well (Settings, accounts and maintenance, and deleting for good)."
translation = "Setiap orang dapat melihat (mencari, melihat pratinjau, dan mengunduh), juga mengubah pustaka (menambahkan, mengedit, memberi tag, mengoleksi, dan mengarsipkan), atau sekaligus menjadi admin (Pengaturan, akun, pemeliharaan, dan menghapus permanen)."

