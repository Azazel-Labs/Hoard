[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Saat rilis baru keluar, Hoard dapat memanggil sebuah alamat begitu tidak ada yang berjalan (tidak ada unggahan, pekerjaan, konversi, atau pemeliharaan), sehingga apa pun yang memperbarui container-nya tidak memulai ulang Hoard di tengah unggahan. Hoard mengirim POST dengan rilis dalam body JSON. Ini memerlukan pemeriksaan rilis di atas."

