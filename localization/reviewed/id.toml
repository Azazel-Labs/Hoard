[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grup yang anggotanya mendapat tiap peran, satu per baris, menurut nama atau DN. Yang tertinggi yang cocok berlaku, dan diperiksa setiap kali masuk. Jika tidak ada yang dicantumkan, akun baru mendapat peran di atas dan admin mengubahnya setelahnya. Jika ada grup yang dicantumkan di Dapat melihat, hanya anggota grup yang tercantum yang boleh masuk."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grup yang anggotanya mendapat tiap peran, satu per baris, menurut nama atau DN (atau apa pun yang dicantumkan klaim groups). Yang tertinggi yang cocok berlaku, dan diperiksa setiap kali masuk. Jika tidak ada yang dicantumkan, akun baru mendapat peran di atas dan admin mengubahnya setelahnya. Jika ada grup yang dicantumkan di Dapat melihat, hanya anggota grup yang tercantum yang boleh masuk."

