       *[other] hari
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Sampai saat itu, halaman berkas hasil konversi dapat mengembalikan berkas asli. Tekstur tidak disalin ke dalam model hasil konversi: model merujuk ke berkas gambar di sebelahnya. Berkas .mtl atau .bin milik model tetap ada."

