[messages.auth-open-to-anyone]
source = "Anyone with a { $provider } account can get in. Add viewer groups below, or turn this off and add people yourself."
translation = "Siapa pun yang memiliki akun { $provider } dapat masuk. Tambahkan grup peninjau di bawah, atau matikan ini dan tambahkan orang sendiri."

[messages.auth-own-accounts-still-work]
source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "Akun Hoard sendiri tetap masuk dengan kata sandinya sendiri, jadi direktori atau penyedia yang mati atau salah diatur tidak dapat mengunci Anda di luar."

[messages.auth-people-under]
