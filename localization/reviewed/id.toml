[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite diputar searah jarum jam dan dipangkas. Format ini tidak dapat menyimpan animasi: bingkai dikenali dari nama bernomornya."

