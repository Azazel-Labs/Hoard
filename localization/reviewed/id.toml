translation = "Sprite tidak pernah diputar, bagian yang dipangkas disimpan sebagai margin, dengan animasi dan durasi tiap bingkai."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Ubin tidak pernah diputar atau dipangkas, ditata pada kisi seukuran ubin, dan gambar dibiarkan apa adanya jika sudah berada pada kisi."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Setiap sprite tegak pada seluruh kanvasnya, dalam sel yang semuanya berukuran sama, untuk apa pun yang memotong lembar menjadi kisi."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Format milik Hoard sendiri: halaman apa adanya, sprite diputar ke arah mana pun dan dipangkas, dengan animasi dan durasi tiap bingkai."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite diputar berlawanan arah jarum jam dan dipangkas. Format ini tidak dapat menyimpan animasi: bingkai dikenali dari nama bernomornya."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprite diputar searah jarum jam dan dipangkas, dengan animasi menurut nama, seperti yang dibaca PixiJS dan Phaser."

