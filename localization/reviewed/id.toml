[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Cari berdasarkan isi gambar"

[messages.settings-clip-hint]
source = "Uses OpenAI’s CLIP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Memakai model CLIP dari OpenAI, dijalankan di prosesor server ini: tidak ada yang keluar dari server. Mengaktifkannya akan mengunduh model ({ $size } MB) dari Hugging Face, lalu mempelajari setiap gambar di latar belakang dengan prioritas rendah. Butuh memori 300 sampai 600 MB selagi bekerja atau saat seseorang mencari. Mematikannya akan menghapus model dan menyimpan apa yang sudah dipelajari, untuk lain kali."

