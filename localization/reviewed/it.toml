source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "I gruppi i cui membri ricevono ciascun ruolo, uno per riga, per nome o DN. Vince il più alto che corrisponde, e viene verificato a ogni accesso. Se non ne è elencato nessuno, i nuovi account ricevono il ruolo qui sopra e un amministratore lo cambia in seguito. Con dei gruppi elencati in Può vedere, possono accedere solo i membri di un gruppo elencato."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "I gruppi i cui membri ricevono ciascun ruolo, uno per riga, per nome o DN (o qualunque cosa elenchi l'attestazione dei gruppi). Vince il più alto che corrisponde, e viene verificato a ogni accesso. Se non ne è elencato nessuno, i nuovi account ricevono il ruolo qui sopra e un amministratore lo cambia in seguito. Con dei gruppi elencati in Può vedere, possono accedere solo i membri di un gruppo elencato."

