translation = "Un'altra regola converte già questo formato"

[messages.settings-conv-to]
source = "Convert to"
translation = "Converti in"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Raddrizza i modelli durante la conversione (Y in alto, rivolti verso +Z), come vengono mostrati i modelli del pacchetto"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Converti i file che Hoard conserva in un unico formato, ad esempio tutti gli OBJ e FBX in GLB, così la libreria è uniforme. Il file convertito prende il posto dell'originale, con il suo nome, i tag, le raccolte e i collegamenti. I file nelle cartelle monitorate non vengono mai modificati."

[messages.settings-conversion-cache]
