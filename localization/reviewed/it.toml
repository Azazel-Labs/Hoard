translation = "Impossibile ottenere il modello: { $detail }. Nuovo tentativo ogni ora."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Scrivi ciò che cerchi («roccia muschiosa», «porta fantascientifica», «barile di legno») e le immagini che lo mostrano compaiono accanto ai nomi che contengono quelle parole. «Altri simili» trova cose dello stesso tipo, non solo degli stessi colori."

[messages.settings-conv]
source = "Conversion rules"
translation = "Regole di conversione"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Aggiungi una regola"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
