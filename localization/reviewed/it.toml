[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "L'indirizzo che persone e app usano per raggiungere Hoard, quando non è quello su cui si trova questo browser: quello di un reverse proxy, di un tunnel o un nome della tailnet, come https://hoard.example.com. I link che Hoard fornisce (a Claude e ad altre app, nell'accesso, nel suo certificato) lo usano."

