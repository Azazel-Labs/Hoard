[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Quando esce una nuova versione, Hoard può chiamare un indirizzo appena non succede niente (nessun caricamento, processo, conversione o manutenzione), così ciò che aggiorna il suo container non lo riavvia a metà di un caricamento. Invia una POST con la versione in un corpo JSON. Richiede il controllo delle versioni qui sopra."

