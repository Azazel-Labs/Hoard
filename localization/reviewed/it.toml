translation = "Ora { $name } può accedere."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude e altre app di IA"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Connetti Claude (o qualsiasi app MCP) e potrà cercare e recuperare asset per te, e descrivere e assegnare tag a ciò che Hoard non ha ancora fatto. La prima volta accede a Hoard; tu lo autorizzi qui nel browser."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "L’app Hoard ti fa accedere da sola, quindi non c’è nessuna password. Crea qui sotto un token di accesso per i plugin dei motori e il comando hoard."

[messages.account-change-password]
source = "Change password"
translation = "Cambia password"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Impostazioni → Connettori → Aggiungi connettore personalizzato, incolla l'indirizzo, poi Connetti. Questi si connettono dai server di Anthropic, quindi Hoard deve essere raggiungibile da internet tramite HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Impostazioni → Connettori → Aggiungi connettore personalizzato, incolla l'indirizzo, poi Connetti. Questi si connettono dai server di Anthropic, quindi Hoard deve essere raggiungibile da internet tramite HTTPS (questo indirizzo non lo è: imposta l'Indirizzo pubblico in Impostazioni → Connessione)."

