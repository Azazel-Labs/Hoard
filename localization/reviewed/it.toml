[messages.settings-mode-path]
source = "This program"
translation = "Questo programma"

[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Miniature in movimento per le animazioni"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Ogni animazione riceve anche un breve filmato in loop, riprodotto mentre punti la sua tessera. Occupano circa 40 KB ciascuno e richiedono un po' di tempo per una libreria grande. Disattivandolo vengono eliminati."

[messages.settings-name]
source = "Name"
translation = "Nome"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Come si chiama questo server nella barra superiore, nella scheda del browser e nella pagina di accesso, così con più di un Hoard puoi distinguerli."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "Come si chiama questa libreria nella barra superiore."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Account"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "La tua password, le altre persone che possono accedere e i token di accesso per script e altri programmi."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Aggiunta di pacchetti"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Cosa fa Hoard con un pacchetto quando viene aggiunto, oltre a leggerlo e assegnargli i tag."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Tag con IA"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Un modello di IA dà un nome, descrive e assegna tag ai nuovi pacchetti, oltre alle regole integrate. I suoi tag sono contrassegnati come suggeriti."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Aspetto"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "I temi che questo browser usa quando è chiaro e quando è scuro. Salvati solo in questo browser."

[messages.settings-page-auth]
source = "Authentication"
translation = "Autenticazione"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Come accedono le persone: gli account di Hoard, una directory LDAP, Microsoft Active Directory o un provider OAuth, quanto durano le sessioni e quali gruppi ricevono quale ruolo."

[messages.settings-page-connection]
source = "Connection"
translation = "Connessione"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Come browser e app raggiungono Hoard: l'indirizzo con cui è conosciuto, e HTTPS, che serve ad alcune funzioni del browser."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Download"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Come vengono chiamati i file in ciò che Hoard invia: download, zip, lo strumento hoard e gli assistenti IA. I file nella libreria restano come sono."

[messages.settings-page-general]
source = "General"
translation = "Generali"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Come si chiama questo server, per tutti quelli che lo usano."

[messages.settings-page-general-blurb-desktop]
source = "What this library is called."
translation = "Come si chiama questa libreria."

[messages.settings-page-issues]
source = "Issues"
translation = "Problemi"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Cosa è andato storto aprendo o elaborando i file: archivi che non si sono estratti, file illeggibili, processi non riusciti. Riprovali una volta risolta la causa, oppure ignorali."

[messages.settings-page-library]
source = "Library"
translation = "Libreria"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Cosa c'è in Hoard: quanto è grande, di cosa è fatto, come è cresciuto e quanto bene è taggato. Gli elementi archiviati non vengono contati."

[messages.settings-page-locations]
source = "Library locations"
translation = "Posizioni della libreria"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Le cartelle sul server che contengono la libreria: quelle in cui Hoard conserva i file, e le cartelle di pacchetti che indicizza dove si trovano."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Le cartelle che contengono la libreria: quelle in cui Hoard conserva i file, e le cartelle di pacchetti che indicizza dove si trovano."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Manutenzione"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Backup, controllo dei danni e pulizia. Ne viene eseguita una per tipo alla volta, e puoi lasciare questa pagina mentre sono in corso."

[messages.settings-page-performance]
source = "Performance"
translation = "Prestazioni"

[messages.settings-page-performance-blurb]
