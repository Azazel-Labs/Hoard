source = "No sprite has that in its name."
translation = "Nessuno sprite ha questo nel nome."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite ruotati in senso orario e ritagliati. Non può contenere animazioni: i fotogrammi si riconoscono dai nomi numerati."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Ogni sprite dritto sulla sua tela intera, ciascuno in un PNG con il suo nome."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprite mai ruotati, con il ritaglio conservato come margine, con le animazioni e la durata di ogni fotogramma."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Tile mai ruotati né ritagliati, su una griglia grande quanto il tile, lasciando le immagini come sono se sono già su una griglia."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Ogni sprite dritto sulla sua tela intera, in celle tutte della stessa dimensione, per qualsiasi cosa divida un foglio in una griglia."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Il formato di Hoard: le pagine così come sono, gli sprite ruotati in qualsiasi verso e ritagliati, con le animazioni e la durata di ogni fotogramma."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite ruotati in senso antiorario e ritagliati. Non può contenere animazioni: i fotogrammi si riconoscono dai nomi numerati."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprite ruotati in senso orario e ritagliati, con le animazioni per nome, come le leggono PixiJS e Phaser."

