translation = "Keycloak, Authentik, Authelia, Okta, Zitadel e altri: indica l'issuer e Rileva compila gli indirizzi."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Crea un'app OAuth in GitHub → Settings → Developer settings. GitHub non invia gruppi, quindi assegna i ruoli in Impostazioni → Account, e disattiva la creazione degli account al primo accesso, a meno che debba entrare chiunque abbia un account GitHub."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Crea un'applicazione in GitLab → Preferences → Applications (o nell'area di amministrazione della tua istanza: cambia gitlab.com negli indirizzi)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Crea un client OAuth (Applicazione web) in Google Cloud Console → API e servizi → Credenziali. Google non invia gruppi, quindi assegna i ruoli in Impostazioni → Account, e disattiva la creazione degli account al primo accesso, a meno che debba entrare chiunque abbia un account Google."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registra un'app in Entra ID → Registrazioni app (con un reindirizzamento Web all'indirizzo qui sotto). Metti l'ID del tuo tenant al posto di «organizations» per far entrare solo la tua organizzazione. Per i ruoli dai gruppi, aggiungi l'attestazione dei gruppi in Configurazione token: elenca gli ID dei gruppi."

