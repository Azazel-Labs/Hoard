translation = "Nella libreria non c'è niente da convertire."

[messages.settings-conv-remove]
source = "Remove"
translation = "Rimuovi"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Rimuovi la regola { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Annulla le modifiche"

[messages.settings-conv-rule-on]
source = "On"
