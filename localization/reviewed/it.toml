    }"""
translation = """
{ $count ->
        [one] un file che Blender non ha ancora letto (Impostazioni → Strumenti)
       *[other] { $count } file che Blender non ha ancora letto (Impostazioni → Strumenti)
    }"""

[messages.settings-conv-skip-unity]
