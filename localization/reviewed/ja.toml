[messages.about-downloaded]
source = "Downloaded when needed"
translation = "必要なときにダウンロード"

[messages.about-downloaded-what]
source = "Hoard doesn’t come with these. It downloads each one the first time something needs it, and each comes under its own license."
translation = "これらは Hoard に同梱されていません。初めて必要になったときにそれぞれダウンロードされ、それぞれ独自のライセンスに従います。"

