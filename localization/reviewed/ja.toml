[messages.settings-clip-hint]
source = "Uses Google’s SigLIP 2 model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Google の SigLIP 2 モデルをこのサーバーのプロセッサーで実行するので、外部には何も送られません。オンにすると Hugging Face からモデル（{ $size } MB）をダウンロードし、すべての画像をバックグラウンドで低い優先度で学習します。学習中や検索中は 350～750 MB のメモリを使います。オフにするとモデルは削除されますが、学習した内容は次回のために残ります。"

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Google の SigLIP 2 モデルをこのコンピューターのプロセッサーで実行するので、外部には何も送られません。オンにすると Hugging Face からモデル（{ $size } MB）をダウンロードし、すべての画像をバックグラウンドで低い優先度で学習します。学習中や検索中は 350～750 MB のメモリを使います。オフにするとモデルは削除されますが、学習した内容は次回のために残ります。"

