translation = "各ロールを与えるグループを、1 行に 1 つ、名前または DN で入力します。一致するうち最も高いロールが適用され、サインインのたびに確認されます。何も入力しない場合、新しいアカウントには上のロールが付き、後で管理者が変更します。「閲覧のみ」にグループを入力すると、一覧にあるグループのメンバーだけがサインインできます。"

