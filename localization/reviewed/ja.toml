[messages.settings-page-about]
source = "About"
translation = "このアプリについて"

[messages.settings-page-about-blurb]
source = "What Hoard is, which version this is, and the work of others it’s made with."
translation = "Hoard とは何か、このバージョン、そして Hoard を形作る他の人々の成果。"

[messages.settings-page-account]
source = "Account"
translation = "アカウント"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "あなたのパスワード、サインインできる他のユーザー、スクリプトや他のプログラム用のアクセストークンです。"

[messages.settings-page-adding]
source = "Adding packs"
translation = "パックの追加"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "パックが追加されたとき、読み取りとタグ付けのほかに Hoard が行うことです。"

[messages.settings-page-ai]
source = "AI tagging"
translation = "AI タグ付け"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "組み込みのルールに加えて、AI モデルが新しいパックに名前、説明、タグを付けます。そのタグは提案として示されます。"

[messages.settings-page-appearance]
source = "Appearance"
translation = "外観"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "このブラウザーがライトのときとダークのときに使うテーマです。このブラウザーにだけ保存されます。"

[messages.settings-page-auth]
source = "Authentication"
translation = "認証"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "サインインの方法です。Hoard 独自のアカウント、LDAP ディレクトリ、Microsoft Active Directory、OAuth プロバイダーのほか、セッションの長さと、どのグループにどのロールを与えるかを設定します。"

[messages.settings-page-connection]
source = "Connection"
translation = "接続"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "ブラウザーやアプリが Hoard に接続する方法です。Hoard のアドレスと、ブラウザーの一部の機能に必要な HTTPS を設定します。"

[messages.settings-page-copies]
source = "Near copies"
translation = "ほぼ同じコピー"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "サイズ、サンプルレート、形式だけが違う同じ画像・サウンド・モデルのファイル。容量を多く使っているものから順に表示します。各セットの最良のものに印が付きます。何も削除しません。"

[messages.settings-page-downloads]
source = "Downloads"
translation = "ダウンロード"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hoard が送るもの（ダウンロード、zip、hoard ツール、AI アシスタント）でのファイルの名前の付け方です。ライブラリ内のファイルはそのままです。"

[messages.settings-page-dragon]
source = "Dragon"
translation = "ドラゴン"

[messages.settings-page-dragon-blurb]
source = "Your dragon’s hoard: every asset in the library is a piece of its treasure."
translation = "あなたのドラゴンの宝の山。ライブラリのアセットひとつひとつがその宝です。"

[messages.settings-page-issues]
source = "Issues"
translation = "問題"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "ファイルを開いたり処理したりするときに起きた問題です。展開できなかったアーカイブ、読み取れなかったファイル、失敗したジョブなど。原因を解決してから再試行するか、閉じてください。"

[messages.settings-page-library]
source = "Library"
translation = "ライブラリ"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Hoard に入っているもの: 大きさ、内訳、増え方、タグ付けの状況です。アーカイブしたものは数えません。"

[messages.settings-page-locations]
source = "Library locations"
translation = "ライブラリの保存場所"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "ライブラリを置くサーバー上のフォルダーです。Hoard がファイルを保管するフォルダーと、その場でインデックスするパックのフォルダーがあります。"

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "ライブラリを置くフォルダーです。Hoard がファイルを保管するフォルダーと、その場でインデックスするパックのフォルダーがあります。"

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "メンテナンス"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "バックアップ、破損の確認、整理を行います。それぞれ一度に 1 つずつ実行され、実行中はこのページを離れても構いません。"

[messages.settings-page-performance]
source = "Performance"
translation = "パフォーマンス"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "サーバーの稼働の度合い、サムネイルの作成と保存の方法、受け付ける上限です。"

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Hoard の稼働の度合い、サムネイルの作成と保存の方法、受け付ける上限です。"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "画像を名前だけでなく写っている内容で、サウンドを聞こえ方で検索し、色だけでなく種類の似たものを見つけます。"

[messages.settings-page-search-tab]
source = "Search"
translation = "検索"

[messages.settings-page-store-files]
source = "Store files"
translation = "ストアファイル"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "ストアがアートの横に置くファイルで、Hoard はこれを読んでパックに名前を付け、作者をクレジットします。知らないファイルを教えたり、教えた内容を共有したりできます。"

[messages.settings-page-tags]
source = "Tags"
translation = "タグ"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "ライブラリのすべてのタグです。同じ意味のものを統合したり、名前を変更したりできます。以後、タグ付けでは新しい名前が使われます。"

[messages.settings-page-tools]
source = "Tools"
translation = "ツール"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Hoard がファイルの変換と読み取りに使う外部プログラムです。"

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
translation = """
確認できるように{ $preview ->
        [light] ライト
       *[dark] ダーク
    }テーマを表示しています。使用中のテーマは{ $used ->
        [light] ライト
       *[dark] ダーク
    }{ $system ->
        [yes] （システムに合わせる）
       *[other] { "" }
    }で、このページを離れると元に戻ります。"""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
{ $used ->
        [light] ライト
       *[dark] ダーク
    }に戻す"""

[messages.settings-previews-size]
source = "Previews take { $size } now."
translation = "現在、プレビューは { $size } を使用しています。"

[messages.settings-public-url]
source = "Public address"
translation = "公開アドレス"

[messages.settings-public-url-default]
source = "from the browser’s address"
translation = "ブラウザーのアドレスから"

[messages.settings-public-url-placeholder]
source = "From the browser’s address (e.g. https://hoard.example.com)"
translation = "ブラウザーのアドレスから（例: https://hoard.example.com）"

[messages.settings-render]
source = "3D thumbnails"
translation = "3D サムネイル"

[messages.settings-render-toggle]
source = "Render thumbnails for 3D models"
translation = "3D モデルのサムネイルをレンダリングする"

[messages.settings-save]
source = "Save"
translation = "保存"

[messages.settings-soundfont]
source = "MIDI SoundFont"
translation = "MIDI SoundFont"

[messages.settings-soundfont-default]
source = "found on the server, or built-in"
translation = "サーバー上で見つかったもの、または組み込み"

[messages.settings-soundfont-default-desktop]
source = "found on this computer, or built-in"
translation = "このコンピューターで見つかったもの、または組み込み"

[messages.settings-soundfont-file]
source = "SoundFont file"
translation = "SoundFont ファイル"

[messages.settings-soundfont-placeholder]
source = "Found on the server, or built-in"
translation = "サーバー上で見つかったもの、または組み込み"

[messages.settings-soundfont-placeholder-desktop]
source = "Found on this computer, or built-in"
translation = "このコンピューターで見つかったもの、または組み込み"

[messages.settings-soundfont-send]
source = "Choose a file…"
translation = "ファイルを選ぶ…"

[messages.settings-soundfont-sent]
source = "MIDI plays with { $name } now"
translation = "MIDI は { $name } で再生されるようになりました"

[messages.settings-soundfont-what]
source = "The instruments MIDI files are played and converted with."
translation = "MIDI ファイルの再生と変換に使う楽器です。"

[messages.settings-status-off]
source = "Off"
translation = "オフ"

[messages.settings-store-lookup]
source = "Look up store pages automatically"
translation = "ストアページを自動で検索する"

[messages.settings-store-pages]
source = "Store pages"
translation = "ストアページ"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "新しいパックはバックグラウンドでストアから検索され、ストアページ、販売者、ライセンスが設定されます。"

[messages.settings-the-default]
source = "the default"
translation = "既定値"

[messages.settings-themes]
source = "Themes"
translation = "テーマ"

[messages.settings-thumbs]
source = "Thumbnails"
translation = "サムネイル"

[messages.settings-thumbs-avif]
source = "Send thumbnails as AVIF"
translation = "サムネイルを AVIF で送る"

[messages.settings-thumbs-avif-what]
source = "Browsers that show AVIF get smaller thumbnails, often less than half the size. Each is made from the stored thumbnail the first time it’s shown and kept with the conversions; until then the stored one is sent. Making them keeps up to two cores busy while a big library is first browsed. Lossless thumbnails and pixel art are sent as they are."
translation = "AVIF を表示できるブラウザには、より小さい（多くは半分以下の）サムネイルが送られます。各サムネイルは初めて表示されたときに保存済みのサムネイルから作られ、変換と一緒に保管されます。それまでは保存済みのものが送られます。大きなライブラリを初めて閲覧する間、作成のために最大 2 コアが使われます。ロスレスのサムネイルとピクセルアートはそのまま送られます。"

[messages.settings-thumbs-balanced]
source = "Balanced"
translation = "バランス"

[messages.settings-thumbs-balanced-hint]
source = "JPEG, quality 82. Hard to tell from the original at thumbnail size."
translation = "JPEG、品質 82。サムネイルのサイズでは元の画像と見分けにくい品質です。"

[messages.settings-thumbs-lossless]
source = "Lossless"
translation = "ロスレス"

[messages.settings-thumbs-lossless-hint]
source = "PNG, exactly as made. Several times larger."
translation = "PNG、作成したそのまま。数倍大きくなります。"

[messages.settings-thumbs-saved]
source = "Thumbnails: { $quality }"
translation = "サムネイル: { $quality }"

[messages.settings-thumbs-sharp]
source = "Sharper"
translation = "鮮明"

[messages.settings-thumbs-sharp-hint]
source = "JPEG, quality 92. About twice the size of Balanced."
translation = "JPEG、品質 92。「バランス」の約 2 倍のサイズです。"

[messages.settings-thumbs-small]
source = "Smaller"
translation = "小さめ"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG、品質 70。グリッドでは十分ですが、近くで見ると少しぼやけます。"

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "新しいサムネイルとモデルビューの保存方法です。透明部分があるものとピクセルアートは常に PNG です。既存のものを縮小するには、メンテナンスで「サムネイルを縮小」を実行してください。"

[messages.settings-title]
source = "Settings"
translation = "設定"

[messages.settings-tn]
source = "Texture names"
translation = "テクスチャ名"

[messages.settings-tn-custom]
source = "Your own"
translation = "独自"

[messages.settings-tn-descriptive]
source = "Descriptive"
translation = "説明的"

[messages.settings-tn-ending-add]
source = "Add an ending"
translation = "末尾を追加"

[messages.settings-tn-ending-from]
source = "Ending"
translation = "末尾"

[messages.settings-tn-ending-from-example]
source = "_diff"
translation = "_diff"

[messages.settings-tn-ending-remove]
source = "Remove"
translation = "削除"

[messages.settings-tn-ending-remove-label]
source = "Remove { $ending }"
translation = "{ $ending } を削除"

[messages.settings-tn-ending-to]
source = "Swap for"
translation = "置き換え先"

[messages.settings-tn-ending-to-example]
source = "_BC"
translation = "_BC"

[messages.settings-tn-endings]
source = "Endings of your own"
translation = "独自の末尾"

[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "マテリアルのマップではないテクスチャは元の名前のままですが、次のいずれかで終わる場合は別です。_diff → _BC なら rock_diff.png は rock_BC.png として送られます。2 つ目を空欄にすると、その末尾を取り除きます。"

[messages.settings-tn-example]
source = "Example"
translation = "例"

[messages.settings-tn-hint-map]
source = '{ " " }what the map is for,{ " " }'
translation = '{ " " }はマップの用途、{ " " }'

[messages.settings-tn-hint-name]
source = '{ " " }the material,{ " " }'
translation = '{ " " }はマテリアル、{ " " }'

[messages.settings-tn-hint-size]
source = '{ " " }its size when the set comes in more than one (added on the end if the pattern leaves it out).'
translation = '{ " " }はセットに複数のサイズがある場合のサイズです（パターンにない場合は末尾に追加されます）。'

[messages.settings-tn-pattern]
source = "Pattern"
translation = "パターン"

[messages.settings-tn-reset]
source = "Texture names: back to the default"
translation = "テクスチャ名: 既定値に戻す"

[messages.settings-tn-saved]
source = "Texture names saved"
translation = "テクスチャ名を保存しました"

[messages.settings-tn-short]
source = "Short"
translation = "短い"

[messages.settings-tn-slots]
source = "In GLB downloads, a texture packed inside a model with no file of its own is named after the material and the slot it fills, and these slots have suffixes too:"
translation = "GLB のダウンロードでは、独自のファイルがなくモデル内に格納されたテクスチャは、マテリアルとそれが埋めるスロットにちなんだ名前になります。これらのスロットにもサフィックスがあります:"

[messages.settings-tn-style]
source = "Style"
translation = "スタイル"

[messages.settings-tn-style-group]
source = "Naming style"
translation = "命名スタイル"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "マップの種類ごとのサフィックス"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "テクスチャマップにマテリアルにちなんだ名前を付ける"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "ファイルの名前にかかわらず、マテリアルのマップはマテリアル名と各マップの用途にちなんだ名前で送られます。rock_moss_xeokah0_raw_8K_Normal.png ではなく Rock_Normal.png のようになります。ライブラリ内のファイルには手を付けません。また、一緒に送るモデルや MTL が名前を指定しているマップは、その名前のままにするので、モデルは引き続きマップを見つけられます。"

[messages.settings-tool-downloading]
source = "Downloading… progress is in the activity indicator"
translation = "ダウンロード中… 進行状況はアクティビティインジケーターに表示されます"

[messages.settings-tool-looking]
source = "Looking…"
translation = "検索中…"

[messages.settings-tool-no-download]
source = "Uses an installed { $tool }. There’s no build to download for this machine, so install it or give its path."
translation = "インストール済みの { $tool } を使います。このマシン用のダウンロードできるビルドはないため、インストールするかパスを指定してください。"

[messages.settings-tool-path]
source = "{ $tool } program path"
translation = "{ $tool } のプログラムのパス"

[messages.settings-tool-ready]
source = "Ready: { $detail }"
translation = "準備完了: { $detail }"

[messages.settings-tool-reset]
source = "{ $tool }: back to the default"
translation = "{ $tool }: 既定値に戻す"

[messages.settings-unreal]
source = "Unreal packages"
translation = "Unreal パッケージ"

[messages.settings-unreal-download]
source = "Downloads Epic’s Linux x86-64 editor. Requires linked GitHub access and tens of GB of disk space."
translation = "Epic の Linux x86-64 エディターをダウンロードします。連携済みの GitHub アクセス権と数十 GB のディスク容量が必要です。"

[messages.settings-unreal-editor-what]
source = "Installs Unreal Editor for the export worker. Run the worker separately to export assets."
translation = "エクスポートワーカー用に Unreal Editor をインストールします。アセットをエクスポートするにはワーカーを別途実行してください。"

[messages.settings-unreal-image]
source = "Unreal version or image"
translation = "Unreal のバージョンまたはイメージ"

[messages.settings-unreal-keep]
source = "Convert, keep originals"
translation = "変換して元のファイルを残す"

[messages.settings-unreal-keep-hint]
source = "Textures, sounds and materials come out in common formats; the .uasset stays too."
translation = "テクスチャ、サウンド、マテリアルが一般的なフォーマットで取り出され、.uasset も残ります。"

[messages.settings-unreal-off]
source = "Leave as is"
translation = "そのままにする"

[messages.settings-unreal-off-hint]
source = "Convert from a pack’s page when you want to."
translation = "必要なときにパックのページから変換します。"

[messages.settings-unreal-replace]
source = "Convert, drop originals"
translation = "変換して元のファイルを破棄"

[messages.settings-unreal-replace-hint]
source = "Saves space once the content is out. Meshes still wait for the Unreal worker."
translation = "中身を取り出したら容量を節約します。メッシュは引き続き Unreal ワーカーを待ちます。"

[messages.settings-unreal-reset]
source = "Unreal packages: back to the default"
translation = "Unreal パッケージ: 既定値に戻す"

[messages.settings-unreal-what]
source = "What to do with .uasset files."
translation = ".uasset ファイルの扱い方です。"

[messages.settings-update-check]
source = "Check GitHub every few hours for a new release"
translation = "数時間ごとに GitHub で新しいリリースを確認する"

[messages.settings-updates]
source = "Updates"
translation = "更新"

[messages.settings-use]
source = "Use"
translation = "使用"

[messages.settings-version]
source = "This is Hoard { $version }."
translation = "これは Hoard { $version } です。"

[messages.settings-workers]
source = "Background workers"
translation = "バックグラウンドワーカー"

[messages.settings-workers-unit]
source = "jobs at once (ingest, tagging, conversions)"
translation = "件のジョブを同時に実行（取り込み、タグ付け、変換）"

[messages.setup-lede]
source = "Pick a folder on the server for Hoard to keep your packs in, or point it at a folder of packs you already have. You can add more locations, on other disks, from Settings later."
translation = "Hoard がパックを保存するサーバー上のフォルダーを選ぶか、すでにあるパックのフォルダーを指定してください。ほかのディスクの保存場所は、後で設定から追加できます。"

[messages.setup-lede-desktop]
source = "Pick a folder for Hoard to keep your packs in, or point it at a folder of packs you already have. You can add more locations, on other disks, from Settings later."
translation = "Hoard がパックを保存するフォルダーを選ぶか、すでにあるパックのフォルダーを指定してください。ほかのディスクの保存場所は、後で設定から追加できます。"

[messages.setup-loading]
