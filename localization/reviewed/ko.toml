translation = 'files가 비어 있습니다. ["*.json"]처럼 이 형식이 읽을 파일을 지정하세요'

[messages.error-format-no-name]
source = "name is empty"
translation = "name이 비어 있습니다"

[messages.error-format-not-a-filter]
source = "[{ $filter }] isn't a filter: use [], [key=value|other], [array], [string], [number], [bool] or [object]"
translation = "[{ $filter }]은(는) 필터가 아닙니다. [], [key=value|other], [array], [string], [number], [bool], [object] 중 하나를 사용하세요"

[messages.error-format-not-found]
source = "format { $file } not found"
translation = "형식 { $file }을(를) 찾을 수 없습니다"

[messages.error-format-too-long]
source = "the format is too long"
translation = "형식이 너무 깁니다"

[messages.error-format-unclosed-bracket]
source = "a bracket isn't closed"
translation = "괄호가 닫히지 않았습니다"

[messages.error-format-unclosed-except]
source = "!( isn't closed"
translation = "!( 이(가) 닫히지 않았습니다"

[messages.error-format-unclosed-filter]
source = "[ isn't closed"
translation = "[ 이(가) 닫히지 않았습니다"

[messages.error-format-unopened-bracket]
source = "a closing bracket without an opening one"
translation = "여는 괄호 없이 닫는 괄호가 있습니다"

[messages.error-frame-sheet-aseprite-only]
source = "only Aseprite files have a frame sheet"
translation = "프레임 시트는 Aseprite 파일에만 있습니다"

[messages.error-frame-sheet-frames]
source = "this has one frame, or too many to lay out"
translation = "프레임이 하나뿐이거나 너무 많아서 배치할 수 없습니다"

[messages.error-full-path]
source = "give a full path"
translation = "전체 경로를 입력하세요"

[messages.error-https-bad-name]
source = "“{ $name }” isn't an address a certificate can hold"
translation = "“{ $name }”은(는) 인증서에 넣을 수 있는 주소가 아닙니다"

[messages.error-https-cert-not-pem]
source = "The certificate isn't valid PEM"
translation = "인증서가 올바른 PEM이 아닙니다"

[messages.error-https-certificate-mode]
source = "A certificate goes with “My certificate”"
translation = "인증서는 “내 인증서”와 함께 사용합니다"

[messages.error-https-expired]
source = "This certificate expired on { $date }"
translation = "이 인증서는 { $date }에 만료되었습니다"

[messages.error-https-key-mismatch]
source = "The key doesn't belong to the certificate. If you gave a chain, put your server's certificate first"
translation = "키가 인증서와 짝이 맞지 않습니다. 체인을 넣었다면 서버 인증서를 맨 앞에 두세요"

[messages.error-https-key-not-pem]
source = "The private key isn't valid PEM"
translation = "개인 키가 올바른 PEM이 아닙니다"

[messages.error-https-key-password]
source = "The key is protected with a password: give it without one (openssl pkey -in key.pem -out plain.pem)"
translation = "키가 비밀번호로 보호되어 있습니다. 비밀번호가 없는 키를 주세요(openssl pkey -in key.pem -out plain.pem)"

[messages.error-https-no-ca]
source = "Hoard hasn't made its certificate authority yet"
translation = "Hoard가 아직 인증 기관을 만들지 않았습니다"

[messages.error-https-no-cert-found]
source = "No certificate found: paste the text that starts with -----BEGIN CERTIFICATE-----"
translation = "인증서를 찾을 수 없습니다. -----BEGIN CERTIFICATE-----로 시작하는 텍스트를 붙여 넣으세요"

[messages.error-https-no-certificate]
source = "Paste or upload your certificate and its key first"
translation = "먼저 인증서와 키를 붙여 넣거나 업로드하세요"

[messages.error-https-no-key-found]
source = "No private key found: paste the text that starts with -----BEGIN PRIVATE KEY-----"
translation = "개인 키를 찾을 수 없습니다. -----BEGIN PRIVATE KEY-----로 시작하는 텍스트를 붙여 넣으세요"

[messages.error-https-not-yet-valid]
source = "This certificate isn't valid until { $date }"
translation = "이 인증서는 { $date }부터 유효합니다"

[messages.error-https-several-keys]
source = "There's more than one private key: paste only the one that goes with the certificate"
translation = "개인 키가 둘 이상 있습니다. 인증서와 짝이 맞는 키 하나만 붙여 넣으세요"

[messages.error-https-test]
source = "The certificate didn't work in a test connection: { $reason }"
translation = "테스트 연결에서 인증서가 작동하지 않았습니다: { $reason }"

[messages.error-https-test-failed]
source = "the test connection failed"
translation = "테스트 연결에 실패했습니다"

[messages.error-https-test-timed-out]
source = "the test connection timed out"
translation = "테스트 연결 시간이 초과되었습니다"

[messages.error-https-unavailable]
source = "HTTPS isn't available on this server"
translation = "이 서버에서는 HTTPS를 사용할 수 없습니다"

[messages.error-https-unreadable]
source = "That isn't a certificate Hoard can read"
translation = "Hoard가 읽을 수 있는 인증서가 아닙니다"

[messages.error-https-unusable]
source = "The certificate or key can't be used"
translation = "인증서나 키를 사용할 수 없습니다"

[messages.error-keep-catch-all]
source = "make another location the catch-all instead"
translation = "대신 다른 위치를 기본 위치로 지정하세요"

[messages.error-ldap-base-dn]
source = "Say where people's entries are (the base DN)"
translation = "사용자 항목이 있는 위치(base DN)를 지정하세요"

[messages.error-ldap-bind-dn]
source = "Give the account that looks people up, or look them up anonymously"
translation = "사용자를 조회할 계정을 지정하거나 익명으로 조회하세요"

[messages.error-ldap-bind-failed]
source = "the account that looks people up couldn't sign in ({ $reason })"
translation = "사용자를 조회하는 계정이 로그인하지 못했습니다({ $reason })"

[messages.error-ldap-ca-cert]
source = "The certificate authority isn't a PEM certificate (-----BEGIN CERTIFICATE-----)"
translation = "인증 기관이 PEM 인증서(-----BEGIN CERTIFICATE-----)가 아닙니다"

[messages.error-ldap-empty-server]
source = "A directory server's address is empty"
translation = "디렉터리 서버의 주소가 비어 있습니다"

[messages.error-ldap-group-search]
source = "looking for { $name }'s groups under { $base }"
translation = "{ $base } 아래에서 { $name }의 그룹 찾는 중"

[messages.error-ldap-no-anonymous]
source = "the directory doesn't allow looking people up anonymously ({ $reason })"
translation = "디렉터리에서 익명 조회를 허용하지 않습니다({ $reason })"

[messages.error-ldap-no-certificate]
source = "no certificate in it"
translation = "인증서가 들어 있지 않습니다"

[messages.error-ldap-no-server]
source = "Add the directory server's address"
translation = "디렉터리 서버의 주소를 추가하세요"

[messages.error-ldap-not-starttls]
source = "{ $server }: that's LDAPS, not StartTLS"
translation = "{ $server }: StartTLS가 아니라 LDAPS입니다"

[messages.error-ldap-password-again]
source = "Give the password of the account that looks people up again: the saved one is only sent to the servers it was given for"
translation = "사용자를 조회하는 계정의 비밀번호를 다시 입력하세요. 저장된 비밀번호는 원래 지정된 서버에만 보냅니다"

[messages.error-ldap-password-check]
source = "the directory wouldn't check { $name }'s password ({ $reason })"
translation = "디렉터리가 { $name }의 비밀번호를 확인하지 않았습니다({ $reason })"

[messages.error-ldap-search]
source = "looking for { $name } under { $base }"
translation = "{ $base } 아래에서 { $name } 찾는 중"

[messages.error-ldap-server-form]
source = "{ $server }: a directory server's address is host:port, ldap://… or ldaps://…"
translation = "{ $server }: 디렉터리 서버의 주소는 host:port, ldap://… 또는 ldaps://… 형태입니다"

[messages.error-ldap-settings]
source = "bad LDAP settings: { $reason }"
translation = "잘못된 LDAP 설정: { $reason }"

[messages.error-ldap-several]
source = "{ $count } entries in the directory match { $name }: narrow the user filter"
translation = "디렉터리에서 { $name }과(와) 일치하는 항목이 { $count }개입니다. 사용자 필터를 좁히세요"

[messages.error-ldap-unreachable]
source = "no directory server could be reached ({ $reasons })"
translation = "연결할 수 있는 디렉터리 서버가 없습니다({ $reasons })"

[messages.error-ldap-username-attribute]
source = "Say which attribute holds the name people sign in with"
translation = "로그인에 쓰는 이름이 들어 있는 속성을 지정하세요"

[messages.error-ldap-wrong-password]
source = "The directory doesn't know { $name } with that password"
translation = "디렉터리에 그 비밀번호를 쓰는 { $name }이(가) 없습니다"

[messages.error-light-preview-images]
source = "only images have a light preview"
translation = "가벼운 미리보기는 이미지에만 있습니다"

[messages.error-limits-zero]
source = "Limits can't be zero"
translation = "한도는 0일 수 없습니다"

[messages.error-local-llm-action]
source = "action is list, download or delete, and the last two need a model"
translation = "action은 list, download, delete 중 하나이며, 뒤의 두 가지에는 모델이 필요합니다"

[messages.error-location-holds-files]
source = "{ $name } still holds files: move them to the other locations first (POST /api/admin/locations/{ $id }/empty)"
translation = "{ $name }에 아직 파일이 있습니다. 먼저 다른 위치로 옮기세요(POST /api/admin/locations/{ $id }/empty)"

[messages.error-location-not-found]
source = "location { $id } not found"
translation = "위치 { $id }을(를) 찾을 수 없습니다"

[messages.error-location-unreachable]
source = "{ $name } can't be reached, so Hoard can't tell whether it still holds files"
translation = "{ $name }에 연결할 수 없어서 Hoard가 아직 파일이 있는지 알 수 없습니다"

[messages.error-maintenance-task-not-found]
source = "maintenance task { $id } not found"
translation = "유지 관리 작업 { $id }을(를) 찾을 수 없습니다"

[messages.error-max-size]
source = "max must be a power of two from 64 to 16384"
translation = "max는 64에서 16384 사이의 2의 거듭제곱이어야 합니다"

[messages.error-merge-into-tag]
source = "into must be a tag"
translation = "into는 태그여야 합니다"

[messages.error-model-delete]
source = "couldn't delete { $model }: { $reason }"
translation = "{ $model }을(를) 삭제할 수 없습니다: { $reason }"

[messages.error-model-download]
source = "couldn't download { $model }: { $reason }"
translation = "{ $model }을(를) 다운로드할 수 없습니다: { $reason }"

[messages.error-model-server-refused]
source = "the model server: { $reason }"
translation = "모델 서버: { $reason }"

[messages.error-no-frame-sheet]
source = "no frame sheet: { $reason }"
translation = "프레임 시트 없음: { $reason }"

[messages.error-no-library]
source = "there's no library location to store files in yet: add a managed one in Settings → Library locations"
translation = "아직 파일을 저장할 라이브러리 위치가 없습니다. 설정 → 라이브러리 위치에서 관리 위치를 추가하세요"

[messages.error-no-light-preview]
source = "no light preview: { $reason }"
translation = "가벼운 미리보기 없음: { $reason }"

[messages.error-no-model-server]
source = "no model server answers at { $url }"
translation = "{ $url }에서 응답하는 모델 서버가 없습니다"

[messages.error-no-other-location]
source = "there's no other library location to move the files to: add one first"
translation = "파일을 옮길 다른 라이브러리 위치가 없습니다. 먼저 하나 추가하세요"

[messages.error-no-soundfont]
source = "There's no SoundFont at { $path } on the server"
translation = "서버의 { $path }에 SoundFont가 없습니다"

[messages.error-not-a-hash]
source = "not a blake3 hex hash"
translation = "blake3 16진수 해시가 아닙니다"

[messages.error-not-a-picture]
source = "not a picture Hoard can read: { $reason }"
translation = "Hoard가 읽을 수 있는 그림이 아닙니다: { $reason }"

[messages.error-not-format-file]
source = "not a format's file: { $name }"
translation = "형식 파일이 아닙니다: { $name }"

[messages.error-not-from-portal]
source = "this request didn't come from the Hoard portal"
translation = "이 요청은 Hoard 포털에서 온 것이 아닙니다"

[messages.error-not-llama-router]
source = "{ $url } isn't a llama.cpp server in router mode, so it can't download models"
translation = "{ $url }은(는) 라우터 모드의 llama.cpp 서버가 아니어서 모델을 다운로드할 수 없습니다"

[messages.error-not-started]
source = "the server hasn't started"
translation = "서버가 시작되지 않았습니다"

[messages.error-not-watched]
source = "{ $name } isn't a watched folder"
translation = "{ $name }은(는) 감시 폴더가 아닙니다"

[messages.error-nothing-to-merge]
source = "nothing to merge"
translation = "병합할 것이 없습니다"

[messages.error-nothing-to-retry]
source = "nothing there can be retried"
translation = "다시 시도할 수 있는 항목이 없습니다"

[messages.error-oauth-addresses]
source = "The authorization and token addresses should start with https://"
translation = "인증 주소와 토큰 주소는 https://로 시작해야 합니다"

[messages.error-oauth-bad-authorization-address]
source = "the authorization address isn't valid"
translation = "인증 주소가 올바르지 않습니다"

[messages.error-oauth-client-id]
source = "Give the client ID the provider made for Hoard"
translation = "제공자가 Hoard용으로 만든 클라이언트 ID를 입력하세요"

[messages.error-oauth-discovery-bad]
source = "{ $url } isn't a discovery document"
translation = "{ $url }은(는) 디스커버리 문서가 아닙니다"

[messages.error-oauth-discovery-incomplete]
source = "{ $url } doesn't name the authorization and token addresses"
translation = "{ $url }에 인증 주소와 토큰 주소가 없습니다"

[messages.error-oauth-discovery-status]
source = "{ $url } answered { $status }"
translation = "{ $url } 응답: { $status }"

[messages.error-oauth-discovery-unreachable]
source = "Couldn't reach { $url }: { $reason }"
translation = "{ $url }에 연결할 수 없습니다: { $reason }"

[messages.error-oauth-expired]
source = "That sign-in took too long or was started elsewhere: try again"
translation = "로그인이 너무 오래 걸렸거나 다른 곳에서 시작되었습니다. 다시 시도하세요"

[messages.error-oauth-issuer]
source = "The issuer should start with https://"
translation = "발급자는 https://로 시작해야 합니다"

[messages.error-oauth-no-access-token]
source = "the provider sent no access token"
translation = "제공자가 액세스 토큰을 보내지 않았습니다"

[messages.error-oauth-no-claim]
source = "The provider didn't say who you are (no { $claim } claim)"
translation = "제공자가 사용자가 누구인지 알려 주지 않았습니다({ $claim } 클레임 없음)"

[messages.error-oauth-no-client-id]
source = "This link has no client_id."
translation = "이 링크에 client_id가 없습니다."

[messages.error-oauth-no-code]
source = "The provider sent you back without a sign-in"
translation = "제공자가 로그인 없이 돌려보냈습니다"

[messages.error-oauth-no-sub]
source = "The provider didn't say who you are (no sub or id claim)"
translation = "제공자가 사용자가 누구인지 알려 주지 않았습니다(sub 또는 id 클레임 없음)"

[messages.error-oauth-off]
source = "Signing in with OAuth isn't turned on"
translation = "OAuth 로그인이 켜져 있지 않습니다"

[messages.error-oauth-pkce]
source = "The app has to use PKCE with S256 to sign in to Hoard."
translation = "Hoard에 로그인하려면 앱이 S256 방식의 PKCE를 사용해야 합니다."

[messages.error-oauth-redirect]
source = "The app asked to be sent back to an address it didn't register."
translation = "앱이 등록하지 않은 주소로 돌려보내 달라고 요청했습니다."

[messages.error-oauth-refused]
source = "The provider didn't sign you in: { $reason }"
translation = "제공자가 로그인시켜 주지 않았습니다: { $reason }"

[messages.error-oauth-response-type]
source = "Hoard only hands out sign-in codes (response_type=code)."
translation = "Hoard는 로그인 코드만 발급합니다(response_type=code)."

[messages.error-oauth-secret-again]
source = "Give the client secret again: the saved one is only sent to the token address it was given for"
translation = "클라이언트 시크릿을 다시 입력하세요. 저장된 시크릿은 원래 지정된 토큰 주소에만 보냅니다"

[messages.error-oauth-token-refused]
source = "The provider wouldn't finish the sign-in: { $reason }"
translation = "제공자가 로그인을 마치지 않았습니다: { $reason }"

[messages.error-oauth-token-unreachable]
source = "couldn't reach the provider's token address"
translation = "제공자의 토큰 주소에 연결할 수 없습니다"

[messages.error-oauth-unknown-app]
source = "This app isn't registered here (any more). Start connecting again from the app."
translation = "이 앱은 여기에 등록되어 있지 않습니다(더 이상). 앱에서 연결을 다시 시작하세요."

[messages.error-oauth-userinfo-address]
source = "The user info address should start with https://"
translation = "사용자 정보 주소는 https://로 시작해야 합니다"

[messages.error-oauth-userinfo-not-json]
source = "the provider's user info isn't JSON"
translation = "제공자의 사용자 정보가 JSON이 아닙니다"

[messages.error-oauth-userinfo-refused]
source = "The provider wouldn't say who signed in ({ $status })"
translation = "제공자가 로그인한 사람이 누구인지 알려 주지 않았습니다({ $status })"

[messages.error-oauth-userinfo-unreachable]
source = "couldn't reach the provider's user info address"
translation = "제공자의 사용자 정보 주소에 연결할 수 없습니다"

[messages.error-oauth-username-claim]
source = "Say which claim holds the person's name"
translation = "사용자 이름이 들어 있는 클레임을 지정하세요"

[messages.error-only-images-resize]
