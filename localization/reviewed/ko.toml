translation = "[{ $filter }]에는 키와 값이 필요합니다"

[messages.error-format-miss-name]
source = "the format's files don't take { $file }"
translation = "이 형식의 파일은 { $file }을(를) 받지 않습니다"

[messages.error-format-miss-store]
