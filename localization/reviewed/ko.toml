[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "새 릴리스가 나오면 Hoard는 진행 중인 작업(업로드, 작업, 변환, 유지 관리)이 없을 때 주소를 호출할 수 있습니다. 그래서 컨테이너를 업데이트하는 도구가 업로드 도중에 Hoard를 다시 시작하지 않습니다. 릴리스 정보를 JSON 본문에 담아 POST로 보냅니다. 위의 릴리스 확인이 켜져 있어야 합니다."

