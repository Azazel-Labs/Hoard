       *[dark] 어두운
    } 테마를 사용 중이며{ $system ->
        [yes] { " " }(시스템 설정을 따름)
       *[other] { "" }
    }, 이 페이지를 나가면 원래대로 돌아옵니다."""

[messages.settings-preview-back]
