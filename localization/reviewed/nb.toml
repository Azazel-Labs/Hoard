source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Lag en OAuth-app i GitHub → Settings → Developer settings. GitHub sender ingen grupper, så gi roller under Innstillinger → Konto, og slå av opprettelse av kontoer ved første pålogging med mindre alle med en GitHub-konto skal slippe inn."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Lag en applikasjon i GitLab → Preferences → Applications (eller i administrasjonsområdet til din egen instans: bytt ut gitlab.com i adressene)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Lag en OAuth-klient (Web application) i Google Cloud Console → APIs & Services → Credentials. Google sender ingen grupper, så gi roller under Innstillinger → Konto, og slå av opprettelse av kontoer ved første pålogging med mindre alle med en Google-konto skal slippe inn."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registrer en app i Entra ID → App registrations (med en Web-omdirigering til adressen nedenfor). Sett tenant-ID-en din i stedet for «organizations» for å bare slippe inn din egen organisasjon. For roller fra grupper legger du til groups-kravet under Token configuration: det viser gruppe-ID-er."

