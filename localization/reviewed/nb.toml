[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Når en ny versjon er ute, kan Hoard kalle en adresse så snart ingenting pågår (ingen opplastinger, jobber, konverteringer eller vedlikehold), slik at det som oppdaterer containeren, ikke starter den på nytt midt i en opplasting. Den sender en POST med versjonen i en JSON-kropp. Dette krever versjonssjekken ovenfor."

