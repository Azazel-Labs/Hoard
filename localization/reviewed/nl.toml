translation = "Conversieregels"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Een regel toevoegen"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Het staat in één pakket.
       *[other] Ze staan in { $packs } pakketten.
    } Elk origineel wordt { $days } dagen bewaard, en tot dan kan het vanaf zijn pagina worden teruggezet."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Eén staat in een pakket dat nog wordt toegevoegd; het wordt geconverteerd zodra dat klaar is.
       *[other] { $count } staan in pakketten die nog worden toegevoegd; ze worden geconverteerd zodra dat klaar is.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Het converteren
       *[other] { $count } bestanden converteren
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Bestanden die zouden worden geconverteerd"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…en nog { $count }"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Opslaan, alleen nieuwe pakketten"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Opslaan en het converteren
       *[other] Opslaan en { $count } bestanden converteren
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Blijven zoals ze zijn:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
        [one] Eén bestand converteren dat al in de bibliotheek staat?
       *[other] { $count } bestanden converteren die al in de bibliotheek staan?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
        [one] Eén bestand wordt op de achtergrond geconverteerd
       *[other] { $count } bestanden worden op de achtergrond geconverteerd
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Bestanden converteren die al in de bibliotheek staan"

[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "Het geluid blijft precies hetzelfde, in ongeveer de helft van de ruimte, en al het andere in de WAV (looppunten, cuemarkeringen, tags) wordt in de FLAC bewaard, zodat de WAV op elk moment precies zoals hij was kan worden teruggezet. WAV’s met floating-point- of 32-bits-samples blijven WAV."

[messages.settings-conv-from]
source = "From"
translation = "Van"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Originelen bewaren gedurende"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] dag
       *[other] dagen
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Tot dan kan de pagina van een geconverteerd bestand het origineel terugzetten. Texturen worden niet in een geconverteerd model gekopieerd: het verwijst naar de afbeeldingsbestanden ernaast. De .mtl- of .bin-bestanden van een model blijven staan."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "Niets in de bibliotheek hoeft te worden geconverteerd."

[messages.settings-conv-remove]
source = "Remove"
translation = "Verwijderen"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Regel { $n } verwijderen"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Wijzigingen ongedaan maken"

[messages.settings-conv-rule-on]
source = "On"
translation = "Aan"

[messages.settings-conv-save]
source = "Save rules"
translation = "Regels opslaan"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Conversieregels opgeslagen. Ze gelden voor pakketten die vanaf nu worden toegevoegd."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] één bestand waarvan de geconverteerde kopie al in zijn pakket staat
       *[other] { $count } bestanden waarvan de geconverteerde kopieën al in hun pakketten staan
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] één bestand dat Blender nog niet heeft gelezen (Instellingen → Hulpprogramma's)
       *[other] { $count } bestanden die Blender nog niet heeft gelezen (Instellingen → Hulpprogramma's)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] één bestand dat een Unity-project bij zijn naam kent
       *[other] { $count } bestanden die een Unity-project bij hun naam kent
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] één bestand waar een scène of een ander bestand naar verwijst
       *[other] { $count } bestanden waar een scène of een ander bestand naar verwijst
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] één bestand in een bewaakte map
       *[other] { $count } bestanden in bewaakte mappen
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "Een andere regel converteert dit formaat al"

[messages.settings-conv-to]
source = "Convert to"
translation = "Converteren naar"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Modellen bij het converteren rechtop zetten (Y omhoog, kijkend naar +Z), zoals de modellen van het pakket worden getoond"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Converteer bestanden die Hoard zelf bewaart naar één formaat, zoals elke OBJ en FBX naar GLB, zodat de hele bibliotheek gelijk is. Het geconverteerde bestand neemt de plaats van het origineel in, met zijn naam, tags, collecties en links. Bestanden in bewaakte mappen worden nooit gewijzigd."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Geconverteerde downloads"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "maximaal bewaard; de minst recent gebruikte gaan eerst"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "maximaal bewaard, nu { $size }; de minst recent gebruikte gaan eerst"

[messages.settings-default-auto]
source = "automatic"
translation = "automatisch"

[messages.settings-default-off]
source = "off"
translation = "uit"

[messages.settings-default-on]
source = "on"
translation = "aan"

[messages.settings-desktop-updates]
source = "Hoard looks for a new release each time it starts, downloads it in the background, and installs it when you quit."
translation = "Hoard zoekt bij elke start naar een nieuwe versie, downloadt die op de achtergrond en installeert hem wanneer je afsluit."

[messages.settings-editor-path]
source = "Enter the executable path of your installed { $tool }. Automatic installation is available only in Docker."
translation = "Voer het pad naar het uitvoerbare bestand van je geïnstalleerde { $tool } in. Automatische installatie is alleen beschikbaar in Docker."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "Gebruikt een ffmpeg van het systeem met de juiste encoders, of downloadt een statische build (ongeveer 80 MB)."

[messages.settings-ffmpeg-what]
source = "Encodes MP3, OGG and Opus downloads, and reads audio Hoard can’t decode itself (AAC, M4A, WMA, …)."
translation = "Codeert MP3-, OGG- en Opus-downloads, en leest audio die Hoard zelf niet kan decoderen (AAC, M4A, WMA, …)."

[messages.settings-find]
source = "Find a setting"
translation = "Een instelling zoeken"

[messages.settings-find-none]
source = "No setting matches “{ $query }”."
translation = "Geen instelling past bij ‘{ $query }’."

[messages.settings-gpu-none]
source = "No GPU or software renderer found, so models get no thumbnails"
translation = "Geen GPU of softwarerenderer gevonden, dus modellen krijgen geen miniaturen"

[messages.settings-gpu-on]
source = "On the GPU: { $renderer }"
translation = "Op de GPU: { $renderer }"

[messages.settings-gpu-software]
source = "No GPU found, so in software ({ $renderer })"
translation = "Geen GPU gevonden, dus in software ({ $renderer })"

[messages.settings-limits]
source = "Work and limits"
translation = "Werk en limieten"

[messages.settings-limits-what]
source = "Each one saves when you leave the field or press Enter. Sizes take units: 100 GB, 512 MB, 1.5 TB; a plain number is GB."
translation = "Elke waarde wordt opgeslagen als je het veld verlaat of op Enter drukt. Groottes nemen eenheden: 100 GB, 512 MB, 1.5 TB; een los getal is GB."

[messages.settings-load-failed]
source = "Couldn't load the settings: { $error }"
translation = "Kon de instellingen niet laden: { $error }"

[messages.settings-loading]
source = "Loading…"
translation = "Laden…"

[messages.settings-local-cancel]
source = "Cancel"
translation = "Annuleren"

[messages.settings-local-catalog]
source = "Models to download"
translation = "Modellen om te downloaden"

[messages.settings-local-delete]
source = "Delete"
translation = "Verwijderen"

[messages.settings-local-delete-body]
source = "Its files are deleted from the model server. You can download it again later."
translation = "De bestanden worden van de modelserver verwijderd. Je kunt het later opnieuw downloaden."

[messages.settings-local-delete-downloading]
source = "The download stops and what came down so far is deleted."
translation = "De download stopt en wat er tot nu toe binnen is, wordt verwijderd."

[messages.settings-local-delete-in-use]
source = "AI tagging uses this model, so it stops until you pick another. Its files are deleted from the model server."
translation = "AI-tagging gebruikt dit model, dus het stopt tot je een ander kiest. De bestanden worden van de modelserver verwijderd."

[messages.settings-local-delete-title]
source = "Delete { $name }?"
translation = "{ $name } verwijderen?"

[messages.settings-local-deleting]
source = "Deleting…"
translation = "Verwijderen…"

[messages.settings-local-download]
source = "Download"
translation = "Downloaden"

[messages.settings-local-downloading]
source = "Downloading…"
translation = "Downloaden…"

[messages.settings-local-downloading-progress]
source = "Downloading { $percent }% · { $done } of { $total }"
translation = "Downloaden { $percent }% · { $done } van { $total }"

[messages.settings-local-failed]
source = "Failed to start last time"
translation = "Kon de vorige keer niet starten"

[messages.settings-local-in-use]
source = "In use"
translation = "In gebruik"

[messages.settings-local-in-use-running]
source = "In use · running"
translation = "In gebruik · actief"

[messages.settings-local-incomplete]
source = "Download stopped"
translation = "Download gestopt"

[messages.settings-local-list]
source = "On the model server"
translation = "Op de modelserver"

[messages.settings-local-none]
source = "Nothing downloaded yet. Pick one below; it’s kept on the server, and you can switch any time."
translation = "Nog niets gedownload. Kies hieronder een model; het wordt op de server bewaard en je kunt altijd wisselen."

[messages.settings-local-other]
source = "Another model from Hugging Face"
translation = "Een ander model van Hugging Face"

[messages.settings-local-other-placeholder]
source = "Another from Hugging Face: owner/name-GGUF:Q4_K_M"
translation = "Een ander van Hugging Face: owner/name-GGUF:Q4_K_M"

[messages.settings-local-ready-images]
source = "Ready · takes images"
translation = "Klaar · kan afbeeldingen aan"

[messages.settings-local-ready-text]
source = "Ready · text only"
translation = "Klaar · alleen tekst"

[messages.settings-local-resume]
source = "Resume"
translation = "Hervatten"

[messages.settings-local-running]
source = "Running"
translation = "Actief"

[messages.settings-local-size]
source = "{ $size } GB · { $license }"
translation = "{ $size } GB · { $license }"

[messages.settings-local-start-after]
source = ". A server that runs just one model works too: give its model’s name below."
translation = ". Een server die maar één model draait, werkt ook: geef hieronder de naam van dat model op."

[messages.settings-local-start-before]
source = 'Start it with{ " " }'
translation = 'Start hem met{ " " }'

[messages.settings-local-start-developing]
source = '{ " " }when developing), then{ " " }'
translation = '{ " " }tijdens het ontwikkelen) en{ " " }'

[messages.settings-local-start-or]
source = '{ " " }(or{ " " }'
translation = '{ " " }(of{ " " }'

[messages.settings-local-start-retry]
source = "try again"
translation = "probeer het opnieuw"

[messages.settings-local-starting]
source = "Starting…"
translation = "Starten…"

[messages.settings-look-dark]
source = "Dark"
translation = "Donker"

[messages.settings-look-group]
source = """
{ $scheme ->
        [light] Light theme
       *[dark] Dark theme
    }"""
translation = """
{ $scheme ->
        [light] Licht thema
       *[dark] Donker thema
    }"""

[messages.settings-look-hint]
source = "Switch between light and dark (or follow the system) from the top bar."
translation = "Wissel tussen licht en donker (of volg het systeem) via de bovenbalk."

[messages.settings-look-light]
source = "Light"
translation = "Licht"

[messages.settings-max-expand]
source = "Largest pack"
translation = "Grootste pakket"

[messages.settings-max-expand-unit]
source = "once unpacked"
translation = "na uitpakken"

[messages.settings-max-upload]
source = "Largest upload"
translation = "Grootste upload"

[messages.settings-max-upload-unit]
source = "per file"
translation = "per bestand"

[messages.settings-mode-auto]
source = "Automatic"
translation = "Automatisch"

[messages.settings-mode-off]
source = "Off"
translation = "Uit"

[messages.settings-mode-path]
source = "This program"
translation = "Dit programma"

[messages.settings-motion-fps]
source = "Frame rate"
translation = "Beeldsnelheid"

[messages.settings-motion-fps-option]
source = "{ $fps } fps"
translation = "{ $fps } fps"

[messages.settings-motion-fps-what]
source = "Smoother movies take longer to make and more room: about twice as much at 24 fps as at 12, and more again at 30. Changing it makes them all again."
translation = "Vloeiendere filmpjes kosten meer tijd en ruimte: ongeveer twee keer zoveel bij 24 fps als bij 12, en nog meer bij 30. Als je dit wijzigt, worden ze allemaal opnieuw gemaakt."

[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Bewegende miniaturen voor animaties"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Elke animatie krijgt ook een kort filmpje in een lus, dat speelt zolang je naar de tegel wijst. Ze nemen elk zo'n 40 KB in en het maken duurt even bij een grote bibliotheek. Uitzetten verwijdert ze."

[messages.settings-name]
source = "Name"
translation = "Naam"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Hoe deze server heet in de bovenbalk, het browsertabblad en op de inlogpagina, zodat je met meer dan één hoard kunt zien welke welke is."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "Hoe deze bibliotheek heet in de bovenbalk."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-about]
source = "About"
translation = "Over"

[messages.settings-page-about-blurb]
source = "What Hoard is, which version this is, and the work of others it’s made with."
translation = "Wat Hoard is, welke versie dit is, en het werk van anderen waarmee het gemaakt is."

[messages.settings-page-account]
source = "Account"
translation = "Account"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Je wachtwoord, de andere mensen die kunnen inloggen, en toegangstokens voor scripts en andere programma’s."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Pakketten toevoegen"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Wat Hoard met een pakket doet als het wordt toegevoegd, naast het lezen en taggen."

[messages.settings-page-ai]
source = "AI tagging"
translation = "AI-tagging"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Een AI-model geeft nieuwe pakketten een naam, beschrijving en tags, bovenop de ingebouwde regels. De tags ervan worden als voorgesteld gemarkeerd."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Weergave"

[messages.settings-page-appearance-blurb]
source = "Language, themes, text size and spacing, and what the tiles and the top bar show. Saved in this browser only."
translation = "Taal, thema’s, tekstgrootte en ruimte, en wat de tegels en de bovenbalk laten zien. Alleen in deze browser bewaard."

[messages.settings-page-auth]
source = "Authentication"
translation = "Authenticatie"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Hoe mensen inloggen: met de eigen accounts van Hoard, een LDAP-directory, Microsoft Active Directory of een OAuth-provider, hoe lang sessies duren, en welke groepen welke rol krijgen."

[messages.settings-page-connection]
source = "Connection"
translation = "Verbinding"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Hoe browsers en apps Hoard bereiken: het adres waaronder het bekend is, en HTTPS, dat sommige browserfuncties nodig hebben."

[messages.settings-page-copies]
source = "Near copies"
translation = "Bijna-kopieën"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Bestanden die dezelfde afbeelding, hetzelfde geluid of model zijn in een andere grootte, samplefrequentie of een ander formaat, die met de meeste ruimte eerst. De beste van elke set is gemarkeerd; er wordt niets verwijderd."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Downloads"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hoe bestanden heten in wat Hoard verstuurt: downloads, zips, de hoard-tool en AI-assistenten. Bestanden in de bibliotheek blijven zoals ze zijn."

[messages.settings-page-dragon]
source = "Dragon"
translation = "Draak"

[messages.settings-page-dragon-blurb]
source = "Your dragon’s hoard: every asset in the library is a piece of its treasure."
translation = "De schat van je draak: elk asset in de bibliotheek is er een stuk van."

[messages.settings-page-issues]
source = "Issues"
translation = "Problemen"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Wat er misging bij het openen of verwerken van bestanden: archieven die niet uitpakten, bestanden die niet gelezen konden worden, taken die mislukten. Probeer ze opnieuw zodra de oorzaak is opgelost, of negeer ze."

[messages.settings-page-library]
source = "Library"
translation = "Bibliotheek"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Wat er in de hoard zit: hoe groot hij is, waar hij uit bestaat, hoe hij is gegroeid en hoe goed hij is getagd. Gearchiveerde dingen tellen niet mee."

[messages.settings-page-locations]
source = "Library locations"
translation = "Bibliotheeklocaties"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "De mappen op de server die de bibliotheek bevatten: mappen waarin Hoard bestanden bewaart, en mappen met pakketten die het indexeert waar ze staan."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "De mappen die de bibliotheek bevatten: mappen waarin Hoard bestanden bewaart, en mappen met pakketten die het indexeert waar ze staan."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Onderhoud"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Back-ups maken, op schade controleren en opruimen. Van elk loopt er één tegelijk, en je kunt deze pagina verlaten terwijl ze bezig zijn."

[messages.settings-page-performance]
source = "Performance"
translation = "Prestaties"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Hoe hard de server werkt, hoe miniaturen worden gemaakt en bewaard, en hoeveel hij maximaal aanneemt."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Hoe hard Hoard werkt, hoe miniaturen worden gemaakt en bewaard, en hoeveel het maximaal aanneemt."

[messages.settings-page-search-blurb]
