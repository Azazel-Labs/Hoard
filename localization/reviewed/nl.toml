[messages.about-blender]
source = "Converts 3D models and makes their thumbnails."
translation = "Zet 3D-modellen om en maakt hun miniaturen."

[messages.about-built-with]
source = "Built with"
translation = "Gemaakt met"

[messages.about-built-with-what]
source = "The open source libraries Hoard is made from, with their licenses."
translation = "De opensourcebibliotheken waaruit Hoard bestaat, met hun licenties."

[messages.about-clap]
source = "Finds sounds by what they sound like."
translation = "Vindt geluiden op basis van hoe ze klinken."

