    }"""

[messages.news-mcp-everything-body]
source = "Claude and other AI apps connected over MCP can now do anything the Hoard web app does, with exactly the permissions of the account or token they sign in with."
translation = "Claude en andere via MCP gekoppelde AI-apps kunnen nu alles wat de Hoard-webapp kan, met precies de rechten van het account of token waarmee ze inloggen."

[messages.news-mcp-everything-title]
source = "AI apps can do what you can"
translation = "AI-apps kunnen wat jij kunt"

[messages.news-mesh-explorer-body]
source = "The cube button above search results that hold 3D models opens the mesh explorer: every model the search found, laid out in rows on an endless floor to fly around."
translation = "De kubusknop boven zoekresultaten met 3D-modellen opent de mesh-verkenner: alle gevonden modellen in rijen op een eindeloze vloer om tussendoor te vliegen."

[messages.news-mesh-explorer-title]
source = "Fly among a search's models"
translation = "Vlieg tussen de modellen van een zoekopdracht"

[messages.news-models-read-body]
source = "Collada, X3D, VRML, OFF and VRM models, BVH animations and Gaussian splats now get thumbnails, facts and the 3D viewer without Blender, and download as GLB."
translation = "Collada-, X3D-, VRML-, OFF- en VRM-modellen, BVH-animaties en Gaussian splats krijgen nu zonder Blender miniaturen, gegevens en de 3D-viewer, en zijn te downloaden als GLB."

[messages.news-models-read-title]
source = "More 3D formats, no Blender needed"
translation = "Meer 3D-formaten, zonder Blender"

[messages.news-motion-fps-body]
source = "Animation thumbnails can now be made at 12, 24 or 30 frames a second."
translation = "Miniaturen van animaties kunnen nu met 12, 24 of 30 beelden per seconde worden gemaakt."

[messages.news-motion-fps-title]
source = "A frame rate for moving thumbnails"
translation = "Een beeldsnelheid voor bewegende miniaturen"

[messages.news-motion-trails-body]
source = "An animation’s thumbnail traces the path its character takes, with a dot where it is right now."
translation = "De miniatuur van een animatie tekent het pad dat het personage aflegt, met een stip waar het nu is."

[messages.news-motion-trails-title]
source = "Motion trails on animations"
translation = "Bewegingssporen op animaties"

[messages.news-none]
source = "Nothing new to find right now."
translation = "Op dit moment niets nieuws te ontdekken."

[messages.news-pack-covers-body]
source = "A pack that comes with previews or screenshots uses them as its cover, stepping through them while the pointer is over it on the packs list, and on its panel."
translation = "Een pakket met voorbeelden of schermafbeeldingen gebruikt die als omslag en bladert erdoor zolang de aanwijzer erboven staat in de pakketlijst, en in zijn paneel."

[messages.news-pack-covers-title]
source = "Packs show their own pictures"
translation = "Pakketten tonen hun eigen afbeeldingen"

[messages.news-pip]
source = """
{ $count ->
        [one] New in Hoard
       *[other] { $count } new things here
    }"""
translation = """
{ $count ->
        [one] Nieuw in Hoard
       *[other] { $count } nieuwe dingen hier
    }"""

[messages.news-point-out]
source = "Point out new things again"
translation = "Nieuwe dingen weer aanwijzen"

[messages.news-seen-lately]
source = "Seen lately"
translation = "Onlangs gezien"

[messages.news-stop-pointing]
source = "Stop pointing out new things"
translation = "Nieuwe dingen niet meer aanwijzen"

[messages.news-tag-lookalikes-body]
source = "Tags that seem to be the same one, such as a plural, words run together, a letter out or a bare word and its namespaced twin, are listed to merge or mark as different."
translation = "Tags die dezelfde lijken, zoals een meervoud, aan elkaar geschreven woorden, een ontbrekende letter of een kaal woord en zijn tweeling met naamruimte, worden opgesomd om samen te voegen of als verschillend te markeren."

[messages.news-tag-lookalikes-title]
source = "Merge tags that look alike"
translation = "Tags samenvoegen die op elkaar lijken"

[messages.news-tag-tree-body]
source = "Put a tag under a broader one, so searching vehicle finds car and sedan too. Nest them on Settings → Tags or on a tag’s own page."
translation = "Zet een tag onder een bredere, zodat zoeken op voertuig ook auto en sedan vindt. Nest ze bij Instellingen → Tags of op de eigen pagina van een tag."

[messages.news-tag-tree-title]
source = "Tags inside tags"
translation = "Tags in tags"

[messages.news-tags-under-body]
source = "Typing a tag in the search box finds everything under it too, a minus in front leaves all of that out, and an asset's panel shows the broader tags its own go under."
translation = "Een tag in het zoekvak vindt nu ook alles eronder, een min ervoor laat dat allemaal weg, en het paneel van een asset toont de bredere tags waar zijn eigen tags onder vallen."

[messages.news-tags-under-title]
source = "A tag finds everything under it"
translation = "Een tag vindt alles eronder"

[messages.news-take-me]
source = "Take me there"
translation = "Breng me erheen"

[messages.news-text-size-body]
source = "Make the writing bigger or smaller and the page roomier or more compact, and pick what the tiles and the top bar show."
translation = "Maak de tekst groter of kleiner en de pagina ruimer of compacter, en kies wat de tegels en de bovenbalk laten zien."

[messages.news-text-size-title]
source = "Text size and spacing"
translation = "Tekstgrootte en ruimte"

[messages.news-themes-body]
source = "Sky, Mint, Apricot and Lemon join the light themes and Midnight, Lagoon and Neon the dark, and the new look spreads out from the tile you pick."
translation = "Hemel, Munt, Abrikoos en Citroen komen bij de lichte thema’s en Middernacht, Lagune en Neon bij de donkere, en de nieuwe look verspreidt zich vanaf de tegel die je kiest."

[messages.news-themes-title]
source = "Ten light and ten dark themes"
translation = "Tien lichte en tien donkere thema’s"

[messages.news-tiles-move-body]
source = "Animations and animated pictures on the library tiles can play all the time, not only under the pointer."
translation = "Animaties en bewegende afbeeldingen op de tegels in de bibliotheek kunnen altijd afspelen, niet alleen onder de aanwijzer."

[messages.news-tiles-move-title]
source = "Keep tiles moving"
translation = "Tegels blijven bewegen"

