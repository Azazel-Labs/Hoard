[messages.news-backups-body]
source = "Back the database up every day or every week, keep the newest few, and copy each one to another folder."
translation = "Maak elke dag of elke week een back-up van de database, bewaar de nieuwste paar en kopieer elke back-up naar een andere map."

[messages.news-backups-title]
source = "Scheduled backups"
translation = "Geplande back-ups"

[messages.news-bulk-edit-body]
source = "Select some assets and press E to change their tags, license, rating and more together, with Undo."
translation = "Selecteer een paar assets en druk op E om hun tags, licentie, beoordeling en meer tegelijk te wijzigen, met Ongedaan maken."

[messages.news-bulk-edit-title]
source = "Edit many at once"
translation = "Veel tegelijk bewerken"

