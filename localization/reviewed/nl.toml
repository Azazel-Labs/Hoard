[messages.news-close]
source = "Close"
translation = "Sluiten"

[messages.news-got-it]
source = "Got it"
translation = "Begrepen"

[messages.news-look-again]
source = "Look again"
translation = "Nog eens bekijken"

[messages.news-mark-all]
source = "Mark all seen"
translation = "Alles als gezien markeren"

[messages.news-marked-seen]
