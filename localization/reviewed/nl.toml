translation = "Gebruikt het SigLIP 2-model van Google, uitgevoerd op de processor van deze server: er gaat niets naar buiten. Inschakelen downloadt het model ({ $size } MB) van Hugging Face en leert daarna elke afbeelding op de achtergrond met lage prioriteit. Het gebruikt 350 tot 750 MB geheugen terwijl het werkt of iemand zoekt. Uitschakelen verwijdert het model en bewaart wat het heeft geleerd, voor de volgende keer."

