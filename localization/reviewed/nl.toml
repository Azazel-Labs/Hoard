[messages.server-maintenance-backup]
source = "Back up the database"
translation = "Back-up van de database maken"

[messages.server-maintenance-backup-blurb]
source = "A consistent copy of the database (packs, tags, notes, collections and Settings) in the backups folder next to it. The library's files aren't in it: they never change once stored, so any file sync backs them up."
translation = "Een consistente kopie van de database (pakketten, tags, notities, collecties en Instellingen) in de map backups ernaast. De bestanden van de bibliotheek zitten er niet in: die veranderen nooit meer nadat ze zijn opgeslagen, dus elke bestandssynchronisatie maakt er een back-up van."

[messages.server-maintenance-clear-cache]
source = "Clear cached conversions"
translation = "Gecachete conversies wissen"

[messages.server-maintenance-clear-cache-blurb]
source = "Drops the files kept from “Download as” conversions (they're made again when next asked for) and what interrupted work left behind."
translation = "Gooit de bestanden weg die zijn bewaard van conversies via “Downloaden als” (ze worden opnieuw gemaakt als erom wordt gevraagd) en wat onderbroken werk heeft achtergelaten."

[messages.server-maintenance-gc]
source = "Delete unused files"
translation = "Ongebruikte bestanden verwijderen"

[messages.server-maintenance-gc-blurb]
source = "Deletes stored files nothing points at any more, such as the files of packs deleted for good."
translation = "Verwijdert opgeslagen bestanden waar niets meer naar verwijst, zoals de bestanden van definitief verwijderde pakketten."

[messages.server-maintenance-reanalyze]
source = "Re-analyze every pack"
translation = "Elk pakket opnieuw analyseren"

[messages.server-maintenance-reanalyze-blurb]
source = "Reads every file again with this version of Hoard: thumbnails, previews, details and rule tags are made afresh. Your own edits stay; the AI isn't asked again."
translation = "Leest elk bestand opnieuw met deze versie van Hoard: miniaturen, voorbeelden, details en regeltags worden opnieuw gemaakt. Je eigen wijzigingen blijven; de AI wordt niet opnieuw gevraagd."

[messages.server-maintenance-scrub]
source = "Check files for damage"
translation = "Bestanden op schade controleren"

[messages.server-maintenance-scrub-blurb]
source = "Reads every stored file back and checks it against its fingerprint, to catch files that have rotted or gone missing from a disk or NAS. Takes a while on a big library."
translation = "Leest elk opgeslagen bestand terug en vergelijkt het met de vingerafdruk, om bestanden te vinden die zijn aangetast of van een schijf of NAS zijn verdwenen. Duurt even bij een grote bibliotheek."

[messages.server-maintenance-shrink-thumbs]
source = "Shrink thumbnails"
translation = "Miniaturen verkleinen"

[messages.server-maintenance-shrink-thumbs-blurb]
source = "Stores the thumbnails and model views kept as PNG the way Settings → Performance → Thumbnails asks, which usually makes them several times smaller. Ones with transparency, and pixel art, stay PNG."
translation = "Slaat de miniaturen en modelweergaven die als PNG zijn bewaard op zoals Instellingen → Prestaties → Miniaturen aangeeft, wat ze meestal een aantal keer kleiner maakt. Die met transparantie, en pixelart, blijven PNG."

