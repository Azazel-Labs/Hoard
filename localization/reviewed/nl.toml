[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Als er een nieuwe versie uit is, kan Hoard een adres aanroepen zodra er niets gebeurt (geen uploads, taken, conversies of onderhoud), zodat wat de container bijwerkt hem niet midden in een upload herstart. Het stuurt een POST met de versie in een JSON-body. Hiervoor is de versiecontrole hierboven nodig."

