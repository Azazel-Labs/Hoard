source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Groepen waarvan de leden elke rol krijgen, één per regel, op naam of DN. De hoogste die overeenkomt wint, en dat wordt bij elke keer inloggen gecontroleerd. Als er geen zijn opgegeven, krijgen nieuwe accounts de rol hierboven en wijzigt een beheerder die daarna. Als er groepen onder Mag kijken staan, mogen alleen leden van een opgegeven groep inloggen."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Groepen waarvan de leden elke rol krijgen, één per regel, op naam of DN (of wat de groups-claim ook vermeldt). De hoogste die overeenkomt wint, en dat wordt bij elke keer inloggen gecontroleerd. Als er geen zijn opgegeven, krijgen nieuwe accounts de rol hierboven en wijzigt een beheerder die daarna. Als er groepen onder Mag kijken staan, mogen alleen leden van een opgegeven groep inloggen."

