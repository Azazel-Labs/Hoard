[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "De maps van een materiaal gaan de deur uit met de naam van het materiaal en waar elke map voor is, hoe de bestanden ook heten: Rock_Normal.png, niet rock_moss_xeokah0_raw_8K_Normal.png. De bestanden in de bibliotheek worden niet aangeraakt, en een map die een meegestuurd model of MTL bij naam noemt, houdt die naam, zodat het model hem nog vindt."

