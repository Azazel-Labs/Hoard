translation = "Iedereen met een { $provider }-account kan binnenkomen. Voeg hieronder kijkersgroepen toe, of schakel dit uit en voeg mensen zelf toe."

[messages.auth-own-accounts-still-work]
source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "De eigen accounts van Hoard loggen nog steeds in met hun eigen wachtwoord, dus een directory of provider die uitvalt of verkeerd is ingesteld, kan je niet buitensluiten."

