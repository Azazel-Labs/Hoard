translation = "Keycloak, Authentik, Authelia, Okta, Zitadel en andere: geef de issuer op en Ontdekken vult de adressen in."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Maak een OAuth-app aan in GitHub → Settings → Developer settings. GitHub stuurt geen groepen mee, dus geef rollen in Instellingen → Account, en schakel het aanmaken van accounts bij de eerste keer inloggen uit, tenzij iedereen met een GitHub-account binnen mag komen."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Maak een applicatie aan in GitLab → Voorkeuren → Applicaties (of in het beheergedeelte van je eigen instantie: wijzig dan gitlab.com in de adressen)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Maak een OAuth-client (Webapplicatie) aan in Google Cloud Console → API's en services → Inloggegevens. Google stuurt geen groepen mee, dus geef rollen in Instellingen → Account, en schakel het aanmaken van accounts bij de eerste keer inloggen uit, tenzij iedereen met een Google-account binnen mag komen."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registreer een app in Entra ID → App-registraties (met een webomleiding naar het adres hieronder). Vervang “organizations” door je tenant-ID om alleen je eigen organisatie binnen te laten. Voor rollen op basis van groepen voeg je de groups-claim toe onder Tokenconfiguratie: die vermeldt groeps-ID's."

