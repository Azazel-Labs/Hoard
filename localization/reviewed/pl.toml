translation = "Każda animacja dostaje też krótki film w pętli, odtwarzany, gdy wskażesz jej kafelek. Każdy zajmuje około 40 KB, a w dużej bibliotece ich tworzenie chwilę trwa. Wyłączenie usuwa je."

