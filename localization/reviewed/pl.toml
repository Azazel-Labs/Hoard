[messages.settings-store-pages]
source = "Store pages"
translation = "Strony w sklepach"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "Nowe paczki są w tle wyszukiwane w sklepach, by uzyskać ich stronę w sklepie, sprzedawcę i licencję."

[messages.settings-the-default]
source = "the default"
