[messages.sheet-no-match]
source = "No sprite has that in its name."
translation = "Żaden sprite nie ma tego w nazwie."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite’y obrócone zgodnie z ruchem wskazówek zegara i przycięte. Ten format nie obsługuje animacji: klatki rozpoznaje się po numerach w nazwach."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Każdy sprite nieobrócony, na całym swoim płótnie, każdy jako osobny plik PNG nazwany tak jak on."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprite’y nigdy nieobracane, a przycięte brzegi zachowane jako marginesy, z animacjami i czasem każdej klatki."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Kafelki nigdy nieobracane ani nieprzycinane, na siatce o rozmiarze kafelka; obrazy, które już są na siatce, zostają bez zmian."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Każdy sprite nieobrócony, na całym swoim płótnie, w jednakowych komórkach, dla każdego narzędzia, które tnie arkusz według siatki."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Własny format Hoard: strony bez zmian, sprite’y obrócone w dowolną stronę i przycięte, z animacjami i czasem każdej klatki."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite’y obrócone przeciwnie do ruchu wskazówek zegara i przycięte. Ten format nie obsługuje animacji: klatki rozpoznaje się po numerach w nazwach."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprite’y obrócone zgodnie z ruchem wskazówek zegara i przycięte, z animacjami według nazw, tak jak odczytują je PixiJS i Phaser."

