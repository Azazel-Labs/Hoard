[messages.formatwizard-library]
source = """
{ $files ->
        [one] { $files } file
       *[other] { $files } files
    } in { $packs ->
        [one] { $packs } pack
       *[other] { $packs } packs
    } have a name it takes. Of { $tried } tried, it reads { $read }."""
translation = """
{ $files ->
        [one] { $files } plik
        [few] { $files } pliki
        [many] { $files } plików
       *[other] { $files } pliku
    } w { $packs ->
        [one] { $packs } paczce
        [few] { $packs } paczkach
        [many] { $packs } paczkach
       *[other] { $packs } paczki
    } { $files ->
        [one] ma
        [few] mają
        [many] ma
       *[other] ma
    } obsługiwaną nazwę. Sprawdzono: { $tried }, odczytano: { $read }."""

