translation = "Ustawiaj modele pionowo podczas konwersji (Y w górę, przodem do +Z), tak jak są wyświetlane modele paczki"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Konwertuje pliki przechowywane przez Hoard do jednego formatu, np. każdy OBJ i FBX do GLB, by cała biblioteka była jednolita. Przekonwertowany plik zajmuje miejsce oryginału, z jego nazwą, tagami, kolekcjami i powiązaniami. Pliki w obserwowanych folderach nigdy nie są zmieniane."

