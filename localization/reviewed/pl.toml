translation = "Grupy, których członkowie otrzymują daną rolę, po jednej w wierszu, według nazwy lub DN. Wygrywa najwyższa pasująca rola, sprawdzana przy każdym logowaniu. Jeśli nie podano żadnej, nowe konta otrzymują rolę ustawioną powyżej, a administrator może ją później zmienić. Jeśli podano grupy w polu „Może przeglądać”, zalogować się mogą tylko członkowie wymienionych grup."

