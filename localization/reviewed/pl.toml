translation = "Problemy"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Co poszło nie tak przy otwieraniu lub przetwarzaniu plików: archiwa, których nie dało się rozpakować, pliki, których nie dało się odczytać, nieudane zadania. Po usunięciu przyczyny można spróbować ponownie albo je odrzucić."

[messages.settings-page-library]
source = "Library"
translation = "Biblioteka"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Co jest w zbiorze: jak jest duży, z czego się składa, jak rósł i jak dobrze jest otagowany. Zarchiwizowane elementy nie są liczone."

[messages.settings-page-locations]
source = "Library locations"
translation = "Lokalizacje biblioteki"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Foldery na serwerze, w których znajduje się biblioteka: te, w których Hoard przechowuje pliki, oraz foldery z paczkami indeksowanymi tam, gdzie leżą."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Foldery, w których znajduje się biblioteka: te, w których Hoard przechowuje pliki, oraz foldery z paczkami indeksowanymi tam, gdzie leżą."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Konserwacja"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Kopie zapasowe, kontrola uszkodzeń i porządki. Każde z tych zadań działa naraz tylko raz, a w trakcie można opuścić tę stronę."

[messages.settings-page-performance]
source = "Performance"
translation = "Wydajność"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Jak intensywnie pracuje serwer, jak powstają i są przechowywane miniatury oraz ile maksymalnie przyjmuje."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Jak intensywnie pracuje Hoard, jak powstają i są przechowywane miniatury oraz ile maksymalnie przyjmuje."

[messages.settings-page-search]
source = "Image and sound search"
translation = "Wyszukiwanie obrazów i dźwięków"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Wyszukiwanie obrazów według tego, co przedstawiają, i dźwięków według tego, jak brzmią, a nie tylko według nazw, oraz znajdowanie rzeczy podobnych rodzajem, a nie tylko kolorem."

[messages.settings-page-store-files]
source = "Store files"
translation = "Pliki sklepów"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Pliki, które sklepy dołączają do grafik, a Hoard odczytuje, by nazywać paczki i wskazywać ich autorów. Można nauczyć go nieznanych plików i udostępnić innym to, czego go nauczono."

[messages.settings-page-tags]
source = "Tags"
translation = "Tagi"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Wszystkie tagi w bibliotece. Można scalić tagi o tym samym znaczeniu lub zmienić nazwę tagu; od tej pory tagowanie używa nowej nazwy."

[messages.settings-page-tools]
source = "Tools"
translation = "Narzędzia"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Zewnętrzne programy, których Hoard używa do konwertowania i odczytywania plików."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
    }{ $system ->
        [yes] { " " }(following the system)
       *[other] { "" }
    }, and it comes back when you leave this page."""
translation = """
Wyświetlany jest motyw { $preview ->
        [light] jasny
       *[dark] ciemny
    }, aby można go było obejrzeć. Używany jest motyw { $used ->
        [light] jasny
       *[dark] ciemny
    }{ $system ->
        [yes] { " " }(zgodnie z systemem)
       *[other] { "" }
    } i wróci on po opuszczeniu tej strony."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
    }"""
translation = """
Wróć do motywu { $used ->
        [light] jasnego
       *[dark] ciemnego
    }"""

