[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "Tekstura, która nie jest jedną z map materiału, zachowuje własną nazwę, chyba że kończy się jedną z tych końcówek: _diff → _BC wysyła rock_diff.png jako rock_BC.png. Zostaw drugie pole puste, aby usunąć końcówkę."

