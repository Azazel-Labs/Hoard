source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Należy utworzyć aplikację OAuth w GitHub → Settings → Developer settings. GitHub nie przesyła grup, więc role należy nadawać w Ustawienia → Konto, a tworzenie kont przy pierwszym logowaniu wyłączyć, chyba że dostęp ma mieć każdy, kto ma konto GitHub."

[messages.auth-preset-gitlab-note]
