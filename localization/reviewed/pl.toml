[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Gdy pojawi się nowa wersja, Hoard może wywołać adres, kiedy nic się nie dzieje (brak przesyłania, zadań, konwersji i konserwacji), dzięki czemu narzędzie aktualizujące jego kontener nie uruchomi go ponownie w trakcie przesyłania. Wysyła żądanie POST z informacją o wersji w treści JSON. Wymaga to powyższego sprawdzania nowych wersji."

