[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Należy utworzyć klienta OAuth (aplikacja internetowa) w Google Cloud Console → APIs & Services → Credentials. Google nie przesyła grup, więc role należy nadawać w Ustawienia → Konto, a tworzenie kont przy pierwszym logowaniu wyłączyć, chyba że dostęp ma mieć każdy, kto ma konto Google."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Należy zarejestrować aplikację w Entra ID → App registrations (z przekierowaniem typu Web na poniższy adres). Aby wpuszczać tylko własną organizację, należy zastąpić „organizations” identyfikatorem dzierżawy. Aby role wynikały z grup, należy dodać oświadczenie groups w Token configuration: zawiera ono identyfikatory grup."

