translation = "JPEG, jakość 92. Około dwa razy większe niż Zrównoważone."

[messages.settings-thumbs-small]
source = "Smaller"
translation = "Mniejsze"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG, jakość 70. Dobre w widoku miniatur; z bliska nieco miękkie."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Sposób przechowywania nowych miniatur i widoków modeli. Te z przezroczystością oraz pixel art są zawsze w PNG. Aby zmniejszyć już istniejące, należy uruchomić zadanie „Zmniejsz miniatury” na stronie Konserwacja."

