[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Jak przeglądarki i aplikacje łączą się z Hoard: adres, pod którym jest dostępny, oraz HTTPS, wymagany przez niektóre funkcje przeglądarek."

[messages.settings-page-copies]
source = "Near copies"
translation = "Prawie kopie"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Pliki, które są tym samym obrazem, dźwiękiem lub modelem w innym rozmiarze, częstotliwości próbkowania lub formacie, najpierw te, które zajmują najwięcej miejsca. Najlepsza w każdym zestawie jest oznaczona; nic nie jest usuwane."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Pobieranie"

[messages.settings-page-downloads-blurb]
