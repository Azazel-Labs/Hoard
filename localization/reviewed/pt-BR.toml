source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grupos cujos membros recebem cada papel, um por linha, pelo nome ou DN. Vale o mais alto que corresponder, e isso é verificado a cada login. Sem nenhum listado, as contas novas recebem o papel acima e um administrador o altera depois. Com grupos listados em Pode ver, só membros de um grupo listado podem entrar."

