translation = "Quando sai uma versão nova, o Hoard pode chamar um endereço assim que nada estiver acontecendo (sem envios, tarefas, conversões ou manutenção), para que o que atualiza o contêiner dele não o reinicie no meio de um envio. Ele envia um POST com a versão em um corpo JSON. Isso precisa da verificação de versões acima."

