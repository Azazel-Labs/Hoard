[messages.settings-name]
source = "Name"
translation = "Nome"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Como este servidor se chama na barra superior, na aba do navegador e na página de login, para você distinguir um do outro quando tiver mais de um Hoard."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Conta"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Sua senha, as outras pessoas que podem entrar e tokens de acesso para scripts e outros programas."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Adição de pacotes"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "O que o Hoard faz com um pacote quando ele é adicionado, além de lê-lo e marcá-lo com tags."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Tags por IA"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Um modelo de IA dá nome, descreve e marca com tags os pacotes novos, além das regras embutidas. As tags dele são marcadas como sugeridas."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Aparência"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Os temas que este navegador usa quando está claro e quando está escuro. Salvo só neste navegador."

[messages.settings-page-auth]
source = "Authentication"
translation = "Autenticação"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Como as pessoas entram: as contas do próprio Hoard, um diretório LDAP, o Microsoft Active Directory ou um provedor OAuth, quanto duram as sessões e quais grupos recebem qual papel."

[messages.settings-page-connection]
source = "Connection"
translation = "Conexão"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Como navegadores e apps acessam o Hoard: o endereço pelo qual ele é conhecido, e HTTPS, que alguns recursos do navegador exigem."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Downloads"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Como os arquivos são nomeados no que o Hoard envia: downloads, zips, a ferramenta hoard e assistentes de IA. Os arquivos da biblioteca ficam como estão."

[messages.settings-page-general]
source = "General"
translation = "Geral"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Como este servidor se chama, para todos que o usam."

[messages.settings-page-issues]
source = "Issues"
translation = "Problemas"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "O que deu errado ao abrir ou processar arquivos: arquivos compactados que não foram extraídos, arquivos que não puderam ser lidos, tarefas que falharam. Tente de novo depois de corrigir a causa, ou dispense-os."

[messages.settings-page-library]
source = "Library"
translation = "Biblioteca"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "O que há no Hoard: o tamanho, do que é feito, como cresceu e quão bem está marcado com tags. Itens arquivados não são contados."

[messages.settings-page-locations]
source = "Library locations"
translation = "Locais da biblioteca"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "As pastas no servidor que contêm a biblioteca: aquelas em que o Hoard guarda arquivos e pastas de pacotes que ele indexa onde estão."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Manutenção"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Faça backup, verifique danos e faça uma limpeza. Uma de cada roda por vez, e você pode sair desta página enquanto elas rodam."

[messages.settings-page-performance]
source = "Performance"
translation = "Desempenho"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Quanto o servidor trabalha, como as miniaturas são feitas e guardadas, e o máximo que ele recebe."

[messages.settings-page-search]
source = "Image search"
translation = "Busca por imagem"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show, not only by their names, and find things that are alike in kind, not only in color."
translation = "Busque imagens pelo que elas mostram, não só pelo nome, e encontre coisas parecidas no tipo, não só na cor."

[messages.settings-page-store-files]
source = "Store files"
translation = "Arquivos de loja"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Os arquivos que as lojas colocam junto da arte, que o Hoard lê para dar nome aos pacotes e creditar quem os fez. Ensine a ele os que ele não conhece e compartilhe o que você ensinou."

[messages.settings-page-tags]
source = "Tags"
translation = "Tags"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Todas as tags da biblioteca. Mescle as que significam a mesma coisa, ou renomeie uma; os geradores de tags usam o novo nome dali em diante."

[messages.settings-page-tools]
source = "Tools"
translation = "Ferramentas"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Programas externos que o Hoard usa para converter e ler arquivos."

