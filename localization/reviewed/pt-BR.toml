translation = "Grupos cujos membros recebem cada papel, um por linha, pelo nome ou DN (ou o que a declaração de grupos listar). Vale o mais alto que corresponder, e isso é verificado a cada login. Sem nenhum listado, as contas novas recebem o papel acima e um administrador o altera depois. Com grupos listados em Pode ver, só membros de um grupo listado podem entrar."

