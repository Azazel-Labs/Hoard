[messages.settings-chatgpt-usage]
source = "Tagging requests count toward your ChatGPT plan’s usage. Manage usage shows what Hoard has used and lets you limit it. To disconnect Hoard from ChatGPT itself, go to Settings → Security and login → Sign in with ChatGPT on chatgpt.com."
translation = "As solicitações de tags contam para o uso do seu plano do ChatGPT. Gerenciar uso mostra o que o Hoard usou e permite limitá-lo. Para desconectar o Hoard do próprio ChatGPT, vá em Configurações → Segurança e login → Fazer login com o ChatGPT em chatgpt.com."

[messages.settings-clip-downloading]
source = "Downloading the model… progress is in the activity indicator"
translation = "Baixando o modelo… o progresso está no indicador de atividade"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Buscar pelo que as imagens mostram"

[messages.settings-clip-hint]
source = "Uses OpenAI’s CLIP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Usa o modelo CLIP da OpenAI, executado no processador deste servidor: nada sai dele. Ativar baixa o modelo ({ $size } MB) do Hugging Face e depois aprende cada imagem em segundo plano, com baixa prioridade. Ele ocupa de 300 a 600 MB de memória enquanto trabalha ou alguém busca. Desativar exclui o modelo e mantém o que ele aprendeu, para a próxima vez."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "Pronto: aprendendo imagens, { $done } de { $total } até agora"

[messages.settings-clip-looking]
source = "Looking for the model…"
translation = "Procurando o modelo…"

[messages.settings-clip-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } pictures
    }"""
translation = """
{ $count ->
        [one] Pronto: conhece { $count } imagem
       *[other] Pronto: conhece todas as { $count } imagens
    }"""

[messages.settings-clip-ready-empty]
source = "Ready. Pictures are learned as packs are added."
translation = "Pronto. As imagens são aprendidas conforme os pacotes são adicionados."

[messages.settings-clip-reset]
source = "Image search: back to the default"
translation = "Busca por imagem: voltar ao padrão"

[messages.settings-clip-saved-off]
source = "Image search: off"
translation = "Busca por imagem: desligada"

[messages.settings-clip-saved-on]
source = "Image search: on"
translation = "Busca por imagem: ligada"

[messages.settings-clip-toggle]
source = "Turn on image search"
translation = "Ativar a busca por imagem"

[messages.settings-clip-unavailable]
source = "Couldn’t get the model: { $detail }. Trying again every hour."
translation = "Não foi possível obter o modelo: { $detail }. Tentando de novo a cada hora."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Digite o que você procura (“mossy rock”, “sci-fi door”, “wooden barrel”) e as imagens que mostram isso aparecem junto com os nomes que têm essas palavras. “Mais como este” encontra coisas do mesmo tipo, não só das mesmas cores."

