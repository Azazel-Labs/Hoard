[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Crie um aplicativo no GitLab → Preferências → Aplicativos (ou na área de administração da sua instância: troque gitlab.com nos endereços)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Crie um cliente OAuth (Aplicativo da Web) no Google Cloud Console → APIs e serviços → Credenciais. O Google não envia grupos, então dê os papéis em Configurações → Conta, e desative a criação de contas no primeiro login, a menos que qualquer pessoa com uma conta Google deva poder entrar."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Registre um app no Entra ID → Registros de aplicativo (com um redirecionamento Web para o endereço abaixo). Coloque o ID do seu locatário no lugar de “organizations” para deixar entrar só a sua organização. Para papéis a partir de grupos, adicione a declaração groups em Configuração de token: ela lista IDs de grupos."

