translation = "Pôr os modelos direitos ao convertê-los (Y para cima, virados para +Z), tal como os modelos do pacote são mostrados"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Converta os ficheiros que o Hoard guarda para um só formato, por exemplo todos os OBJ e FBX para GLB, para que a biblioteca fique toda igual. O ficheiro convertido toma o lugar do original, com o nome, as etiquetas, as coleções e as ligações. Os ficheiros em pastas vigiadas nunca são alterados."

