translation = "Os mapas de um material saem com o nome dele e aquilo para que cada mapa serve, seja qual for o nome dos ficheiros: Rock_Normal.png, não rock_moss_xeokah0_raw_8K_Normal.png. Os ficheiros na biblioteca não são tocados, e um mapa cujo nome é indicado por um modelo ou MTL enviado com ele mantém esse nome, para que o modelo continue a encontrá-lo."

