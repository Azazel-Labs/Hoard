        [one] { $count } animação
       *[other] { $count } animações
    }"""

[messages.sheet-failed]
source = "This sheet can't be read."
translation = "Não é possível ler esta folha."

[messages.sheet-find]
source = "Find a sprite"
translation = "Procurar um sprite"

[messages.sheet-loading]
source = "Loading the sheet…"
translation = "A carregar a folha…"

[messages.sheet-no-match]
source = "No sprite has that in its name."
translation = "Nenhum sprite tem isso no nome."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites rodados no sentido dos ponteiros do relógio e recortados. Não suporta animações: os fotogramas distinguem-se pelos nomes numerados."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Cada sprite sem rodar, na sua tela inteira, cada um num PNG com o seu nome."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprites nunca rodados, com o recorte guardado como margens, com animações e a duração de cada fotograma."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Mosaicos nunca rodados nem recortados, numa grelha do tamanho do mosaico, mantendo as imagens como estão quando já estão numa grelha."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Cada sprite sem rodar, na sua tela inteira, em células todas do mesmo tamanho, para qualquer programa que corte a folha em grelha."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Formato próprio do Hoard: as páginas tal como estão, sprites rodados em qualquer sentido e recortados, com animações e a duração de cada fotograma."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprites rodados no sentido contrário ao dos ponteiros do relógio e recortados. Não suporta animações: os fotogramas distinguem-se pelos nomes numerados."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprites rodados no sentido dos ponteiros do relógio e recortados, com animações por nome, tal como o PixiJS e o Phaser os leem."

