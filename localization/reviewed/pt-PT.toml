[messages.formatwizard-library]
source = """
{ $files ->
        [one] { $files } file
       *[other] { $files } files
    } in { $packs ->
        [one] { $packs } pack
       *[other] { $packs } packs
    } have a name it takes. Of { $tried } tried, it reads { $read }."""
translation = """
{ $files ->
        [one] { $files } ficheiro
       *[other] { $files } ficheiros
    } em { $packs ->
        [one] { $packs } pacote
       *[other] { $packs } pacotes
    } { $files ->
        [one] tem
       *[other] têm
    } um nome que aceita. Dos { $tried } experimentados, lê { $read }."""

