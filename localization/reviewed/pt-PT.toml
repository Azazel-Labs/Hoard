translation = "Não foi possível obter o modelo: { $detail }. A tentar de novo a cada hora."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Escreva o que procura («rocha com musgo», «porta de ficção científica», «barril de madeira») e as imagens que o mostram aparecem ao lado dos nomes que têm essas palavras. «Mais como este» encontra coisas do mesmo tipo, não só das mesmas cores."

[messages.settings-conv]
source = "Conversion rules"
translation = "Regras de conversão"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Adicionar uma regra"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Está num pacote.
       *[other] Estão em { $packs } pacotes.
    } Cada original é guardado durante { $days } dias e, até lá, pode ser reposto a partir da sua página."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Um está num pacote que ainda está a ser adicionado; é convertido quando isso terminar.
       *[other] { $count } estão em pacotes que ainda estão a ser adicionados; são convertidos quando isso terminar.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
