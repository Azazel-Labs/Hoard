translation = "{ $name } já pode iniciar sessão."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude e outras aplicações de IA"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Ligue o Claude (ou qualquer aplicação MCP) e ele pode pesquisar e obter recursos por si, e descrever e etiquetar o que o Hoard ainda não descreveu. Inicia sessão no Hoard da primeira vez; autoriza-o aqui, no navegador."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "A aplicação Hoard inicia a sessão por si, por isso não há palavra-passe. Crie abaixo um token de acesso para os plugins dos motores e o comando hoard."

[messages.account-change-password]
source = "Change password"
translation = "Alterar a palavra-passe"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Settings → Connectors → Add custom connector, cole o endereço e depois Connect. Estes ligam-se a partir dos servidores da Anthropic, por isso o Hoard tem de estar acessível a partir da internet por HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Settings → Connectors → Add custom connector, cole o endereço e depois Connect. Estes ligam-se a partir dos servidores da Anthropic, por isso o Hoard tem de estar acessível a partir da internet por HTTPS (este endereço não está: defina o Endereço público em Definições → Ligação)."

