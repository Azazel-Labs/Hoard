[messages.settings-page-ai]
source = "AI tagging"
translation = "Etiquetagem por IA"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Um modelo de IA dá nome, descreve e etiqueta os pacotes novos, além das regras incorporadas. As etiquetas dele ficam marcadas como sugeridas."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Aspeto"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Os temas que este navegador usa quando está claro e quando está escuro. Guardado só neste navegador."

[messages.settings-page-auth]
source = "Authentication"
translation = "Autenticação"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Como as pessoas iniciam sessão: as contas do próprio Hoard, um diretório LDAP, o Microsoft Active Directory ou um fornecedor OAuth, quanto tempo duram as sessões e que grupos recebem que função."

[messages.settings-page-connection]
source = "Connection"
translation = "Ligação"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Como os navegadores e as aplicações chegam ao Hoard: o endereço pelo qual é conhecido, e o HTTPS, de que algumas funcionalidades do navegador precisam."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Transferências"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Como os ficheiros são nomeados no que o Hoard envia: transferências, zips, a ferramenta hoard e assistentes de IA. Os ficheiros na biblioteca ficam como estão."

[messages.settings-page-general]
source = "General"
translation = "Geral"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Como este servidor se chama, para todos os que o usam."

[messages.settings-page-general-blurb-desktop]
source = "What this library is called."
translation = "Como esta biblioteca se chama."

[messages.settings-page-issues]
source = "Issues"
translation = "Problemas"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "O que correu mal ao abrir ou processar ficheiros: arquivos que não se descomprimiram, ficheiros que não puderam ser lidos, tarefas que falharam. Tente-os de novo quando a causa estiver resolvida, ou dispense-os."

[messages.settings-page-library]
source = "Library"
translation = "Biblioteca"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "O que há no Hoard: o tamanho, de que é feito, como cresceu e quão bem está etiquetado. As coisas arquivadas não contam."

[messages.settings-page-locations]
source = "Library locations"
translation = "Locais da biblioteca"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "As pastas no servidor que contêm a biblioteca: aquelas onde o Hoard guarda ficheiros, e pastas de pacotes que indexa onde estão."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "As pastas que contêm a biblioteca: aquelas onde o Hoard guarda ficheiros, e pastas de pacotes que indexa onde estão."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Manutenção"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Faça cópias de segurança, verifique danos e arrume. Executa-se uma de cada de cada vez, e pode sair desta página enquanto decorrem."

[messages.settings-page-performance]
source = "Performance"
translation = "Desempenho"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "O esforço que o servidor faz, como as miniaturas são feitas e guardadas, e o máximo que aceita."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "O esforço que o Hoard faz, como as miniaturas são feitas e guardadas, e o máximo que aceita."

[messages.settings-page-search]
source = "Image search"
translation = "Pesquisa de imagens"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show, not only by their names, and find things that are alike in kind, not only in color."
translation = "Pesquise imagens pelo que mostram, não só pelos nomes, e encontre coisas semelhantes no tipo, não só na cor."

[messages.settings-page-store-files]
source = "Store files"
translation = "Ficheiros de loja"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Os ficheiros que as lojas põem ao lado dos seus conteúdos, que o Hoard lê para dar nome aos pacotes e creditar os autores. Ensine-lhe os que não conhece, e partilhe o que lhe ensinou."

[messages.settings-page-tags]
source = "Tags"
translation = "Etiquetas"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Todas as etiquetas da biblioteca. Funda as que significam o mesmo, ou mude o nome de uma; os etiquetadores usam o novo nome a partir daí."

[messages.settings-page-tools]
source = "Tools"
translation = "Ferramentas"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Programas externos que o Hoard usa para converter e ler ficheiros."

