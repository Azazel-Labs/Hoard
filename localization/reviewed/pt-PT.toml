[messages.settings-chatgpt-usage]
source = "Tagging requests count toward your ChatGPT plan’s usage. Manage usage shows what Hoard has used and lets you limit it. To disconnect Hoard from ChatGPT itself, go to Settings → Security and login → Sign in with ChatGPT on chatgpt.com."
translation = "Os pedidos de etiquetagem contam para a utilização do seu plano ChatGPT. Gerir utilização mostra o que o Hoard usou e permite limitá-lo. Para desligar o Hoard no próprio ChatGPT, vá a Settings → Security and login → Sign in with ChatGPT em chatgpt.com."

[messages.settings-clip-downloading]
source = "Downloading the model… progress is in the activity indicator"
translation = "A transferir o modelo… o progresso está no indicador de atividade"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Pesquisar pelo que as imagens mostram"

[messages.settings-clip-hint]
source = "Uses OpenAI’s CLIP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Usa o modelo CLIP da OpenAI, executado no processador deste servidor: nada sai dele. Ligá-la transfere o modelo ({ $size } MB) do Hugging Face e depois aprende todas as imagens em segundo plano, com baixa prioridade. Ocupa 300 a 600 MB de memória enquanto trabalha ou enquanto alguém pesquisa. Desligá-la elimina o modelo e mantém o que aprendeu, para a próxima vez."

[messages.settings-clip-hint-desktop]
source = "Uses OpenAI’s CLIP model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Usa o modelo CLIP da OpenAI, executado no processador deste computador: nada sai dele. Ligá-la transfere o modelo ({ $size } MB) do Hugging Face e depois aprende todas as imagens em segundo plano, com baixa prioridade. Ocupa 300 a 600 MB de memória enquanto trabalha ou enquanto pesquisa. Desligá-la elimina o modelo e mantém o que aprendeu, para a próxima vez."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "Pronto: a aprender imagens, { $done } de { $total } até agora"

[messages.settings-clip-looking]
