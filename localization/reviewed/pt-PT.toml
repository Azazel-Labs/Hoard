translation = "Repor a predefinição"

[messages.settings-blender-download]
source = "Uses an installed Blender, or downloads Blender 4.5 LTS (about 400 MB) from a blender.org mirror."
translation = "Usa um Blender instalado, ou transfere o Blender 4.5 LTS (cerca de 400 MB) de um espelho do blender.org."

[messages.settings-blender-what]
source = "Converts .blend, .dae, .abc and .x3d models to glTF in the background, so they get thumbnails and a 3D preview. Packs added while it was off are converted once it’s ready."
translation = "Converte modelos .blend, .dae, .abc e .x3d para glTF em segundo plano, para que tenham miniaturas e pré-visualização 3D. Os pacotes adicionados enquanto estava desligado são convertidos quando estiver pronto."

