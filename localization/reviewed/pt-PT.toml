    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Até lá, a página de um ficheiro convertido pode repor o original. As texturas não são copiadas para dentro de um modelo convertido: este aponta para os ficheiros de imagem ao seu lado. Os ficheiros .mtl ou .bin de um modelo mantêm-se."

