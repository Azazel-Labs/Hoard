[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Quando sai uma nova versão, o Hoard pode chamar um endereço assim que nada estiver a decorrer (sem carregamentos, tarefas, conversões nem manutenção), para que aquilo que atualiza o contentor não o reinicie a meio de um carregamento. Envia um POST com a versão num corpo JSON. Isto precisa da verificação de versões acima."

