source = "Type what you’re after (“distant thunder”, “glassy UI blip”, “footsteps on gravel”) and sounds that sound like it turn up beside names that have the words."
translation = "Tastați ce căutați („distant thunder”, „glassy UI blip”, „footsteps on gravel”), iar sunetele care sună așa apar lângă numele care conțin cuvintele."

[messages.settings-clip-downloading]
