[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Cum sunt stocate miniaturile și vederile modelelor noi. Cele cu transparență și pixel art sunt întotdeauna PNG. Pentru a le micșora pe cele pe care le aveți deja, rulați Micșorare a miniaturilor în Întreținere."

