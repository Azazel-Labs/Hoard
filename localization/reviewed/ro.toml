[messages.settings-tn-slots]
source = "In GLB downloads, a texture packed inside a model with no file of its own is named after the material and the slot it fills, and these slots have suffixes too:"
translation = "În descărcările GLB, o textură împachetată într-un model, fără un fișier propriu, primește numele materialului și al slotului pe care îl ocupă, iar aceste sloturi au și ele sufixe:"

[messages.settings-tn-style]
source = "Style"
translation = "Stil"

[messages.settings-tn-style-group]
source = "Naming style"
translation = "Stilul de denumire"

[messages.settings-tn-suffixes]
source = "Suffixes for each kind of map"
translation = "Sufixe pentru fiecare tip de hartă"

[messages.settings-tn-toggle]
source = "Name texture maps by their material"
translation = "Denumiți hărțile de textură după materialul lor"

[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Hărțile unui material pleacă denumite după el și după rolul fiecărei hărți, oricum ar fi denumite fișierele: Rock_Normal.png, nu rock_moss_xeokah0_raw_8K_Normal.png. Fișierele din bibliotecă nu sunt atinse, iar o hartă pe care o numește un model sau un MTL trimis împreună cu ea își păstrează numele, ca modelul să o găsească în continuare."

[messages.settings-tool-downloading]
