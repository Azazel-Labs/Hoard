[messages.settings-conv]
source = "Conversion rules"
translation = "Reguli de conversie"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Adăugați o regulă"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Se află într-un singur pachet.
        [few] Se află în { $packs } pachete.
       *[other] Se află în { $packs } de pachete.
    } Fiecare original este păstrat { $days ->
        [one] { $days } zi
        [few] { $days } zile
       *[other] { $days } de zile
    }, iar până atunci poate fi restaurat din pagina sa."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] Unul se află într-un pachet care încă se adaugă; va fi convertit după ce se termină.
        [few] { $count } se află în pachete care încă se adaugă; vor fi convertite după ce se termină.
       *[other] { $count } se află în pachete care încă se adaugă; vor fi convertite după ce se termină.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Convertiți-l
        [few] Convertiți { $count } fișiere
       *[other] Convertiți { $count } de fișiere
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Fișiere care ar fi convertite"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…și încă { $count }"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Salvați, doar pachete noi"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Salvați și convertiți-l
        [few] Salvați și convertiți { $count } fișiere
       *[other] Salvați și convertiți { $count } de fișiere
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Rămân așa cum sunt:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
        [one] Convertiți un fișier aflat deja în bibliotecă?
        [few] Convertiți { $count } fișiere aflate deja în bibliotecă?
       *[other] Convertiți { $count } de fișiere aflate deja în bibliotecă?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
        [one] Se convertește un fișier în fundal
        [few] Se convertesc { $count } fișiere în fundal
       *[other] Se convertesc { $count } de fișiere în fundal
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Convertiți fișierele aflate deja în bibliotecă"

[messages.settings-conv-from]
source = "From"
translation = "Din"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Păstrați originalele timp de"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] zi
        [few] zile
       *[other] de zile
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Până atunci, pagina unui fișier convertit poate restaura originalul. Texturile nu sunt copiate în modelul convertit: acesta trimite la fișierele de imagine de lângă el. Fișierele .mtl sau .bin ale unui model rămân."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "Nimic din bibliotecă nu trebuie convertit."

[messages.settings-conv-remove]
source = "Remove"
translation = "Eliminați"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Eliminați regula { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Anulați modificările"

[messages.settings-conv-rule-on]
source = "On"
translation = "Activă"

[messages.settings-conv-save]
source = "Save rules"
translation = "Salvați regulile"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Regulile de conversie au fost salvate. Se aplică pachetelor adăugate de acum înainte."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] un fișier a cărui copie convertită se află deja în pachetul său
        [few] { $count } fișiere ale căror copii convertite se află deja în pachetele lor
       *[other] { $count } de fișiere ale căror copii convertite se află deja în pachetele lor
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] un fișier pe care Blender nu l-a citit încă (Setări → Instrumente)
        [few] { $count } fișiere pe care Blender nu le-a citit încă (Setări → Instrumente)
       *[other] { $count } de fișiere pe care Blender nu le-a citit încă (Setări → Instrumente)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] un fișier pe care un proiect Unity îl cunoaște după nume
        [few] { $count } fișiere pe care un proiect Unity le cunoaște după nume
       *[other] { $count } de fișiere pe care un proiect Unity le cunoaște după nume
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] un fișier menționat de o scenă sau de alt fișier
        [few] { $count } fișiere menționate de o scenă sau de alt fișier
       *[other] { $count } de fișiere menționate de o scenă sau de alt fișier
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] un fișier dintr-un dosar urmărit
        [few] { $count } fișiere din dosare urmărite
       *[other] { $count } de fișiere din dosare urmărite
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "O altă regulă convertește deja acest format"

[messages.settings-conv-to]
source = "Convert to"
translation = "Convertiți în"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Îndreptați modelele la conversie (Y în sus, cu fața spre +Z), așa cum sunt afișate modelele pachetului"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Convertiți fișierele păstrate de Hoard într-un singur format, de exemplu toate OBJ și FBX în GLB, ca biblioteca să fie uniformă. Fișierul convertit ia locul originalului, cu numele, etichetele, colecțiile și linkurile sale. Fișierele din dosarele urmărite nu sunt modificate niciodată."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Descărcări convertite"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "păstrate cel mult; cele folosite cel mai demult pleacă primele"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "păstrate cel mult, acum { $size }; cele folosite cel mai demult pleacă primele"

[messages.settings-default-auto]
source = "automatic"
translation = "automat"

[messages.settings-default-off]
source = "off"
translation = "dezactivat"

[messages.settings-default-on]
source = "on"
translation = "activat"

[messages.settings-desktop-updates]
source = "Hoard looks for a new release each time it starts, downloads it in the background, and installs it when you quit."
translation = "Hoard caută o versiune nouă la fiecare pornire, o descarcă în fundal și o instalează când îl închizi."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "Folosește un ffmpeg de sistem cu codificatoarele potrivite sau descarcă un build static (aproximativ 80 MB)."

[messages.settings-ffmpeg-what]
source = "Encodes MP3, OGG and Opus downloads, and reads audio Hoard can’t decode itself (AAC, M4A, WMA, …)."
translation = "Codifică descărcările MP3, OGG și Opus și citește sunetul pe care Hoard nu îl poate decoda singur (AAC, M4A, WMA, …)."

[messages.settings-gpu-none]
source = "No GPU or software renderer found, so models get no thumbnails"
translation = "Nu s-a găsit niciun GPU sau randare software, deci modelele nu primesc miniaturi"

[messages.settings-gpu-on]
source = "On the GPU: { $renderer }"
translation = "Pe GPU: { $renderer }"

[messages.settings-gpu-software]
source = "No GPU found, so in software ({ $renderer })"
translation = "Nu s-a găsit niciun GPU, deci în software ({ $renderer })"

[messages.settings-limits]
source = "Work and limits"
translation = "Lucru și limite"

[messages.settings-limits-what]
source = "Each one saves when you leave the field or press Enter. Sizes take units: 100 GB, 512 MB, 1.5 TB; a plain number is GB."
translation = "Fiecare se salvează când părăsiți câmpul sau apăsați Enter. Mărimile au unități: 100 GB, 512 MB, 1,5 TB; un număr simplu înseamnă GB."

[messages.settings-load-failed]
