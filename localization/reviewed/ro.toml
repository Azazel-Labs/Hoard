[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "O textură care nu este una dintre hărțile unui material își păstrează numele, cu excepția cazului în care se termină cu una dintre acestea: _diff → _BC trimite rock_diff.png ca rock_BC.png. Lăsați a doua goală pentru a elimina terminația."

