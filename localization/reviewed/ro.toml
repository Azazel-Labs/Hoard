[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Când apare o versiune nouă, Hoard poate apela o adresă după ce nu se mai întâmplă nimic (nicio încărcare, sarcină, conversie sau întreținere), astfel încât ce îi actualizează containerul să nu-l repornească în mijlocul unei încărcări. Trimite un POST cu versiunea într-un corp JSON. Este nevoie de verificarea versiunilor de mai sus."

