translation = "Folosește modelul SigLIP 2 de la Google, rulat pe procesorul acestui server: nimic nu pleacă de pe el. Activarea descarcă modelul ({ $size } MB) de pe Hugging Face, apoi învață fiecare imagine în fundal, cu prioritate scăzută. Ocupă între 350 și 750 MB de memorie cât timp lucrează sau cât timp caută cineva. Dezactivarea șterge modelul și păstrează ce a învățat, pentru data viitoare."

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Folosește modelul SigLIP 2 de la Google, rulat pe procesorul acestui computer: nimic nu pleacă de pe el. Activarea descarcă modelul ({ $size } MB) de pe Hugging Face, apoi învață fiecare imagine în fundal, cu prioritate scăzută. Ocupă între 350 și 750 MB de memorie cât timp lucrează sau cât timp căutați. Dezactivarea șterge modelul și păstrează ce a învățat, pentru data viitoare."

[messages.settings-clip-hosted]
source = "A hosted service"
translation = "Un serviciu găzduit"

[messages.settings-clip-hosted-hint]
source = "Nothing is downloaded or run here: the service learns every picture, a batch at a time. Another service or model learns them all again, and what each one learned is kept, for switching back."
translation = "Nimic nu se descarcă și nu rulează aici: serviciul învață fiecare imagine, pe loturi. Alt serviciu sau model le învață din nou pe toate, iar ce a învățat fiecare se păstrează, pentru a putea reveni."

[messages.settings-clip-hosted-unavailable]
source = "Couldn’t use { $service }: { $detail }. Trying again every hour."
translation = "{ $service } nu a putut fi folosit: { $detail }. Se încearcă din nou în fiecare oră."

[messages.settings-clip-hosted-warning]
source = "Pictures leave this server. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Imaginile ies de pe acest server. O miniatură a fiecărei imagini din bibliotecă și cuvintele fiecărei căutări după imagine sunt trimise la { $service }, care le taxează și le păstrează după cum spun condițiile sale."

