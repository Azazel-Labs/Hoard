translation = "Niciun sprite nu are asta în nume."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite-uri rotite în sensul acelor de ceasornic și decupate. Nu poate păstra animații: cadrele se recunosc după numele numerotate."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Fiecare sprite drept, pe întreaga sa pânză, fiecare ca PNG cu numele lui."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprite-uri niciodată rotite, cu decuparea păstrată ca margini, cu animații și durata fiecărui cadru."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Tile-uri niciodată rotite sau decupate, pe o grilă de mărimea unui tile, păstrând imaginile neschimbate când sunt deja pe o grilă."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Fiecare sprite drept, pe întreaga sa pânză, în celule de aceeași mărime, pentru orice program care taie o foaie după o grilă."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Formatul propriu Hoard: paginile așa cum sunt, sprite-uri rotite în orice sens și decupate, cu animații și durata fiecărui cadru."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite-uri rotite în sens invers acelor de ceasornic și decupate. Nu poate păstra animații: cadrele se recunosc după numele numerotate."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprite-uri rotite în sensul acelor de ceasornic și decupate, cu animații după nume, așa cum le citesc PixiJS și Phaser."

