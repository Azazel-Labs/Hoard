[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grupurile ai căror membri primesc fiecare rol, câte unul pe rând, după nume sau DN. Câștigă cel mai înalt care se potrivește și se verifică la fiecare conectare. Dacă nu este listat niciunul, conturile noi primesc rolul de mai sus, iar un administrator îl schimbă apoi. Dacă sunt listate grupuri la Poate vedea, se pot conecta doar membrii unui grup listat."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Grupurile ai căror membri primesc fiecare rol, câte unul pe rând, după nume sau DN (sau ce listează claimul groups). Câștigă cel mai înalt care se potrivește și se verifică la fiecare conectare. Dacă nu este listat niciunul, conturile noi primesc rolul de mai sus, iar un administrator îl schimbă apoi. Dacă sunt listate grupuri la Poate vedea, se pot conecta doar membrii unui grup listat."

