translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Cont"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Parola dvs., celelalte persoane care se pot conecta și tokenurile de acces pentru scripturi și alte programe."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Adăugarea pachetelor"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Ce face Hoard cu un pachet când este adăugat, pe lângă citirea și etichetarea lui."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Etichetare AI"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Un model AI denumește, descrie și etichetează pachetele noi, pe lângă regulile integrate. Etichetele lui sunt marcate ca sugerate."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Aspect"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Temele pe care le folosește acest browser când este luminos și când este întunecat. Salvate doar în acest browser."

[messages.settings-page-auth]
source = "Authentication"
translation = "Autentificare"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Cum se conectează persoanele: conturile proprii Hoard, un director LDAP, Microsoft Active Directory sau un furnizor OAuth, cât durează sesiunile și ce grupuri primesc ce rol."

[messages.settings-page-connection]
source = "Connection"
translation = "Conexiune"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Cum ajung browserele și aplicațiile la Hoard: adresa sub care este cunoscut și HTTPS, de care au nevoie unele funcții ale browserului."

[messages.settings-page-copies]
source = "Near copies"
translation = "Aproape copii"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Fișiere care sunt aceeași imagine, același sunet sau model la altă dimensiune, frecvență de eșantionare sau în alt format, întâi cele care ocupă cel mai mult spațiu. Cea mai bună din fiecare set este marcată; nu se șterge nimic."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Descărcări"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Cum sunt denumite fișierele în ce trimite Hoard: descărcări, arhive zip, instrumentul hoard și asistenții AI. Fișierele din bibliotecă rămân cum sunt."

[messages.settings-page-general]
source = "General"
translation = "General"

[messages.settings-page-general-blurb]
source = "Your dragon’s hoard, and what this server is called."
translation = "Comoara dragonului dumneavoastră și numele acestui server."

[messages.settings-page-general-blurb-desktop]
source = "Your dragon’s hoard, and what this library is called."
translation = "Comoara dragonului dumneavoastră și numele acestei biblioteci."

[messages.settings-page-issues]
source = "Issues"
translation = "Probleme"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Ce a mers prost la deschiderea sau procesarea fișierelor: arhive care nu s-au dezarhivat, fișiere care nu au putut fi citite, sarcini care au eșuat. Reîncercați-le după ce cauza este remediată sau ignorați-le."

[messages.settings-page-library]
source = "Library"
translation = "Bibliotecă"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Ce este în Hoard: cât de mare este, din ce este alcătuit, cum a crescut și cât de bine este etichetat. Elementele arhivate nu sunt numărate."

[messages.settings-page-locations]
source = "Library locations"
translation = "Locații ale bibliotecii"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Dosarele de pe server care conțin biblioteca: cele în care Hoard păstrează fișiere și dosarele de pachete pe care le indexează acolo unde sunt."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Dosarele care conțin biblioteca: cele în care Hoard păstrează fișiere și dosarele de pachete pe care le indexează acolo unde sunt."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Întreținere"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Copii de rezervă, verificarea deteriorărilor și curățenie. Rulează câte una din fiecare odată și puteți părăsi această pagină cât timp rulează."

[messages.settings-page-performance]
source = "Performance"
translation = "Performanță"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Cât de intens lucrează serverul, cum sunt create și păstrate miniaturile și cât poate primi cel mult."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Cât de intens lucrează Hoard, cum sunt create și păstrate miniaturile și cât poate primi cel mult."

[messages.settings-page-search]
source = "Image and sound search"
translation = "Căutare după imagine și sunet"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Căutați imagini după ce arată și sunete după cum sună, nu doar după nume, și găsiți lucruri asemănătoare ca fel, nu doar ca culoare."

[messages.settings-page-store-files]
source = "Store files"
translation = "Fișiere de magazin"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Fișierele pe care magazinele le pun lângă grafica lor și pe care Hoard le citește pentru a denumi pachetele și a-i menționa pe autori. Învățați-l pe cele pe care nu le cunoaște și împărtășiți ce l-ați învățat."

[messages.settings-page-tags]
source = "Tags"
translation = "Etichete"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Toate etichetele din bibliotecă. Uniți-le pe cele care înseamnă același lucru sau redenumiți una; etichetatorii folosesc noul nume de atunci înainte."

[messages.settings-page-tools]
source = "Tools"
translation = "Instrumente"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Programe externe pe care Hoard le folosește pentru a converti și a citi fișiere."

