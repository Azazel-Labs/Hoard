translation = "Gata: se învață sunetele, { $done } din { $total } până acum"

[messages.settings-clap-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } sounds
    }"""
translation = """
{ $count ->
        [one] Gata: cunoaște { $count } sunet
        [few] Gata: cunoaște toate cele { $count } sunete
       *[other] Gata: cunoaște toate cele { $count } de sunete
    }"""

[messages.settings-clap-ready-empty]
