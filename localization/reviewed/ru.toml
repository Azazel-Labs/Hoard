translation = "Поиск по содержимому картинок"

[messages.settings-clip-hint]
source = "Uses OpenAI’s CLIP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 300 to 600 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Использует модель CLIP от OpenAI, которая работает на процессоре этого сервера: ничего наружу не уходит. При включении модель ({ $size } МБ) скачивается с Hugging Face, а затем в фоне с низким приоритетом изучает каждую картинку. Во время работы или поиска она занимает 300–600 МБ памяти. При выключении модель удаляется, а то, что она изучила, сохраняется на следующий раз."

