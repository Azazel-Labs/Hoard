[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Преобразует файлы, которые хранит Hoard, в один формат — например, все OBJ и FBX в GLB, — чтобы библиотека была единообразной. Преобразованный файл занимает место оригинала и сохраняет его имя, теги, коллекции и ссылки. Файлы в отслеживаемых папках никогда не изменяются."

