[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Когда выходит новый выпуск, Hoard может вызвать адрес, как только ничего не происходит (нет загрузок, задач, преобразований или обслуживания), чтобы то, что обновляет его контейнер, не перезапустило его посреди загрузки. Он отправляет POST с выпуском в теле JSON. Для этого нужна проверка выпусков выше."

