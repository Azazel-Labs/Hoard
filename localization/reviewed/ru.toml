[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Группы, участники которых получают каждую роль, по одной на строку, по имени или DN. Побеждает самая высокая подходящая роль, и она проверяется при каждом входе. Если групп нет, новые учётные записи получают роль выше, а администратор меняет её потом. Если указаны группы в «Может смотреть», входить могут только участники указанных групп."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Группы, участники которых получают каждую роль, по одной на строку, по имени или DN (или как их перечисляет утверждение groups). Побеждает самая высокая подходящая роль, и она проверяется при каждом входе. Если групп нет, новые учётные записи получают роль выше, а администратор меняет её потом. Если указаны группы в «Может смотреть», входить могут только участники указанных групп."

