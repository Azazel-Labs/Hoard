translation = "Текстура, которая не относится к картам материала, сохраняет своё название, если только оно не оканчивается на одно из этих окончаний: _diff → _BC отдаёт rock_diff.png как rock_BC.png. Оставьте второе поле пустым, чтобы убрать окончание."

