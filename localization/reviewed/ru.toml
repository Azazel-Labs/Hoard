[messages.auth-preset-custom-note]
source = "Keycloak, Authentik, Authelia, Okta, Zitadel and others: give the issuer and Discover fills in the addresses."
translation = "Keycloak, Authentik, Authelia, Okta, Zitadel и другие: укажите издателя (issuer), и «Найти» заполнит адреса."

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "Создайте OAuth-приложение в GitHub → Settings → Developer settings. GitHub не передаёт группы, поэтому назначайте роли в «Настройки → Учётная запись» и выключите создание учётных записей при первом входе, если только не любой обладатель учётной записи GitHub должен получить доступ."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "Создайте приложение в GitLab → Preferences → Applications (или в админке своего экземпляра: тогда замените gitlab.com в адресах)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Создайте OAuth-клиент (Web application) в Google Cloud Console → APIs & Services → Credentials. Google не передаёт группы, поэтому назначайте роли в «Настройки → Учётная запись» и выключите создание учётных записей при первом входе, если только не любой обладатель учётной записи Google должен получить доступ."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Зарегистрируйте приложение в Entra ID → App registrations (с перенаправлением Web на адрес ниже). Подставьте ID своего клиента (tenant) вместо «organizations», чтобы впускать только свою организацию. Чтобы получать роли из групп, добавьте утверждение groups в Token configuration: в нём перечислены ID групп."

