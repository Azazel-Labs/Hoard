translation = "Firefox ведёт собственный список: «Настройки» → «Приватность и защита» → «Сертификаты» → «Просмотр сертификатов» → «Центры сертификации» → «Импортировать», и отметьте «Доверять при идентификации веб-сайтов»."

[messages.https-ca-ios]
source = "Download it in Safari and allow it. Settings → Profile Downloaded → Install. Then Settings → General → About → Certificate Trust Settings → turn on “{ $subject }”."
translation = "Скачайте его в Safari и разрешите загрузку. «Настройки» → «Профиль загружен» → «Установить». Затем «Настройки» → «Основные» → «Об этом устройстве» → «Доверие сертификатам» → включите «{ $subject }»."

