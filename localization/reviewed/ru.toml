        [few] Всё это в { $packs } паках.
        [many] Всё это в { $packs } паках.
       *[other] Всё это в { $packs } пака.
    } Каждый оригинал хранится { $days ->
        [one] { $days } день
        [few] { $days } дня
        [many] { $days } дней
       *[other] { $days } дня
    }, и до тех пор его можно вернуть с его страницы."""

