translation = '. Fedora и Arch:{ " " }'

[messages.https-ca-linux-3]
source = ". Chrome on Linux keeps its own list: Settings → Privacy and security → Security → Manage certificates → Import."
translation = ". Chrome в Linux ведёт собственный список: «Настройки» → «Конфиденциальность и безопасность» → «Безопасность» → «Настроить сертификаты» → «Импорт»."

[messages.https-ca-macos]
source = "Open the file; it goes into Keychain Access. Double-click “{ $subject }” there → Trust → When using this certificate: Always Trust."
translation = "Откройте файл; он попадёт в «Связку ключей». Дважды щёлкните там «{ $subject }» → «Доверие» → «При использовании этого сертификата»: «Всегда доверять»."

[messages.https-ca-windows]
source = "Open the file → Install Certificate → Current User → Place all certificates in the following store → Browse → Trusted Root Certification Authorities → Finish. Restart the browser."
translation = "Откройте файл → «Установить сертификат» → «Текущий пользователь» → «Поместить все сертификаты в следующее хранилище» → «Обзор» → «Доверенные корневые центры сертификации» → «Готово». Перезапустите браузер."

