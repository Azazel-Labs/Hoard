[messages.settings-address]
source = "Address"
translation = "Адрес"

[messages.settings-address-what]
source = "The address people and apps use to reach Hoard, when it isn’t the one this browser is on: a reverse proxy’s, a tunnel’s or a tailnet name, like https://hoard.example.com. Links Hoard hands out (to Claude and other apps, in sign-in, on its certificate) use it."
translation = "Адрес, по которому люди и приложения обращаются к Hoard, если он отличается от адреса в этом браузере: адрес обратного прокси, туннеля или имя в tailnet, например https://hoard.example.com. Его используют ссылки, которые выдаёт Hoard (для Claude и других приложений, при входе, в его сертификате)."

[messages.settings-ai-anthropic-hint]
source = "Hosted by Anthropic, through its OpenAI-compatible endpoint."
