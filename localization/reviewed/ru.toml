[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Движущиеся миниатюры анимаций"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Каждая анимация также получает короткий зацикленный ролик, который играет, пока вы наводите указатель на её плитку. Каждый занимает около 40 КБ, а для большой библиотеки их создание занимает время. При выключении они удаляются."

[messages.settings-name]
source = "Name"
translation = "Название"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Как этот сервер называется на верхней панели, во вкладке браузера и на странице входа, чтобы при нескольких серверах Hoard можно было их различать."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Учётная запись"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Ваш пароль, другие люди, которые могут входить, и токены доступа для скриптов и других программ."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Добавление паков"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Что Hoard делает с паком при добавлении, кроме чтения и расстановки тегов."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Теги от ИИ"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "ИИ-модель называет, описывает и размечает тегами новые паки в дополнение к встроенным правилам. Её теги помечаются как предложенные."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Оформление"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Темы, которые этот браузер использует в светлом и в тёмном режиме. Сохраняется только в этом браузере."

[messages.settings-page-auth]
source = "Authentication"
translation = "Аутентификация"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Как входят пользователи: собственные учётные записи Hoard, каталог LDAP, Microsoft Active Directory или провайдер OAuth, сколько длятся сеансы и какие группы получают какую роль."

[messages.settings-page-connection]
source = "Connection"
translation = "Подключение"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Как браузеры и приложения обращаются к Hoard: адрес, по которому он известен, и HTTPS, который нужен некоторым функциям браузера."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Скачивание"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Как называются файлы в том, что отдаёт Hoard: при скачивании, в zip, в инструменте hoard и для ИИ-ассистентов. Файлы в библиотеке остаются как есть."

[messages.settings-page-general]
source = "General"
translation = "Общие"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Как называется этот сервер — для всех, кто им пользуется."

[messages.settings-page-issues]
source = "Issues"
translation = "Проблемы"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Что пошло не так при открытии или обработке файлов: архивы, которые не распаковались, файлы, которые не удалось прочитать, задачи, завершившиеся ошибкой. Повторите их, когда причина устранена, или уберите."

[messages.settings-page-library]
source = "Library"
translation = "Библиотека"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Что есть в Hoard: какой он большой, из чего состоит, как рос и насколько хорошо размечен тегами. Содержимое архива не учитывается."

[messages.settings-page-locations]
source = "Library locations"
translation = "Места хранения"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Папки на сервере, в которых лежит библиотека: те, где Hoard хранит файлы, и папки с паками, которые он индексирует на месте."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Обслуживание"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Резервное копирование, проверка на повреждения и уборка. Каждая задача выполняется в одном экземпляре, и пока они идут, эту страницу можно покинуть."

[messages.settings-page-performance]
source = "Performance"
translation = "Производительность"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Насколько интенсивно работает сервер, как создаются и хранятся миниатюры и сколько он принимает максимум."

[messages.settings-page-search]
source = "Image search"
translation = "Поиск по картинкам"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show, not only by their names, and find things that are alike in kind, not only in color."
translation = "Ищите картинки по тому, что на них изображено, а не только по названиям, и находите похожие по сути, а не только по цвету."

[messages.settings-page-store-files]
source = "Store files"
translation = "Файлы магазинов"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Файлы, которые магазины кладут рядом с контентом и которые Hoard читает, чтобы назвать паки и указать их авторов. Научите его тем, которых он не знает, и поделитесь тем, чему научили."

[messages.settings-page-tags]
source = "Tags"
translation = "Теги"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Все теги библиотеки. Объединяйте теги с одинаковым значением или переименовывайте; разметчики с этого момента используют новое название."

[messages.settings-page-tools]
source = "Tools"
translation = "Инструменты"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Внешние программы, которыми Hoard преобразует и читает файлы."

