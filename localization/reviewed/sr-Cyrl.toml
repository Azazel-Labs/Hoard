translation = "Свака иде у фасциклу резервних копија као hoard-auto-…db, и у другу фасциклу (други диск или фасциклу коју чува апликација за синхронизацију) ако постоји, задату пуном путањом на серверу. Уклањају се само старије заказане копије; оне направљене ручно остају."

