[messages.error-chatgpt-signed-out-desktop]
source = "ChatGPT signed Hoard out ({ $code }); sign in again from Settings → AI tagging"
translation = "ChatGPT је одјавио Hoard ({ $code }); пријавите се поново у Подешавања → Означавање помоћу ВИ"

