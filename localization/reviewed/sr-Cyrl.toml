[messages.auth-roles-from-groups]
source = "Roles from groups"
translation = "Улоге из група"

[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Групе чији чланови добијају сваку улогу, по једна у реду, по имену или DN-у. Побеђује највиша која одговара и проверава се при свакој пријави. Ако ниједна није наведена, нови налози добијају улогу изнад, а администратор је после мења. Ако су групе наведене под „Може да гледа“, пријавити се могу само чланови наведене групе."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Групе чији чланови добијају сваку улогу, по једна у реду, по имену или DN-у (или шта год groups claim наводи). Побеђује највиша која одговара и проверава се при свакој пријави. Ако ниједна није наведена, нови налози добијају улогу изнад, а администратор је после мења. Ако су групе наведене под „Може да гледа“, пријавити се могу само чланови наведене групе."

