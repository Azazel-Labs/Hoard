translation = "Претрага по томе како звуци звуче"

[messages.settings-clap-hint]
source = "Uses LAION’s CLAP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Користи LAION-ов модел CLAP, који ради на процесору овог сервера: ништа не напушта сервер. Укључивање преузима модел ({ $size } MB) са Hugging Face-а, а затим у позадини, ниским приоритетом, преслушава почетак сваког звука. Заузима до око 1 GB меморије док ради или док неко претражује. Искључивање брише модел и чува оно што је научио, за следећи пут."

