[messages.about-edition-steam]
source = "Desktop app from Steam"
translation = "Апликација за рачунар са Steam-а"

[messages.about-ffmpeg]
source = "Converts sound and video and makes their previews."
translation = "Претвара звук и видео и прави њихове прегледе."

[messages.about-filter]
source = "Filter by name or license"
