translation = "Користи LAION-ов модел CLAP, који ради на процесору овог рачунара: ништа не напушта рачунар. Укључивање преузима модел ({ $size } MB) са Hugging Face-а, а затим у позадини, ниским приоритетом, преслушава почетак сваког звука. Заузима до око 1 GB меморије док ради или док претражујете. Искључивање брише модел и чува оно што је научио, за следећи пут."

