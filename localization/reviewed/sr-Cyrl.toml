[messages.about-blender]
source = "Converts 3D models and makes their thumbnails."
translation = "Претвара 3D моделе и прави њихове сличице."

[messages.about-built-with]
source = "Built with"
translation = "Направљено помоћу"

[messages.about-built-with-what]
source = "The open source libraries Hoard is made from, with their licenses."
translation = "Библиотеке отвореног кода од којих је Hoard направљен, са њиховим лиценцама."

[messages.about-clap]
source = "Finds sounds by what they sound like."
translation = "Проналази звукове по томе како звуче."

[messages.about-count]
source = "{ $shown } of { $total }"
translation = "{ $shown } од { $total }"

[messages.about-discord]
source = "Chat with us on Discord"
translation = "Ћаскајте са нама на Discord-у"

[messages.about-downloaded]
source = "Downloaded when needed"
translation = "Преузима се по потреби"

[messages.about-downloaded-what]
source = "Hoard doesn’t come with these. It downloads each one the first time something needs it, and each comes under its own license."
translation = "Hoard их не садржи. Свако од њих преузима први пут када затреба, и свако има сопствену лиценцу."

[messages.about-edition]
source = "Edition"
translation = "Издање"

