translation = "GitHub пријава је сачувана; преузимање се поново покушава"

[messages.settings-unreal-github-step-enter]
source = "Enter your GitHub user name and the token here, then choose Automatic."
translation = "Овде унесите своје GitHub корисничко име и токен, а затим изаберите „Аутоматски“."

[messages.settings-unreal-github-step-invite]
source = "Accept the invitation to the EpicGames organization that GitHub emails you (it can take a few minutes to arrive)."
translation = "Прихватите позивницу у организацију EpicGames коју вам GitHub шаље е-поштом (може да потраје неколико минута док не стигне)."

[messages.settings-unreal-github-step-link]
source = "Link your GitHub account to your Epic Games account."
translation = "Повежите свој GitHub налог са својим Epic Games налогом."

[messages.settings-unreal-github-step-link-go]
source = "How to link them"
translation = "Како да их повежете"

[messages.settings-unreal-github-step-token]
source = "Make a GitHub token (classic) with only read:packages ticked."
translation = "Направите GitHub токен (classic) у коме је означено само read:packages."

[messages.settings-unreal-github-step-token-go]
source = "Make a token"
translation = "Направи токен"

[messages.settings-unreal-github-token]
source = "Token"
translation = "Токен"

[messages.settings-unreal-github-token-kept]
source = "Saved (type a new one to replace it)"
translation = "Сачувано (унесите нови да бисте га заменили)"

[messages.settings-unreal-github-user]
source = "GitHub user name"
translation = "GitHub корисничко име"

[messages.settings-unreal-github-why]
source = "Epic publishes the Linux editor as a private image on GitHub’s package registry (ghcr.io), and Hoard downloads it from there with crane, which comes with Hoard. GitHub only hands it to accounts that Epic has let in, so Hoard needs one to download it as. Hoard keeps the token with its other settings and uses it for nothing else."
translation = "Epic објављује Linux уређивач као приватну слику у GitHub-овом регистру пакета (ghcr.io), а Hoard га одатле преузима помоћу алата crane, који долази уз Hoard. GitHub га даје само налозима којима је Epic одобрио приступ, па је Hoard-у потребан налог преко ког ће га преузети. Hoard чува токен са осталим подешавањима и не користи га ни за шта друго."

[messages.settings-unreal-image]
source = "Unreal version or image"
translation = "Unreal верзија или слика"

[messages.settings-unreal-keep]
source = "Convert, keep originals"
translation = "Претвори, задржи оригинале"

[messages.settings-unreal-keep-hint]
source = "Textures, sounds and materials come out in common formats; the .uasset stays too."
translation = "Текстуре, звукови и материјали излазе у уобичајеним форматима; .uasset такође остаје."

[messages.settings-unreal-off]
