[messages.settings-unreal]
source = "Unreal packages"
translation = "Unreal пакети"

[messages.settings-unreal-download]
source = "Downloads Epic’s Linux x86-64 editor, once, into Hoard’s tools folder. It takes tens of GB of disk space, and a GitHub account Epic has let in (see GitHub sign-in)."
translation = "Једном преузима Epic Linux x86-64 уређивач у фасциклу алата Hoard-а. Заузима десетине GB на диску и захтева GitHub налог коме је Epic одобрио приступ (погледајте Пријава на GitHub)."

[messages.settings-unreal-editor-what]
source = "Installs Unreal Editor for the export worker. Run the worker separately to export assets."
translation = "Инсталира Unreal Editor за процес извоза. Покрените га засебно да бисте извезли ресурсе."

[messages.settings-unreal-github]
source = "GitHub sign-in"
translation = "Пријава на GitHub"

[messages.settings-unreal-github-forget]
source = "Forget"
translation = "Заборави"

[messages.settings-unreal-github-forgotten]
source = "GitHub sign-in forgotten"
translation = "GitHub пријава је заборављена"

[messages.settings-unreal-github-from-server]
source = "This server was also given a sign-in of its own (GHCR_TOKEN_FILE or DOCKER_CONFIG); it’s used when none is saved here."
translation = "Овај сервер је добио и сопствену пријаву (GHCR_TOKEN_FILE или DOCKER_CONFIG); она се користи када овде ниједна није сачувана."

[messages.settings-unreal-github-save]
source = "Save sign-in"
translation = "Сачувај пријаву"

[messages.settings-unreal-github-saved]
