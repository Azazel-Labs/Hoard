[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "Звук остаје потпуно исти, на отприлике половини простора, а све остало из WAV датотеке (тачке петље, cue ознаке, ознаке) чува се у FLAC датотеци, па се WAV у сваком тренутку може вратити тачно онакав какав је био. WAV датотеке са узорцима у покретном зарезу или 32-битним узорцима остају WAV."

