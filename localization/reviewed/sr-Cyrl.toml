[messages.server-maintenance-avif-thumbs]
source = "Convert thumbnails to AVIF"
translation = "Претвори сличице у AVIF"

[messages.server-maintenance-avif-thumbs-blurb]
source = "Converts every thumbnail now, rather than as each is first shown, when thumbnails are sent as AVIF."
translation = "Претвара све сличице сада, уместо сваку када се први пут прикаже, када се сличице шаљу као AVIF."

[messages.server-maintenance-backup]
source = "Back up the database"
translation = "Направи резервну копију базе"

[messages.server-maintenance-backup-blurb]
source = "A consistent copy of the database (packs, tags, notes, collections and Settings) in the backups folder next to it. The library's files aren't in it: they never change once stored, so any file sync backs them up."
translation = "Доследна копија базе података (пакети, ознаке, белешке, колекције и Подешавања) у фасцикли backups поред ње. Датотеке библиотеке нису у њој: оне се никад не мењају кад се сачувају, па их свака синхронизација датотека чува."

[messages.server-maintenance-clear-cache]
source = "Clear cached conversions"
translation = "Обриши кеширана претварања"

[messages.server-maintenance-clear-cache-blurb]
source = "Drops the files kept from “Download as” conversions (they're made again when next asked for) and what interrupted work left behind."
translation = "Брише датотеке сачуване од претварања „Преузми као“ (поново се праве кад се следећи пут затраже) и оно што је остало од прекинутог рада."

[messages.server-maintenance-gc]
source = "Delete unused files"
translation = "Обриши некоришћене датотеке"

[messages.server-maintenance-gc-blurb]
source = "Deletes stored files nothing points at any more, such as the files of packs deleted for good."
translation = "Брише сачуване датотеке на које више ништа не упућује, као што су датотеке трајно обрисаних пакета."

[messages.server-maintenance-reanalyze]
source = "Re-analyze every pack"
translation = "Поново анализирај сваки пакет"

[messages.server-maintenance-reanalyze-blurb]
source = "Reads every file again with this version of Hoard: thumbnails, previews, details and rule tags are made afresh. Your own edits stay; the AI isn't asked again."
translation = "Поново чита сваку датотеку овом верзијом Hoard-а: сличице, прегледи, детаљи и ознаке из правила праве се изнова. Ваше измене остају; ВИ се не пита поново."

[messages.server-maintenance-scrub]
source = "Check files for damage"
translation = "Провери датотеке на оштећења"

[messages.server-maintenance-scrub-blurb]
source = "Reads every stored file back and checks it against its fingerprint, to catch files that have rotted or gone missing from a disk or NAS. Takes a while on a big library."
translation = "Поново чита сваку сачувану датотеку и проверава је према њеном отиску, да би открио датотеке које су се оштетиле или нестале с диска или NAS-а. На великој библиотеци траје неко време."

[messages.server-maintenance-shrink-thumbs]
source = "Shrink thumbnails"
translation = "Смањи сличице"

[messages.server-maintenance-shrink-thumbs-blurb]
source = "Stores the thumbnails and model views kept as PNG the way Settings → Performance → Thumbnails asks, which usually makes them several times smaller. Ones with transparency, and pixel art, stay PNG."
translation = "Чува сличице и приказе модела сачуване као PNG онако како тражи Подешавања → Перформансе → Сличице, што их обично чини неколико пута мањим. Оне с провидношћу и пиксел-арт остају PNG."

