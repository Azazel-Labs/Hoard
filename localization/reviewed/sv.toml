Visar det { $preview ->
        [light] ljusa
       *[dark] mörka
    } temat så att du kan se det. Du använder { $used ->
        [light] ljust
       *[dark] mörkt
    }{ $system ->
        [yes] { " " }(följer systemet)
       *[other] { "" }
    }, och det kommer tillbaka när du lämnar sidan."""

