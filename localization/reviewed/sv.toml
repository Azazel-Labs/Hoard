translation = "Inloggad som { $email }"

[messages.settings-chatgpt-usage]
source = "Tagging requests count toward your ChatGPT plan’s usage. Manage usage shows what Hoard has used and lets you limit it. To disconnect Hoard from ChatGPT itself, go to Settings → Security and login → Sign in with ChatGPT on chatgpt.com."
translation = "Taggningsbegäranden räknas mot ditt ChatGPT-abonnemangs användning. Hantera användning visar vad Hoard har använt och låter dig begränsa det. Om du vill koppla från Hoard i själva ChatGPT går du till Inställningar → Säkerhet och inloggning → Logga in med ChatGPT på chatgpt.com."

[messages.settings-clap-heading]
source = "Search by what sounds sound like"
translation = "Sök efter hur ljud låter"

[messages.settings-clap-hint]
source = "Uses LAION’s CLAP model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Använder LAION:s CLAP-modell, som körs på den här serverns processor: inget lämnar den. När du slår på den laddas modellen ner ({ $size } MB) från Hugging Face, och sedan lyssnar den på början av varje ljud i bakgrunden med låg prioritet. Den tar upp till ungefär 1 GB minne medan den arbetar eller någon söker. När du stänger av den raderas modellen men det den har lärt sig behålls, till nästa gång."

[messages.settings-clap-hint-desktop]
source = "Uses LAION’s CLAP model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then listens to the start of every sound in the background at low priority. It takes up to about 1 GB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Använder LAION:s CLAP-modell, som körs på den här datorns processor: inget lämnar den. När du slår på den laddas modellen ner ({ $size } MB) från Hugging Face, och sedan lyssnar den på början av varje ljud i bakgrunden med låg prioritet. Den tar upp till ungefär 1 GB minne medan den arbetar eller du söker. När du stänger av den raderas modellen men det den har lärt sig behålls, till nästa gång."

[messages.settings-clap-learning]
source = "Ready: learning sounds, { $done } of { $total } so far"
translation = "Klar: lär sig ljud, { $done } av { $total } hittills"

[messages.settings-clap-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } sounds
    }"""
translation = """
{ $count ->
        [one] Klar: känner till { $count } ljud
       *[other] Klar: känner till alla { $count } ljud
    }"""

[messages.settings-clap-ready-empty]
source = "Ready. Sounds are learned as packs are added."
translation = "Klar. Ljud lärs in när paket läggs till."

[messages.settings-clap-reset]
source = "Sound search: back to the default"
translation = "Ljudsökning: tillbaka till standardvärdet"

[messages.settings-clap-saved-off]
source = "Sound search: off"
translation = "Ljudsökning: av"

[messages.settings-clap-saved-on]
source = "Sound search: on"
translation = "Ljudsökning: på"

[messages.settings-clap-toggle]
source = "Turn on sound search"
translation = "Slå på ljudsökning"

[messages.settings-clap-what]
source = "Type what you’re after (“distant thunder”, “glassy UI blip”, “footsteps on gravel”) and sounds that sound like it turn up beside names that have the words."
translation = "Skriv vad du letar efter (”distant thunder”, ”glassy UI blip”, ”footsteps on gravel”) så dyker ljud som låter så upp bredvid namn som innehåller orden."

[messages.settings-clip-downloading]
source = "Downloading the model… progress is in the activity indicator"
translation = "Laddar ner modellen… förloppet visas i aktivitetsindikatorn"

[messages.settings-clip-heading]
source = "Search by what pictures show"
translation = "Sök efter vad bilder visar"

[messages.settings-clip-here]
source = "This server: nothing leaves it"
translation = "Den här servern: inget lämnar den"

[messages.settings-clip-here-desktop]
source = "This computer: nothing leaves it"
translation = "Den här datorn: inget lämnar den"

[messages.settings-clip-hint]
source = "Uses Google’s SigLIP 2 model, run on this server’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or someone searches. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Använder Googles SigLIP 2-modell, som körs på den här serverns processor: inget lämnar den. När du slår på den laddas modellen ner ({ $size } MB) från Hugging Face, och sedan lär den sig varje bild i bakgrunden med låg prioritet. Den tar 350 till 750 MB minne medan den arbetar eller någon söker. När du stänger av den raderas modellen men det den har lärt sig behålls, till nästa gång."

[messages.settings-clip-hint-desktop]
source = "Uses Google’s SigLIP 2 model, run on this computer’s processor: nothing leaves it. Turning it on downloads the model ({ $size } MB) from Hugging Face, then learns every picture in the background at low priority. It takes 350 to 750 MB of memory while it works or you search. Turning it off deletes the model and keeps what it learned, for next time."
translation = "Använder Googles SigLIP 2-modell, som körs på den här datorns processor: inget lämnar den. När du slår på den laddas modellen ner ({ $size } MB) från Hugging Face, och sedan lär den sig varje bild i bakgrunden med låg prioritet. Den tar 350 till 750 MB minne medan den arbetar eller du söker. När du stänger av den raderas modellen men det den har lärt sig behålls, till nästa gång."

[messages.settings-clip-hosted]
source = "A hosted service"
translation = "En värdbaserad tjänst"

[messages.settings-clip-hosted-hint]
source = "Nothing is downloaded or run here: the service learns every picture, a batch at a time. Another service or model learns them all again, and what each one learned is kept, for switching back."
translation = "Inget laddas ned eller körs här: tjänsten lär sig varje bild, en omgång i taget. En annan tjänst eller modell lär sig alla igen, och det varje har lärt sig sparas, så att du kan byta tillbaka."

[messages.settings-clip-hosted-unavailable]
source = "Couldn’t use { $service }: { $detail }. Trying again every hour."
translation = "Kunde inte använda { $service }: { $detail }. Försöker igen varje timme."

[messages.settings-clip-hosted-warning]
source = "Pictures leave this server. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Bilder lämnar den här servern. En miniatyr av varje bild i biblioteket och orden i varje bildsökning skickas till { $service }, som tar betalt för dem och behåller dem enligt sina villkor."

[messages.settings-clip-hosted-warning-desktop]
source = "Pictures leave this computer. A thumbnail of every picture in the library, and the words of every image search, are sent to { $service }, which charges for them and keeps them as its terms say."
translation = "Bilder lämnar den här datorn. En miniatyr av varje bild i biblioteket och orden i varje bildsökning skickas till { $service }, som tar betalt för dem och behåller dem enligt sina villkor."

[messages.settings-clip-learning]
source = "Ready: learning pictures, { $done } of { $total } so far"
translation = "Klar: lär sig bilder, { $done } av { $total } hittills"

[messages.settings-clip-looking]
source = "Looking for the model…"
translation = "Letar efter modellen…"

[messages.settings-clip-ready-all]
source = """
{ $count ->
       *[other] Ready: knows all { $count } pictures
    }"""
translation = """
{ $count ->
        [one] Klar: känner till { $count } bild
       *[other] Klar: känner till alla { $count } bilder
    }"""

[messages.settings-clip-ready-empty]
source = "Ready. Pictures are learned as packs are added."
translation = "Klar. Bilder lärs in när paket läggs till."

[messages.settings-clip-relearning]
source = "Until the new model has learned every picture, searches use what the old one learned."
translation = "Tills den nya modellen har lärt sig varje bild använder sökningar det den gamla lärde sig."

[messages.settings-clip-reset]
source = "Image search: back to the default"
translation = "Bildsökning: tillbaka till standardvärdet"

[messages.settings-clip-saved-here]
source = "Image search: runs on this server"
translation = "Bildsökning: körs på den här servern"

[messages.settings-clip-saved-here-desktop]
source = "Image search: runs on this computer"
translation = "Bildsökning: körs på den här datorn"

[messages.settings-clip-saved-hosted]
source = "Image search: runs on { $service }"
translation = "Bildsökning: körs hos { $service }"

[messages.settings-clip-saved-off]
source = "Image search: off"
translation = "Bildsökning: av"

[messages.settings-clip-saved-on]
source = "Image search: on"
translation = "Bildsökning: på"

[messages.settings-clip-toggle]
source = "Turn on image search"
translation = "Slå på bildsökning"

[messages.settings-clip-unavailable]
source = "Couldn’t get the model: { $detail }. Trying again every hour."
translation = "Kunde inte hämta modellen: { $detail }. Försöker igen varje timme."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Skriv vad du letar efter (”mossy rock”, ”sci-fi door”, ”wooden barrel”) så dyker bilder som visar det upp bredvid namn som innehåller orden. ”Fler som den här” hittar saker av samma slag, inte bara med samma färger."

[messages.settings-clip-where]
source = "Runs on"
translation = "Körs på"

[messages.settings-conv]
source = "Conversion rules"
translation = "Konverteringsregler"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Lägg till en regel"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
        [one] Den finns i ett paket.
       *[other] De finns i { $packs } paket.
    } Varje original sparas i { $days } dagar, och till dess kan det läggas tillbaka från sin sida."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
        [one] En finns i ett paket som fortfarande läggs till; den konverteras när det är klart.
       *[other] { $count } finns i paket som fortfarande läggs till; de konverteras när det är klart.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Konvertera den
       *[other] Konvertera { $count } filer
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Filer som skulle konverteras"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…och { $count } till"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Spara, bara nya paket"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
        [one] Spara och konvertera den
       *[other] Spara och konvertera { $count } filer
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Lämnas som de är:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
        [one] Konvertera en fil som redan finns i biblioteket?
       *[other] Konvertera { $count } filer som redan finns i biblioteket?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
        [one] Konverterar en fil i bakgrunden
       *[other] Konverterar { $count } filer i bakgrunden
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Konvertera filer som redan finns i biblioteket"

[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "Ljudet förblir exakt detsamma, på ungefär halva utrymmet, och allt annat i WAV-filen (looppunkter, cue-markörer, taggar) behålls i FLAC-filen, så att WAV-filen när som helst kan läggas tillbaka exakt som den var. WAV-filer med flyttals- eller 32-bitarssampel förblir WAV."

[messages.settings-conv-from]
source = "From"
translation = "Från"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Behåll originalen i"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
        [one] dag
       *[other] dagar
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Till dess kan en konverterad fils sida lägga tillbaka originalet. Texturer kopieras inte in i en konverterad modell: den pekar på bildfilerna bredvid den. En modells .mtl- eller .bin-filer ligger kvar."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "Inget i biblioteket behöver konverteras."

[messages.settings-conv-remove]
source = "Remove"
translation = "Ta bort"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Ta bort regel { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Ångra ändringar"

[messages.settings-conv-rule-on]
source = "On"
translation = "På"

[messages.settings-conv-save]
source = "Save rules"
translation = "Spara regler"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Konverteringsreglerna har sparats. De gäller för paket som läggs till från och med nu."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
        [one] en fil vars konverterade kopia redan finns i dess paket
       *[other] { $count } filer vars konverterade kopior redan finns i deras paket
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
        [one] en fil som Blender inte har läst än (Inställningar → Verktyg)
       *[other] { $count } filer som Blender inte har läst än (Inställningar → Verktyg)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
        [one] en fil som ett Unity-projekt hänvisar till med namn
       *[other] { $count } filer som ett Unity-projekt hänvisar till med namn
    }"""

[messages.settings-conv-skip-used]
source = """
{ $count ->
        [one] one file a scene or another file names
       *[other] { $count } files a scene or another file names
    }"""
translation = """
{ $count ->
        [one] en fil som en scen eller en annan fil nämner
       *[other] { $count } filer som en scen eller en annan fil nämner
    }"""

[messages.settings-conv-skip-watched]
source = """
{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
        [one] en fil i en bevakad mapp
       *[other] { $count } filer i bevakade mappar
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "En annan regel konverterar det här formatet"

[messages.settings-conv-to]
source = "Convert to"
translation = "Konvertera till"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Vänd modeller upprätt när de konverteras (Y upp, vända mot +Z), så som paketets modeller visas"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Konvertera filer som Hoard lagrar till ett format, till exempel alla OBJ och FBX till GLB, så att hela biblioteket blir enhetligt. Den konverterade filen tar originalets plats, med dess namn, taggar, samlingar och länkar. Filer i bevakade mappar ändras aldrig."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Konverterade nedladdningar"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "sparas som mest; de som använts minst nyligen tas bort först"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "sparas som mest, { $size } nu; de som använts minst nyligen tas bort först"

[messages.settings-default-auto]
source = "automatic"
translation = "automatiskt"

[messages.settings-default-off]
source = "off"
translation = "av"

[messages.settings-default-on]
source = "on"
translation = "på"

[messages.settings-desktop-updates]
source = "Hoard looks for a new release each time it starts, downloads it in the background, and installs it when you quit."
translation = "Hoard letar efter en ny version varje gång det startar, laddar ned den i bakgrunden och installerar den när du avslutar."

[messages.settings-editor-path]
source = "Enter the executable path of your installed { $tool }. Automatic installation is available only in Docker."
