[messages.about-version]
source = "Version"
translation = "Version"

[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "Hoard samlar speltillgångar (modeller, texturer, ljud, musik, sprites och mer) i ett bibliotek som du kan söka i, förhandsgranska och ta från, delat med alla du ger åtkomst."

[messages.account-add]
source = "Add"
translation = "Lägg till"

[messages.account-add-failed]
source = "Couldn't add { $name }"
translation = "Kunde inte lägga till { $name }"

[messages.account-added]
source = "{ $name } can sign in now."
translation = "{ $name } kan logga in nu."

[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude och andra AI-appar"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Anslut Claude (eller valfri MCP-app) så kan den söka efter och hämta resurser åt dig, och beskriva och tagga det som Hoard inte har hunnit med än. Den loggar in i Hoard första gången; du godkänner det här i webbläsaren."

[messages.account-app-signin]
source = "The Hoard app signs you in by itself, so there’s no password. Make an access token below for the engine plugins and the hoard command."
translation = "Hoard-appen loggar in dig själv, så det finns inget lösenord. Skapa en åtkomsttoken nedan för motortilläggen och kommandot hoard."

[messages.account-change-password]
source = "Change password"
translation = "Byt lösenord"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Settings → Connectors → Add custom connector, klistra in adressen och välj sedan Connect. De ansluter från Anthropics servrar, så Hoard måste kunna nås från internet över HTTPS."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Settings → Connectors → Add custom connector, klistra in adressen och välj sedan Connect. De ansluter från Anthropics servrar, så Hoard måste kunna nås från internet över HTTPS (den här adressen kan inte det: ange Offentlig adress i Inställningar → Anslutning)."

