[messages.settings-backups]
source = "Scheduled backups"
translation = "Schemalagda säkerhetskopior"

[messages.settings-backups-kept]
source = "Each goes in the backups folder as hoard-auto-…db, and to the other folder (another disk, or one a sync app backs up) when there’s one, given by its full path on the server. Only older scheduled backups are removed; ones made by hand stay."
translation = "Varje kopia hamnar i säkerhetskopiemappen som hoard-auto-…db, och i den andra mappen (en annan disk, eller en som en synkapp säkerhetskopierar) om det finns en, angiven med sin fullständiga sökväg på servern. Bara äldre schemalagda kopior tas bort; de som gjorts för hand blir kvar."

[messages.settings-backups-what]
source = "The database backs itself up on its own; each backup shows in the history below."
translation = "Databasen säkerhetskopierar sig själv; varje kopia visas i historiken nedan."

[messages.settings-blender-download]
source = "Uses an installed Blender, or downloads Blender 4.5 LTS (about 400 MB) from a blender.org mirror."
translation = "Använder en installerad Blender, eller laddar ner Blender 4.5 LTS (cirka 400 MB) från en spegel av blender.org."

[messages.settings-blender-what]
source = "Converts .blend, .dae, .abc and .x3d models to glTF in the background, so they get thumbnails and a 3D preview. Packs added while it was off are converted once it’s ready."
translation = "Konverterar .blend-, .dae-, .abc- och .x3d-modeller till glTF i bakgrunden, så att de får miniatyrbilder och en 3D-förhandsvisning. Paket som lades till medan det var avstängt konverteras när det är klart."

