translation = "{ $fps } fps"

[messages.settings-motion-fps-what]
source = "Smoother movies take longer to make and more room: about twice as much at 24 fps as at 12, and more again at 30. Changing it makes them all again."
translation = "Mjukare filmer tar längre tid att göra och mer plats: ungefär dubbelt så mycket vid 24 fps som vid 12, och ännu mer vid 30. Ändrar du den görs alla om."

[messages.settings-motion-thumbs]
source = "Moving thumbnails for animations"
translation = "Rörliga miniatyrer för animationer"

[messages.settings-motion-thumbs-what]
source = "Each animation also gets a short looping movie of it playing, shown while you point at its tile. They take about 40 KB each and a while to make for a big library. Turning this off deletes them."
translation = "Varje animation får också en kort film i loop som spelas medan du pekar på dess ruta. De tar ungefär 40 kB var och en stund att göra för ett stort bibliotek. Stänger du av det tas de bort."

[messages.settings-name]
source = "Name"
translation = "Namn"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Vad den här servern heter i det övre fältet, på webbläsarfliken och på inloggningssidan, så att du kan skilja dem åt om du har mer än en Hoard."

[messages.settings-name-what-desktop]
source = "What this library is called in the top bar."
translation = "Vad det här biblioteket heter i det övre fältet."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-about]
source = "About"
translation = "Om"

[messages.settings-page-about-blurb]
source = "What Hoard is, which version this is, and the work of others it’s made with."
translation = "Vad Hoard är, vilken version det här är och andras arbete som det är byggt av."

[messages.settings-page-account]
source = "Account"
translation = "Konto"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Ditt lösenord, de andra personerna som kan logga in och åtkomsttoken för skript och andra program."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Lägga till paket"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Vad Hoard gör med ett paket när det läggs till, förutom att läsa och tagga det."

[messages.settings-page-ai]
source = "AI tagging"
translation = "AI-taggning"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "En AI-modell namnger, beskriver och taggar nya paket, utöver de inbyggda reglerna. Dess taggar markeras som föreslagna."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Utseende"

[messages.settings-page-appearance-blurb]
source = "Language, themes, text size and spacing, and what the tiles and the top bar show. Saved in this browser only."
translation = "Språk, teman, textstorlek och avstånd, och vad rutorna och toppfältet visar. Sparas bara i den här webbläsaren."

[messages.settings-page-auth]
source = "Authentication"
translation = "Autentisering"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Hur personer loggar in: Hoards egna konton, en LDAP-katalog, Microsoft Active Directory eller en OAuth-leverantör, hur länge sessioner varar och vilka grupper som får vilken roll."

[messages.settings-page-connection]
source = "Connection"
translation = "Anslutning"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Hur webbläsare och appar når Hoard: adressen det är känt under, och HTTPS, som vissa webbläsarfunktioner kräver."

[messages.settings-page-copies]
source = "Near copies"
translation = "Nästan-kopior"

[messages.settings-page-copies-blurb]
source = "Files that are the same picture, sound or model at another size, rate or format, the most space taken first. The best of each set is marked; nothing is deleted."
translation = "Filer som är samma bild, ljud eller modell i en annan storlek, samplingsfrekvens eller ett annat format, de som tar mest plats först. Den bästa i varje uppsättning är markerad; inget raderas."

[messages.settings-page-downloads]
source = "Downloads"
translation = "Nedladdningar"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hur filer namnges i det som Hoard skickar: nedladdningar, zip-filer, verktyget hoard och AI-assistenter. Filerna i biblioteket förblir som de är."

[messages.settings-page-dragon]
source = "Dragon"
translation = "Drake"

[messages.settings-page-dragon-blurb]
source = "Your dragon’s hoard: every asset in the library is a piece of its treasure."
translation = "Din drakes skatt: varje tillgång i biblioteket är en bit av den."

[messages.settings-page-issues]
source = "Issues"
translation = "Problem"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Det som gick fel när filer öppnades eller bearbetades: arkiv som inte gick att packa upp, filer som inte kunde läsas, jobb som misslyckades. Försök igen när orsaken är åtgärdad, eller avfärda dem."

[messages.settings-page-library]
source = "Library"
translation = "Bibliotek"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Vad som finns i Hoard: hur stort det är, vad det består av, hur det har vuxit och hur väl det är taggat. Arkiverade saker räknas inte."

[messages.settings-page-locations]
source = "Library locations"
translation = "Biblioteksplatser"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Mapparna på servern som rymmer biblioteket: sådana som Hoard förvarar filer i, och mappar med paket som det indexerar där de ligger."

[messages.settings-page-locations-blurb-desktop]
source = "The folders that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Mapparna som rymmer biblioteket: sådana som Hoard förvarar filer i, och mappar med paket som det indexerar där de ligger."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Underhåll"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Säkerhetskopiera, kontrollera efter skador och städa. En av varje körs åt gången, och du kan lämna sidan medan de körs."

[messages.settings-page-performance]
source = "Performance"
translation = "Prestanda"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Hur hårt servern arbetar, hur miniatyrbilder skapas och sparas, och det mesta den tar emot."

[messages.settings-page-performance-blurb-desktop]
source = "How hard Hoard works, how thumbnails are made and kept, and the most it takes in."
translation = "Hur hårt Hoard arbetar, hur miniatyrbilder skapas och sparas, och det mesta det tar emot."

[messages.settings-page-search-blurb]
source = "Search pictures by what they show and sounds by what they sound like, not only by their names, and find things that are alike in kind, not only in color."
translation = "Sök bilder efter vad de visar och ljud efter hur de låter, inte bara efter namn, och hitta saker som liknar varandra till sin art, inte bara till färgen."

[messages.settings-page-search-tab]
source = "Search"
translation = "Sökning"

[messages.settings-page-store-files]
source = "Store files"
translation = "Butiksfiler"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Filerna som butiker lägger bredvid sina resurser, som Hoard läser för att namnge paket och kreditera deras skapare. Lär det filer som det inte känner till, och dela med dig av det du har lärt det."

[messages.settings-page-tags]
source = "Tags"
translation = "Taggar"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Alla taggar i biblioteket. Slå ihop sådana som betyder samma sak, eller byt namn på en; taggningen använder det nya namnet från och med då."

[messages.settings-page-tools]
source = "Tools"
translation = "Verktyg"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Externa program som Hoard använder för att konvertera och läsa filer."

