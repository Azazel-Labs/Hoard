[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "När en ny version har släppts kan Hoard anropa en adress så snart inget pågår (inga uppladdningar, jobb, konverteringar eller underhåll), så att det som uppdaterar containern inte startar om den mitt i en uppladdning. Den skickar en POST med versionen i en JSON-kropp. Det här kräver versionskontrollen ovan."

