[messages.about-what]
source = "Hoard keeps game assets (models, textures, sounds, music, sprites and more) in one library you can search, preview and take from, shared with everyone you let in."
translation = "Hoard เก็บแอสเซ็ตเกม (โมเดล เท็กซ์เจอร์ เสียง เพลง สไปรต์ และอื่น ๆ) ไว้ในคลังเดียวที่คุณค้นหา ดูตัวอย่าง และหยิบไปใช้ได้ โดยแชร์กับทุกคนที่คุณให้สิทธิ์เข้าถึง"

[messages.account-add]
source = "Add"
translation = "เพิ่ม"

