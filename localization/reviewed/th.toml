translation = "ChatGPT ลงชื่อออก Hoard แล้ว ({ $code }) ให้ลงชื่อเข้าใช้ใหม่จาก การตั้งค่า → การติดแท็กด้วย AI"

[messages.error-chatgpt-signed-out-problem]
source = "ChatGPT signed this server out ({ $code }). Sign in again to keep tagging with your plan."
translation = "ChatGPT ลงชื่อออกเซิร์ฟเวอร์นี้แล้ว ({ $code }) ให้ลงชื่อเข้าใช้ใหม่เพื่อติดแท็กด้วยแพ็กเกจของคุณต่อไป"

[messages.error-chatgpt-signed-out-problem-desktop]
source = "ChatGPT signed Hoard out ({ $code }). Sign in again to keep tagging with your plan."
translation = "ChatGPT ลงชื่อออก Hoard แล้ว ({ $code }) ให้ลงชื่อเข้าใช้ใหม่เพื่อติดแท็กด้วยแพ็กเกจของคุณต่อไป"

[messages.error-chatgpt-unsupported]
