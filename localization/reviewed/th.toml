translation = "ยังไม่ได้ลงชื่อเข้าใช้ ChatGPT ให้ลงชื่อเข้าใช้จาก การตั้งค่า → การติดแท็กด้วย AI"

[messages.error-chatgpt-not-started]
source = "this sign-in wasn't started here, or it was started more than 15 minutes ago. Start it again from Settings."
translation = "การลงชื่อเข้าใช้นี้ไม่ได้เริ่มที่นี่ หรือเริ่มไปนานกว่า 15 นาทีแล้ว เริ่มใหม่อีกครั้งจากการตั้งค่า"

[messages.error-chatgpt-other-registration]
