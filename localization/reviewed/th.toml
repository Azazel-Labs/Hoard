translation = "ขนาดประมาณสองเท่าของแบบสมดุล"

[messages.settings-thumbs-small]
source = "Smaller"
translation = "เล็กกว่า"

[messages.settings-thumbs-small-hint]
source = "Fine in the grid; a little soft up close."
translation = "ดูดีในตาราง แต่จะนุ่มไปเล็กน้อยเมื่อดูใกล้ ๆ"

[messages.settings-thumbs-what]
source = "For new thumbnails and model views. Transparent and pixel-art ones stay PNG. Shrink thumbnails in Maintenance redoes the ones you have."
translation = "สำหรับภาพย่อและมุมมองโมเดลใหม่ ภาพโปร่งใสและพิกเซลอาร์ตยังคงเป็น PNG ย่อขนาดภาพย่อ ในการบำรุงรักษาจะสร้างภาพที่มีอยู่ใหม่"

