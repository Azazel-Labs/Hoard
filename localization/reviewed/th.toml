[messages.error-chatgpt-other-registration-desktop]
source = "ChatGPT answered for a different copy of Hoard; start the sign-in again"
translation = "ChatGPT ตอบกลับสำหรับสำเนา Hoard อื่น ให้เริ่มลงชื่อเข้าใช้ใหม่"

[messages.error-chatgpt-paste-address]
source = "paste the whole address, starting with http://127.0.0.1"
translation = "วางที่อยู่ทั้งหมดที่ขึ้นต้นด้วย http://127.0.0.1"

[messages.error-chatgpt-plan-not-allowed]
source = "Signed in, but using the plan wasn't allowed. Sign in again and allow it, or use an API key instead."
translation = "ลงชื่อเข้าใช้แล้ว แต่ไม่ได้รับอนุญาตให้ใช้แพ็กเกจ ให้ลงชื่อเข้าใช้ใหม่และอนุญาต หรือใช้คีย์ API แทน"

[messages.error-chatgpt-port]
source = "port is the one the browser reaches Hoard on"
translation = "port คือพอร์ตที่เบราว์เซอร์ใช้เข้าถึง Hoard"

[messages.error-chatgpt-problem]
