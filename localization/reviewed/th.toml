[messages.error-github-no-app]
source = "This server has no GitHub app to sign in through; use a token instead."
translation = "เซิร์ฟเวอร์นี้ไม่มีแอป GitHub สำหรับลงชื่อเข้าใช้ ใช้โทเค็นแทน"

[messages.error-github-refused]
source = "GitHub turned the sign-in down: { $reason }"
translation = "GitHub ปฏิเสธการลงชื่อเข้าใช้: { $reason }"

[messages.error-github-unreachable]
source = "Can’t reach GitHub."
translation = "เชื่อมต่อ GitHub ไม่ได้"

[messages.error-hoard-seen]
source = "the hoard can record at most 32 kinds of asset, each named in lowercase letters"
translation = "ขุมทรัพย์บันทึกแอสเซ็ตได้สูงสุด 32 ชนิด แต่ละชนิดตั้งชื่อด้วยตัวพิมพ์เล็ก"

[messages.error-hosted-address]
source = "The image search service’s address should start with http:// or https://"
translation = "ที่อยู่ของบริการค้นหาด้วยภาพควรขึ้นต้นด้วย http:// หรือ https://"

[messages.error-hosted-key]
source = "Enter the API key for { $provider }"
translation = "ใส่คีย์ API ของ { $provider }"

[messages.error-https-bad-name]
source = "“{ $name }” isn't an address a certificate can hold"
translation = "“{ $name }” ไม่ใช่ที่อยู่ที่ใบรับรองระบุได้"

[messages.error-https-cert-not-pem]
source = "The certificate isn't valid PEM"
translation = "ใบรับรองไม่ใช่ PEM ที่ถูกต้อง"

[messages.error-https-certificate-mode]
source = "A certificate goes with “My certificate”"
translation = "ใบรับรองใช้คู่กับตัวเลือก “ใบรับรองของฉัน”"

[messages.error-https-expired]
source = "This certificate expired on { $date }"
translation = "ใบรับรองนี้หมดอายุเมื่อ { $date }"

[messages.error-https-key-mismatch]
source = "The key doesn't belong to the certificate. If you gave a chain, put your server's certificate first"
translation = "คีย์ไม่ได้คู่กับใบรับรอง หากคุณให้ใบรับรองแบบเชน ให้ใส่ใบรับรองของเซิร์ฟเวอร์คุณไว้เป็นอันแรก"

[messages.error-https-key-not-pem]
