[messages.error-format-no-files]
source = 'files is empty: say which files the format reads, like ["*.json"]'
translation = 'files ว่างเปล่า: ระบุว่ารูปแบบนี้อ่านไฟล์ใด เช่น ["*.json"]'

[messages.error-format-no-name]
source = "name is empty"
translation = "name ว่างเปล่า"

[messages.error-format-not-a-filter]
source = "[{ $filter }] isn't a filter: use [], [key=value|other], [array], [string], [number], [bool] or [object]"
translation = "[{ $filter }] ไม่ใช่ตัวกรอง: ใช้ [], [key=value|other], [array], [string], [number], [bool] หรือ [object]"

[messages.error-format-not-found]
source = "format { $file } not found"
translation = "ไม่พบรูปแบบ { $file }"

[messages.error-format-too-long]
source = "the format is too long"
translation = "รูปแบบยาวเกินไป"

