    }"""
translation = """
{ $count ->
       *[other] แปลง { $count } ไฟล์
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "ไฟล์ที่จะถูกแปลง"

[messages.settings-conv-ask-more]
