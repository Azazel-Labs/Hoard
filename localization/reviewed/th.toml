translation = "โควตาการใช้งานแพ็กเกจ ChatGPT ของคุณสำหรับ Hoard หมดแล้วในตอนนี้ ดูหรือเปลี่ยนขีดจำกัดได้ที่ { $url }"

[messages.error-chatgpt-usage-unavailable]
