[messages.error-conversion-target]
source = "Conversion rules: Hoard can’t convert files to { $format }"
translation = "กฎการแปลง: Hoard แปลงไฟล์เป็น { $format } ไม่ได้"

[messages.error-conversion-twice]
source = "Conversion rules: .{ $ext } is in two rules"
translation = "กฎการแปลง: .{ $ext } อยู่ในกฎสองข้อ"

[messages.error-credits-collection]
