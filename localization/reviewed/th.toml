[messages.tags-merged-what]
source = "When the taggers come up with one of these old names, the asset gets the tag it was merged into."
translation = "เมื่อตัวติดแท็กเสนอชื่อเก่าเหล่านี้ แอสเซ็ตจะได้แท็กที่ชื่อนั้นถูกรวมเข้าไปแทน"

