source = 'Zips, tarballs, folders or loose files all work. Hoard unpacks them, stores every file once by its hash, reads sizes, lengths and poly counts, and tags everything so you can search for things like{ " " }'
translation = 'ใช้ได้ทั้งไฟล์ zip, tarball, โฟลเดอร์ หรือไฟล์เดี่ยว ๆ Hoard จะแตกไฟล์ จัดเก็บทุกไฟล์เพียงครั้งเดียวตามแฮช อ่านขนาด ความยาว และจำนวนโพลีกอน แล้วติดแท็กทุกอย่างเพื่อให้คุณค้นหาสิ่งต่าง ๆ ได้ เช่น{ " " }'

