translation = "ทุกคนที่มีบัญชี { $provider } เข้าได้ เพิ่มกลุ่มผู้ดูด้านล่าง หรือปิดตัวเลือกนี้แล้วเพิ่มผู้ใช้เอง"

[messages.auth-own-accounts-still-work]
source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "บัญชีของ Hoard เองยังลงชื่อเข้าใช้ด้วยรหัสผ่านของตัวเองได้ ดังนั้นไดเรกทอรีหรือผู้ให้บริการที่ล่มหรือตั้งค่าผิดจะไม่ทำให้คุณเข้าไม่ได้"

[messages.auth-people-under]
source = "People are under"
translation = "ผู้ใช้อยู่ภายใต้"

[messages.auth-preset-custom]
source = "Other (OpenID Connect)"
translation = "อื่น ๆ (OpenID Connect)"

[messages.auth-preset-custom-note]
source = "Keycloak, Authentik, Authelia, Okta, Zitadel and others: give the issuer and Discover fills in the addresses."
translation = "Keycloak, Authentik, Authelia, Okta, Zitadel และอื่น ๆ: ระบุผู้ออก (issuer) แล้ว ค้นหาอัตโนมัติ จะกรอกที่อยู่ให้"

[messages.auth-preset-github-note]
source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "สร้าง OAuth app ใน GitHub → Settings → Developer settings GitHub ไม่ส่งกลุ่มมา จึงต้องกำหนดบทบาทที่ การตั้งค่า → บัญชี และปิดการสร้างบัญชีเมื่อลงชื่อเข้าใช้ครั้งแรก เว้นแต่ทุกคนที่มีบัญชี GitHub ควรเข้าได้"

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "สร้างแอปพลิเคชันใน GitLab → Preferences → Applications (หรือในส่วนผู้ดูแลระบบของอินสแตนซ์ของคุณ: เปลี่ยน gitlab.com ในที่อยู่)"

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "สร้าง OAuth client (Web application) ใน Google Cloud Console → APIs & Services → Credentials Google ไม่ส่งกลุ่มมา จึงต้องกำหนดบทบาทที่ การตั้งค่า → บัญชี และปิดการสร้างบัญชีเมื่อลงชื่อเข้าใช้ครั้งแรก เว้นแต่ทุกคนที่มีบัญชี Google ควรเข้าได้"

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organization in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "ลงทะเบียนแอปใน Entra ID → App registrations (ตั้ง redirect แบบ Web ไปยังที่อยู่ด้านล่าง) ใส่ tenant ID ของคุณแทน “organizations” เพื่อให้เฉพาะองค์กรของคุณเข้าได้ หากต้องการบทบาทจากกลุ่ม ให้เพิ่ม groups claim ใน Token configuration: ซึ่งจะระบุ ID ของกลุ่ม"

