[messages.tags-merged]
source = """
{ $count ->
        [one] { $count } asset now tagged { $into }
       *[other] { $count } assets now tagged { $into }
    }"""
translation = "ตอนนี้แอสเซ็ต { $count } รายการติดแท็ก { $into } แล้ว"

