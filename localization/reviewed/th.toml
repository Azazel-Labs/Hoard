[messages.error-collection-exists]
source = "there's already a collection called { $name }"
translation = "มีคอลเลกชันชื่อ { $name } อยู่แล้ว"

[messages.error-collection-needs-name]
source = "a collection needs a name"
translation = "คอลเลกชันต้องมีชื่อ"

[messages.error-collection-not-found]
source = "collection { $id } not found"
translation = "ไม่พบคอลเลกชัน { $id }"

[messages.error-connection-not-found]
