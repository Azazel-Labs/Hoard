translation = "ไฟล์นี้ไม่ได้ถูกแปลงโดยกฎ หรือไฟล์ต้นฉบับถูกลบไปแล้ว"

[messages.error-conversion-failed]
source = "couldn't convert to { $format }: { $reason }"
translation = "แปลงเป็น { $format } ไม่ได้: { $reason }"

