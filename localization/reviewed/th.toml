[messages.settings-unreal]
source = "Unreal packages"
translation = "แพ็กเกจ Unreal"

[messages.settings-unreal-download]
source = "Downloads Epic’s Linux x86-64 editor, once, into Hoard’s tools folder. It takes tens of GB of disk space, and a GitHub account Epic has let in."
translation = "ดาวน์โหลดเอดิเตอร์ Linux x86-64 ของ Epic หนึ่งครั้งลงในโฟลเดอร์เครื่องมือของ Hoard ใช้พื้นที่ดิสก์หลายสิบ GB และต้องมีบัญชี GitHub ที่ Epic อนุญาตแล้ว"

[messages.settings-unreal-editor-what]
source = "Installs Unreal Editor for the export worker. Run the worker separately to export assets."
translation = "ติดตั้ง Unreal Editor สำหรับกระบวนการส่งออก เรียกใช้กระบวนการแยกต่างหากเพื่อส่งออกแอสเซ็ต"

[messages.settings-unreal-github-again]
