translation = "ChatGPT ลงชื่อออกเซิร์ฟเวอร์นี้แล้ว ({ $code }) ให้ลงชื่อเข้าใช้ใหม่จาก การตั้งค่า → การติดแท็กด้วย AI"

[messages.error-chatgpt-signed-out-desktop]
