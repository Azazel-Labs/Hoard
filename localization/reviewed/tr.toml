[messages.settings-tn-what]
source = "A material’s maps go out named after it and what each map is for, however the files are named: Rock_Normal.png, not rock_moss_xeokah0_raw_8K_Normal.png. The files in the library aren’t touched, and a map that a model or MTL sent with it names keeps that name, so the model still finds it."
translation = "Bir malzemenin haritaları, dosyalar nasıl adlandırılmış olursa olsun, malzemenin adına ve her haritanın ne için olduğuna göre adlandırılarak gönderilir: rock_moss_xeokah0_raw_8K_Normal.png değil, Rock_Normal.png. Kütüphanedeki dosyalara dokunulmaz; bir modelin ya da birlikte gönderilen bir MTL’nin adını verdiği harita o adı korur, böylece model onu yine bulur."

