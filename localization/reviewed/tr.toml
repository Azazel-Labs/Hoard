[messages.account-ai-apps]
source = "Claude and other AI apps"
translation = "Claude ve diğer yapay zekâ uygulamaları"

[messages.account-ai-apps-hint]
source = "Connect Claude (or any MCP app) and it can search and fetch assets for you, and describe and tag what Hoard hasn’t yet. It signs in to Hoard the first time; you allow it here in the browser."
translation = "Claude’u (ya da herhangi bir MCP uygulamasını) bağlayın; sizin için varlık arayıp getirebilir, Hoard’un henüz tanımlamadıklarını tanımlayıp etiketleyebilir. İlk seferde Hoard’da oturum açar; buna burada, tarayıcıda izin verirsiniz."

[messages.account-change-password]
source = "Change password"
translation = "Parolayı değiştir"

[messages.account-claude-ai]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS."
translation = "Settings → Connectors → Add custom connector bölümüne gidin, adresi yapıştırın, ardından Connect’e tıklayın. Bunlar Anthropic’in sunucularından bağlanır; bu yüzden Hoard’a internetten HTTPS üzerinden ulaşılabilmesi gerekir."

[messages.account-claude-ai-local]
source = "Settings → Connectors → Add custom connector, paste the address, then Connect. These connect from Anthropic’s servers, so Hoard has to be reachable from the internet over HTTPS (this address isn’t: set the Public address in Settings → Connection)."
translation = "Settings → Connectors → Add custom connector bölümüne gidin, adresi yapıştırın, ardından Connect’e tıklayın. Bunlar Anthropic’in sunucularından bağlanır; bu yüzden Hoard’a internetten HTTPS üzerinden ulaşılabilmesi gerekir (bu adrese ulaşılamaz: Ayarlar → Bağlantı bölümünden Genel adresi ayarlayın)."

