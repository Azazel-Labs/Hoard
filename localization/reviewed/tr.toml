Görebilmeniz için { $preview ->
        [light] açık
       *[dark] koyu
    } tema gösteriliyor. Siz { $used ->
        [light] açık
       *[dark] koyu
    } tema kullanıyorsunuz{ $system ->
        [yes] { " " }(sistemi izleyerek)
       *[other] { "" }
    }; bu sayfadan ayrıldığınızda o geri gelir."""

[messages.settings-preview-back]
source = """
Back to { $used ->
        [light] light
       *[dark] dark
