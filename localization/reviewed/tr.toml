translation = "Üyeleri her rolü alan gruplar; her satıra bir tane, adıyla ya da DN’siyle. Eşleşen en yüksek rol geçerli olur ve her oturum açmada denetlenir. Hiçbiri listelenmezse yeni hesaplar yukarıdaki rolü alır ve sonra bir yönetici değiştirir. Bakabilir altında gruplar listelenmişse yalnızca listelenen bir grubun üyeleri oturum açabilir."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Üyeleri her rolü alan gruplar; her satıra bir tane, adıyla ya da DN’siyle (ya da groups talebi ne listeliyorsa). Eşleşen en yüksek rol geçerli olur ve her oturum açmada denetlenir. Hiçbiri listelenmezse yeni hesaplar yukarıdaki rolü alır ve sonra bir yönetici değiştirir. Bakabilir altında gruplar listelenmişse yalnızca listelenen bir grubun üyeleri oturum açabilir."

