source = "Make an OAuth app in GitHub → Settings → Developer settings. GitHub sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a GitHub account should get in."
translation = "GitHub → Settings → Developer settings bölümünde bir OAuth uygulaması oluşturun. GitHub grup göndermez; bu yüzden rolleri Ayarlar → Hesap bölümünden verin ve GitHub hesabı olan herkesin girmesini istemiyorsanız ilk oturum açmada hesap oluşturmayı kapatın."

[messages.auth-preset-gitlab-note]
source = "Make an application in GitLab → Preferences → Applications (or your instance’s admin area: change gitlab.com in the addresses)."
translation = "GitLab → Preferences → Applications bölümünde bir uygulama oluşturun (ya da sunucunuzun yönetici alanında: adreslerdeki gitlab.com’u değiştirin)."

[messages.auth-preset-google-note]
source = "Make an OAuth client (Web application) in Google Cloud Console → APIs & Services → Credentials. Google sends no groups, so give roles in Settings → Account, and turn off making accounts at first sign-in unless anyone with a Google account should get in."
translation = "Google Cloud Console → APIs & Services → Credentials bölümünde bir OAuth istemcisi (Web application) oluşturun. Google grup göndermez; bu yüzden rolleri Ayarlar → Hesap bölümünden verin ve Google hesabı olan herkesin girmesini istemiyorsanız ilk oturum açmada hesap oluşturmayı kapatın."

[messages.auth-preset-microsoft-note]
source = "Register an app in Entra ID → App registrations (a Web redirect to the address below). Put your tenant ID in place of “organizations” to let only your organisation in. For roles from groups, add the groups claim under Token configuration: it lists group IDs."
translation = "Entra ID → App registrations bölümünde bir uygulama kaydedin (aşağıdaki adrese bir Web yönlendirmesiyle). Yalnızca kuruluşunuzun girmesi için “organizations” yerine kiracı kimliğinizi yazın. Rolleri gruplardan almak için Token configuration altında groups talebini ekleyin: grup kimliklerini listeler."

