translation = "OpenAI’nin CLIP modelini kullanır ve bu sunucunun işlemcisinde çalışır: hiçbir şey dışarı çıkmaz. Açmak, modeli ({ $size } MB) Hugging Face’ten indirir, ardından her resmi arka planda düşük öncelikle öğrenir. Çalışırken ya da biri arama yaparken 300 ile 600 MB bellek kullanır. Kapatmak modeli siler, öğrendiklerini bir dahaki sefer için saklar."

