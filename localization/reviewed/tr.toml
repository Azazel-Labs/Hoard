[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Yeni bir sürüm çıktığında Hoard, hiçbir şey yapılmıyorken (yükleme, iş, dönüştürme ya da bakım yokken) bir adresi çağırabilir; böylece konteynerini güncelleyen şey onu bir yüklemenin ortasında yeniden başlatmaz. Sürümü bir JSON gövdesinde taşıyan bir POST gönderir. Bunun için yukarıdaki sürüm denetimi gerekir."

