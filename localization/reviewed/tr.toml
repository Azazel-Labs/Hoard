[messages.settings-name]
source = "Name"
translation = "Ad"

[messages.settings-name-what]
source = "What this server is called in the top bar, the browser tab and on the sign-in page, so with more than one hoard you can tell which is which."
translation = "Bu sunucunun üst çubukta, tarayıcı sekmesinde ve oturum açma sayfasında görünen adı; böylece birden fazla Hoard varsa hangisinin hangisi olduğunu anlayabilirsiniz."

[messages.settings-option-saved]
source = "{ $name }: { $value }"
translation = "{ $name }: { $value }"

[messages.settings-page-account]
source = "Account"
translation = "Hesap"

[messages.settings-page-account-blurb]
source = "Your password, the other people who can sign in, and access tokens for scripts and other programs."
translation = "Parolanız, oturum açabilen diğer kişiler ve betikler ile diğer programlar için erişim belirteçleri."

[messages.settings-page-adding]
source = "Adding packs"
translation = "Paket ekleme"

[messages.settings-page-adding-blurb]
source = "What Hoard does with a pack when it’s added, besides reading and tagging it."
translation = "Bir paket eklendiğinde, okuyup etiketlemenin yanı sıra Hoard’un onunla ne yaptığı."

[messages.settings-page-ai]
source = "AI tagging"
translation = "Yapay zekâ etiketleme"

[messages.settings-page-ai-blurb]
source = "An AI model names, describes and tags new packs, on top of the built-in rules. Its tags are marked as suggested."
translation = "Yerleşik kuralların üstüne, bir yapay zekâ modeli yeni paketlere ad verir, onları tanımlar ve etiketler. Onun etiketleri önerilen olarak işaretlenir."

[messages.settings-page-appearance]
source = "Appearance"
translation = "Görünüm"

[messages.settings-page-appearance-blurb]
source = "The themes this browser wears when it’s light and when it’s dark. Saved in this browser only."
translation = "Bu tarayıcının açık ve koyu moddayken giydiği temalar. Yalnızca bu tarayıcıda kaydedilir."

[messages.settings-page-auth]
source = "Authentication"
translation = "Kimlik doğrulama"

[messages.settings-page-auth-blurb]
source = "How people sign in: Hoard’s own accounts, an LDAP directory, Microsoft Active Directory or an OAuth provider, how long sessions last, and which groups get which role."
translation = "Kişilerin nasıl oturum açtığı: Hoard’un kendi hesapları, bir LDAP dizini, Microsoft Active Directory ya da bir OAuth sağlayıcısı; oturumların ne kadar sürdüğü ve hangi grubun hangi rolü aldığı."

[messages.settings-page-connection]
source = "Connection"
translation = "Bağlantı"

[messages.settings-page-connection-blurb]
source = "How browsers and apps reach Hoard: the address it’s known by, and HTTPS, which some browser features need."
translation = "Tarayıcıların ve uygulamaların Hoard’a nasıl ulaştığı: bilinen adresi ve bazı tarayıcı özelliklerinin gerektirdiği HTTPS."

[messages.settings-page-downloads]
source = "Downloads"
translation = "İndirmeler"

[messages.settings-page-downloads-blurb]
source = "How files are named in what Hoard sends: downloads, zips, the hoard tool and AI assistants. Files in the library stay as they are."
translation = "Hoard’un gönderdiklerinde dosyaların nasıl adlandırıldığı: indirmeler, zip’ler, hoard aracı ve yapay zekâ asistanları. Kütüphanedeki dosyalar olduğu gibi kalır."

[messages.settings-page-general]
source = "General"
translation = "Genel"

[messages.settings-page-general-blurb]
source = "What this server is called, for everyone who uses it."
translation = "Bu sunucunun, onu kullanan herkes için adı."

[messages.settings-page-issues]
source = "Issues"
translation = "Sorunlar"

[messages.settings-page-issues-blurb]
source = "What went wrong opening or processing files: archives that wouldn’t unpack, files that couldn’t be read, jobs that failed. Try them again once the cause is fixed, or dismiss them."
translation = "Dosyalar açılırken ya da işlenirken ters gidenler: açılmayan arşivler, okunamayan dosyalar, başarısız olan işler. Neden giderildikten sonra onları yeniden deneyin ya da yok sayın."

[messages.settings-page-library]
source = "Library"
translation = "Kütüphane"

[messages.settings-page-library-blurb]
source = "What’s in the hoard: how big it is, what it’s made of, how it grew and how well it’s tagged. Archived things aren’t counted."
translation = "Hoard’da neler var: ne kadar büyük, nelerden oluşuyor, nasıl büyüdü ve ne kadar iyi etiketlenmiş. Arşivlenenler sayılmaz."

[messages.settings-page-locations]
source = "Library locations"
translation = "Kütüphane konumları"

[messages.settings-page-locations-blurb]
source = "The folders on the server that hold the library: ones Hoard keeps files in, and folders of packs it indexes where they are."
translation = "Sunucuda kütüphaneyi tutan klasörler: Hoard’un dosya sakladığı klasörler ve paketleri bulundukları yerde dizinlediği klasörler."

[messages.settings-page-maintenance]
source = "Maintenance"
translation = "Bakım"

[messages.settings-page-maintenance-blurb]
source = "Back up, check for damage and tidy up. One of each runs at a time, and you can leave this page while they do."
translation = "Yedekleyin, hasarı denetleyin ve toparlayın. Her birinden aynı anda yalnızca biri çalışır; onlar çalışırken bu sayfadan ayrılabilirsiniz."

[messages.settings-page-performance]
source = "Performance"
translation = "Performans"

[messages.settings-page-performance-blurb]
source = "How hard the server works, how thumbnails are made and kept, and the most it takes in."
translation = "Sunucunun ne kadar yoğun çalıştığı, küçük resimlerin nasıl oluşturulup saklandığı ve alabileceği en büyük boyutlar."

[messages.settings-page-search]
source = "Image search"
translation = "Görsel arama"

[messages.settings-page-search-blurb]
source = "Search pictures by what they show, not only by their names, and find things that are alike in kind, not only in colour."
translation = "Resimleri yalnızca adlarına göre değil, gösterdiklerine göre arayın; yalnızca renkte değil, türde de benzeyen şeyleri bulun."

[messages.settings-page-store-files]
source = "Store files"
translation = "Mağaza dosyaları"

[messages.settings-page-store-files-blurb]
source = "The files stores put beside their art, which Hoard reads to name packs and credit their makers. Teach it ones it doesn’t know, and share what you taught it."
translation = "Mağazaların çizimlerin yanına koyduğu, Hoard’un paketlere ad vermek ve yapanlarını anmak için okuduğu dosyalar. Bilmediklerini ona öğretin ve öğrettiklerinizi paylaşın."

[messages.settings-page-tags]
source = "Tags"
translation = "Etiketler"

[messages.settings-page-tags-blurb]
source = "Every tag in the library. Merge ones that mean the same thing, or rename one; the taggers use the new name from then on."
translation = "Kütüphanedeki her etiket. Aynı anlama gelenleri birleştirin ya da birini yeniden adlandırın; etiketleyiciler bundan sonra yeni adı kullanır."

[messages.settings-page-tools]
source = "Tools"
translation = "Araçlar"

[messages.settings-page-tools-blurb]
source = "Outside programs Hoard uses to convert and read files."
translation = "Hoard’un dosyaları dönüştürmek ve okumak için kullandığı dış programlar."

[messages.settings-preview]
source = """
Showing the { $preview ->
        [light] light
       *[dark] dark
    } theme so you can see it. You're using { $used ->
        [light] light
       *[dark] dark
