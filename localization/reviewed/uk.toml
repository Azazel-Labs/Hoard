translation = "Збережені файли, які пошкоджено або втрачено"

[messages.server-issues-damaged-blurb]
source = "Found by Check files for damage. Restore them from a backup or add their pack again, then run Check files for damage again."
translation = "Знайдено завданням «Перевірити файли на пошкодження». Відновіть їх із резервної копії або знову додайте їхній пакет, а потім ще раз запустіть «Перевірити файли на пошкодження»."

[messages.server-issues-file]
source = "Files that couldn’t be opened"
translation = "Файли, які не вдалося відкрити"

[messages.server-issues-file-blurb]
source = "Hoard couldn’t open or store them. A watched pack tries them again at its next scan; a file already in the library kept what it had before."
translation = "Hoard не зміг відкрити або зберегти їх. Відстежуваний пакет спробує знову під час наступного сканування; файл, що вже є в бібліотеці, зберіг те, що мав раніше."

[messages.server-issues-folder]
