translation = "Кожна людина може переглядати (пошук, попередній перегляд і завантаження), також змінювати бібліотеку (додавання, редагування, тегування, колекції й архів) або ще й бути адміністратором (налаштування, облікові записи, обслуговування й остаточне видалення)."

