translation = "JPEG, якість 70. Добре в сітці; трохи розмито зблизька."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Як зберігаються нові мініатюри та вигляди моделей. Зображення з прозорістю та піксель-арт завжди в PNG. Щоб зменшити наявні, запустіть «Зменшити мініатюри» в розділі «Обслуговування»."

