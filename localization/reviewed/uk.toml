[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Коли виходить новий випуск, Hoard може звернутися за адресою, щойно нічого не відбуватиметься (немає вивантажень, завдань, перетворень чи обслуговування), щоб те, що оновлює його контейнер, не перезапустило його посеред вивантаження. Він надсилає POST із випуском у тілі JSON. Для цього потрібна перевірка випусків, описана вище."

