[messages.auth-roles-from-groups]
source = "Roles from groups"
translation = "Ролі з груп"

[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Групи, учасники яких отримують кожну роль, по одній на рядок, за назвою чи DN. Перемагає найвища відповідна роль; вона перевіряється під час кожного входу. Якщо груп не вказано, нові облікові записи отримують роль, вибрану вище, а адміністратор змінює її згодом. Якщо в «Може переглядати» вказано групи, входити можуть лише учасники вказаних груп."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Групи, учасники яких отримують кожну роль, по одній на рядок, за назвою чи DN (або за тим, що містить claim груп). Перемагає найвища відповідна роль; вона перевіряється під час кожного входу. Якщо груп не вказано, нові облікові записи отримують роль, вибрану вище, а адміністратор змінює її згодом. Якщо в «Може переглядати» вказано групи, входити можуть лише учасники вказаних груп."

