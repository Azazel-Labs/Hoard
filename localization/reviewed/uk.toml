translation = "Увійти може будь-хто з обліковим записом { $provider }. Додайте групи для перегляду нижче або вимкніть це й додавайте людей самостійно."

[messages.auth-own-accounts-still-work]
source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "Власні облікові записи Hoard і далі входять зі своїми паролями, тож каталог чи постачальник, що не працює або неправильно налаштований, не заблокує вам доступ."

