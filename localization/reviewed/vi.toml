translation = "Tìm kiếm hình ảnh: về mặc định"

[messages.settings-clip-saved-here]
source = "Image search: runs on this server"
translation = "Tìm kiếm hình ảnh: chạy trên máy chủ này"

[messages.settings-clip-saved-here-desktop]
source = "Image search: runs on this computer"
translation = "Tìm kiếm hình ảnh: chạy trên máy tính này"

[messages.settings-clip-saved-hosted]
source = "Image search: runs on { $service }"
translation = "Tìm kiếm hình ảnh: chạy trên { $service }"

[messages.settings-clip-saved-off]
source = "Image search: off"
translation = "Tìm kiếm hình ảnh: tắt"

[messages.settings-clip-saved-on]
source = "Image search: on"
translation = "Tìm kiếm hình ảnh: bật"

[messages.settings-clip-toggle]
source = "Turn on image search"
translation = "Bật tìm kiếm hình ảnh"

[messages.settings-clip-unavailable]
source = "Couldn’t get the model: { $detail }. Trying again every hour."
translation = "Không lấy được mô hình: { $detail }. Sẽ thử lại mỗi giờ."

[messages.settings-clip-what]
source = "Type what you’re after (“mossy rock”, “sci-fi door”, “wooden barrel”) and pictures that show it turn up beside names that have the words. “More like this” finds things of the same kind, not only the same colors."
translation = "Nhập thứ bạn đang tìm (“mossy rock”, “sci-fi door”, “wooden barrel”) và những ảnh thể hiện nó sẽ hiện ra cạnh những tên có các từ đó. “Thêm nữa giống thế này” tìm những thứ cùng loại, không chỉ cùng màu."

[messages.settings-clip-where]
source = "Runs on"
translation = "Chạy trên"

[messages.settings-conv]
source = "Conversion rules"
translation = "Quy tắc chuyển đổi"

[messages.settings-conv-add]
source = "Add a rule"
translation = "Thêm quy tắc"

[messages.settings-conv-ask-body]
source = """
{ $packs ->
        [one] It’s in one pack.
       *[other] They’re in { $packs } packs.
    } Each original is kept for { $days } days, and until then it can be put back from its page."""
translation = """
{ $packs ->
       *[other] Chúng nằm trong { $packs } gói.
    } Mỗi tệp gốc được giữ { $days } ngày, và cho đến lúc đó có thể đưa trở lại từ trang của nó."""

[messages.settings-conv-ask-busy]
source = """
{ $count ->
        [one] One is in a pack still being added; it’s converted once that’s done.
       *[other] { $count } are in packs still being added; they’re converted once that’s done.
    }"""
translation = """
{ $count ->
       *[other] { $count } tệp nằm trong các gói vẫn đang được thêm; chúng sẽ được chuyển đổi khi việc đó xong.
    }"""

[messages.settings-conv-ask-convert]
source = """
{ $count ->
        [one] Convert it
       *[other] Convert { $count } files
    }"""
translation = """
{ $count ->
       *[other] Chuyển đổi { $count } tệp
    }"""

[messages.settings-conv-ask-list]
source = "Files that would be converted"
translation = "Các tệp sẽ được chuyển đổi"

[messages.settings-conv-ask-more]
source = "…and { $count } more"
translation = "…và { $count } tệp khác"

[messages.settings-conv-ask-new]
source = "Save, only new packs"
translation = "Lưu, chỉ gói mới"

[messages.settings-conv-ask-save-convert]
source = """
{ $count ->
        [one] Save and convert it
       *[other] Save and convert { $count } files
    }"""
translation = """
{ $count ->
       *[other] Lưu và chuyển đổi { $count } tệp
    }"""

[messages.settings-conv-ask-skipped]
source = "Left as they are:"
translation = "Giữ nguyên:"

[messages.settings-conv-ask-title]
source = """
{ $count ->
        [one] Convert one file already in the library?
       *[other] Convert { $count } files already in the library?
    }"""
translation = """
{ $count ->
       *[other] Chuyển đổi { $count } tệp đã có trong thư viện?
    }"""

[messages.settings-conv-converting]
source = """
{ $count ->
        [one] Converting one file in the background
       *[other] Converting { $count } files in the background
    }"""
translation = """
{ $count ->
       *[other] Đang chuyển đổi { $count } tệp trong nền
    }"""

[messages.settings-conv-existing]
source = "Convert files already in the library"
translation = "Chuyển đổi các tệp đã có trong thư viện"

[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "Âm thanh giữ nguyên hoàn toàn, chỉ chiếm khoảng một nửa dung lượng, và mọi thứ khác trong WAV (điểm lặp, dấu cue, thẻ) đều được giữ trong FLAC, nên có thể đưa WAV trở lại y như cũ bất cứ lúc nào. Các WAV có mẫu dấu phẩy động hoặc 32 bit sẽ vẫn là WAV."

[messages.settings-conv-from]
source = "From"
translation = "Từ"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "Giữ tệp gốc trong"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
       *[other] ngày
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "Cho đến lúc đó, trang của tệp đã chuyển đổi có thể đưa tệp gốc trở lại. Texture không được sao chép vào mô hình đã chuyển đổi: mô hình trỏ tới các tệp ảnh nằm cạnh nó. Các tệp .mtl hoặc .bin của mô hình vẫn được giữ lại."

[messages.settings-conv-nothing]
source = "Nothing in the library needs converting."
translation = "Không có gì trong thư viện cần chuyển đổi."

[messages.settings-conv-remove]
source = "Remove"
translation = "Gỡ"

[messages.settings-conv-remove-label]
source = "Remove rule { $n }"
translation = "Gỡ quy tắc { $n }"

[messages.settings-conv-revert]
source = "Undo changes"
translation = "Hoàn tác thay đổi"

[messages.settings-conv-rule-on]
source = "On"
translation = "Bật"

[messages.settings-conv-save]
source = "Save rules"
translation = "Lưu quy tắc"

[messages.settings-conv-saved]
source = "Conversion rules saved. They apply to packs added from now on."
translation = "Đã lưu quy tắc chuyển đổi. Chúng áp dụng cho các gói được thêm từ bây giờ."

[messages.settings-conv-skip-beside]
source = """
{ $count ->
        [one] one file whose converted copy is in its pack already
       *[other] { $count } files whose converted copies are in their packs already
    }"""
translation = """
{ $count ->
       *[other] { $count } tệp có bản đã chuyển đổi nằm sẵn trong gói của nó
    }"""

[messages.settings-conv-skip-blender]
source = """
{ $count ->
        [one] one file Blender hasn’t read yet (Settings → Tools)
       *[other] { $count } files Blender hasn’t read yet (Settings → Tools)
    }"""
translation = """
{ $count ->
       *[other] { $count } tệp Blender chưa đọc (Cài đặt → Công cụ)
    }"""

[messages.settings-conv-skip-unity]
source = """
{ $count ->
        [one] one file a Unity project knows by its name
       *[other] { $count } files a Unity project knows by their names
    }"""
translation = """
{ $count ->
       *[other] { $count } tệp mà một dự án Unity biết theo tên
    }"""

[messages.settings-conv-skip-used]
