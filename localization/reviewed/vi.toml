[messages.updates-what]
source = "When a new release is out, Hoard can call an address once nothing is going on (no uploads, jobs, conversions or maintenance), so whatever updates its container doesn’t restart it mid-upload. It sends a POST with the release in a JSON body. This needs the release check above."
translation = "Khi có bản phát hành mới, Hoard có thể gọi một địa chỉ khi không còn việc gì đang chạy (không có tải lên, tác vụ, chuyển đổi hay bảo trì), để công cụ cập nhật container không khởi động lại nó giữa lúc đang tải lên. Hoard gửi một yêu cầu POST với thông tin bản phát hành trong phần thân JSON. Việc này cần bật kiểm tra bản phát hành ở trên."

