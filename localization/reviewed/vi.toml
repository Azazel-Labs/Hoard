translation = "Chọn các thẻ cùng nghĩa để gộp, hoặc chọn một thẻ để đổi tên."

[messages.texnames-bad-characters]
source = 'Names can’t have < > : " / \ | ? or *'
translation = 'Tên không được chứa < > : " / \ | ? hoặc *'

[messages.texnames-bad-suffix]
source = 'The suffix for { $role } maps can’t have < > : " / \ | ? or *'
translation = 'Hậu tố cho map { $role } không được chứa < > : " / \ | ? hoặc *'

[messages.texnames-ending-bad]
source = 'Endings of your own can’t have < > : " / \ | ? or *'
translation = 'Đuôi tên riêng không được chứa < > : " / \ | ? hoặc *'

[messages.texnames-ending-missing]
source = "Each ending of your own needs the ending to look for"
translation = "Mỗi đuôi tên riêng của bạn cần có đuôi tên cần tìm"

[messages.texnames-ending-twice]
source = "{ $ending } is in your endings twice"
translation = "{ $ending } xuất hiện hai lần trong các đuôi tên của bạn"

[messages.texnames-needs-map]
source = 'The pattern needs { "{" }map{ "}" }, or every map of a material would get the same name'
translation = 'Mẫu cần có { "{" }map{ "}" }, nếu không mọi map của một vật liệu sẽ có cùng tên'

[messages.texnames-no-suffix]
source = "Give { $role } maps a suffix"
translation = "Hãy đặt hậu tố cho map { $role }"

[messages.texnames-placeholders]
source = 'The pattern can use { "{" }name{ "}" }, { "{" }map{ "}" } and { "{" }size{ "}" }'
translation = 'Mẫu có thể dùng { "{" }name{ "}" }, { "{" }map{ "}" } và { "{" }size{ "}" }'

