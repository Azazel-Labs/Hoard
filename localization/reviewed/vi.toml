[messages.packs-unreal-intro]
source = "Hoard reads Unreal packages itself and stores what's inside as ordinary files: textures as PNG or EXR, sounds as WAV, materials as JSON. The converted file takes the package's place, keeping its tags, links and collections."
translation = "Hoard tự đọc các package Unreal và lưu nội dung bên trong thành tệp thông thường: texture thành PNG hoặc EXR, âm thanh thành WAV, vật liệu thành JSON. Tệp đã chuyển đổi thay thế package, giữ nguyên thẻ, liên kết và bộ sưu tập của nó."

