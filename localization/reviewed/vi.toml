translation = "Dùng mô hình CLAP của LAION, chạy trên bộ xử lý của máy tính này: không có gì rời khỏi máy. Khi bật, mô hình ({ $size } MB) sẽ được tải từ Hugging Face, rồi nghe phần đầu của mọi âm thanh trong nền với mức ưu tiên thấp. Nó dùng tối đa khoảng 1 GB bộ nhớ khi đang làm việc hoặc khi bạn tìm kiếm. Khi tắt, mô hình bị xóa nhưng những gì nó đã học được giữ lại cho lần sau."

