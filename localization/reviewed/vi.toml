{ $count ->
        [one] one file in a watched folder
       *[other] { $count } files in watched folders
    }"""
translation = """
{ $count ->
       *[other] { $count } tệp trong thư mục theo dõi
    }"""

[messages.settings-conv-taken]
source = "Another rule converts this format"
translation = "Một quy tắc khác đã chuyển đổi định dạng này"

[messages.settings-conv-to]
source = "Convert to"
translation = "Chuyển đổi sang"

[messages.settings-conv-upright]
source = "Turn models upright as they’re converted (Y up, facing +Z), the way the pack’s models are shown"
translation = "Dựng thẳng mô hình khi chuyển đổi (Y hướng lên, quay về +Z), theo cách các mô hình của gói được hiển thị"

[messages.settings-conv-what]
source = "Convert files Hoard keeps to one format, such as every OBJ and FBX to GLB, so the library is all alike. The converted file takes the original’s place, with its name, tags, collections and links. Files in watched folders are never changed."
translation = "Chuyển đổi các tệp Hoard lưu giữ sang một định dạng, chẳng hạn mọi tệp OBJ và FBX sang GLB, để cả thư viện đồng nhất. Tệp đã chuyển đổi thế chỗ tệp gốc, giữ nguyên tên, thẻ, bộ sưu tập và liên kết của nó. Tệp trong thư mục theo dõi không bao giờ bị thay đổi."

[messages.settings-conversion-cache]
source = "Converted downloads"
translation = "Bản tải xuống đã chuyển đổi"

[messages.settings-conversion-cache-unit]
source = "kept at most; the least recently used go first"
translation = "giữ tối đa; thứ ít được dùng gần đây nhất sẽ bị xóa trước"

[messages.settings-conversion-cache-unit-now]
source = "kept at most, { $size } now; the least recently used go first"
translation = "giữ tối đa, hiện { $size }; thứ ít được dùng gần đây nhất sẽ bị xóa trước"

[messages.settings-default-auto]
