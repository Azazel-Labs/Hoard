translation = "Tìm sprite"

[messages.sheet-loading]
source = "Loading the sheet…"
translation = "Đang tải bảng…"

[messages.sheet-no-match]
source = "No sprite has that in its name."
translation = "Không có sprite nào có tên chứa nội dung này."

[messages.sheet-note-clockwise]
source = "Sprites turned clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite xoay theo chiều kim đồng hồ và được cắt viền trong suốt. Định dạng này không chứa được hoạt ảnh: khung hình được nhận theo tên có đánh số."

[messages.sheet-note-frames]
source = "Every sprite upright on its whole canvas, each a PNG named after it."
translation = "Mỗi sprite đứng thẳng trên toàn bộ khung vẽ của nó, mỗi sprite là một tệp PNG mang tên của chính nó."

[messages.sheet-note-godot-frames]
source = "Sprites never turned, their trim kept as margins, with animations and each frame's time."
translation = "Sprite không bao giờ bị xoay, phần viền đã cắt được giữ lại làm lề, kèm hoạt ảnh và thời gian của từng khung hình."

[messages.sheet-note-godot-tileset]
source = "Tiles never turned or trimmed, on a grid of the tile size, keeping the images when they're on one already."
translation = "Ô không bao giờ bị xoay hay cắt viền, xếp trên lưới theo kích thước ô, và giữ nguyên ảnh nếu chúng đã nằm sẵn trên lưới."

[messages.sheet-note-grid]
source = "Every sprite upright on its whole canvas, in cells all one size, for anything that cuts a sheet into a grid."
translation = "Mỗi sprite đứng thẳng trên toàn bộ khung vẽ của nó, trong các ô cùng kích thước, dùng cho bất kỳ công cụ nào cắt bảng thành lưới."

[messages.sheet-note-hoard]
source = "Hoard's own: the pages as they are, sprites turned any way and trimmed, with animations and each frame's time."
translation = "Định dạng riêng của Hoard: giữ nguyên các trang, sprite xoay theo mọi hướng và được cắt viền trong suốt, kèm hoạt ảnh và thời gian của từng khung hình."

[messages.sheet-note-libgdx]
source = "Sprites turned counter-clockwise and trimmed. It can't hold animations: frames go by their numbered names."
translation = "Sprite xoay ngược chiều kim đồng hồ và được cắt viền trong suốt. Định dạng này không chứa được hoạt ảnh: khung hình được nhận theo tên có đánh số."

[messages.sheet-note-texturepacker]
source = "Sprites turned clockwise and trimmed, with animations by name, as PixiJS and Phaser read them."
translation = "Sprite xoay theo chiều kim đồng hồ và được cắt viền trong suốt, kèm hoạt ảnh theo tên, đúng như cách PixiJS và Phaser đọc."

