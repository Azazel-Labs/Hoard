translation = "Các map của một vật liệu được đặt tên theo vật liệu và công dụng của từng map khi gửi đi, dù tệp có tên gì: Rock_Normal.png, không phải rock_moss_xeokah0_raw_8K_Normal.png. Tệp trong thư viện không bị động tới, và map mà mô hình hoặc MTL đi kèm nêu tên sẽ giữ tên đó, để mô hình vẫn tìm thấy nó."

