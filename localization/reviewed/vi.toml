[messages.auth-roles-hint]
source = "Groups whose members get each role, one per line, by name or DN. The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Các nhóm có thành viên nhận từng vai trò, mỗi dòng một nhóm, theo tên hoặc DN. Vai trò cao nhất khớp sẽ được dùng, và được kiểm tra ở mỗi lần đăng nhập. Nếu không liệt kê nhóm nào, tài khoản mới nhận vai trò ở trên và quản trị viên đổi sau. Nếu có nhóm được liệt kê ở Được xem, chỉ thành viên của nhóm được liệt kê mới được đăng nhập."

[messages.auth-roles-hint-oauth]
source = "Groups whose members get each role, one per line, by name or DN (or whatever the groups claim lists). The highest that matches wins, and it’s checked at each sign-in. With none listed, new accounts get the role above and an admin changes it after. With groups listed under Can look, only members of a listed group may sign in."
translation = "Các nhóm có thành viên nhận từng vai trò, mỗi dòng một nhóm, theo tên hoặc DN (hoặc bất cứ thứ gì groups claim liệt kê). Vai trò cao nhất khớp sẽ được dùng, và được kiểm tra ở mỗi lần đăng nhập. Nếu không liệt kê nhóm nào, tài khoản mới nhận vai trò ở trên và quản trị viên đổi sau. Nếu có nhóm được liệt kê ở Được xem, chỉ thành viên của nhóm được liệt kê mới được đăng nhập."

