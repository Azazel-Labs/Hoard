translation = "Nhập đường dẫn tệp thực thi của { $tool } đã cài đặt. Chỉ hỗ trợ cài đặt tự động trong Docker."

[messages.settings-ffmpeg-download]
source = "Uses a system ffmpeg with the right encoders, or downloads a static build (about 80 MB)."
translation = "Dùng ffmpeg của hệ thống có đủ bộ mã hóa, hoặc tải một bản build tĩnh (khoảng 80 MB)."

[messages.settings-ffmpeg-what]
