translation = "{ $error }. Tiến độ của bạn được giữ lại: hãy thử lại, hoặc thả lại cùng các tệp đó sau."

[messages.upload-eta-hours]
source = "{ $h } h left"
translation = "còn { $h } giờ"

[messages.upload-eta-minutes]
source = "{ $min } min left"
translation = "còn { $min } phút"

[messages.upload-eta-seconds]
source = "{ $s } s left"
translation = "còn { $s } giây"

[messages.upload-expand]
source = "Show imports"
translation = "Hiện các lần nhập"

[messages.upload-failed-plain]
source = "failed"
translation = "thất bại"

[messages.upload-files-of]
source = "{ $done } of { $total } files"
translation = "{ $done } / { $total } tệp"

[messages.upload-finish]
source = "finish upload"
translation = "hoàn tất tải lên"

[messages.upload-gave-up]
source = "{ $what }: { $error } after { $attempts } attempts"
translation = "{ $what }: { $error } sau { $attempts } lần thử"

[messages.upload-importing]
source = "Importing { $count } packs"
translation = "Đang nhập { $count } gói"

[messages.upload-interrupted]
source = "Interrupted"
translation = "Bị gián đoạn"

[messages.upload-into]
source = "Going into “{ $name }”, which is in the library already: new files are added and changed ones replaced."
translation = "Đang vào “{ $name }”, gói đã có trong thư viện: tệp mới được thêm và tệp đã đổi được thay thế."

[messages.upload-minimize]
source = "Minimize"
translation = "Thu nhỏ"

[messages.upload-network-error]
source = "network error"
translation = "lỗi mạng"

[messages.upload-not-same]
source = "Those aren’t the same files, so nothing was resumed."
translation = "Đó không phải là cùng các tệp, nên không có gì được tiếp tục."

[messages.upload-own-pack]
source = "Make it a pack of its own"
translation = "Tách thành gói riêng"

[messages.upload-part-failed]
source = "upload failed ({ $status })"
translation = "tải lên thất bại ({ $status })"

[messages.upload-permission-denied]
source = "The browser wasn’t allowed to read the files again. Pick them instead."
translation = "Trình duyệt không được phép đọc lại các tệp. Hãy chọn chúng thay vào đó."

[messages.upload-pill]
source = "Importing { $count } · { $percent }%"
translation = "Đang nhập { $count } · { $percent }%"

[messages.upload-pill-stopped]
source = "Stopped: { $count }"
translation = "Đã dừng: { $count }"

[messages.upload-queue]
source = "Imports"
translation = "Nhập"

[messages.upload-rate]
source = "{ $size }/s"
translation = "{ $size }/s"

[messages.upload-resume]
source = "Resume"
translation = "Tiếp tục"

[messages.upload-resume-all]
source = "Resume all"
translation = "Tiếp tục tất cả"

[messages.upload-resume-hint-file]
source = "Pick the same file again, or drop it on the page, to carry on where it stopped."
translation = "Chọn lại đúng tệp đó, hoặc thả nó vào trang, để tiếp tục từ chỗ đã dừng."

[messages.upload-resume-hint-folder]
source = "Pick the same folder again, or drop it on the page, to carry on where it stopped."
translation = "Chọn lại đúng thư mục đó, hoặc thả nó vào trang, để tiếp tục từ chỗ đã dừng."

[messages.upload-resumed]
source = "resumed, { $size } were already there"
translation = "đã tiếp tục, { $size } đã có sẵn"

[messages.upload-retry]
source = "Retry"
translation = "Thử lại"

[messages.upload-skipped]
source = "These exact files were already imported as “{ $name }”, so they were skipped."
translation = "Chính những tệp này đã được nhập dưới tên “{ $name }”, nên đã bỏ qua."

[messages.upload-stopped]
source = "Stopped"
translation = "Đã dừng"

[messages.upload-unpacking]
source = "Uploaded, now unpacking"
translation = "Đã tải lên, đang giải nén"

[messages.upload-update]
source = "Update “{ $name }”"
translation = "Cập nhật “{ $name }”"

[messages.upload-waiting]
source = "Waiting"
translation = "Đang chờ"

[messages.window-close]
source = "Close"
translation = "Đóng"

[messages.window-maximize]
source = "Maximize"
translation = "Phóng to"

[messages.window-minimize]
source = "Minimize"
translation = "Thu nhỏ"

[messages.window-restore]
source = "Restore"
translation = "Khôi phục"
