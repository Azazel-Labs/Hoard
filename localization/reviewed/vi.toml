translation = "lấy từ địa chỉ trình duyệt"

[messages.settings-public-url-placeholder]
source = "From the browser’s address (e.g. https://hoard.example.com)"
translation = "Lấy từ địa chỉ trình duyệt (ví dụ https://hoard.example.com)"

[messages.settings-render]
source = "3D thumbnails"
translation = "Ảnh thu nhỏ 3D"

[messages.settings-render-toggle]
source = "Render thumbnails for 3D models"
translation = "Kết xuất ảnh thu nhỏ cho mô hình 3D"

[messages.settings-save]
source = "Save"
translation = "Lưu"

[messages.settings-soundfont]
source = "MIDI SoundFont"
translation = "SoundFont MIDI"

[messages.settings-soundfont-default]
source = "found on the server, or built-in"
translation = "tìm thấy trên máy chủ, hoặc có sẵn"

[messages.settings-soundfont-default-desktop]
source = "found on this computer, or built-in"
translation = "tìm thấy trên máy tính này, hoặc có sẵn"

[messages.settings-soundfont-file]
source = "SoundFont file"
translation = "Tệp SoundFont"

[messages.settings-soundfont-placeholder]
source = "Found on the server, or built-in"
translation = "Tìm thấy trên máy chủ, hoặc có sẵn"

[messages.settings-soundfont-placeholder-desktop]
source = "Found on this computer, or built-in"
translation = "Tìm thấy trên máy tính này, hoặc có sẵn"

[messages.settings-soundfont-send]
source = "Choose a file…"
translation = "Chọn tệp…"

[messages.settings-soundfont-sent]
source = "MIDI plays with { $name } now"
translation = "Giờ MIDI phát bằng { $name }"

[messages.settings-soundfont-what]
source = "The instruments MIDI files are played and converted with."
translation = "Các nhạc cụ dùng để phát và chuyển đổi tệp MIDI."

[messages.settings-status-off]
source = "Off"
translation = "Tắt"

[messages.settings-store-lookup]
source = "Look up store pages automatically"
translation = "Tự động tra cứu trang cửa hàng"

[messages.settings-store-pages]
source = "Store pages"
translation = "Trang cửa hàng"

[messages.settings-store-pages-what]
source = "New packs are looked up on the stores in the background, so they get their store page, seller and license."
translation = "Gói mới được tra cứu trên các cửa hàng trong nền, để có trang cửa hàng, người bán và giấy phép."

[messages.settings-the-default]
source = "the default"
translation = "mặc định"

[messages.settings-themes]
source = "Themes"
translation = "Chủ đề"

[messages.settings-thumbs]
source = "Thumbnails"
translation = "Ảnh thu nhỏ"

[messages.settings-thumbs-avif]
source = "Send thumbnails as AVIF"
translation = "Gửi ảnh thu nhỏ dưới dạng AVIF"

[messages.settings-thumbs-avif-what]
source = "Browsers that show AVIF get smaller thumbnails, often less than half the size. Each is made from the stored thumbnail the first time it’s shown and kept with the conversions; until then the stored one is sent. Making them keeps up to two cores busy while a big library is first browsed. Lossless thumbnails and pixel art are sent as they are."
translation = "Trình duyệt hiển thị được AVIF sẽ nhận ảnh thu nhỏ nhỏ hơn, thường chưa tới một nửa kích thước. Mỗi ảnh được tạo từ ảnh thu nhỏ đã lưu vào lần đầu hiển thị và được giữ cùng các bản chuyển đổi; trước đó ảnh đã lưu sẽ được gửi. Việc tạo chúng chiếm tới hai lõi trong khi một thư viện lớn được duyệt lần đầu. Ảnh thu nhỏ không mất dữ liệu và pixel art được gửi nguyên trạng."

[messages.settings-thumbs-balanced]
source = "Balanced"
translation = "Cân bằng"

[messages.settings-thumbs-balanced-hint]
source = "JPEG, quality 82. Hard to tell from the original at thumbnail size."
translation = "JPEG, chất lượng 82. Khó phân biệt với bản gốc ở kích thước ảnh thu nhỏ."

[messages.settings-thumbs-lossless]
source = "Lossless"
translation = "Không mất dữ liệu"

[messages.settings-thumbs-lossless-hint]
source = "PNG, exactly as made. Several times larger."
translation = "PNG, đúng như khi tạo. Lớn hơn vài lần."

[messages.settings-thumbs-saved]
source = "Thumbnails: { $quality }"
translation = "Ảnh thu nhỏ: { $quality }"

[messages.settings-thumbs-sharp]
source = "Sharper"
translation = "Sắc nét hơn"

[messages.settings-thumbs-sharp-hint]
source = "JPEG, quality 92. About twice the size of Balanced."
translation = "JPEG, chất lượng 92. Lớn khoảng gấp đôi Cân bằng."

[messages.settings-thumbs-small]
source = "Smaller"
translation = "Nhỏ hơn"

[messages.settings-thumbs-small-hint]
source = "JPEG, quality 70. Fine in the grid; a little soft up close."
translation = "JPEG, chất lượng 70. Ổn trong lưới; hơi mờ khi xem gần."

[messages.settings-thumbs-what]
source = "How new thumbnails and model views are stored. Ones with transparency, and pixel art, are always PNG. To shrink the ones you already have, run Shrink thumbnails in Maintenance."
translation = "Cách lưu ảnh thu nhỏ và ảnh xem mô hình mới. Ảnh có độ trong suốt và ảnh pixel art luôn là PNG. Để thu nhỏ những ảnh bạn đã có, hãy chạy Thu nhỏ ảnh thu nhỏ trong Bảo trì."

[messages.settings-title]
source = "Settings"
translation = "Cài đặt"

[messages.settings-tn]
source = "Texture names"
translation = "Tên texture"

[messages.settings-tn-custom]
source = "Your own"
translation = "Tùy chỉnh"

[messages.settings-tn-descriptive]
source = "Descriptive"
translation = "Mô tả"

[messages.settings-tn-ending-add]
source = "Add an ending"
translation = "Thêm đuôi tên"

[messages.settings-tn-ending-from]
source = "Ending"
translation = "Đuôi tên"

[messages.settings-tn-ending-from-example]
source = "_diff"
translation = "_diff"

[messages.settings-tn-ending-remove]
source = "Remove"
translation = "Bỏ"

[messages.settings-tn-ending-remove-label]
source = "Remove { $ending }"
translation = "Bỏ { $ending }"

[messages.settings-tn-ending-to]
source = "Swap for"
translation = "Thay bằng"

[messages.settings-tn-ending-to-example]
source = "_BC"
translation = "_BC"

[messages.settings-tn-endings]
source = "Endings of your own"
translation = "Đuôi tên riêng"

[messages.settings-tn-endings-what]
source = "A texture that isn’t one of a material’s maps keeps its own name, unless it ends in one of these: _diff → _BC sends rock_diff.png as rock_BC.png. Leave the second empty to drop the ending."
translation = "Texture không phải là một map của vật liệu sẽ giữ tên riêng của nó, trừ khi tên kết thúc bằng một trong các đuôi này: _diff → _BC gửi rock_diff.png thành rock_BC.png. Để trống ô thứ hai để bỏ đuôi tên."

[messages.settings-tn-example]
source = "Example"
translation = "Ví dụ"

[messages.settings-tn-hint-map]
source = '{ " " }what the map is for,{ " " }'
translation = '{ " " }là công dụng của map,{ " " }'

[messages.settings-tn-hint-name]
source = '{ " " }the material,{ " " }'
translation = '{ " " }là vật liệu,{ " " }'

