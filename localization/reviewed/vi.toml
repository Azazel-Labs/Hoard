translation = "Tạm thời là tất cả. Sau này hãy thêm vị trí từ Cài đặt để đưa một số loại (ví dụ nhạc) sang ổ đĩa khác."

[messages.locations-first-watched-note]
source = "Uploading needs a library Hoard keeps. You can add one later from Settings → Library locations."
translation = "Tải lên cần một thư viện do Hoard quản lý. Bạn có thể thêm sau từ Cài đặt → Vị trí thư viện."

[messages.locations-folder-desktop]
source = "Folder"
translation = "Thư mục"

[messages.locations-folder-hint-managed]
source = "Hoard creates it if it isn't there. In Docker, this is a folder you've mounted into the container."
translation = "Hoard sẽ tạo thư mục nếu chưa có. Trong Docker, đây là thư mục bạn đã gắn vào container."

[messages.locations-folder-hint-managed-desktop]
source = "Hoard creates it if it isn't there."
translation = "Hoard sẽ tạo thư mục nếu chưa có."

[messages.locations-folder-hint-watched]
source = "In Docker, mount the folder into the container first (read-only is fine), then pick it here."
translation = "Trong Docker, hãy gắn thư mục vào container trước (chỉ đọc cũng được), rồi chọn nó ở đây."

[messages.locations-folder-hint-watched-desktop]
source = "Hoard only reads it: nothing in it is changed."
translation = "Hoard chỉ đọc thư mục: không có gì trong đó bị thay đổi."

[messages.locations-folder-placeholder]
source = "The folder your packs are in"
translation = "Thư mục chứa các gói của bạn"

[messages.locations-kind-folder]
source = "A folder"
translation = "Một thư mục"

[messages.locations-kind-folder-hint]
source = "On a disk or NAS share mounted into the container, or one that Dropbox, Google Drive, OneDrive or iCloud Drive keeps in sync. Hoard can keep files there, or watch packs you already have."
translation = "Trên ổ đĩa hoặc thư mục chia sẻ NAS đã gắn vào container, hoặc thư mục được Dropbox, Google Drive, OneDrive hay iCloud Drive đồng bộ. Hoard có thể giữ tệp ở đó, hoặc theo dõi các gói bạn đã có."

[messages.locations-kind-folder-hint-desktop]
source = "On this computer, another disk or a NAS share, or one that Dropbox, Google Drive, OneDrive or iCloud Drive keeps in sync. Hoard can keep files there, or watch packs you already have."
translation = "Trên máy tính này, một ổ đĩa khác hoặc thư mục chia sẻ NAS, hoặc thư mục được Dropbox, Google Drive, OneDrive hay iCloud Drive đồng bộ. Hoard có thể giữ tệp ở đó, hoặc theo dõi các gói bạn đã có."

[messages.locations-kind-question]
source = "What kind of location is it?"
translation = "Đây là loại vị trí nào?"

[messages.locations-kind-s3-hint]
source = "A bucket in Amazon S3 or a service like it: Backblaze B2, Cloudflare R2, Wasabi, MinIO, Garage. Hoard keeps files there."
translation = "Một bucket trong Amazon S3 hoặc dịch vụ tương tự: Backblaze B2, Cloudflare R2, Wasabi, MinIO, Garage. Hoard giữ tệp ở đó."

[messages.locations-kinds-hint]
source = "A new pack's files go to the location that ticks their kind. The rest go to the catch-all."
translation = "Tệp của gói mới sẽ vào vị trí có đánh dấu loại của chúng. Phần còn lại vào vị trí chứa mọi loại."

[messages.locations-load-failed]
source = "Couldn't load the library locations"
translation = "Không thể tải các vị trí thư viện"

[messages.locations-loading]
source = "Loading…"
translation = "Đang tải…"

[messages.locations-managed-empty]
source = "None yet, so there's nowhere to put an upload. Add one below."
translation = "Chưa có, nên chưa có nơi nào để chứa tệp tải lên. Hãy thêm một vị trí bên dưới."

[messages.locations-managed-hint]
source = "Uploads and imports are copied in here. Each location takes the kinds it ticks; the catch-all takes the rest."
translation = "Tệp tải lên và nhập vào được sao chép vào đây. Mỗi vị trí nhận các loại nó đánh dấu; vị trí chứa mọi loại nhận phần còn lại."

[messages.locations-managed-title]
source = "Libraries Hoard keeps"
translation = "Thư viện do Hoard quản lý"

[messages.locations-mode-managed]
source = "Claim it: Hoard keeps my packs here"
translation = "Chiếm lấy: Hoard giữ các gói của tôi ở đây"

[messages.locations-mode-managed-hint]
source = "Packs you upload or import are copied in, and Hoard keeps them in order. The folder is Hoard’s now, so leave its contents alone."
translation = "Các gói bạn tải lên hoặc nhập sẽ được sao chép vào đây, và Hoard giữ chúng ngăn nắp. Giờ thư mục này là của Hoard, nên đừng động vào nội dung bên trong."

[messages.locations-mode-question]
source = "What should Hoard do with this folder?"
translation = "Hoard nên làm gì với thư mục này?"

[messages.locations-mode-watched]
source = "Watch it: my packs are already here"
translation = "Canh chừng: các gói của tôi đã ở đây"

[messages.locations-mode-watched-hint]
source = "Each folder inside it becomes a pack. Hoard reads the files where they are and never changes, moves or deletes them, and picks up new folders as they appear."
translation = "Mỗi thư mục bên trong sẽ thành một gói. Hoard đọc tệp tại chỗ và không bao giờ thay đổi, di chuyển hay xóa chúng, đồng thời nhận các thư mục mới khi chúng xuất hiện."

