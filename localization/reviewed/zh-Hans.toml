translation = "使用 OpenAI 的 CLIP 模型，在这台电脑的处理器上运行：任何数据都不会离开这台电脑。开启后会从 Hugging Face 下载模型（{ $size } MB），然后在后台以低优先级识别每张图片。工作或你搜索时会占用 300 到 600 MB 内存。关闭后会删除模型，但保留已识别的内容，供下次使用。"

