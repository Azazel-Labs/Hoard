source = "Anyone with a { $provider } account can get in. Add viewer groups below, or turn this off and add people yourself."
translation = "任何擁有 { $provider } 帳號的人都能進入。請在下方新增檢視者群組，或關閉此選項並自行新增使用者。"

[messages.auth-own-accounts-still-work]
source = "Hoard’s own accounts still sign in with their own passwords, so a directory or provider that’s down or set up wrong can’t lock you out."
translation = "Hoard 自己的帳號仍然使用各自的密碼登入，因此目錄或提供者停擺或設定錯誤時，你也不會被鎖在外面。"

