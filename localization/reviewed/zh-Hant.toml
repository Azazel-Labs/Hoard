source = "Built with"
translation = "使用的開放原始碼軟體"

[messages.about-built-with-what]
source = "The open source libraries Hoard is made from, with their licenses."
translation = "構成 Hoard 的開放原始碼函式庫及其授權條款。"

[messages.about-clap]
source = "Finds sounds by what they sound like."
