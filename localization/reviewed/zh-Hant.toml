[messages.settings-conv-flac-what]
source = "The sound stays exactly the same, in about half the space, and everything else in the WAV (loop points, cue markers, tags) is kept in the FLAC, so the WAV can be put back exactly as it was at any time. WAVs with floating-point or 32-bit samples stay WAV."
translation = "聲音完全不變，空間約為一半；WAV 中的其他所有內容（循環點、cue 標記、標籤）都保留在 FLAC 裡，因此隨時可以把 WAV 原樣還原。帶有浮點或 32 位元取樣的 WAV 會維持為 WAV。"

[messages.settings-conv-from]
source = "From"
translation = "來源格式"

[messages.settings-conv-keep]
source = "Keep originals for"
translation = "原始檔案保留"

[messages.settings-conv-keep-days]
source = """
{ $count ->
        [one] day
       *[other] days
    }"""
translation = """
{ $count ->
       *[other] 天
    }"""

[messages.settings-conv-keep-what]
source = "Until then, a converted file’s page can put the original back. Textures aren’t copied into a converted model: it points at the image files beside it. A model’s .mtl or .bin files stay."
translation = "在此之前，可在轉換後檔案的頁面還原原始檔案。貼圖不會複製到轉換後的模型中：模型會參照旁邊的圖片檔案。模型的 .mtl 或 .bin 檔案會保留。"

