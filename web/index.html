<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (theme.ts keeps it in sync afterwards). Unknown theme names
      // match no rule in styles.css, which leaves the defaults.
      try {
        var p = JSON.parse(localStorage.getItem('hoard.prefs') || '{}')
        var t = p.theme || 'system'
        var d = document.documentElement.dataset
        d.scheme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (typeof p.lightTheme === 'string') d.light = p.lightTheme
        if (typeof p.darkTheme === 'string') d.dark = p.darkTheme
      } catch (e) {}
    </script>
    <title>Hoard</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
